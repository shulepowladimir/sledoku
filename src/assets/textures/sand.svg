  <rect x="164" y="212" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="212" y="232" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="244" y="196" width="2" height="2" rx="0.5" fill="#3A2A20"/>
</svg>
