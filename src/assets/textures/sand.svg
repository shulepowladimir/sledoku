  <rect x="152" y="236" width="2" height="2" rx="1" fill="#F5E9D0"/>
  <rect x="202" y="252" width="3" height="2" rx="1" fill="#F5E9D0"/>

  <!-- ── Dark grain flecks (sparse, simulating heavy mineral grains) ── -->
  <rect x="38"  y="56"  width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="88"  y="14"  width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="130" y="92"  width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="180" y="62"  width="2" height="2" rx="0.5" fill="#3A2A20"/>
