<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    ice.svg — seamless 256×256.
    Palette: #D4D8DA pale-cold-gray base, #A8A8A0 stone shadow patches, #7EB9D4 sky-blue crack lines, #F5E9D0 cream glints.
    No opacity attributes.
  -->

  <!-- Base: pale cold gray (pre-blended stone+cream) -->
  <rect width="256" height="256" fill="#D4D8DA"/>

  <!-- Stone-gray depth patches (irregular ice facets) -->
  <rect x="18"  y="30"  width="28" height="14" rx="3" fill="#A8A8A0"/>
  <rect x="95"  y="15"  width="20" height="10" rx="2" fill="#A8A8A0"/>
  <rect x="155" y="55"  width="24" height="12" rx="3" fill="#A8A8A0"/>
  <rect x="38"  y="110" width="18" height="10" rx="2" fill="#A8A8A0"/>
  <rect x="120" y="100" width="32" height="14" rx="3" fill="#A8A8A0"/>
  <rect x="200" y="80"  width="22" height="12" rx="3" fill="#A8A8A0"/>
  <rect x="68"  y="185" width="26" height="12" rx="3" fill="#A8A8A0"/>
  <rect x="170" y="170" width="20" height="10" rx="2" fill="#A8A8A0"/>
  <rect x="10"  y="210" width="18" height="10" rx="2" fill="#A8A8A0"/>
  <rect x="220" y="200" width="24" height="12" rx="3" fill="#A8A8A0"/>
  <rect x="130" y="230" width="22" height="14" rx="3" fill="#A8A8A0"/>

  <!-- Sky-blue crack network (primary horizontal cracks) -->
  <path d="M0,72  L38,58  L78,76  L116,60  L158,78  L198,64  L256,72"
        stroke="#7EB9D4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0,168 L36,155 L80,172 L120,158 L165,176 L208,162 L256,168"
        stroke="#7EB9D4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary diagonal cracks from top edge -->
  <path d="M75,0  L62,42  L78,76"
        stroke="#7EB9D4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M170,0 L164,46 L158,78"
        stroke="#7EB9D4" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Connectors between horizontal cracks -->
  <path d="M78,76  L95,120  L80,168"
        stroke="#7EB9D4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M158,78 L178,122 L165,168"
        stroke="#7EB9D4" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Hairline cracks to bottom edge -->
  <path d="M36,155  L34,256" stroke="#7EB9D4" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M208,162 L210,256" stroke="#7EB9D4" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Hairline cracks to top edge -->
  <path d="M38,58  L40,0" stroke="#7EB9D4" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M198,64 L200,0" stroke="#7EB9D4" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Cream glint highlights (short bright strokes on facet edges) -->
  <line x1="19"  y1="32"  x2="38"  y2="32"  stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96"  y1="17"  x2="110" y2="17"  stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="121" y1="102" x2="140" y2="102" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="172" x2="184" y2="172" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69"  y1="187" x2="86"  y2="187" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="131" y1="232" x2="148" y2="232" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="221" y1="202" x2="238" y2="202" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
</svg>
