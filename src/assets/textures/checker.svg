<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    checker — шахматный пол дайнера (.63): крупные клетки 128px (32px на экране),
    тёплая кремовая N2 + глубокая N8. Тональное биение: пара полос-бликов.
    Бесшовно: период 128px чётен по обоим осям.
  -->
  <!-- Тёмные клетки (база нижнего тона) -->
  <rect x="0" y="0" width="256" height="256" fill="#786862"/>

  <!-- Светлые клетки N2 в шахматном порядке -->
  <g fill="#DFD6C6">
    <rect x="0" y="0" width="128" height="128"/>
    <rect x="128" y="128" width="128" height="128"/>
  </g>

  <!-- Биение 1: блик-полоса на светлой клетке (свет сверху-слева) -->
  <path d="M0 0 L128 0 L128 10 Q64 22 0 10 Z" fill="#EDE7DB"/>
  <!-- Биение 2: чуть светлее полоса на тёмной клетке -->
  <path d="M128 256 L256 256 L256 246 Q192 234 128 246 Z" fill="#8A786A"/>
  <!-- Биение 3: мягкая тень-дуга на светлой клетке -->
  <path d="M128 128 Q192 140 256 128 L256 138 Q192 150 128 138 Z" fill="#CFC3AF"/>
</svg>
