<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    rails — шахтная узкоколейка (.38, между cliff .42 и metal .29 по яркости):
    балласт N10 с крапом, пары ниток с периодом 64px (колея по центру клетки),
    шпалы N8 с периодом 64px. Бесшовность: все элементы кратны 64, у кромок
    ничего не разрезается. Ортогональна metal (пластины) — в нуаре различимы.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#574D4A"/>

  <!-- Балласт: крап между колеями -->
  <g fill="#675A56">
    <circle cx="10" cy="18" r="3"/>
    <circle cx="50" cy="52" r="2.5"/>
    <circle cx="6" cy="120" r="2.5"/>
    <circle cx="52" cy="180" r="3"/>
    <circle cx="14" cy="240" r="2.5"/>
    <circle cx="120" cy="30" r="3"/>
    <circle cx="180" cy="14" r="2.5"/>
    <circle cx="244" cy="60" r="3"/>
    <circle cx="160" cy="120" r="2.5"/>
    <circle cx="250" cy="170" r="2.5"/>
    <circle cx="130" cy="220" r="3"/>
    <circle cx="200" cy="250" r="2.5"/>
  </g>
  <g fill="#453E3B">
    <circle cx="32" cy="90" r="2.5"/>
    <circle cx="54" cy="140" r="2"/>
    <circle cx="8" cy="200" r="2.5"/>
    <circle cx="96" cy="64" r="2"/>
    <circle cx="150" cy="88" r="2.5"/>
    <circle cx="230" cy="120" r="2"/>
    <circle cx="110" cy="160" r="2.5"/>
    <circle cx="180" cy="200" r="2"/>
    <circle cx="240" cy="230" r="2.5"/>
  </g>

  <!-- Шпалы (под рельсами): высота 16, центры каждые 64 (y=32, 96, 160, 224) -->
  <g fill="#786862" stroke="#453E3B" stroke-width="2">
    <rect x="2" y="24" width="60" height="16" rx="3"/>
    <rect x="66" y="24" width="60" height="16" rx="3"/>
    <rect x="130" y="24" width="60" height="16" rx="3"/>
    <rect x="194" y="24" width="60" height="16" rx="3"/>
    <rect x="2" y="88" width="60" height="16" rx="3"/>
    <rect x="66" y="88" width="60" height="16" rx="3"/>
    <rect x="130" y="88" width="60" height="16" rx="3"/>
    <rect x="194" y="88" width="60" height="16" rx="3"/>
    <rect x="2" y="152" width="60" height="16" rx="3"/>
    <rect x="66" y="152" width="60" height="16" rx="3"/>
    <rect x="130" y="152" width="60" height="16" rx="3"/>
    <rect x="194" y="152" width="60" height="16" rx="3"/>
    <rect x="2" y="216" width="60" height="16" rx="3"/>
    <rect x="66" y="216" width="60" height="16" rx="3"/>
    <rect x="130" y="216" width="60" height="16" rx="3"/>
    <rect x="194" y="216" width="60" height="16" rx="3"/>
  </g>
  <!-- Светлая грань шпал (свет сверху-слева) -->
  <g fill="#8A786A">
    <rect x="3" y="25" width="58" height="4" rx="2"/>
    <rect x="67" y="25" width="58" height="4" rx="2"/>
    <rect x="131" y="25" width="58" height="4" rx="2"/>
    <rect x="195" y="25" width="58" height="4" rx="2"/>
    <rect x="3" y="89" width="58" height="4" rx="2"/>
    <rect x="67" y="89" width="58" height="4" rx="2"/>
    <rect x="131" y="89" width="58" height="4" rx="2"/>
    <rect x="195" y="89" width="58" height="4" rx="2"/>
    <rect x="3" y="153" width="58" height="4" rx="2"/>
    <rect x="67" y="153" width="58" height="4" rx="2"/>
    <rect x="131" y="153" width="58" height="4" rx="2"/>
    <rect x="195" y="153" width="58" height="4" rx="2"/>
    <rect x="3" y="217" width="58" height="4" rx="2"/>
    <rect x="67" y="217" width="58" height="4" rx="2"/>
    <rect x="131" y="217" width="58" height="4" rx="2"/>
    <rect x="195" y="217" width="58" height="4" rx="2"/>
  </g>

  <!-- Нитки рельсов: пары в каждой 64-ячейке (x≈20 и x≈44), сталь C5/C7 -->
  <g>
    <!-- подложка/шейка -->
    <g fill="#545D65">
      <rect x="18" y="0" width="8" height="256"/>
      <rect x="38" y="0" width="8" height="256"/>
      <rect x="82" y="0" width="8" height="256"/>
      <rect x="102" y="0" width="8" height="256"/>
      <rect x="146" y="0" width="8" height="256"/>
      <rect x="166" y="0" width="8" height="256"/>
      <rect x="210" y="0" width="8" height="256"/>
      <rect x="230" y="0" width="8" height="256"/>
    </g>
    <!-- головка рельса -->
    <g fill="#939CA2">
      <rect x="19" y="0" width="6" height="256"/>
      <rect x="39" y="0" width="6" height="256"/>
      <rect x="83" y="0" width="6" height="256"/>
      <rect x="103" y="0" width="6" height="256"/>
      <rect x="147" y="0" width="6" height="256"/>
      <rect x="167" y="0" width="6" height="256"/>
      <rect x="211" y="0" width="6" height="256"/>
      <rect x="231" y="0" width="6" height="256"/>
    </g>
    <!-- блик по левой кромке (свет сверху-слева) -->
    <g fill="#C2C9CB">
      <rect x="19" y="0" width="2" height="256"/>
      <rect x="39" y="0" width="2" height="256"/>
      <rect x="83" y="0" width="2" height="256"/>
      <rect x="103" y="0" width="2" height="256"/>
      <rect x="147" y="0" width="2" height="256"/>
      <rect x="167" y="0" width="2" height="256"/>
      <rect x="211" y="0" width="2" height="256"/>
      <rect x="231" y="0" width="2" height="256"/>
    </g>
  </g>

  <!-- Костыли-крепления на шпалах -->
  <g fill="#453E3B">
    <circle cx="22" cy="32" r="1.6"/><circle cx="42" cy="32" r="1.6"/>
    <circle cx="86" cy="32" r="1.6"/><circle cx="106" cy="32" r="1.6"/>
    <circle cx="150" cy="32" r="1.6"/><circle cx="170" cy="32" r="1.6"/>
    <circle cx="214" cy="32" r="1.6"/><circle cx="234" cy="32" r="1.6"/>
    <circle cx="22" cy="96" r="1.6"/><circle cx="42" cy="96" r="1.6"/>
    <circle cx="86" cy="96" r="1.6"/><circle cx="106" cy="96" r="1.6"/>
    <circle cx="150" cy="96" r="1.6"/><circle cx="170" cy="96" r="1.6"/>
    <circle cx="214" cy="96" r="1.6"/><circle cx="234" cy="96" r="1.6"/>
    <circle cx="22" cy="160" r="1.6"/><circle cx="42" cy="160" r="1.6"/>
    <circle cx="86" cy="160" r="1.6"/><circle cx="106" cy="160" r="1.6"/>
    <circle cx="150" cy="160" r="1.6"/><circle cx="170" cy="160" r="1.6"/>
    <circle cx="214" cy="160" r="1.6"/><circle cx="234" cy="160" r="1.6"/>
    <circle cx="22" cy="224" r="1.6"/><circle cx="42" cy="224" r="1.6"/>
    <circle cx="86" cy="224" r="1.6"/><circle cx="106" cy="224" r="1.6"/>
    <circle cx="150" cy="224" r="1.6"/><circle cx="170" cy="224" r="1.6"/>
    <circle cx="214" cy="224" r="1.6"/><circle cx="234" cy="224" r="1.6"/>
  </g>
</svg>
