<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    tile.svg — seamless ceramic bathroom tile, 4×4 grid.
    60×60 cream tiles with 4px stone-gray grout (2px per edge).
    Unit: 64px × 64px → 4 units = 256px. Seamless at all edges.
    No opacity attributes.
  -->

  <!-- Grout base -->
  <rect width="256" height="256" fill="#A8A8A0"/>

  <!-- Row 0 -->
  <rect x="2"   y="2"   width="60" height="60" fill="#F5E9D0"/>
  <rect x="66"  y="2"   width="60" height="60" fill="#F5E9D0"/>
  <rect x="130" y="2"   width="60" height="60" fill="#F5E9D0"/>
  <rect x="194" y="2"   width="60" height="60" fill="#F5E9D0"/>

  <!-- Row 1 -->
  <rect x="2"   y="66"  width="60" height="60" fill="#F5E9D0"/>
  <rect x="66"  y="66"  width="60" height="60" fill="#F5E9D0"/>
  <rect x="130" y="66"  width="60" height="60" fill="#F5E9D0"/>
  <rect x="194" y="66"  width="60" height="60" fill="#F5E9D0"/>

  <!-- Row 2 -->
  <rect x="2"   y="130" width="60" height="60" fill="#F5E9D0"/>
  <rect x="66"  y="130" width="60" height="60" fill="#F5E9D0"/>
  <rect x="130" y="130" width="60" height="60" fill="#F5E9D0"/>
  <rect x="194" y="130" width="60" height="60" fill="#F5E9D0"/>

  <!-- Row 3 -->
  <rect x="2"   y="194" width="60" height="60" fill="#F5E9D0"/>
  <rect x="66"  y="194" width="60" height="60" fill="#F5E9D0"/>
  <rect x="130" y="194" width="60" height="60" fill="#F5E9D0"/>
  <rect x="194" y="194" width="60" height="60" fill="#F5E9D0"/>

  <!-- ── Tile surface detail: subtle cross mark at center of each tile ── -->
  <!-- Row 0 -->
  <line x1="32"  y1="26"  x2="32"  y2="38"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="26"  y1="32"  x2="38"  y2="32"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="96"  y1="26"  x2="96"  y2="38"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="90"  y1="32"  x2="102" y2="32"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="160" y1="26"  x2="160" y2="38"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="154" y1="32"  x2="166" y2="32"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="224" y1="26"  x2="224" y2="38"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="218" y1="32"  x2="230" y2="32"  stroke="#E0D4B8" stroke-width="1"/>
  <!-- Row 1 -->
  <line x1="32"  y1="90"  x2="32"  y2="102" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="26"  y1="96"  x2="38"  y2="96"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="96"  y1="90"  x2="96"  y2="102" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="90"  y1="96"  x2="102" y2="96"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="160" y1="90"  x2="160" y2="102" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="154" y1="96"  x2="166" y2="96"  stroke="#E0D4B8" stroke-width="1"/>
  <line x1="224" y1="90"  x2="224" y2="102" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="218" y1="96"  x2="230" y2="96"  stroke="#E0D4B8" stroke-width="1"/>
  <!-- Row 2 -->
  <line x1="32"  y1="154" x2="32"  y2="166" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="26"  y1="160" x2="38"  y2="160" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="96"  y1="154" x2="96"  y2="166" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="90"  y1="160" x2="102" y2="160" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="160" y1="154" x2="160" y2="166" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="154" y1="160" x2="166" y2="160" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="224" y1="154" x2="224" y2="166" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="218" y1="160" x2="230" y2="160" stroke="#E0D4B8" stroke-width="1"/>
  <!-- Row 3 -->
  <line x1="32"  y1="218" x2="32"  y2="230" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="26"  y1="224" x2="38"  y2="224" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="96"  y1="218" x2="96"  y2="230" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="90"  y1="224" x2="102" y2="224" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="160" y1="218" x2="160" y2="230" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="154" y1="224" x2="166" y2="224" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="224" y1="218" x2="224" y2="230" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="218" y1="224" x2="230" y2="224" stroke="#E0D4B8" stroke-width="1"/>

  <!-- ── Grout shadow lines (darker on bottom/right edge of each tile) ── -->
  <!-- vertical darks (right side of each tile column) -->
  <rect x="60"  y="0" width="2" height="256" fill="#888880"/>
  <rect x="124" y="0" width="2" height="256" fill="#888880"/>
  <rect x="188" y="0" width="2" height="256" fill="#888880"/>
  <!-- horizontal darks (bottom of each tile row) -->
  <rect x="0" y="60"  width="256" height="2" fill="#888880"/>
  <rect x="0" y="124" width="256" height="2" fill="#888880"/>
  <rect x="0" y="188" width="256" height="2" fill="#888880"/>
</svg>
