<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    cliff.svg — seamless 256×256 rocky cliff face / stone wall.
    Base: #A8A8A0 (stone). Strata bands with lighter highlights and dark cracks.
    Horizontal sediment layers visible; irregular crevices.
    No opacity attributes.
  -->

  <!-- Base stone surface -->
  <rect width="256" height="256" fill="#A8A8A0"/>

  <!-- ── Sediment layer bands (lighter stripes) ── -->
  <rect x="0" y="14"  width="256" height="8"  fill="#C0C0B8"/>
  <rect x="0" y="46"  width="256" height="6"  fill="#C0C0B8"/>
  <rect x="0" y="80"  width="256" height="10" fill="#C0C0B8"/>
  <rect x="0" y="116" width="256" height="6"  fill="#C0C0B8"/>
  <rect x="0" y="148" width="256" height="8"  fill="#C0C0B8"/>
  <rect x="0" y="184" width="256" height="6"  fill="#C0C0B8"/>
  <rect x="0" y="214" width="256" height="10" fill="#C0C0B8"/>
  <rect x="0" y="246" width="256" height="6"  fill="#C0C0B8"/>

  <!-- ── Dark shadow bands below each strata ── -->
  <rect x="0" y="22"  width="256" height="4" fill="#888880"/>
  <rect x="0" y="52"  width="256" height="3" fill="#888880"/>
  <rect x="0" y="90"  width="256" height="4" fill="#888880"/>
  <rect x="0" y="122" width="256" height="3" fill="#888880"/>
  <rect x="0" y="156" width="256" height="4" fill="#888880"/>
  <rect x="0" y="190" width="256" height="3" fill="#888880"/>
  <rect x="0" y="224" width="256" height="4" fill="#888880"/>

  <!-- ── Vertical crevices (irregular, jagged) ── -->
  <!-- Crevice 1 -->
  <path d="M30,0 L28,18 L34,30 L30,46 L28,80 L32,116 L28,148 L32,184 L28,214 L32,256"
        fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <!-- Crevice 2 -->
  <path d="M76,0 L80,14 L74,30 L78,52 L72,80 L76,116 L74,148 L78,184 L72,214 L76,256"
        fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crevice 3 -->
  <path d="M128,0 L132,14 L126,30 L130,46 L126,80 L130,116 L128,148 L132,184 L126,214 L130,256"
        fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <!-- Crevice 4 -->
  <path d="M180,0 L176,18 L182,30 L178,52 L184,80 L178,116 L182,148 L178,184 L182,214 L178,256"
        fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Crevice 5 (near right edge, partial) -->
  <path d="M230,0 L228,18 L234,30 L230,52 L228,80 L232,116 L228,148 L232,184 L228,214 L232,256"
        fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>

  <!-- ── Horizontal crack details ── -->
  <path d="M0,36  L24,34  L50,38  L76,34  L102,38  L128,36  L154,40  L180,36  L206,40  L232,36  L256,38"
        fill="none" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>
  <path d="M0,68  L22,66  L48,70  L72,66  L100,70  L126,68  L152,72  L178,68  L204,72  L230,68  L256,70"
        fill="none" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>
  <path d="M0,104 L26,102 L52,106 L78,102 L104,106 L130,104 L156,108 L182,104 L208,108 L234,104 L256,106"
        fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0,138 L24,136 L50,140 L76,136 L102,140 L128,138 L154,142 L180,138 L206,142 L232,138 L256,140"
        fill="none" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>
  <path d="M0,170 L26,168 L52,172 L78,168 L104,172 L130,170 L156,174 L182,170 L208,174 L234,170 L256,172"
        fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M0,202 L24,200 L50,204 L76,200 L102,204 L128,202 L154,206 L180,202 L206,206 L232,202 L256,204"
        fill="none" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>
  <path d="M0,238 L22,236 L48,240 L72,236 L100,240 L126,238 L152,242 L178,238 L204,242 L230,238 L256,240"
        fill="none" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>

  <!-- ── Rock surface chips / inclusions ── -->
  <rect x="10"  y="6"   width="8" height="5" rx="2" fill="#888880"/>
  <rect x="52"  y="60"  width="6" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="96"  y="28"  width="7" height="5" rx="2" fill="#888880"/>
  <rect x="148" y="68"  width="8" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="196" y="10"  width="6" height="5" rx="2" fill="#888880"/>
  <rect x="240" y="56"  width="8" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="38"  y="100" width="7" height="5" rx="2" fill="#888880"/>
  <rect x="86"  y="132" width="8" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="136" y="100" width="6" height="5" rx="2" fill="#888880"/>
  <rect x="184" y="136" width="7" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="222" y="102" width="8" height="5" rx="2" fill="#888880"/>
  <rect x="14"  y="162" width="7" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="60"  y="196" width="8" height="5" rx="2" fill="#888880"/>
  <rect x="112" y="164" width="6" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="160" y="198" width="7" height="5" rx="2" fill="#888880"/>
  <rect x="210" y="168" width="8" height="4" rx="2" fill="#C0C0B8"/>
  <rect x="42"  y="236" width="7" height="5" rx="2" fill="#888880"/>
  <rect x="170" y="238" width="8" height="4" rx="2" fill="#C0C0B8"/>
</svg>
