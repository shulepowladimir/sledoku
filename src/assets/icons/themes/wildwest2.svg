<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wildwest2 — sheriff's star badge. Gold 6-pointed star on navy, red centre, "SHERIFF" text.
  -->

  <!-- ══ BACKGROUND ══ -->
  <rect width="96" height="96" fill="#1F3A5F"/>
  <!-- Worn leather texture strips -->
  <rect x="0"  y="0"  width="96" height="4"  fill="#3A2A20"/>
  <rect x="0"  y="92" width="96" height="4"  fill="#3A2A20"/>
  <rect x="0"  y="0"  width="4"  height="96" fill="#3A2A20"/>
  <rect x="92" y="0"  width="4"  height="96" fill="#3A2A20"/>

  <!-- ══ BADGE SHADOW ══ -->
  <polygon points="52,10 62,32 85,29 71,48 85,67 62,64 52,86 43,64 20,67 34,48 20,29 43,32"
           fill="#3A2A20"/>

  <!-- ══ STAR (6-pointed) ══ -->
  <polygon points="48,10 58,32 81,29 67,48 81,67 58,64 48,86 39,64 15,67 29,48 15,29 39,32"
           fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ══ STAR INNER CIRCLE ══ -->
  <circle cx="48" cy="48" r="14" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ RED BADGE CENTRE ══ -->
  <circle cx="48" cy="48" r="10" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="5"  fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ "SHERIFF" TEXT BLOCKS (5 simulated letter blocks in arc) ══ -->
  <!-- Arranged in a slight arc above/below the star points -->
  <rect x="18" y="44" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="28" y="32" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="43" y="26" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="58" y="32" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="68" y="44" width="5" height="7" rx="1" fill="#3A2A20"/>
  <!-- Below (mirror arc) -->
  <rect x="18" y="54" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="28" y="66" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="68" y="54" width="5" height="7" rx="1" fill="#3A2A20"/>
  <rect x="58" y="66" width="5" height="7" rx="1" fill="#3A2A20"/>
</svg>
