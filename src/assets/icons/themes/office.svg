<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    office — modern office building, night. Glass tower, lit windows, city silhouette.
  -->

  <!-- ══ NIGHT SKY ══ -->
  <rect width="96" height="96" fill="#1F3A5F"/>

  <!-- ══ CITY SILHOUETTE (background) ══ -->
  <rect x="0"  y="56" width="16" height="40" fill="#2E5580"/>
  <rect x="14" y="64" width="12" height="32" fill="#2E5580"/>
  <rect x="74" y="50" width="12" height="46" fill="#2E5580"/>
  <rect x="84" y="60" width="12" height="36" fill="#2E5580"/>
  <!-- Background windows (faint) -->
  <rect x="3"  y="60" width="4"  height="3"  fill="#E0A94A"/>
  <rect x="9"  y="66" width="4"  height="3"  fill="#7EB9D4"/>
  <rect x="78" y="56" width="4"  height="3"  fill="#E0A94A"/>
  <rect x="84" y="64" width="4"  height="3"  fill="#E0A94A"/>

  <!-- ══ GROUND / PLAZA ══ -->
  <rect x="0" y="82" width="96" height="14" fill="#3A2A20"/>
  <!-- Plaza tiles -->
  <line x1="16" y1="82" x2="16" y2="96" stroke="#4A3018" stroke-width="1.5"/>
  <line x1="32" y1="82" x2="32" y2="96" stroke="#4A3018" stroke-width="1.5"/>
  <line x1="48" y1="82" x2="48" y2="96" stroke="#4A3018" stroke-width="1.5"/>
  <line x1="64" y1="82" x2="64" y2="96" stroke="#4A3018" stroke-width="1.5"/>
  <line x1="80" y1="82" x2="80" y2="96" stroke="#4A3018" stroke-width="1.5"/>

  <!-- ══ MAIN TOWER SHADOW ══ -->
  <rect x="26" y="6" width="48" height="80" rx="2" fill="#3A2A20"/>

  <!-- ══ MAIN GLASS TOWER ══ -->
  <rect x="22" y="2" width="48" height="80" rx="2" fill="#2E5580" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ GLASS CURTAIN-WALL GRID ══ -->
  <!-- Vertical mullions -->
  <line x1="32" y1="2"  x2="32" y2="82" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="44" y1="2"  x2="44" y2="82" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="56" y1="2"  x2="56" y2="82" stroke="#1F3A5F" stroke-width="2"/>
  <!-- Horizontal transoms -->
  <line x1="22" y1="14" x2="70" y2="14" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="22" y1="26" x2="70" y2="26" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="22" y1="38" x2="70" y2="38" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="22" y1="50" x2="70" y2="50" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="22" y1="62" x2="70" y2="62" stroke="#1F3A5F" stroke-width="1.5"/>
  <line x1="22" y1="74" x2="70" y2="74" stroke="#1F3A5F" stroke-width="1.5"/>

  <!-- ══ LIT OFFICE WINDOWS ══ -->
  <!-- Floor 6 (top) — all dark, late night -->
  <!-- Floor 5 -->
  <rect x="24" y="40" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <rect x="46" y="40" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <!-- Floor 4 -->
  <rect x="24" y="28" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <rect x="34" y="28" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <rect x="58" y="28" width="8"  height="10" rx="1" fill="#7EB9D4"/>
  <!-- Floor 3 -->
  <rect x="34" y="16" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <rect x="46" y="16" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <rect x="58" y="16" width="8"  height="10" rx="1" fill="#E0A94A"/>
  <!-- Floor 2 — mostly dark -->
  <rect x="24" y="4"  width="8"  height="8"  rx="1" fill="#7EB9D4"/>
  <!-- Floor 1 (lobby) -->
  <rect x="24" y="64" width="44" height="14" rx="1" fill="#7EB9D4"/>
  <!-- Lobby detail: reception desk silhouette -->
  <rect x="34" y="72" width="20" height="4" rx="1" fill="#1F3A5F"/>

  <!-- ══ ANTENNA ══ -->
  <line x1="46" y1="2" x2="46" y2="0" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <rect x="42" y="0" width="8"  height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Red aircraft light -->
  <circle cx="46" cy="0" r="2" fill="#C8102E"/>

  <!-- ══ ENTRANCE CANOPY ══ -->
  <rect x="30" y="78" width="32" height="6"  rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Canopy support posts -->
  <rect x="31" y="78" width="3"  height="8"  rx="1.5" fill="#C89830"/>
  <rect x="58" y="78" width="3"  height="8"  rx="1.5" fill="#C89830"/>
</svg>
