<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    mall theme — shopping centre, multi-storey facade, large glass entrance arch.
  -->

  <!-- ══ SKY ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>
  <!-- Ground -->
  <rect x="0" y="78" width="96" height="18" fill="#C7C2B3"/>
  <rect x="0" y="84" width="96" height="12" fill="#A8A8A0"/>

  <!-- ══ BUILDING SHADOW ══ -->
  <rect x="6" y="10" width="86" height="74" rx="4" fill="#3A2A20"/>

  <!-- ══ MAIN FACADE ══ -->
  <rect x="2" y="6"  width="86" height="74" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ FACADE TRIM ══ -->
  <!-- Top cornice band -->
  <rect x="2" y="6"  width="86" height="10" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Floor separator bands -->
  <rect x="2" y="34" width="86" height="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="2" y="54" width="86" height="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ UPPER FLOOR WINDOWS ══ -->
  <!-- Row 1 (y=18..30) -->
  <rect x="8"  y="18" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="28" y="18" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="48" y="18" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="68" y="18" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Row 2 (y=38..50) -->
  <rect x="8"  y="38" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="28" y="38" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="68" y="38" width="16" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ ENTRANCE ARCH ══ -->
  <!-- Arch frame -->
  <path d="M36,80 L36,56 Q36,44 48,44 Q60,44 60,56 L60,80 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Glass inside arch -->
  <path d="M40,80 L40,57 Q40,48 48,48 Q56,48 56,57 L56,80 Z"
        fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Door divider -->
  <line x1="48" y1="48" x2="48" y2="80" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SHOPPING BAG SIGN (left of entrance) ══ -->
  <rect x="12" y="58" width="18" height="20" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Bag handles -->
  <path d="M16,58 Q16,52 21,52 Q26,52 26,58" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
