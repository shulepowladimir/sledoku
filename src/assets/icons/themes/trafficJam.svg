<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trafficJam — строго вид сверху на разделённое шоссе с плотной очередью машин.
    Две встречные стороны дороги читаются по медиане и противоположным направлениям.
  -->
  <!-- Земля и рамка -->
  <rect x="6" y="6" width="84" height="84" rx="8" fill="#DFD6C6" stroke="#1A1A1A" stroke-width="2.8"/>

  <!-- Двустороннее шоссе: две отдельные проезжие части -->
  <path d="M16 8 L80 8 L80 88 L16 88 Z" fill="#675A56" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M20 10 L20 86 M76 10 L76 86" stroke="#CFC3AF" stroke-width="2.2"/>
  <!-- Разметка по краям каждой стороны -->
  <path d="M24 10 L24 86 M72 10 L72 86" stroke="#F5E9D0" stroke-width="1.7" stroke-dasharray="5 6"/>

  <!-- Центральная разделительная полоса с направляющими тумбами -->
  <path d="M44 8 L52 8 L52 88 L44 88 Z" fill="#9C8A76" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M45.5 14 L50.5 14 L50.5 24 L45.5 24 Z M45.5 39 L50.5 39 L50.5 49 L45.5 49 Z M45.5 64 L50.5 64 L50.5 74 L45.5 74 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Машина, вид сверху; нос вверху -->
  <g transform="translate(34 21)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>
  <g transform="translate(34 49) rotate(180)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>
  <g transform="translate(34 77)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>

  <!-- Встречный поток: машины ориентированы носом вниз -->
  <g transform="translate(62 21) rotate(180)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>
  <g transform="translate(62 49)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>
  <g transform="translate(62 77) rotate(180)">
    <rect x="-8" y="-11" width="16" height="22" rx="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M-5 -7 Q0 -10 5 -7 L6 -2 L-6 -2 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M-5 3 L5 3 L4 7 L-4 7 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M-8 -7 L-10 -6 L-10 -2 L-8 -2 M8 -7 L10 -6 L10 -2 L8 -2 M-8 5 L-10 6 L-10 9 L-8 9 M8 5 L10 6 L10 9 L8 9" fill="#1A1A1A"/>
    <circle cx="-5" cy="-9" r="1.2" fill="#E8B95F"/><circle cx="5" cy="-9" r="1.2" fill="#E8B95F"/>
    <rect x="-6" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/><rect x="3" y="8" width="3" height="1.8" rx=".8" fill="#C9536B"/>
  </g>
</svg>
