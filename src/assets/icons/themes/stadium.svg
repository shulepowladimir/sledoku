<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Shadow -->
  <ellipse cx="52" cy="52" rx="40" ry="34" fill="#3A2A20"/>
  <!-- Outer stands -->
  <ellipse cx="48" cy="48" rx="40" ry="34" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Inner track -->
  <ellipse cx="48" cy="48" rx="30" ry="24" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Playing field -->
  <rect x="28" y="34" width="40" height="28" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Center line -->
  <rect x="46" y="34" width="4" height="28" fill="#1A1A1A"/>
  <!-- Center circle -->
  <circle cx="48" cy="48" r="6" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Goal areas -->
  <rect x="28" y="42" width="8" height="12" rx="1" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="60" y="42" width="8" height="12" rx="1" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
