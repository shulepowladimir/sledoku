<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wizardschool — gothic castle school of magic. Stone towers, pointed spires, lit windows, floating stars.
  -->

  <!-- ══ NIGHT SKY ══ -->
  <rect width="96" height="96" fill="#1F3A5F"/>
  <!-- Stars -->
  <rect x="4"  y="4"  width="2" height="2" fill="#E0A94A"/>
  <rect x="14" y="10" width="2" height="2" fill="#F5E9D0"/>
  <rect x="28" y="6"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="68" y="4"  width="2" height="2" fill="#E0A94A"/>
  <rect x="82" y="8"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="90" y="14" width="2" height="2" fill="#F5E9D0"/>
  <rect x="6"  y="22" width="2" height="2" fill="#F5E9D0"/>
  <rect x="88" y="22" width="2" height="2" fill="#E0A94A"/>
  <!-- Moon -->
  <circle cx="80" cy="14" r="8" fill="#E0A94A"/>
  <circle cx="84" cy="12" r="6" fill="#1F3A5F"/>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="82" width="96" height="14" fill="#3A2A20"/>

  <!-- ══ MAIN KEEP (centre) SHADOW ══ -->
  <rect x="28" y="18" width="40" height="68" rx="2" fill="#3A2A20"/>

  <!-- ══ MAIN KEEP ══ -->
  <rect x="24" y="14" width="40" height="68" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Stone courses -->
  <line x1="24" y1="28" x2="64" y2="28" stroke="#888880" stroke-width="1.5"/>
  <line x1="24" y1="44" x2="64" y2="44" stroke="#888880" stroke-width="1.5"/>
  <line x1="24" y1="60" x2="64" y2="60" stroke="#888880" stroke-width="1.5"/>
  <!-- Main window (lit gold) -->
  <rect x="34" y="34" width="20" height="16" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Gothic arch top -->
  <path d="M34,34 Q44,26 54,34" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Window cross -->
  <line x1="44" y1="26" x2="44" y2="50" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="34" y1="38" x2="54" y2="38" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Lower windows -->
  <rect x="30" y="62" width="10" height="12" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="48" y="62" width="10" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ BATTLEMENTS (main keep) ══ -->
  <rect x="24" y="10" width="8"  height="8" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="36" y="10" width="8"  height="8" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="48" y="10" width="8"  height="8" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="60" y="10" width="4"  height="8" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LEFT TOWER SHADOW ══ -->
  <rect x="4" y="30" width="26" height="56" rx="2" fill="#3A2A20"/>
  <!-- ══ LEFT TOWER ══ -->
  <rect x="0" y="26" width="26" height="56" rx="2" fill="#888880" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="0"  y1="40" x2="26" y2="40" stroke="#707068" stroke-width="1.5"/>
  <line x1="0"  y1="56" x2="26" y2="56" stroke="#707068" stroke-width="1.5"/>
  <rect x="6"  y="44" width="10" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M6,44 Q11,38 16,44" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Left spire shadow -->
  <polygon points="5,30 13,2 19,30" fill="#3A2A20"/>
  <!-- Left spire -->
  <polygon points="0,28 13,0 26,28" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="13" y1="0"  x2="13" y2="28" stroke="#246058" stroke-width="1.5"/>
  <!-- Left battlements -->
  <rect x="0"  y="24" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="10" y="24" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="20" y="24" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ RIGHT TOWER SHADOW ══ -->
  <rect x="70" y="36" width="26" height="50" rx="2" fill="#3A2A20"/>
  <!-- ══ RIGHT TOWER ══ -->
  <rect x="66" y="32" width="26" height="50" rx="2" fill="#888880" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="66" y1="48" x2="92" y2="48" stroke="#707068" stroke-width="1.5"/>
  <line x1="66" y1="62" x2="92" y2="62" stroke="#707068" stroke-width="1.5"/>
  <rect x="72" y="50" width="10" height="10" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M72,50 Q77,44 82,50" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Right spire shadow -->
  <polygon points="71,36 79,8 85,36" fill="#3A2A20"/>
  <!-- Right spire -->
  <polygon points="66,34 79,6 92,34" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="79" y1="6" x2="79" y2="34" stroke="#A80020" stroke-width="1.5"/>
  <!-- Right battlements -->
  <rect x="66" y="28" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="76" y="28" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="86" y="28" width="6"  height="6" rx="1" fill="#888880" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ MAIN SPIRE ══ -->
  <polygon points="30,18 44,0 58,18" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="44" y1="0"  x2="44" y2="18" stroke="#2E5580" stroke-width="1.5"/>
  <!-- Flag -->
  <line x1="44" y1="0" x2="44" y2="8"  stroke="#E0A94A" stroke-width="2"/>
  <polygon points="44,0 52,3 44,6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ FLOATING STARS / MAGIC ══ -->
  <polygon points="12,14 13.5,18 17.5,18 14.5,20.5 15.5,24.5 12,22 8.5,24.5 9.5,20.5 6.5,18 10.5,18" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="58" cy="8" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="58" y1="4"  x2="58" y2="12" stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="8"  x2="62" y2="8"  stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
