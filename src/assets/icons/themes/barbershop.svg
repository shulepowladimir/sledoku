  <path d="M41 18 L42 77" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M55 18 L57 75" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Brass bands -->
  <path d="M36 18 Q48 14 60 18 L60 22 Q48 19 36 23 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M35 75 Q48 78 61 74 L62 79 Q48 83 35 80 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="49" cy="17" r="1.8" fill="#F5E9D0"/>
</svg>
