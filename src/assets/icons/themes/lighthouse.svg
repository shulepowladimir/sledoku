<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lighthouse theme — tall striped tower with light beams, rocky coast, sea.
    Cream/red stripes, gold light, navy water, shadow rocks.
  -->

  <!-- ══ SKY & SEA ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>
  <rect x="0" y="62" width="96" height="34" fill="#1F3A5F"/>
  <!-- Wave line -->
  <path d="M0,62 C16,58 32,66 48,62 C64,58 80,66 96,62" fill="#2E6E65" stroke="none"/>

  <!-- ══ ROCKS / BASE ══ -->
  <ellipse cx="48" cy="74" rx="30" ry="14" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="26" cy="78" rx="14" ry="8"  fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="70" cy="76" rx="12" ry="7"  fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ TOWER SHADOW ══ -->
  <rect x="38" y="18" width="24" height="60" rx="6" fill="#3A2A20"/>

  <!-- ══ TOWER BODY (tapered) ══ -->
  <!-- Cream sections -->
  <rect x="36" y="14" width="22" height="60" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Red stripes (3 bands) -->
  <rect x="36" y="26" width="22" height="12" rx="2" fill="#C8102E" stroke="none"/>
  <rect x="36" y="50" width="22" height="12" rx="2" fill="#C8102E" stroke="none"/>
  <!-- Redraw outlines over stripes -->
  <rect x="36" y="14" width="22" height="60" rx="6" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ GALLERY / BALCONY ══ -->
  <rect x="32" y="14" width="30" height="6" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Balcony railing -->
  <line x1="34" y1="14" x2="34" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="40" y1="14" x2="40" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="46" y1="14" x2="46" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="52" y1="14" x2="52" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="58" y1="14" x2="58" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ LIGHT ROOM ══ -->
  <rect x="38" y="6" width="18" height="12" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Glass (gold lamp) -->
  <rect x="40" y="8" width="14" height="8" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Lamp divider -->
  <line x1="47" y1="8" x2="47" y2="16" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Dome cap -->
  <ellipse cx="47" cy="6" rx="11" ry="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Flagpole -->
  <rect x="46" y="0" width="2" height="8" rx="1" fill="#1A1A1A"/>
  <polygon points="48,0 58,3 48,6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ LIGHT BEAMS ══ -->
  <polygon points="58,10 90,2  86,16" fill="#E0A94A" stroke="none"/>
  <polygon points="58,12 92,20 86,28" fill="#E0A94A" stroke="none"/>
  <polygon points="36,10 6,2   10,16" fill="#E0A94A" stroke="none"/>
  <!-- Beam edges -->
  <line x1="58" y1="10" x2="90" y2="2"  stroke="#1A1A1A" stroke-width="1"/>
  <line x1="58" y1="16" x2="86" y2="28" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="36" y1="10" x2="6"  y2="2"  stroke="#1A1A1A" stroke-width="1"/>
  <line x1="36" y1="16" x2="10" y2="28" stroke="#1A1A1A" stroke-width="1"/>
</svg>
