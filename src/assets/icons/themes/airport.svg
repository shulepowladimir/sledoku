<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hard shadows -->
  <!-- Tower base shadow -->
  <rect x="36" y="72" width="30" height="14" rx="2" fill="#3A2A20"/>
  <!-- Tower shaft shadow -->
  <rect x="40" y="36" width="18" height="40" rx="2" fill="#3A2A20"/>
  <!-- Observation deck shadow -->
  <rect x="33" y="28" width="34" height="12" rx="2" fill="#3A2A20"/>
  <!-- Roof shadow -->
  <polygon points="34,32 62,32 56,24 40,24" fill="#3A2A20"/>
  <!-- Plane shadow -->
  <polygon points="12,20 22,16 72,28 62,32 48,28" fill="#3A2A20"/>

  <!-- Tower base -->
  <rect x="32" y="68" width="30" height="14" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Base windows -->
  <rect x="37" y="72" width="7" height="6" rx="1" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="50" y="72" width="7" height="6" rx="1" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Tower shaft -->
  <rect x="36" y="32" width="18" height="40" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Observation deck -->
  <rect x="29" y="24" width="34" height="12" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Deck windows (glass strip) -->
  <rect x="32" y="26" width="28" height="6" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Roof -->
  <polygon points="30,28 66,28 60,20 36,20" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Antenna -->
  <rect x="46" y="10" width="3" height="12" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Antenna tip dot -->
  <circle cx="47" cy="10" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Runway stripes at bottom -->
  <rect x="8" y="84" width="80" height="4" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="16" y="85" width="10" height="2" rx="1" fill="#1A1A1A"/>
  <rect x="32" y="85" width="10" height="2" rx="1" fill="#1A1A1A"/>
  <rect x="48" y="85" width="10" height="2" rx="1" fill="#1A1A1A"/>
  <rect x="64" y="85" width="10" height="2" rx="1" fill="#1A1A1A"/>

  <!-- Small plane silhouette flying past -->
  <polygon points="8,16 18,12 62,24 52,28 38,24" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Plane wing highlight -->
  <polygon points="28,17 52,23 44,26 22,20" fill="#E0A94A" stroke="none"/>
</svg>
