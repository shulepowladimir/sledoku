<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    space — orbital space station. Ring module, central hub, solar panels, Earth limb below.
  -->

  <!-- ══ DEEP SPACE ══ -->
  <rect width="96" height="96" fill="#1A1A1A"/>
  <!-- Stars -->
  <rect x="4"  y="4"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="16" y="12" width="2" height="2" fill="#F5E9D0"/>
  <rect x="28" y="2"  width="2" height="2" fill="#A8A8A0"/>
  <rect x="50" y="6"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="74" y="4"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="88" y="10" width="2" height="2" fill="#A8A8A0"/>
  <rect x="6"  y="32" width="2" height="2" fill="#F5E9D0"/>
  <rect x="90" y="30" width="2" height="2" fill="#F5E9D0"/>
  <rect x="82" y="20" width="2" height="2" fill="#F5E9D0"/>

  <!-- ══ EARTH LIMB ══ -->
  <path d="M0,96 Q48,60 96,96 Z" fill="#2E6E65"/>
  <path d="M0,96 Q48,66 96,96 Z" fill="#4D8B3A"/>
  <!-- Cloud wisps -->
  <path d="M10,88 Q20,82 30,86 Q24,84 20,86" fill="#7EB9D4"/>
  <path d="M60,84 Q70,78 80,82" fill="none" stroke="#7EB9D4" stroke-width="3" stroke-linecap="round"/>

  <!-- ══ STATION — SOLAR PANELS (left) ══ -->
  <!-- Panel arm -->
  <line x1="16" y1="42" x2="36" y2="42" stroke="#A8A8A0" stroke-width="3" stroke-linecap="round"/>
  <!-- Panel shadow -->
  <rect x="4"  y="32" width="16" height="20" rx="2" fill="#3A2A20"/>
  <!-- Panel -->
  <rect x="2"  y="30" width="16" height="20" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Panel cells -->
  <line x1="10" y1="30" x2="10" y2="50" stroke="#7EB9D4" stroke-width="1.5"/>
  <line x1="2"  y1="38" x2="18" y2="38" stroke="#7EB9D4" stroke-width="1.5"/>
  <line x1="2"  y1="42" x2="18" y2="42" stroke="#7EB9D4" stroke-width="1"/>

  <!-- ══ SOLAR PANELS (right) ══ -->
  <line x1="60" y1="42" x2="80" y2="42" stroke="#A8A8A0" stroke-width="3" stroke-linecap="round"/>
  <rect x="78" y="32" width="16" height="20" rx="2" fill="#3A2A20"/>
  <rect x="78" y="30" width="16" height="20" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="86" y1="30" x2="86" y2="50" stroke="#7EB9D4" stroke-width="1.5"/>
  <line x1="78" y1="38" x2="94" y2="38" stroke="#7EB9D4" stroke-width="1.5"/>
  <line x1="78" y1="42" x2="94" y2="42" stroke="#7EB9D4" stroke-width="1"/>

  <!-- ══ RING MODULE ══ -->
  <!-- Ring shadow -->
  <ellipse cx="50" cy="46" rx="30" ry="12" fill="none" stroke="#3A2A20" stroke-width="8"/>
  <!-- Ring body -->
  <ellipse cx="46" cy="42" rx="28" ry="10" fill="none" stroke="#A8A8A0" stroke-width="8"/>
  <ellipse cx="46" cy="42" rx="28" ry="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Ring windows -->
  <rect x="24" y="34" width="5"  height="4" rx="1" fill="#E0A94A"/>
  <rect x="34" y="30" width="5"  height="4" rx="1" fill="#E0A94A"/>
  <rect x="44" y="28" width="5"  height="4" rx="1" fill="#7EB9D4"/>
  <rect x="54" y="30" width="5"  height="4" rx="1" fill="#E0A94A"/>
  <rect x="64" y="34" width="5"  height="4" rx="1" fill="#E0A94A"/>

  <!-- ══ CENTRAL HUB ══ -->
  <!-- Hub shadow -->
  <circle cx="50" cy="44" r="14" fill="#3A2A20"/>
  <!-- Hub body -->
  <circle cx="46" cy="40" r="14" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Hub panel lines -->
  <line x1="46" y1="26" x2="46" y2="54" stroke="#D0C9B0" stroke-width="1.5"/>
  <line x1="32" y1="40" x2="60" y2="40" stroke="#D0C9B0" stroke-width="1.5"/>
  <!-- Hub port lights -->
  <circle cx="40" cy="36" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="52" cy="36" r="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="46" cy="46" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Docking port -->
  <rect x="42" y="24" width="8" height="6" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ VERTICAL MODULE ══ -->
  <rect x="42" y="52" width="8"  height="14" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="46" y1="52" x2="46" y2="66" stroke="#888880" stroke-width="1.5"/>
</svg>
