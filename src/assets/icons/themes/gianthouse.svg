<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    gianthouse — «В доме великана»: гигантский чайник нависает над
    крошечным человечком, задравшим голову. Контраст масштабов.
  -->
  <!-- Чайник-гигант -->
  <ellipse cx="48" cy="60" rx="34" ry="6" fill="#3A2A20"/>
  <path d="M22 62 Q13 62 15 46 Q17 28 32 22 L64 22 Q79 28 81 46 Q83 62 74 62 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тень по нижней кромке -->
  <path d="M24 56 Q48 62 72 56" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Блик слева -->
  <path d="M23 46 Q22 34 30 27" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <!-- Синий ободок -->
  <path d="M23 50 Q48 57 73 50" fill="none" stroke="#1F3A5F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Носик -->
  <path d="M20 36 Q9 32 7 20 Q6 16 9.5 15.5 Q12.5 15.5 14 20 Q16 28 25 30 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <ellipse cx="10" cy="18.5" rx="2.8" ry="2" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Ручка-дуга -->
  <path d="M31 22 Q31 6 48 6 Q65 6 65 22" fill="none" stroke="#5C6670" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Крышка и шарик -->
  <path d="M33 22 Q48 15 63 22 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="48" cy="13.5" r="3.4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Пар -->
  <path d="M42 12 Q44.5 7.5 42 4 M54 13 Q56.5 8.5 53.5 4.5" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Человечек (крошечный, стоит на «полу» под чайником, задрал голову) -->
  <g>
    <!-- Голова -->
    <circle cx="48" cy="74.5" r="4.4" fill="#E3B48A" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Шапка -->
    <path d="M44.2 72.5 Q48 68 51.8 72.5 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Тело (пальто) -->
    <path d="M44.5 79 Q44 86.5 46 89 L50 89 Q52 86.5 51.5 79 Q48 77.5 44.5 79 Z"
          fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Рука к чайнику (указывает вверх) -->
    <path d="M50 81.5 L54 76.5" stroke="#2E6E65" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="54.5" cy="76" r="1.4" fill="#E3B48A" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Ноги -->
    <path d="M46.5 89 L46 91.5 M49.5 89 L50 91.5" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Пол-доска под человечком -->
  <path d="M30 93 L66 93" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
</svg>
