<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    train — classic overnight express locomotive, side view. Navy body, gold trim, steam.
  -->

  <!-- ══ SKY ══ -->
  <rect width="96" height="60" fill="#1F3A5F"/>
  <!-- Stars -->
  <rect x="10" y="6"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="30" y="12" width="2" height="2" fill="#F5E9D0"/>
  <rect x="55" y="5"  width="2" height="2" fill="#F5E9D0"/>
  <rect x="78" y="10" width="2" height="2" fill="#F5E9D0"/>
  <rect x="20" y="18" width="2" height="2" fill="#F5E9D0"/>
  <rect x="70" y="18" width="2" height="2" fill="#F5E9D0"/>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="78" width="96" height="18" fill="#3A2A20"/>

  <!-- ══ RAIL ══ -->
  <line x1="0" y1="80" x2="96" y2="80" stroke="#A8A8A0" stroke-width="3"/>
  <line x1="0" y1="75" x2="96" y2="75" stroke="#A8A8A0" stroke-width="3"/>
  <line x1="8"  y1="74" x2="8"  y2="82" stroke="#888880" stroke-width="2"/>
  <line x1="22" y1="74" x2="22" y2="82" stroke="#888880" stroke-width="2"/>
  <line x1="36" y1="74" x2="36" y2="82" stroke="#888880" stroke-width="2"/>
  <line x1="50" y1="74" x2="50" y2="82" stroke="#888880" stroke-width="2"/>
  <line x1="64" y1="74" x2="64" y2="82" stroke="#888880" stroke-width="2"/>
  <line x1="78" y1="74" x2="78" y2="82" stroke="#888880" stroke-width="2"/>

  <!-- ══ LOCOMOTIVE BODY SHADOW ══ -->
  <rect x="8"  y="46" width="76" height="32" rx="4" fill="#3A2A20"/>

  <!-- ══ LOCOMOTIVE BODY ══ -->
  <rect x="4"  y="42" width="76" height="32" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ BOILER (front cylinder) ══ -->
  <rect x="62" y="38" width="28" height="20" rx="6" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Boiler bands -->
  <line x1="70" y1="38" x2="70" y2="58" stroke="#E0A94A" stroke-width="2"/>
  <line x1="78" y1="38" x2="78" y2="58" stroke="#E0A94A" stroke-width="2"/>
  <!-- Boiler face -->
  <ellipse cx="90" cy="48" rx="6" ry="10" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Headlamp -->
  <circle cx="92" cy="44" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="92" cy="44" r="2" fill="#F5E9D0"/>

  <!-- ══ GOLD TRIM STRIPE ══ -->
  <rect x="4" y="56" width="86" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ WINDOWS (carriage) ══ -->
  <rect x="8"  y="44" width="14" height="10" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="26" y="44" width="14" height="10" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="44" y="44" width="14" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Blind pulled on last window -->
  <rect x="44" y="44" width="14" height="6"  rx="2" fill="#F5E9D0"/>

  <!-- ══ WHEELS ══ -->
  <!-- Large driver wheel -->
  <circle cx="22" cy="74" r="12" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="22" cy="74" r="8"  fill="#3A2A20" stroke="#E0A94A" stroke-width="2"/>
  <circle cx="22" cy="74" r="3"  fill="#E0A94A"/>
  <!-- Connecting rod -->
  <line x1="22" y1="74" x2="50" y2="74" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <!-- Front wheel -->
  <circle cx="50" cy="74" r="9"  fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="50" cy="74" r="5"  fill="#3A2A20" stroke="#E0A94A" stroke-width="1.5"/>
  <circle cx="50" cy="74" r="2"  fill="#E0A94A"/>
  <!-- Rear wheels (small) -->
  <circle cx="72" cy="74" r="7"  fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="72" cy="74" r="4"  fill="#3A2A20" stroke="#E0A94A" stroke-width="1.5"/>
  <circle cx="86" cy="74" r="7"  fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="86" cy="74" r="4"  fill="#3A2A20" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ SMOKESTACK ══ -->
  <rect x="74" y="28" width="8" height="14" rx="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="78" cy="28" rx="7" ry="4" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Steam puffs -->
  <circle cx="72" cy="22" r="6" fill="#A8A8A0"/>
  <circle cx="80" cy="16" r="5" fill="#A8A8A0"/>
  <circle cx="86" cy="22" r="4" fill="#888880"/>

  <!-- ══ COWCATCHER ══ -->
  <polygon points="88,62 96,68 88,68" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
</svg>
