<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    agency theme — open case file with a magnifying glass over it.
    Cream folder, gold lens, red string tie. Simple two-element composition.
  -->

  <!-- ══ SHADOWS ══ -->
  <polygon points="16,78 82,78 82,58 50,50 16,58" fill="#3A2A20"/>
  <circle cx="42" cy="46" r="20" fill="#3A2A20"/>

  <!-- ══ CASE FILE (open folder, wide) ══ -->
  <polygon points="12,74 48,74 48,46 12,54" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="48,74 84,74 84,54 48,46" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Spine -->
  <line x1="48" y1="46" x2="48" y2="74" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Text lines left page -->
  <line x1="18" y1="58" x2="40" y2="56" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="18" y1="64" x2="40" y2="62" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="18" y1="70" x2="36" y2="68" stroke="#A8A8A0" stroke-width="2"/>
  <!-- Text lines right page -->
  <line x1="56" y1="56" x2="78" y2="58" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="56" y1="62" x2="78" y2="64" stroke="#A8A8A0" stroke-width="2"/>
  <!-- Red string tie -->
  <path d="M40,45 Q48,64 56,45" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══ MAGNIFYING GLASS (hero) ══ -->
  <circle cx="40" cy="40" r="18" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="4"/>
  <circle cx="40" cy="40" r="12.5" fill="#E0A94A"/>
  <path d="M32,34 Q36,29 42,30" fill="none" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="52" y1="52" x2="66" y2="66" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
</svg>
