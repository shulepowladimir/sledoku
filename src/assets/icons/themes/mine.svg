<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    mine — «Шахта»: вход в штольню — деревянная крепь-арка, тёмный зев,
    рельсы со шпалами уходят вглубь (перспектива), фонарь на балке, кирка
    прислонена сбоку. Рендер 40-64px, крупно, без мелочи.
  -->
  <!-- Породный фон (cliff-тон) -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#786862"/>
  <!-- Обломки породы -->
  <path d="M10 80 L16 72 L24 78 Z" fill="#675A56"/>
  <path d="M76 78 L84 70 L88 80 Z" fill="#675A56"/>
  <circle cx="12" cy="26" r="3" fill="#8A786A"/>
  <circle cx="84" cy="34" r="2.4" fill="#8A786A"/>

  <!-- Тёмный зев штольни -->
  <path d="M26 82 L26 40 Q26 26 40 26 L56 26 Q70 26 70 40 L70 82 Z" fill="#2E2620"/>
  <!-- Глубина: тёмный проём внутри зева -->
  <path d="M32 82 L32 42 Q32 32 42 32 L54 32 Q64 32 64 42 L64 82 Z" fill="#1A1410"/>

  <!-- Рельсы со шпалами, уходящие вглубь (перспектива) -->
  <g stroke="#939CA2" stroke-width="3" stroke-linecap="round">
    <path d="M40 82 L46 48"/>
    <path d="M56 82 L50 48"/>
  </g>
  <g stroke="#786862" stroke-width="3.4" stroke-linecap="round">
    <path d="M36 76 H60"/>
    <path d="M41 66 H55"/>
    <path d="M45 56 H51"/>
  </g>

  <!-- Деревянная крепь-арка (балки) -->
  <g fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round">
    <!-- Стойки -->
    <rect x="18" y="34" width="12" height="52" rx="2"/>
    <rect x="66" y="34" width="12" height="52" rx="2"/>
    <!-- Верхняк (перекладина) -->
    <rect x="16" y="20" width="64" height="12" rx="2"/>
  </g>
  <!-- Волокна и фаски на балках -->
  <g stroke="#B87F33" stroke-width="1.6" stroke-linecap="round">
    <path d="M23 40 V80"/>
    <path d="M26 40 V80"/>
    <path d="M71 40 V80"/>
    <path d="M74 40 V80"/>
    <path d="M22 26 H74"/>
  </g>
  <!-- Блики на кромках -->
  <g stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round">
    <path d="M20 38 V80"/>
    <path d="M68 38 V80"/>
    <path d="M18 23 H78"/>
  </g>
  <!-- Гвозди -->
  <g fill="#1A1A1A">
    <circle cx="24" cy="36" r="1.4"/>
    <circle cx="72" cy="36" r="1.4"/>
    <circle cx="22" cy="30" r="1.4"/>
    <circle cx="74" cy="30" r="1.4"/>
  </g>

  <!-- Шахтный фонарь на верхней балке (тёплый свет) -->
  <g>
    <path d="M40 32 V24" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="36" y="14" width="10" height="12" rx="2" fill="#545D65" stroke="#1A1A1A" stroke-width="2.4"/>
    <circle cx="41" cy="20" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <!-- Световое пятно без opacity: крем-лучи -->
    <path d="M32 16 L26 12 M32 24 L26 28 M50 16 L56 12 M50 24 L56 28" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Кирка, прислонённая к стойке -->
  <g transform="rotate(24 78 58)">
    <rect x="75" y="34" width="6" height="44" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
    <path d="M64 34 Q78 24 92 34 L90 39 Q78 32 66 39 Z" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  </g>
</svg>
