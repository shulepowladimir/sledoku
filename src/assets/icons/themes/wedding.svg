    <circle cx="39" cy="68" r="1.5" fill="#E8B95F"/>
    <circle cx="48" cy="66" r="5" fill="#F5E9D0"/>
    <circle cx="48" cy="66" r="1.7" fill="#E0824A"/>
    <circle cx="57" cy="68" r="4.5" fill="#E08BA0"/>
    <circle cx="57" cy="68" r="1.5" fill="#C8102E"/>
