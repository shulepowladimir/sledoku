    <ellipse cx="56" cy="43" rx="22" ry="29" transform="rotate(35 56 43)"/>
  </g>
  <path d="M22 29 Q28 21 35 20 M62 20 Q70 24 73 32" fill="none" stroke="#E8B95F" stroke-width="2.5" stroke-linecap="round"/>

