  <g fill="none" stroke="#3A2A20" stroke-width="11">
    <ellipse cx="39" cy="50" rx="22" ry="29" transform="rotate(-35 39 50)"/>
    <ellipse cx="58" cy="47" rx="22" ry="29" transform="rotate(35 58 47)"/>
  </g>

  <!-- Кольца -->
  <g fill="none" stroke="#1A1A1A" stroke-width="10">
