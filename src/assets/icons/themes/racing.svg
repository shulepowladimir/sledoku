<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    racing — «Убийственная скорость»: городское гран-при. Клетчатый флаг
    на флагштоке над трассой, внизу — силуэт трибуны с рядами зрителей.
    Фон — тёплое небо вечера, дорога стальная с разметкой.
  -->
  <!-- Тёплое вечернее небо -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#E8B95F"/>
  <!-- Солнце-блик слева -->
  <circle cx="20" cy="20" r="7" fill="#F5E9D0"/>
  <path d="M8 24 Q20 18 34 24" fill="none" stroke="#E0A94A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Трибуна (полосатые ряды, силуэт) -->
  <path d="M6 52 L90 52 L90 68 L6 68 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M6 52 L90 52 L90 56 L6 56 Z M6 60 L90 60 L90 63 L6 63 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Зрители-точки на трибуне -->
  <circle cx="16" cy="58.5" r="2.2" fill="#2E6E65"/>
  <circle cx="28" cy="58.5" r="2.2" fill="#1F3A5F"/>
  <circle cx="40" cy="58.5" r="2.2" fill="#C8102E"/>
  <circle cx="52" cy="58.5" r="2.2" fill="#4A7BA6"/>
  <circle cx="64" cy="58.5" r="2.2" fill="#5E8A46"/>
  <circle cx="76" cy="58.5" r="2.2" fill="#7C5EC9"/>
  <circle cx="22" cy="66" r="2.2" fill="#C98B5E"/>
  <circle cx="34" cy="66" r="2.2" fill="#2E6E65"/>
  <circle cx="46" cy="66" r="2.2" fill="#1F3A5F"/>
  <circle cx="58" cy="66" r="2.2" fill="#C8102E"/>
  <circle cx="70" cy="66" r="2.2" fill="#E0824A"/>
  <circle cx="82" cy="66" r="2.2" fill="#4A7BA6"/>

  <!-- Трасса (сталь с разметкой) -->
  <path d="M6 68 L90 68 L90 90 L6 90 Z" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Бордюр (красно-кремовый поребрик) -->
  <path d="M6 68 L90 68 L90 73 L6 73 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M14 68 L14 73 M26 68 L26 73 M38 68 L38 73 M50 68 L50 73 M62 68 L62 73 M74 68 L74 73 M86 68 L86 73" stroke="#F5E9D0" stroke-width="4"/>
  <!-- Дорожная разметка -->
  <path d="M12 81 L24 81 M36 81 L48 81 M60 81 L72 81" stroke="#F5E9D0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Флагшток -->
  <path d="M30 73 L30 14" stroke="#8F5A3A" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="30" cy="12" r="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Клетчатый флаг (натянут ветром вправо) -->
  <path d="M32 14 L78 14 L78 46 L32 46 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Чёрные клетки 4×4 -->
  <path d="M32 14 h11.5 v8 h-11.5 Z M55 14 h11.5 v8 h-11.5 Z M43.5 22 h11.5 v8 h-11.5 Z M66.5 22 h11.5 v8 h-11.5 Z M32 30 h11.5 v8 h-11.5 Z M55 30 h11.5 v8 h-11.5 Z M43.5 38 h11.5 v8 h-11.5 Z M66.5 38 h11.5 v8 h-11.5 Z" fill="#1A1A1A"/>
  <!-- Прогиб полотна (живая деталь) -->
  <path d="M32 45 Q55 48 78 45" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
