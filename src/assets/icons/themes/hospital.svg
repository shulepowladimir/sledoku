<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hospital theme — white building, red cross, ambulance stripe.
  -->

  <!-- ══ SKY ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="74" width="96" height="22" fill="#4D8B3A"/>
  <rect x="0" y="80" width="96" height="16" fill="#3A6B2C"/>

  <!-- ══ BUILDING SHADOW ══ -->
  <rect x="14" y="22" width="72" height="58" rx="3" fill="#3A2A20"/>

  <!-- ══ MAIN BUILDING ══ -->
  <rect x="10" y="18" width="72" height="58" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ WINDOWS (3×2 grid) ══ -->
  <rect x="16" y="26" width="14" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="34" y="26" width="14" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="52" y="26" width="14" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="16" y="42" width="14" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="52" y="42" width="14" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Window cross dividers -->
  <line x1="23" y1="26" x2="23" y2="38" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="16" y1="32" x2="30" y2="32" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="41" y1="26" x2="41" y2="38" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="34" y1="32" x2="48" y2="32" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="59" y1="26" x2="59" y2="38" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="52" y1="32" x2="66" y2="32" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="23" y1="42" x2="23" y2="54" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="16" y1="48" x2="30" y2="48" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="59" y1="42" x2="59" y2="54" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="52" y1="48" x2="66" y2="48" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ RED CROSS (centre facade) ══ -->
  <rect x="38" y="38" width="10" height="28" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="30" y="46" width="26" height="10" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ ENTRANCE ══ -->
  <rect x="34" y="58" width="20" height="18" rx="3" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Door frame -->
  <line x1="44" y1="58" x2="44" y2="76" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ ROOF RAIL ══ -->
  <rect x="10" y="16" width="72" height="5" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SIGN ══ -->
  <rect x="22" y="6" width="38" height="12" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="26" y="9" width="6" height="6" rx="1" fill="#F5E9D0"/>
  <rect x="34" y="9" width="6" height="6" rx="1" fill="#F5E9D0"/>
  <rect x="42" y="9" width="6" height="6" rx="1" fill="#F5E9D0"/>
  <rect x="50" y="9" width="6" height="6" rx="1" fill="#F5E9D0"/>
</svg>
