<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    island theme — aerial map view: tropical island in sky-blue sea.
    Sky-blue water, gold sandy island, green palm, cream beach ring.
  -->

  <!-- ══ WATER BACKGROUND ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>

  <!-- ══ WAVE LINES ══ -->
  <path d="M4,14 C14,10 26,18 38,14" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M58,14 C68,10 80,18 92,14" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4,76 C14,72 24,80 34,76"  fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M62,80 C72,76 82,84 92,80" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M4,46 C10,42 16,50 22,46"  fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M74,46 C80,42 86,50 92,46" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ ISLAND SHADOW ══ -->
  <ellipse cx="52" cy="64" rx="32" ry="20" fill="#3A2A20"/>

  <!-- ══ ISLAND BODY ══ -->
  <ellipse cx="48" cy="60" rx="32" ry="20" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Beach ring (lighter sand) -->
  <ellipse cx="48" cy="60" rx="26" ry="15" fill="#F5E9D0"/>
  <!-- Interior island ground -->
  <ellipse cx="48" cy="60" rx="18" ry="10" fill="#E0A94A"/>

  <!-- ══ PALM TREE ══ -->
  <!-- Trunk -->
  <rect x="46" y="32" width="5" height="28" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Coconuts -->
  <circle cx="48" cy="34" r="3.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Fronds -->
  <ellipse cx="48" cy="28" rx="16" ry="5" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="36" cy="32" rx="13" ry="4" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="2" transform="rotate(-30 36 32)"/>
  <ellipse cx="60" cy="32" rx="13" ry="4" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="2" transform="rotate(30 60 32)"/>
  <ellipse cx="34" cy="26" rx="10" ry="3" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5" transform="rotate(-50 34 26)"/>
  <ellipse cx="62" cy="26" rx="10" ry="3" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5" transform="rotate(50 62 26)"/>
</svg>
