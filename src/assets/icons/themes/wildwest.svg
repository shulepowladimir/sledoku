<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wildwest — western bank building. Gold/cream wood facade, barred windows, false front.
  -->

  <!-- ══ SKY (dusty) ══ -->
  <rect width="96" height="96" fill="#E0A94A"/>
  <!-- Horizon dust haze -->
  <rect x="0" y="64" width="96" height="32" fill="#C89830"/>
  <!-- Ground (dirt) -->
  <rect x="0" y="76" width="96" height="20" fill="#7C5D31"/>

  <!-- ══ BUILDING SHADOW ══ -->
  <rect x="8" y="14" width="82" height="70" rx="2" fill="#3A2A20"/>

  <!-- ══ FALSE FRONT (tall decorative top) ══ -->
  <rect x="4" y="4" width="82" height="18" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- "BANK" simulated text blocks -->
  <rect x="12" y="8"  width="10" height="10" rx="1" fill="#1F3A5F"/>
  <rect x="26" y="8"  width="10" height="10" rx="1" fill="#1F3A5F"/>
  <rect x="40" y="8"  width="10" height="10" rx="1" fill="#1F3A5F"/>
  <rect x="54" y="8"  width="10" height="10" rx="1" fill="#1F3A5F"/>
  <!-- Ornate top trim -->
  <rect x="4" y="4"  width="82" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="4" y="18" width="82" height="4"         fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ MAIN BUILDING FACE ══ -->
  <rect x="4" y="22" width="82" height="56" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ WOODEN PORCH COLUMNS ══ -->
  <rect x="10" y="22" width="6"  height="56" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="74" y="22" width="6"  height="56" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Porch beam -->
  <rect x="4"  y="22" width="82" height="8"  rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ BARRED WINDOWS ══ -->
  <!-- Left window -->
  <rect x="14" y="34" width="18" height="18" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="20" y1="34" x2="20" y2="52" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="26" y1="34" x2="26" y2="52" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="14" y1="43" x2="32" y2="43" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Right window -->
  <rect x="56" y="34" width="18" height="18" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="62" y1="34" x2="62" y2="52" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="68" y1="34" x2="68" y2="52" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="56" y1="43" x2="74" y2="43" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ BANK DOOR (centre) ══ -->
  <rect x="34" y="48" width="20" height="30" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Door panels -->
  <rect x="36" y="50" width="7"  height="10" rx="1" fill="#C89830" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="45" y="50" width="7"  height="10" rx="1" fill="#C89830" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="36" y="62" width="7"  height="10" rx="1" fill="#C89830" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="45" y="62" width="7"  height="10" rx="1" fill="#C89830" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Door knob -->
  <circle cx="43" cy="65" r="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ HITCHING POST ══ -->
  <rect x="0"  y="72" width="4"  height="16" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="84" y="72" width="4"  height="16" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="0"  y="68" width="88" height="5"  rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
