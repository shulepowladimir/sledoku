<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    station — grand railway terminal. Arched glass facade, clock tower, stone columns.
  -->

  <!-- ══ SKY ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="76" width="96" height="20" fill="#A8A8A0"/>

  <!-- ══ MAIN BUILDING SHADOW ══ -->
  <rect x="8" y="20" width="80" height="60" rx="3" fill="#3A2A20"/>

  <!-- ══ MAIN BUILDING ══ -->
  <rect x="4" y="16" width="80" height="62" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ CENTRAL ARCH (glass) ══ -->
  <path d="M28,78 L28,38 Q48,16 68,38 L68,78 Z" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Arch rib lines -->
  <path d="M38,78 L38,42 Q48,26 58,42 L58,78" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="28" y1="58" x2="68" y2="58" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="30" y1="46" x2="66" y2="46" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ COLUMNS ══ -->
  <rect x="8"  y="32" width="8" height="46" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="18" y="32" width="8" height="46" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="66" y="32" width="8" height="46" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="76" y="32" width="8" height="46" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SIDE WINDOWS ══ -->
  <rect x="8"  y="18" width="18" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="17" y1="18" x2="17" y2="30" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="66" y="18" width="18" height="12" rx="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="75" y1="18" x2="75" y2="30" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ CLOCK TOWER ══ -->
  <rect x="38" y="0" width="20" height="18" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Clock face -->
  <circle cx="48" cy="9" r="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="9" r="5" fill="#E8E0CC"/>
  <!-- Clock hands -->
  <line x1="48" y1="9" x2="48" y2="5"  stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="9" x2="51" y2="11" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tower top -->
  <polygon points="38,2 48,0 58,2 58,4 38,4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CORNICE / ENTABLATURE ══ -->
  <rect x="4" y="30" width="80" height="6" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ENTRANCE STEPS ══ -->
  <rect x="30" y="76" width="36" height="4" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="34" y="80" width="28" height="4" rx="1" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ TRAIN RAIL (foreground) ══ -->
  <line x1="0" y1="90" x2="96" y2="90" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="0" y1="85" x2="96" y2="85" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="8"  y1="84" x2="8"  y2="92" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="24" y1="84" x2="24" y2="92" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="40" y1="84" x2="40" y2="92" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="56" y1="84" x2="56" y2="92" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="72" y1="84" x2="72" y2="92" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="88" y1="84" x2="88" y2="92" stroke="#1A1A1A" stroke-width="2"/>
</svg>
