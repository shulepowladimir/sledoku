<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    pirates — «Сундук мертвеца»: пиратский фрегат на волнах под рассветным
    небом, чёрный флаг с черепом, на переднем плане — сундук с сокровищами.
  -->
  <!-- Рассветное небо -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#1F3A5F"/>
  <!-- Заря слева -->
  <circle cx="20" cy="22" r="8" fill="#E8B95F"/>
  <path d="M8 26 Q20 20 34 26" fill="none" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Звёзды справа -->
  <circle cx="72" cy="14" r="1.3" fill="#F5E9D0"/>
  <circle cx="82" cy="22" r="1" fill="#F5E9D0"/>
  <circle cx="64" cy="10" r="1" fill="#F5E9D0"/>

  <!-- Море -->
  <path d="M6 58 Q40 52 90 58 L90 84 Q90 90 84 90 L12 90 Q6 90 6 84 Z" fill="#4A7BA6"/>
  <path d="M10 64 Q30 60 50 64 Q70 68 88 63" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <path d="M8 74 Q32 70 54 74 Q74 78 90 72" fill="none" stroke="#61889F" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M14 84 Q36 80 58 84 Q76 87 88 83" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Корпус фрегата (взгляд сбоку, плывёт вправо) -->
  <path d="M14 52 L84 52 L78 70 Q48 76 20 70 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Пушечные порты -->
  <circle cx="30" cy="60" r="2.6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="44" cy="61.5" r="2.6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="58" cy="61.5" r="2.6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="70" cy="60" r="2.6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Бортовая полоса -->
  <path d="M16 55 L82 55" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Бушприт -->
  <path d="M84 52 L94 46" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>

  <!-- Мачты -->
  <path d="M38 52 L38 18" stroke="#B87F33" stroke-width="3.4"/>
  <path d="M62 52 L62 24" stroke="#B87F33" stroke-width="3"/>

  <!-- Паруса (кремовые, надутые вправо) -->
  <path d="M40 20 Q60 24 58 42 Q48 46 40 44 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M64 26 Q78 30 76 44 Q69 47 64 45 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Швы парусов -->
  <path d="M46 22 Q48 32 46 43 M52 23 Q53 33 52 44" stroke="#DFD6C6" stroke-width="1.4" fill="none"/>
  <!-- Реи -->
  <path d="M34 20 L62 18 M60 26 L80 26" stroke="#8F5A3A" stroke-width="2"/>

  <!-- Чёрный флаг с черепом (на грот-мачте) -->
  <path d="M38 18 L38 6 L52 8 Q50 13 52 18 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Череп -->
  <circle cx="44.5" cy="11.5" r="2.6" fill="#F5E9D0"/>
  <circle cx="43.7" cy="11" r="0.7" fill="#1A1A1A"/>
  <circle cx="45.5" cy="11" r="0.7" fill="#1A1A1A"/>
  <path d="M43.3 13.6 L45.7 13.6" stroke="#1A1A1A" stroke-width="0.9"/>
  <!-- Кости -->
  <path d="M48.5 10 L51.5 13 M51.5 10 L48.5 13" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Сундук на переднем плане -->
  <path d="M22 76 L52 76 L52 84 Q52 86 50 86 L24 86 Q22 86 22 84 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22 76 Q37 70 52 76 L52 79 Q37 73 22 79 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Металлические полосы -->
  <path d="M27 76 L27 86 M47 76 L47 86" stroke="#9BA5AD" stroke-width="2"/>
  <circle cx="37" cy="80" r="1.8" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Монетка, выглядывающая из сундука -->
  <circle cx="40" cy="73.5" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
