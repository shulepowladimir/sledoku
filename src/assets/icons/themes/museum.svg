<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    museum — neoclassical museum building. Cream pediment, gold columns, red banner, Greek frieze.
  -->

  <!-- ══ SKY ══ -->
  <rect width="96" height="96" fill="#7EB9D4"/>
  <!-- Clouds -->
  <ellipse cx="18" cy="12" rx="14" ry="6" fill="#F5E9D0"/>
  <ellipse cx="28" cy="10" rx="10" ry="5" fill="#F5E9D0"/>
  <ellipse cx="74" cy="14" rx="12" ry="5" fill="#F5E9D0"/>

  <!-- ══ GROUND ══ -->
  <rect x="0" y="82" width="96" height="14" fill="#A8A8A0"/>

  <!-- ══ STEPS ══ -->
  <rect x="4"  y="76" width="88" height="6" rx="2" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="8"  y="80" width="80" height="6" rx="2" fill="#E8E0CC" stroke="#1A1A5F" stroke-width="1.5"/>

  <!-- ══ MAIN BUILDING SHADOW ══ -->
  <rect x="8"  y="30" width="82" height="50" rx="2" fill="#3A2A20"/>

  <!-- ══ MAIN BUILDING BODY ══ -->
  <rect x="4"  y="26" width="82" height="52" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ FRIEZE (below pediment) ══ -->
  <rect x="4"  y="40" width="82" height="8"  rx="1" fill="#E0D4B0" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Triglyphs -->
  <rect x="10" y="40" width="6"  height="8" rx="1" fill="#A8A8A0"/>
  <line x1="12" y1="40" x2="12" y2="48" stroke="#888880" stroke-width="1.5"/>
  <line x1="14" y1="40" x2="14" y2="48" stroke="#888880" stroke-width="1.5"/>
  <rect x="26" y="40" width="6"  height="8" rx="1" fill="#A8A8A0"/>
  <line x1="28" y1="40" x2="28" y2="48" stroke="#888880" stroke-width="1.5"/>
  <line x1="30" y1="40" x2="30" y2="48" stroke="#888880" stroke-width="1.5"/>
  <rect x="44" y="40" width="6"  height="8" rx="1" fill="#A8A8A0"/>
  <line x1="46" y1="40" x2="46" y2="48" stroke="#888880" stroke-width="1.5"/>
  <line x1="48" y1="40" x2="48" y2="48" stroke="#888880" stroke-width="1.5"/>
  <rect x="62" y="40" width="6"  height="8" rx="1" fill="#A8A8A0"/>
  <line x1="64" y1="40" x2="64" y2="48" stroke="#888880" stroke-width="1.5"/>
  <line x1="66" y1="40" x2="66" y2="48" stroke="#888880" stroke-width="1.5"/>
  <rect x="74" y="40" width="6"  height="8" rx="1" fill="#A8A8A0"/>
  <line x1="76" y1="40" x2="76" y2="48" stroke="#888880" stroke-width="1.5"/>
  <line x1="78" y1="40" x2="78" y2="48" stroke="#888880" stroke-width="1.5"/>

  <!-- ══ COLUMNS (gold, 6) ══ -->
  <rect x="6"  y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="18" y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="30" y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="54" y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="66" y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="78" y="42" width="8" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Column flutes -->
  <line x1="9"  y1="42" x2="9"  y2="78" stroke="#C89830" stroke-width="1"/>
  <line x1="21" y1="42" x2="21" y2="78" stroke="#C89830" stroke-width="1"/>
  <line x1="33" y1="42" x2="33" y2="78" stroke="#C89830" stroke-width="1"/>
  <line x1="57" y1="42" x2="57" y2="78" stroke="#C89830" stroke-width="1"/>
  <line x1="69" y1="42" x2="69" y2="78" stroke="#C89830" stroke-width="1"/>
  <line x1="81" y1="42" x2="81" y2="78" stroke="#C89830" stroke-width="1"/>

  <!-- ══ DOOR ══ -->
  <rect x="38" y="52" width="16" height="26" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Door arch -->
  <path d="M38,52 Q46,44 54,52" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Door panels -->
  <line x1="46" y1="44" x2="46" y2="78" stroke="#2E5580" stroke-width="1.5"/>
  <line x1="38" y1="62" x2="54" y2="62" stroke="#2E5580" stroke-width="1.5"/>

  <!-- ══ PEDIMENT (triangular gable) ══ -->
  <!-- Shadow -->
  <polygon points="8,44 50,12 90,44" fill="#3A2A20"/>
  <!-- Body -->
  <polygon points="4,40 46,8 88,40" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Raking cornice lines -->
  <line x1="4"  y1="40" x2="46" y2="8"  stroke="#E0D4B0" stroke-width="2"/>
  <line x1="88" y1="40" x2="46" y2="8"  stroke="#E0D4B0" stroke-width="2"/>
  <!-- Pediment relief: simplified figure -->
  <ellipse cx="46" cy="28" rx="6" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="42" y="32" width="8"  height="6" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ RED BANNER ══ -->
  <rect x="40" y="42" width="12" height="22" rx="1" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="46" y1="42" x2="46" y2="64" stroke="#A80020" stroke-width="1.5"/>
</svg>
