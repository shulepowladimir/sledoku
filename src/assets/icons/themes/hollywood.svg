<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    hollywood theme — clapperboard under a spotlight beam, film reel aside.
    Dark board, red stripe, cream spotlight cone, teal reel hub.
  -->

  <!-- ══ SPOTLIGHT BEAM ══ -->
  <polygon points="70,4 92,4 78,50 58,50" fill="#F5E9D0" opacity="0.35"/>
  <polygon points="74,4 88,4 78,40 66,40" fill="#F5E9D0" opacity="0.5"/>

  <!-- ══ FILM REEL (background, left) ══ -->
  <circle cx="20" cy="26" r="14" fill="#3A2A20"/>
  <circle cx="18" cy="24" r="14" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="18" cy="24" r="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="18" cy="15" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="26" cy="21" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="26" cy="30" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="18" cy="33" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="10" cy="26" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ CLAPPERBOARD SHADOW ══ -->
  <polygon points="26,52 78,44 82,58 30,66" fill="#3A2A20"/>
  <rect x="26" y="58" width="52" height="30" rx="3" fill="#3A2A20"/>

  <!-- ══ CLAPPER STICKS (top, open) ══ -->
  <polygon points="24,50 76,42 80,56 28,64" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="30,46 42,44 44,50 32,52" fill="#F5E9D0"/>
  <polygon points="46,43.5 58,41.5 60,47.5 48,49.5" fill="#C8102E"/>
  <polygon points="62,41 74,39 76,45 64,47" fill="#F5E9D0"/>

  <!-- ══ BOARD BODY ══ -->
  <rect x="22" y="54" width="52" height="30" rx="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Diagonal stripe -->
  <polygon points="22,60 74,54 74,60 22,66" fill="#C8102E"/>
  <!-- Text lines -->
  <line x1="28" y1="72" x2="52" y2="72" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="78" x2="44" y2="78" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
</svg>
