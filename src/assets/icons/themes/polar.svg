<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    polar — «Полярная ночь»: станция-модуль под северным сиянием
    (слоёные дуги зелень/бирюза — обычные палитровые слои, не неон),
    снег, торос, антенна с красным маячком.
  -->
  <!-- Полярное небо -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#1F3A5F"/>

  <!-- Звёзды -->
  <circle cx="16" cy="16" r="1.3" fill="#F5E9D0"/>
  <circle cx="30" cy="12" r="1" fill="#F5E9D0"/>
  <circle cx="80" cy="14" r="1.2" fill="#F5E9D0"/>
  <circle cx="86" cy="26" r="1" fill="#F5E9D0"/>
  <circle cx="12" cy="34" r="1" fill="#F5E9D0"/>

  <!-- Северное сияние: слоёные дуги -->
  <path d="M8 34 Q28 14 48 30 Q68 44 88 26" fill="none" stroke="#7FA85B" stroke-width="5" stroke-linecap="round"/>
  <path d="M8 34 Q28 14 48 30 Q68 44 88 26" fill="none" stroke="#A4B18E" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 44 Q34 28 52 40" fill="none" stroke="#2E6E65" stroke-width="4" stroke-linecap="round"/>

  <!-- Снежное поле -->
  <path d="M6 62 Q30 56 50 62 Q70 68 90 60 L90 84 Q90 90 84 90 L12 90 Q6 90 6 84 Z" fill="#EDE7DB"/>

  <!-- Здание станции -->
  <rect x="22" y="44" width="40" height="26" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Плоская крыша со снегом -->
  <path d="M20 44 L64 44 L64 40 L20 40 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M20 40 Q42 34 64 40" fill="#EDE7DB" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Тёплые окна -->
  <rect x="28" y="52" width="9" height="9" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="46" y="52" width="9" height="9" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Переплёты -->
  <path d="M32.5 52 L32.5 61 M28 56.5 L37 56.5 M50.5 52 L50.5 61 M46 56.5 L55 56.5" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Дверь -->
  <rect x="56" y="56" width="7" height="14" rx="1" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Антенна на крыше -->
  <path d="M42 40 L42 22 M34 26 L50 26 M37 22 L47 22" stroke="#9BA5AD" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Маячок (красный акцент) -->
  <circle cx="42" cy="20" r="2.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Торос -->
  <path d="M68 62 Q66 50 76 48 Q86 46 88 56 Q90 62 86 64 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M72 52 Q78 50 82 54" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
</svg>
