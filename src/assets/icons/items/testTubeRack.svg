<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    testTubeRack — стеллаж пробирок (1кл, decorative): стальная рама-лесенка
    с перекладиной, четыре пробирки с жидкостью (вода/стекло), одна — с красным
    реактивом (живая деталь). Свет сверху-слева.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="26" ry="5" fill="#3A2A20"/>

  <!-- Стойка-лесенка (П-образная рама) -->
  <path d="M18 24 L18 84 L26 84 L26 30 M70 30 L70 84 L78 84 L78 24"
        fill="none" stroke="#68727A" stroke-width="5" stroke-linecap="round"/>
  <!-- Верхняя перекладина (держатель пробирок) -->
  <rect x="16" y="20" width="64" height="9" rx="4" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M20 23 H76" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <!-- Нижняя опора-поддон -->
  <rect x="22" y="76" width="52" height="8" rx="4" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M26 79 H70" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Пробирка 1 (синяя) -->
  <rect x="24" y="28" width="10" height="48" rx="5" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M25.5 48 Q29 51 32.5 48 L32.5 71 Q29 74 25.5 71 Z" fill="#4A7BA6"/>
  <circle cx="27.5" cy="34" r="1.4" fill="#F5E9D0"/>

  <!-- Пробирка 2 (красный реактив — акцент) -->
  <rect x="38" y="26" width="10" height="50" rx="5" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M39.5 40 Q43 43 46.5 40 L46.5 72 Q43 75 39.5 72 Z" fill="#C8102E"/>
  <circle cx="41.5" cy="31" r="1.4" fill="#F5E9D0"/>
  <!-- Пузырьки в красной -->
  <circle cx="43" cy="60" r="1.6" fill="#F5E9D0"/>
  <circle cx="43" cy="66" r="1.1" fill="#F5E9D0"/>

  <!-- Пробирка 3 (высокий уровень) -->
  <rect x="52" y="28" width="10" height="48" rx="5" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M53.5 38 Q57 41 60.5 38 L60.5 71 Q57 74 53.5 71 Z" fill="#4A7BA6"/>
  <circle cx="55.5" cy="33" r="1.4" fill="#F5E9D0"/>
  <circle cx="57" cy="50" r="1.2" fill="#F5E9D0"/>

  <!-- Пробирка 4 (почти пустая) -->
  <rect x="66" y="30" width="10" height="46" rx="5" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M67.5 66 Q71 68.5 74.5 66 L74.5 71.5 Q71 74 67.5 71.5 Z" fill="#4A7BA6"/>
  <circle cx="69.5" cy="36" r="1.4" fill="#F5E9D0"/>

  <!-- Градуировка на пробирке 1 (штрихи) -->
  <path d="M25 55 H27.5 M25 62 H27.5" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
</svg>
