<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hammock — rope hammock between two dark posts.
    Posts: shadow brown. Hammock fill: gold/orange.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="10" y="10" width="12" height="78" rx="5" fill="#3A2A20"/>
  <rect x="78" y="10" width="12" height="78" rx="5" fill="#3A2A20"/>

  <!-- ══ POSTS ══ -->
  <rect x="6" y="6" width="12" height="78" rx="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="78" y="6" width="12" height="78" rx="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Post caps (orange) -->
  <rect x="4" y="4" width="16" height="8" rx="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="76" y="4" width="16" height="8" rx="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ ROPES ══ -->
  <line x1="18" y1="32" x2="22" y2="44" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="32" x2="74" y2="44" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ HAMMOCK BODY ══ -->
  <!-- Filled hammock shape: top edge (taut) + sagging bottom edge -->
  <path d="M18,32 C28,34 68,34 78,32 C72,70 24,70 18,32 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripe lines on hammock fabric -->
  <path d="M22,40 C32,56 64,56 74,40" fill="none" stroke="#E0824A" stroke-width="2" stroke-linecap="round"/>
  <path d="M24,48 C34,62 62,62 72,48" fill="none" stroke="#E0824A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26,55 C36,67 60,67 70,55" fill="none" stroke="#E0824A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fringe at each end -->
  <line x1="18" y1="32" x2="14" y2="40" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="14" y2="48" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="32" x2="82" y2="40" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="40" x2="82" y2="48" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
</svg>
