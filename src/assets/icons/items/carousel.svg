<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    carousel — merry-go-round, front view. Conical canopy with alternating panels,
    center pole, two visible horses on poles.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="44" y="50" width="8" height="40" rx="3" fill="#3A2A20"/>
  <ellipse cx="52" cy="92" rx="26" ry="6" fill="#3A2A20"/>

  <!-- ══ PLATFORM BASE ══ -->
  <ellipse cx="48" cy="88" rx="36" ry="8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ CENTER POLE ══ -->
  <rect x="44" y="28" width="8" height="62" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ HANGING POLES (to horses) ══ -->
  <line x1="48" y1="42" x2="18" y2="54" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="42" x2="78" y2="54" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical horse poles -->
  <line x1="18" y1="54" x2="18" y2="82" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="54" x2="78" y2="82" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══ HORSES (simplified, side-on) ══ -->
  <!-- Left horse -->
  <ellipse cx="18" cy="72" rx="10" ry="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="14" y="74" width="5" height="10" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="20" y="74" width="5" height="10" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="24" cy="68" rx="6" ry="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Right horse (facing opposite) -->
  <ellipse cx="78" cy="72" rx="10" ry="7" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="72" y="74" width="5" height="10" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="78" y="74" width="5" height="10" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="72" cy="68" rx="6" ry="5" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CANOPY (cone, alternating panels) ══ -->
  <!-- Panel 1: red -->
  <polygon points="48,6 18,42 33,42" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Panel 2: cream -->
  <polygon points="48,6 33,42 48,44" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Panel 3: red -->
  <polygon points="48,6 48,44 63,42" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Panel 4: cream -->
  <polygon points="48,6 63,42 78,42" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Canopy rim ring -->
  <ellipse cx="48" cy="42" rx="30" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Canopy tip -->
  <circle cx="48" cy="6" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Pennant flags along rim -->
  <polygon points="18,42 14,36 22,38" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <polygon points="48,36 44,30 52,32" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1"/>
  <polygon points="78,42 74,36 82,38" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
</svg>
