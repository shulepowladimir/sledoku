<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    medicineCabinet — wall-mounted medicine cabinet. White/cream body, mirrored door, red cross, pill bottles.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="8" y="6" width="78" height="84" rx="6" fill="#3A2A20"/>

  <!-- ══ CABINET BODY ══ -->
  <rect x="4"  y="2" width="78" height="84" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ MIRROR DOOR (left half open, right half closed/mirrored) ══ -->
  <!-- Left door (open, showing interior) -->
  <rect x="6"  y="4" width="36" height="80" rx="4" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Shelf lines inside -->
  <rect x="8"  y="26" width="32" height="2.5" rx="1" fill="#C8C0AC"/>
  <rect x="8"  y="50" width="32" height="2.5" rx="1" fill="#C8C0AC"/>
  <rect x="8"  y="72" width="32" height="2.5" rx="1" fill="#C8C0AC"/>
  <!-- Pill bottles on shelves -->
  <!-- Top shelf -->
  <rect x="10" y="14" width="8" height="12" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="10" y="12" width="8" height="4"  rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="22" y="14" width="8" height="12" rx="3" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="22" y="12" width="8" height="4"  rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Middle shelf -->
  <rect x="10" y="36" width="6"  height="14" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="10" y="34" width="6"  height="4"  rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="20" y="38" width="10" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="31" y="36" width="7"  height="14" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Bandage roll -->
  <ellipse cx="16" cy="60" rx="7" ry="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="16" cy="60" rx="3" ry="2" fill="#C8102E"/>
  <!-- Scissors -->
  <path d="M25,57 Q30,60 25,63" fill="none" stroke="#A8A8A0" stroke-width="2"/>
  <path d="M30,57 Q25,60 30,63" fill="none" stroke="#A8A8A0" stroke-width="2"/>

  <!-- Right door (closed, mirrored — sky reflection) -->
  <rect x="44" y="4" width="36" height="80" rx="4" fill="#D4E0E8" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Mirror gleam lines -->
  <line x1="52" y1="10" x2="56" y2="70" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="8"  x2="65" y2="60" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Red cross on mirror -->
  <rect x="66" y="12" width="8"  height="24" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="62" y="20" width="16" height="8"  rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ DOOR KNOBS ══ -->
  <circle cx="42" cy="44" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="46" cy="44" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ WALL MOUNT SCREWS ══ -->
  <circle cx="8"  cy="10" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="78" cy="10" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="8"  cy="78" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="78" cy="78" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1"/>
</svg>
