<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    boat — small sailing dinghy / ял, side view. Gold hull, cream sail, navy mast, teal water line.
  -->

  <!-- ══ WATER LINE ══ -->
  <path d="M4,72 C20,68 44,76 72,70 C84,68 90,72 92,72 L92,80 C90,80 84,76 72,78 C44,84 20,76 4,80 Z"
        fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ HULL SHADOW ══ -->
  <path d="M14,62 L82,62 Q90,70 76,78 L18,78 Q8,70 14,62 Z" fill="#3A2A20"/>

  <!-- ══ HULL ══ -->
  <path d="M10,58 L80,58 Q88,66 72,74 L22,74 Q6,66 10,58 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Hull planking lines -->
  <path d="M14,62 Q48,64 82,62" fill="none" stroke="#C89830" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16,66 Q48,68 80,66" fill="none" stroke="#C89830" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20,70 Q48,72 76,70" fill="none" stroke="#C89830" stroke-width="1" stroke-linecap="round"/>
  <!-- Gunwale (top rail) -->
  <rect x="10" y="54" width="70" height="6" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ MAST ══ -->
  <rect x="44" y="10" width="4" height="48" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SAIL ══ -->
  <!-- Main sail (triangular) -->
  <polygon points="48,12 48,52 78,50"
           fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sail seam lines -->
  <line x1="48" y1="22" x2="72" y2="50" stroke="#E0D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="34" x2="66" y2="50" stroke="#E0D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Jib sail (small front) -->
  <polygon points="44,18 44,52 18,52"
           fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- ══ BOOM / YARD ══ -->
  <rect x="44" y="50" width="36" height="4" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ FLAG ══ -->
  <polygon points="48,10 62,13 48,16" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ OARS (stowed) ══ -->
  <rect x="14" y="56" width="34" height="3" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1"/>
  <ellipse cx="14" cy="57.5" rx="5" ry="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1"/>
</svg>
