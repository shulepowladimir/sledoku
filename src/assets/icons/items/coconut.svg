<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    coconut — whole coconut + halved piece showing white interior.
    Dark fibrous shell, cream flesh, gold husk fibre.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="54" cy="78" rx="32" ry="10" fill="#3A2A20"/>
  <!-- Half shadow -->
  <ellipse cx="28" cy="68" rx="22" ry="14" fill="#3A2A20"/>

  <!-- ══ WHOLE COCONUT ══ -->
  <!-- Husk fibre texture base -->
  <ellipse cx="58" cy="46" rx="28" ry="26" fill="#5A3A18" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Fibre lines (curved, dark) -->
  <path d="M34,40 Q58,28 82,40" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32,46 Q58,34 84,46" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M34,52 Q58,40 82,52" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36,58 Q58,46 80,58" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38,64 Q58,52 78,64" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shell highlight -->
  <ellipse cx="50" cy="36" rx="12" ry="7" fill="#7C5D31"/>
  <!-- Three "eyes" at stem end -->
  <circle cx="72" cy="36" r="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="78" cy="42" r="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="74" cy="48" r="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ HALVED COCONUT PIECE ══ -->
  <!-- Shell outer -->
  <path d="M8,56 Q8,28 28,28 Q48,28 48,56 Z"
        fill="#5A3A18" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Shell inner (thin ring) -->
  <path d="M12,56 Q12,32 28,32 Q44,32 44,56 Z" fill="#3A2A20"/>
  <!-- Cream flesh interior -->
  <path d="M16,56 Q16,36 28,36 Q40,36 40,56 Z" fill="#F5E9D0"/>
  <!-- Water hollow (center dark circle) -->
  <ellipse cx="28" cy="52" rx="6" ry="5" fill="#C89830"/>
  <!-- Flesh grain lines -->
  <path d="M18,50 Q28,44 38,50" fill="none" stroke="#E0D4B8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M17,44 Q28,38 39,44" fill="none" stroke="#E0D4B8" stroke-width="1" stroke-linecap="round"/>
</svg>
