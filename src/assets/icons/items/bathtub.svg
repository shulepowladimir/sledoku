<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bathtub — clawfoot bathtub, 3/4 view. Cream porcelain, gold fixtures, teal water.
  -->

  <!-- ══ SHADOWS ══ -->
  <ellipse cx="50" cy="82" rx="38" ry="8" fill="#3A2A20"/>
  <rect x="16" y="32" width="68" height="46" rx="14" fill="#3A2A20"/>

  <!-- ══ CLAW FEET (4) ══ -->
  <!-- Front-left -->
  <rect x="16" y="72" width="8" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="20" cy="84" rx="5" ry="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Front-right -->
  <rect x="72" y="72" width="8" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="76" cy="84" rx="5" ry="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Back-left (smaller, behind) -->
  <rect x="18" y="68" width="6" height="8" rx="2" fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Back-right -->
  <rect x="72" y="68" width="6" height="8" rx="2" fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ TUB BODY ══ -->
  <rect x="12" y="28" width="68" height="46" rx="14" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Interior rim top -->
  <rect x="18" y="32" width="56" height="10" rx="10" fill="#E0D4B8" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Water surface (teal) -->
  <ellipse cx="48" cy="42" rx="26" ry="8" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Water interior deeper area -->
  <ellipse cx="48" cy="44" rx="22" ry="12" fill="#5A9AB8"/>
  <!-- Tub inner wall visible above water -->
  <rect x="18" y="42" width="56" height="26" rx="10" fill="#F5E9D0"/>

  <!-- ══ FAUCET END (left) ══ -->
  <rect x="8"  y="32" width="10" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Spout -->
  <rect x="10" y="40" width="8" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Hot/cold handles -->
  <circle cx="11" cy="34" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="17" cy="34" r="3" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ DRAIN ══ -->
  <circle cx="78" cy="70" r="4" fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="76" y1="70" x2="80" y2="70" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="78" y1="68" x2="78" y2="72" stroke="#1A1A1A" stroke-width="1"/>
</svg>
