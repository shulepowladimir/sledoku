<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    micStand — стойка с микрофоном: стальное основание-тренога, круглая опорная
    площадка, телескопическая стойка со стопорным узлом, наклонная «гусиная шея»
    и микрофонная капсюля (тёмный гриль со стальным бликом, красная точка
    «включён» — единственный красный акцент); живая деталь — петля кабеля у ног.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="89" rx="26" ry="4" fill="#3A2A20"/>

  <!-- Кабель-петля у основания (живая деталь) -->
  <path d="M62 84 Q70 80 74 84 Q76 87 72 88" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Тренога: три луча -->
  <path d="M48 82 L24 88 M48 82 L72 88 M48 82 L48 89" stroke="#5C6670" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M46 82.5 L27 87.5 M47 84.5 L47 88" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Центральная опорная площадка -->
  <ellipse cx="48" cy="81.5" rx="7" ry="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Стойка -->
  <rect x="45.6" y="30" width="4.8" height="51" rx="2.4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Светлая кромка стойки слева -->
  <path d="M47 33 L47 78" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Стопорный узел -->
  <rect x="43.6" y="52" width="8.8" height="7" rx="2.6" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="55.5" r="1.5" fill="#D5DCE1"/>

  <!-- Гусиная шея -->
  <path d="M48 30 Q48 20 38 18" fill="none" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <path d="M47.4 29 Q47.4 21.5 39.5 19.4" fill="none" stroke="#9BA5AD" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Корпус микрофона -->
  <rect x="20" y="8" width="12" height="19" rx="5.4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6"
        transform="rotate(14 26 17)"/>
  <!-- Стальной гриль -->
  <g transform="rotate(14 26 17)">
    <rect x="23.4" y="7.4" width="5.2" height="7" rx="2.6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M24.6 9 L27.4 9 M24.6 11.5 L27.4 11.5" stroke="#D5DCE1" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Красная точка «включён» (единственный красный акцент) -->
    <circle cx="28.4" cy="21" r="1.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="0.9"/>
  </g>
</svg>
