<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    newsDesk — curved broadcast anchor desk in warm wood and navy;
    raised pale worktop, inset front panel, note cards, and a small on-air lamp.
  -->
