  <path d="M10 39 Q11 32 20 29 Q48 20 76 29 Q85 32 86 39 Q85 45 76 48 Q48 56 20 48 Q11 45 10 39 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
