<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    examTable — medical examination table. Cream padded surface, navy frame, gold adjustment rail.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="91" rx="44" ry="5" fill="#3A2A20"/>

  <!-- ══ LEGS ══ -->
  <rect x="12" y="68" width="8" height="22" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="76" y="68" width="8" height="22" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Leg cross brace -->
  <rect x="12" y="80" width="72" height="5" rx="2.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Foot bars -->
  <rect x="6"  y="84" width="22" height="5" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="68" y="84" width="22" height="5" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ TABLE FRAME ══ -->
  <rect x="8" y="50" width="80" height="22" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ PAD (padded surface, 2 sections) ══ -->
  <!-- Back section (slightly elevated) -->
  <rect x="10" y="30" width="38" height="24" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Cushion stitch lines -->
  <line x1="14" y1="38" x2="44" y2="38" stroke="#D0C9B0" stroke-width="1.5"/>
  <line x1="14" y1="44" x2="44" y2="44" stroke="#D0C9B0" stroke-width="1.5"/>

  <!-- Leg section (flat, extends from main) -->
  <rect x="48" y="36" width="40" height="18" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="52" y1="44" x2="84" y2="44" stroke="#D0C9B0" stroke-width="1.5"/>

  <!-- Hinge between sections -->
  <ellipse cx="49" cy="45" rx="4" ry="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ PILLOW ══ -->
  <rect x="12" y="28" width="22" height="8" rx="4" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="14" y1="32" x2="32" y2="32" stroke="#5A9AB8" stroke-width="1.5"/>

  <!-- ══ SIDE RAIL ══ -->
  <rect x="4"  y="46" width="6" height="26" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Height adjustment handle -->
  <circle cx="4" cy="56" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ STIRRUP (retracted, folded down) ══ -->
  <line x1="82" y1="54" x2="88" y2="64" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="89" cy="65" rx="5" ry="3" fill="none" stroke="#E0A94A" stroke-width="2"/>

  <!-- ══ ROLL OF PAPER (at head end) ══ -->
  <rect x="10" y="26" width="36" height="6" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="46" cy="29" rx="3" ry="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
