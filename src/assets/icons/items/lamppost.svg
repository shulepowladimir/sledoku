<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lamppost — Victorian-style street lamp.
    Navy pole, gold lantern glow, red accent cap.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="48" y="30" width="8" height="60" rx="3" fill="#3A2A20"/>
  <rect x="40" y="88" width="24" height="6" rx="2" fill="#3A2A20"/>
  <rect x="48" y="30" width="24" height="5" rx="2" fill="#3A2A20"/>
  <rect x="68" y="12" width="6" height="22" rx="2" fill="#3A2A20"/>
  <rect x="58" y="8" width="18" height="28" rx="3" fill="#3A2A20"/>

  <!-- ══ BASE ══ -->
  <rect x="36" y="84" width="24" height="8" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ MAIN POLE ══ -->
  <rect x="44" y="28" width="8" height="60" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ HORIZONTAL ARM ══ -->
  <rect x="44" y="28" width="26" height="5" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ VERTICAL CONNECTOR ══ -->
  <rect x="66" y="8" width="6" height="24" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ LANTERN ══ -->
  <!-- Lantern cap (red trim) -->
  <polygon points="54,8 80,8 76,4 58,4" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Lantern body -->
  <rect x="54" y="8" width="26" height="26" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Glass panes (glowing gold) -->
  <rect x="57" y="11" width="20" height="20" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Pane dividers -->
  <line x1="67" y1="11" x2="67" y2="31" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="57" y1="21" x2="77" y2="21" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Lantern base ring -->
  <rect x="54" y="32" width="26" height="4" rx="1" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
