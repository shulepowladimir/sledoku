<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    flowerbed — garden flower bed. Stone border oval, soil, flowers in red/gold/teal/sky.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="80" rx="44" ry="14" fill="#3A2A20"/>

  <!-- ══ SOIL BED ══ -->
  <ellipse cx="48" cy="72" rx="44" ry="14" fill="#7C5D31" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Soil texture lines -->
  <path d="M14,72 Q32,68 48,72 Q64,76 82,72" fill="none" stroke="#4A3018" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ STONE BORDER ══ -->
  <ellipse cx="48" cy="72" rx="44" ry="14" fill="none" stroke="#A8A8A0" stroke-width="6"/>
  <ellipse cx="48" cy="72" rx="44" ry="14" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Stone segments -->
  <line x1="14" y1="65" x2="10" y2="79" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="26" y1="59" x2="24" y2="85" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="48" y1="58" x2="48" y2="86" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="70" y1="59" x2="72" y2="85" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="82" y1="65" x2="86" y2="79" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ STEMS ══ -->
  <line x1="22" y1="72" x2="22" y2="42" stroke="#4D8B3A" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="72" x2="34" y2="36" stroke="#4D8B3A" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="72" x2="48" y2="30" stroke="#4D8B3A" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="72" x2="62" y2="36" stroke="#4D8B3A" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="72" x2="74" y2="42" stroke="#4D8B3A" stroke-width="3" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="28" cy="52" rx="8" ry="4" fill="#4D8B3A" transform="rotate(-30,28,52)"/>
  <ellipse cx="42" cy="48" rx="8" ry="4" fill="#3A6B2C" transform="rotate(25,42,48)"/>
  <ellipse cx="55" cy="44" rx="8" ry="4" fill="#4D8B3A" transform="rotate(-20,55,44)"/>
  <ellipse cx="68" cy="52" rx="7" ry="4" fill="#3A6B2C" transform="rotate(30,68,52)"/>

  <!-- ══ FLOWERS ══ -->
  <!-- Red flower (left) -->
  <circle cx="22" cy="36" r="10" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="22" cy="36" r="5"  fill="#E0A94A"/>
  <!-- Gold flower -->
  <circle cx="34" cy="30" r="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="34" cy="30" r="5"  fill="#C89830"/>
  <!-- Teal flower (centre) -->
  <circle cx="48" cy="24" r="11" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="48" cy="24" r="5"  fill="#F5E9D0"/>
  <!-- Sky flower -->
  <circle cx="62" cy="30" r="10" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="62" cy="30" r="5"  fill="#1F3A5F"/>
  <!-- Orange flower (right) -->
  <circle cx="74" cy="36" r="10" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="74" cy="36" r="5"  fill="#E0A94A"/>
  <!-- Petal marks -->
  <line x1="22" y1="26" x2="22" y2="22" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="28" y1="30" x2="32" y2="28" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="16" y1="30" x2="12" y2="28" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
