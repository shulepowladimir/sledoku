<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    treadmill — running machine. Navy frame, cream belt, gold handles, teal console.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="91" rx="46" ry="5" fill="#3A2A20"/>

  <!-- ══ BASE FRAME ══ -->
  <!-- Frame shadow -->
  <rect x="6"  y="56" width="84" height="22" rx="5" fill="#3A2A20"/>
  <!-- Frame body -->
  <rect x="2"  y="52" width="84" height="22" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ RUNNING BELT ══ -->
  <!-- Belt shadow -->
  <rect x="6"  y="44" width="76" height="16" rx="4" fill="#3A2A20"/>
  <!-- Belt surface -->
  <rect x="2"  y="40" width="76" height="16" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Belt tread lines -->
  <line x1="8"  y1="40" x2="8"  y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="18" y1="40" x2="18" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="28" y1="40" x2="28" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="38" y1="40" x2="38" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="48" y1="40" x2="48" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="58" y1="40" x2="58" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <line x1="68" y1="40" x2="68" y2="56" stroke="#D0C9B0" stroke-width="2"/>
  <!-- End rollers -->
  <ellipse cx="4"  cy="48" rx="4" ry="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="78" cy="48" rx="4" ry="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ INCLINE SUPPORT ══ -->
  <rect x="6"  y="52" width="18" height="8" rx="4" fill="#2E5580" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ REAR LEGS ══ -->
  <rect x="66" y="70" width="10" height="20" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="76" y="84" width="14" height="6"  rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ UPRIGHT HANDLEBARS ══ -->
  <!-- Left post -->
  <rect x="6"  y="8"  width="8"  height="46" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Right post -->
  <rect x="54" y="8"  width="8"  height="46" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Cross bar -->
  <rect x="6"  y="8"  width="56" height="8"  rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Grip rubber -->
  <rect x="6"  y="20" width="8"  height="18" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="54" y="20" width="8"  height="18" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CONSOLE ══ -->
  <rect x="18" y="4"  width="32" height="16" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Screen -->
  <rect x="20" y="6"  width="28" height="10" rx="2" fill="#7EB9D4"/>
  <!-- Speed indicator arc -->
  <path d="M24,14 Q34,8 44,14" fill="none" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <!-- Buttons row -->
  <circle cx="22" cy="22" r="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="28" cy="22" r="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="34" cy="22" r="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="40" cy="22" r="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="46" cy="22" r="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1"/>
</svg>
