<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    speaker — концертная колонка: деревянный кабинет с тёмным грилем, два
    диффузора (крупный вуфер с бирюзовым подвесом и стальным колпачком,
    верхний пищалка), угловые стальные накладки-кромки, ручка сверху;
    красный светодиод питания (единственный красный акцент), живая деталь —
    диагональный шов гриля.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="89" rx="27" ry="4" fill="#3A2A20"/>

  <!-- Кабель у ног (живая деталь доп.) -->
  <path d="M66 87 Q74 84 78 87" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Кабинет -->
  <rect x="22" y="14" width="52" height="72" rx="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Светлая грань слева -->
  <path d="M26.5 20 L26.5 80" stroke="#E8B95F" stroke-width="3" stroke-linecap="round"/>
  <!-- Затемнение справа -->
  <path d="M69 20 L69 80" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>

  <!-- Ручка сверху -->
  <path d="M40 14 L40 9 Q40 6.5 43 6.5 L53 6.5 Q56 6.5 56 9 L56 14"
        fill="none" stroke="#1A1A1A" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Гриль (тёмная панель) -->
  <rect x="27" y="19" width="42" height="62" rx="4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Диагональный шов гриля (живая деталь) -->
  <path d="M31 74 L65 25" stroke="#5C6670" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M35 77 L67 31" stroke="#5C6670" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Вуфер (крупный нижний диффузор) -->
  <circle cx="48" cy="60" r="15" fill="#1A1A1A" stroke="#9BA5AD" stroke-width="2.4"/>
  <circle cx="48" cy="60" r="12" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Бирюзовый подвес -->
  <circle cx="48" cy="60" r="13.4" fill="none" stroke="#2E6E65" stroke-width="2.6"/>
  <!-- Стальной колпачок с бликом -->
  <circle cx="48" cy="60" r="5.4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M44.8 57.5 Q47 55.5 49.6 56.4" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Пищалка (верхний динамик) -->
  <circle cx="48" cy="31" r="8.6" fill="#1A1A1A" stroke="#9BA5AD" stroke-width="2.2"/>
  <circle cx="48" cy="31" r="5.4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="48" cy="31" r="2.2" fill="#9BA5AD"/>

  <!-- Красный светодиод питания (единственный красный акцент) -->
  <circle cx="33" cy="23" r="1.9" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Угловые стальные накладки -->
  <path d="M27 27 Q27 23 31 23" fill="none" stroke="#9BA5AD" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M69 27 Q69 23 65 23" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M27 73 Q27 77 31 77" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M69 73 Q69 77 65 77" fill="none" stroke="#9BA5AD" stroke-width="2.6" stroke-linecap="round"/>
</svg>
