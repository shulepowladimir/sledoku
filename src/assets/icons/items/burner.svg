<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    burner — конфорка-гигант: чугунный диск с поперечной решёткой
    на стальном основании, кран-пенёк сбоку. Зажжена: кольцо огоньков
    вокруг пробки, под решёткой (красный акцент).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="32" ry="4.5" fill="#3A2A20"/>

  <!-- Стальное основание -->
  <circle cx="48" cy="52" r="34" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик на основании -->
  <path d="M20 38 Q26 26 38 21" fill="none" stroke="#D5DCE1" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Тень по нижней кромке основания -->
  <path d="M24 66 Q48 80 72 66" fill="none" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Чугунный диск конфорки -->
  <circle cx="48" cy="52" r="26" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Внутренняя воронка -->
  <circle cx="48" cy="52" r="18" fill="#3A2A20"/>
  <!-- Центральная пробка -->
  <circle cx="48" cy="52" r="4.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Огонь: кольцо язычков вокруг пробки (под решёткой) -->
  <g fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round">
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(45 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(90 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(135 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(180 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(225 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(270 48 52)"/>
    <path d="M45.8 44.8 Q47 39.5 48 37.5 Q49 39.5 50.2 44.8 Q48 43.6 45.8 44.8 Z" transform="rotate(315 48 52)"/>
  </g>
  <!-- Оранжевые сердцевины язычков -->
  <g fill="#E0824A">
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(45 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(90 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(135 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(180 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(225 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(270 48 52)"/>
    <path d="M46.6 44.4 Q47.6 40.8 48 39.4 Q48.4 40.8 49.4 44.4 Z" transform="rotate(315 48 52)"/>
  </g>

  <!-- Решётка: поперечные прутья -->
  <g stroke="#1A1A1A" stroke-width="3.4" stroke-linecap="round">
    <path d="M31 38 L65 66"/>
    <path d="M65 38 L31 66"/>
    <path d="M25 52 L71 52"/>
  </g>
  <!-- Блик на верхнем пруте -->
  <path d="M33 40.5 L62 64.5" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Кран-пенёк -->
  <path d="M82 46 L82 34 Q82 30 86 30" fill="none" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="86" cy="30" r="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
