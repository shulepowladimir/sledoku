<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trafficLight — трёхсекционный светофор на стальном столбе:
    корпус-головка с тремя огнями (красный горит — единственный акцент),
    козырёк над секциями, основание-тумба. Ночная улица.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="16" ry="4" fill="#3A2A20"/>

  <!-- Столб -->
  <rect x="44" y="42" width="8" height="42" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M46.5 46 L46.5 78" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Основание-тумба -->
  <path d="M38 82 L58 82 L56 88 L40 88 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Корпус головки -->
  <rect x="33" y="6" width="30" height="42" rx="8" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева на корпусе -->
  <path d="M36 12 Q35 26 36 40" fill="none" stroke="#5C6670" stroke-width="2" stroke-linecap="round"/>

  <!-- Красный огонь (горит, акцент) -->
  <circle cx="48" cy="17" r="6" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="46" cy="15" r="1.6" fill="#F5E9D0"/>
  <!-- Жёлтый огонь (погашен) -->
  <circle cx="48" cy="32" r="5.4" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Зелёный огонь (погашен) -->
  <circle cx="48" cy="42.5" r="4" fill="#44663A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Козырьки над секциями -->
  <path d="M36 10 Q48 6 60 10 L60 12.5 Q48 8.5 36 12.5 Z" fill="#1A1A1A"/>
  <path d="M36.5 26 Q48 22 59.5 26 L59.5 28 Q48 24.5 36.5 28 Z" fill="#1A1A1A"/>
  <path d="M37 37 Q48 33 59 37 L59 39 Q48 35.5 37 39 Z" fill="#1A1A1A"/>

  <!-- Верхняя шапка -->
  <path d="M33 10 Q48 -1 63 10 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
