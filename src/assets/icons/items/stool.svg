<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stool — simple wooden stool. Round seat, four splayed legs, cream wood.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="48" cy="90" rx="36" ry="6" fill="#3A2A20"/>

  <!-- ══ LEGS (four, splayed) ══ -->
  <!-- Front-left leg shadow -->
  <line x1="34" y1="46" x2="16" y2="92" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Front-right leg shadow -->
  <line x1="58" y1="46" x2="80" y2="92" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Back-left leg shadow -->
  <line x1="38" y1="46" x2="26" y2="88" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>
  <!-- Back-right leg shadow -->
  <line x1="58" y1="46" x2="70" y2="88" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>

  <!-- Front-left leg -->
  <line x1="30" y1="44" x2="12" y2="90" stroke="#B08020" stroke-width="7" stroke-linecap="round"/>
  <line x1="30" y1="44" x2="12" y2="90" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Front-right leg -->
  <line x1="62" y1="44" x2="80" y2="90" stroke="#B08020" stroke-width="7" stroke-linecap="round"/>
  <line x1="62" y1="44" x2="80" y2="90" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Back-left leg -->
  <line x1="36" y1="44" x2="24" y2="86" stroke="#C89830" stroke-width="6" stroke-linecap="round"/>
  <line x1="36" y1="44" x2="24" y2="86" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Back-right leg -->
  <line x1="60" y1="44" x2="72" y2="86" stroke="#C89830" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="44" x2="72" y2="86" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ STRETCHER (cross-brace) ══ -->
  <line x1="18" y1="70" x2="78" y2="70" stroke="#B08020" stroke-width="5" stroke-linecap="round"/>
  <line x1="18" y1="70" x2="78" y2="70" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="64" x2="70" y2="78" stroke="#B08020" stroke-width="5" stroke-linecap="round"/>
  <line x1="26" y1="64" x2="70" y2="78" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ SEAT (round) ══ -->
  <!-- Seat shadow -->
  <ellipse cx="50" cy="46" rx="30" ry="10" fill="#3A2A20"/>
  <!-- Seat top face -->
  <ellipse cx="46" cy="42" rx="30" ry="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Seat grain lines -->
  <line x1="22" y1="40" x2="70" y2="44" stroke="#C89830" stroke-width="1.5"/>
  <line x1="18" y1="42" x2="74" y2="42" stroke="#C89830" stroke-width="1.5"/>
  <line x1="22" y1="44" x2="70" y2="40" stroke="#C89830" stroke-width="1.5"/>
  <!-- Seat edge band -->
  <ellipse cx="46" cy="44" rx="30" ry="5"  fill="#B08020" stroke="#1A1A1A" stroke-width="2"/>
</svg>
