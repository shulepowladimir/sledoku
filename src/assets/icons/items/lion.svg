<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lion — front view, majestic portrait. Shadow-brown mane, gold face, orange body.
  -->

  <!-- ══ SHADOWS ══ -->
  <circle cx="52" cy="46" r="38" fill="#3A2A20"/>
  <ellipse cx="52" cy="84" rx="28" ry="12" fill="#3A2A20"/>

  <!-- ══ BODY (lower) ══ -->
  <ellipse cx="48" cy="82" rx="28" ry="14" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Paws -->
  <ellipse cx="28" cy="88" rx="10" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="68" cy="88" rx="10" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Paw lines -->
  <line x1="24" y1="90" x2="24" y2="93" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="91" x2="28" y2="94" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="90" x2="32" y2="93" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="64" y2="93" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="91" x2="68" y2="94" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="90" x2="72" y2="93" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ MANE ══ -->
  <circle cx="48" cy="44" r="38" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Mane texture: radiating bumps -->
  <circle cx="48" cy="8"  r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="78" cy="18" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="86" cy="46" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="78" cy="72" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="18" cy="72" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="10" cy="46" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="18" cy="18" r="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ FACE ══ -->
  <circle cx="48" cy="44" r="26" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ FACE DETAILS ══ -->
  <!-- Brow ridge -->
  <path d="M32,36 Q40,30 48,34 Q56,30 64,36" fill="none" stroke="#3A2A20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="40" rx="5" ry="4" fill="#1A1A1A"/>
  <ellipse cx="37" cy="39" rx="1.5" ry="1.5" fill="#E0A94A"/>
  <ellipse cx="58" cy="40" rx="5" ry="4" fill="#1A1A1A"/>
  <ellipse cx="57" cy="39" rx="1.5" ry="1.5" fill="#E0A94A"/>
  <!-- Nose -->
  <ellipse cx="48" cy="51" rx="7" ry="5" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="48" cy="52" rx="4" ry="3" fill="#C8102E"/>
  <!-- Mouth -->
  <path d="M41,58 Q48,63 55,58" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="55" x2="48" y2="58" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whisker dots -->
  <circle cx="34" cy="55" r="1.5" fill="#3A2A20"/>
  <circle cx="30" cy="58" r="1.5" fill="#3A2A20"/>
  <circle cx="26" cy="56" r="1.5" fill="#3A2A20"/>
  <circle cx="62" cy="55" r="1.5" fill="#3A2A20"/>
  <circle cx="66" cy="58" r="1.5" fill="#3A2A20"/>
  <circle cx="70" cy="56" r="1.5" fill="#3A2A20"/>
  <!-- Ears -->
  <ellipse cx="24" cy="22" rx="9" ry="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="24" cy="23" rx="4.5" ry="5" fill="#E0824A"/>
  <ellipse cx="72" cy="22" rx="9" ry="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="72" cy="23" rx="4.5" ry="5" fill="#E0824A"/>
</svg>
