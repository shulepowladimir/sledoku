<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    ball2 — 4-panel toy/beach ball. Navy/red/gold/teal quarters, cream seam highlight.
  -->

  <!-- ══ SHADOW ══ -->
  <circle cx="52" cy="52" r="34" fill="#3A2A20"/>

  <!-- ══ BALL PANELS ══ -->
  <!-- Top-left: navy -->
  <path d="M48,48 L14,48 A34,34 0 0,1 48,14 Z" fill="#1F3A5F"/>
  <!-- Top-right: red -->
  <path d="M48,48 L48,14 A34,34 0 0,1 82,48 Z" fill="#C8102E"/>
  <!-- Bottom-right: gold -->
  <path d="M48,48 L82,48 A34,34 0 0,1 48,82 Z" fill="#E0A94A"/>
  <!-- Bottom-left: teal -->
  <path d="M48,48 L48,82 A34,34 0 0,1 14,48 Z" fill="#2E6E65"/>

  <!-- ══ SEAM LINES ══ -->
  <line x1="48" y1="14" x2="48" y2="82" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="14" y1="48" x2="82" y2="48" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ OUTLINE ══ -->
  <circle cx="48" cy="48" r="34" fill="none" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ HIGHLIGHT ══ -->
  <ellipse cx="36" cy="32" rx="8" ry="5" fill="#F5E9D0"/>
</svg>
