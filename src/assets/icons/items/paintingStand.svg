<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    paintingStand — artist's easel with canvas. Dark wood tripod, cream canvas, colourful paint marks.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="92" rx="36" ry="5" fill="#3A2A20"/>

  <!-- ══ REAR LEG ══ -->
  <line x1="48" y1="14" x2="66" y2="90" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>
  <line x1="46" y1="14" x2="64" y2="90" stroke="#7C5D31" stroke-width="5" stroke-linecap="round"/>

  <!-- ══ FRONT LEGS ══ -->
  <!-- Left leg shadow -->
  <line x1="28" y1="18" x2="16" y2="90" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>
  <line x1="68" y1="18" x2="80" y2="90" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>
  <!-- Left leg body -->
  <line x1="24" y1="18" x2="12" y2="90" stroke="#3A2A20" stroke-width="5" stroke-linecap="round"/>
  <!-- Right leg body -->
  <line x1="64" y1="18" x2="76" y2="90" stroke="#3A2A20" stroke-width="5" stroke-linecap="round"/>

  <!-- ══ SPREADER BAR ══ -->
  <line x1="18" y1="64" x2="76" y2="64" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
  <line x1="16" y1="62" x2="74" y2="62" stroke="#7C5D31" stroke-width="3" stroke-linecap="round"/>

  <!-- ══ CANVAS LEDGE ══ -->
  <rect x="20" y="70" width="54" height="6" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ CANVAS SHADOW ══ -->
  <rect x="24" y="16" width="52" height="58" rx="3" fill="#3A2A20"/>

  <!-- ══ CANVAS ══ -->
  <rect x="20" y="12" width="52" height="58" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Canvas texture (very subtle grain lines) -->
  <line x1="20" y1="20" x2="72" y2="20" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="20" y1="32" x2="72" y2="32" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="20" y1="44" x2="72" y2="44" stroke="#E0D4B8" stroke-width="1"/>
  <line x1="20" y1="56" x2="72" y2="56" stroke="#E0D4B8" stroke-width="1"/>

  <!-- ══ PAINTING ON CANVAS (landscape) ══ -->
  <!-- Sky area -->
  <rect x="22" y="14" width="48" height="24" rx="2" fill="#7EB9D4"/>
  <!-- Ground area -->
  <rect x="22" y="38" width="48" height="28" rx="2" fill="#4D8B3A"/>
  <!-- Simple tree shapes -->
  <circle cx="34" cy="36" r="8"  fill="#3A6B2C" stroke="#1A1A1A" stroke-width="1"/>
  <rect   cx="34" cy="44" x="32" y="42" width="4" height="6" rx="1" fill="#7C5D31"/>
  <!-- Sun spot -->
  <circle cx="58" cy="22" r="6"  fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CANVAS FRAME BORDER ══ -->
  <rect x="20" y="12" width="52" height="58" rx="3" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ TOP CLAMP ══ -->
  <rect x="30" y="8" width="36" height="8" rx="3" fill="#7C5D31" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ APEX JOINT ══ -->
  <circle cx="46" cy="14" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
</svg>
