<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    spellbookStand — wooden lectern holding an open glowing spellbook.
    Orange wood podium, cream pages, teal glowing rune, red ribbon.
  -->

  <!-- ══ SHADOW ══ -->
  <polygon points="30,90 66,90 62,80 34,80" fill="#3A2A20"/>
  <rect x="44" y="46" width="8" height="34" fill="#3A2A20"/>
  <polygon points="22,50 74,50 66,36 30,36" fill="#3A2A20"/>

  <!-- ══ BASE ══ -->
  <polygon points="26,86 62,86 58,78 30,78" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ POLE ══ -->
  <rect x="40" y="42" width="8" height="34" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ LECTERN TOP (angled) ══ -->
  <polygon points="18,46 70,46 62,32 26,32" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <line x1="26" y1="32" x2="34" y2="46" stroke="#3A2A20" stroke-width="1.5"/>
  <line x1="62" y1="32" x2="54" y2="46" stroke="#3A2A20" stroke-width="1.5"/>

  <!-- ══ OPEN BOOK ══ -->
  <path d="M22,44 L44,38 L44,22 L22,28 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M66,44 L44,38 L44,22 L66,28 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Text lines -->
  <line x1="26" y1="32" x2="38" y2="29" stroke="#A8A8A0" stroke-width="1.5"/>
  <line x1="26" y1="37" x2="38" y2="34" stroke="#A8A8A0" stroke-width="1.5"/>
  <line x1="50" y1="29" x2="62" y2="32" stroke="#A8A8A0" stroke-width="1.5"/>
  <line x1="50" y1="34" x2="62" y2="37" stroke="#A8A8A0" stroke-width="1.5"/>
  <!-- Ribbon bookmark -->
  <polygon points="42,22 46,22 46,14 44,17 42,14" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ GLOWING RUNE ══ -->
  <circle cx="44" cy="30" r="7" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M44,25 L46,29 L44,35 L42,29 Z" fill="#F5E9D0"/>
  <!-- Sparkle wisps -->
  <path d="M44,14 Q40,8 44,4" fill="none" stroke="#2E6E65" stroke-width="2" stroke-linecap="round"/>
  <path d="M52,16 Q56,10 54,6" fill="none" stroke="#2E6E65" stroke-width="2" stroke-linecap="round"/>
</svg>
