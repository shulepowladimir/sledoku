<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    baggageCart — airport/station luggage trolley. Gold frame, stacked bags, black wheels.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="46" cy="90" rx="42" ry="6" fill="#3A2A20"/>

  <!-- ══ WHEELS ══ -->
  <circle cx="16" cy="80" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="16" cy="80" r="4" fill="#E0A94A"/>
  <circle cx="72" cy="80" r="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="72" cy="80" r="4" fill="#E0A94A"/>
  <!-- Rear caster -->
  <circle cx="84" cy="82" r="5" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ PLATFORM FRAME ══ -->
  <rect x="8" y="68" width="76" height="10" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Frame cross supports -->
  <line x1="28" y1="68" x2="28" y2="78" stroke="#C89830" stroke-width="2"/>
  <line x1="52" y1="68" x2="52" y2="78" stroke="#C89830" stroke-width="2"/>

  <!-- ══ STACKED LUGGAGE ══ -->
  <!-- Large suitcase (bottom) -->
  <rect x="10" y="40" width="70" height="28" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="14" y="44" width="62" height="20" rx="3" fill="#2E5580"/>
  <!-- Zipper lines -->
  <line x1="14" y1="52" x2="76" y2="52" stroke="#E0A94A" stroke-width="2"/>
  <!-- Handle -->
  <rect x="36" y="36" width="20" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Medium suitcase (middle) -->
  <rect x="12" y="16" width="58" height="24" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="16" y="20" width="50" height="16" rx="2" fill="#C89830"/>
  <line x1="16" y1="28" x2="66" y2="28" stroke="#E0A94A" stroke-width="1.5"/>
  <rect x="30" y="12" width="16" height="7" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Small bag (top) -->
  <rect x="20" y="4"  width="34" height="14" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="24" y="8"  width="26" height="7" rx="2" fill="#3A8070"/>
  <rect x="32" y="2"  width="10" height="5" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ PUSH HANDLE ══ -->
  <rect x="78" y="20" width="8" height="56" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Handle bar -->
  <rect x="76" y="18" width="12" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
</svg>
