<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    swing — playground swing set. Navy A-frame, red seat, rope chains, sky background.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="48" cy="91" rx="44" ry="5" fill="#3A2A20"/>

  <!-- ══ A-FRAME LEFT ══ -->
  <!-- Left post shadow -->
  <line x1="10" y1="6"  x2="34" y2="90" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Left post -->
  <line x1="6"  y1="4"  x2="30" y2="88" stroke="#1F3A5F" stroke-width="7" stroke-linecap="round"/>
  <line x1="6"  y1="4"  x2="30" y2="88" stroke="#1A1A1A" stroke-width="2"  stroke-linecap="round"/>

  <!-- ══ A-FRAME RIGHT ══ -->
  <!-- Right post shadow -->
  <line x1="86" y1="6"  x2="62" y2="90" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Right post -->
  <line x1="90" y1="4"  x2="66" y2="88" stroke="#1F3A5F" stroke-width="7" stroke-linecap="round"/>
  <line x1="90" y1="4"  x2="66" y2="88" stroke="#1A1A1A" stroke-width="2"  stroke-linecap="round"/>

  <!-- ══ TOP BEAM ══ -->
  <!-- Beam shadow -->
  <rect x="8"  y="4"  width="80" height="8" rx="4" fill="#3A2A20"/>
  <!-- Beam -->
  <rect x="4"  y="0"  width="80" height="8" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ CHAINS / ROPES (left) ══ -->
  <line x1="28" y1="8"  x2="24" y2="58" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <line x1="38" y1="8"  x2="34" y2="58" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <!-- Chain links left -->
  <ellipse cx="26" cy="18" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="25" cy="28" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="24" cy="38" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="36" cy="18" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="35" cy="28" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="34" cy="38" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ CHAINS / ROPES (right) ══ -->
  <line x1="58" y1="8"  x2="62" y2="58" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="8"  x2="72" y2="58" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <!-- Chain links right -->
  <ellipse cx="60" cy="18" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="61" cy="28" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="62" cy="38" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="70" cy="18" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="71" cy="28" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <ellipse cx="72" cy="38" rx="2" ry="3" fill="none" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ SEAT ══ -->
  <!-- Seat shadow -->
  <rect x="24" y="60" width="50" height="10" rx="4" fill="#3A2A20"/>
  <!-- Seat board -->
  <rect x="20" y="56" width="56" height="10" rx="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Seat plank lines -->
  <line x1="32" y1="56" x2="32" y2="66" stroke="#A80020" stroke-width="1.5"/>
  <line x1="48" y1="56" x2="48" y2="66" stroke="#A80020" stroke-width="1.5"/>
  <line x1="64" y1="56" x2="64" y2="66" stroke="#A80020" stroke-width="1.5"/>

  <!-- ══ CROSS BRACE ══ -->
  <line x1="18" y1="60" x2="78" y2="60" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round"/>
  <line x1="18" y1="60" x2="78" y2="60" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ GROUND ANCHORS ══ -->
  <rect x="24" y="84" width="14" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="58" y="84" width="14" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
