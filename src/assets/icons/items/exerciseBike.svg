<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    exerciseBike — stationary exercise bicycle. Navy frame, cream seat, gold handlebars, large flywheel.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="48" cy="90" rx="42" ry="6" fill="#3A2A20"/>

  <!-- ══ LARGE FLYWHEEL ══ -->
  <!-- Flywheel shadow -->
  <circle cx="32" cy="58" r="28" fill="#3A2A20"/>
  <!-- Flywheel rim -->
  <circle cx="28" cy="54" r="28" fill="none" stroke="#A8A8A0" stroke-width="8"/>
  <circle cx="28" cy="54" r="28" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Flywheel spokes -->
  <line x1="28" y1="26" x2="28" y2="82" stroke="#888880" stroke-width="3"/>
  <line x1="0"  y1="54" x2="56" y2="54" stroke="#888880" stroke-width="3"/>
  <line x1="8"  y1="34" x2="48" y2="74" stroke="#888880" stroke-width="2.5"/>
  <line x1="48" y1="34" x2="8"  y2="74" stroke="#888880" stroke-width="2.5"/>
  <!-- Hub -->
  <circle cx="28" cy="54" r="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ FRAME ══ -->
  <!-- Down tube shadow -->
  <line x1="44" y1="24" x2="68" y2="84" stroke="#3A2A20" stroke-width="9" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="40" y1="22" x2="64" y2="82" stroke="#1F3A5F" stroke-width="8" stroke-linecap="round"/>
  <!-- Seat tube -->
  <line x1="60" y1="30" x2="70" y2="62" stroke="#1F3A5F" stroke-width="7" stroke-linecap="round"/>
  <!-- Chain stay to flywheel -->
  <line x1="64" y1="82" x2="28" y2="54" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round"/>

  <!-- ══ BASE FEET ══ -->
  <rect x="56" y="80" width="28" height="8" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="4"  y="80" width="18" height="8" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ PEDAL CRANK ══ -->
  <line x1="28" y1="54" x2="36" y2="64" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <rect x="34" y="62" width="10" height="5" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SEAT ══ -->
  <rect x="56" y="22" width="6"  height="22" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="62" cy="22" rx="14" ry="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ HANDLEBARS ══ -->
  <rect x="36" y="8"  width="6"  height="18" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="26" y="8"  width="20" height="6"  rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Grips -->
  <rect x="26" y="6"  width="5"  height="12" rx="2.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="41" y="6"  width="5"  height="12" rx="2.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CONSOLE ══ -->
  <rect x="32" y="4"  width="16" height="10" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="35" y="6"  width="10" height="6"  rx="1" fill="#7EB9D4"/>
</svg>
