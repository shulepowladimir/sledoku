<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    shell — spiral conch shell. Gold/cream exterior, orange interior, ribbed surface.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="52" cy="86" rx="34" ry="9" fill="#3A2A20"/>

  <!-- ══ MAIN SHELL BODY ══ -->
  <!-- Outer whorl (largest) -->
  <path d="M14,70 Q8,48 18,30 Q28,14 48,12 Q70,10 80,28 Q90,46 80,64 Q70,80 50,82 Q28,84 14,70 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- ══ SHELL RIBS ══ -->
  <path d="M48,12 Q72,14 80,28" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q76,22 82,40" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q80,32 80,52" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q76,44 72,66" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q66,56 54,80" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q48,66 34,80" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q30,60 16,68" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,12 Q18,50 16,50" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ INNER SPIRAL ══ -->
  <!-- Second whorl -->
  <path d="M28,58 Q26,44 34,34 Q42,24 54,26 Q66,28 68,40 Q70,52 60,60 Q50,68 38,64 Q28,60 28,58 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Third whorl -->
  <path d="M36,52 Q34,44 40,38 Q46,32 54,34 Q62,36 62,44 Q62,52 56,56 Q48,60 42,56 Q36,52 36,52 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Fourth whorl (innermost) -->
  <path d="M42,50 Q40,44 44,40 Q48,36 54,38 Q58,40 58,46 Q58,52 54,54 Q48,56 44,52 Z"
        fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Core -->
  <circle cx="50" cy="46" r="4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ APERTURE / OPENING (orange interior) ══ -->
  <path d="M14,70 Q10,78 18,82 Q30,86 50,82 Q66,78 68,68 Q60,76 46,74 Q28,72 14,70 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Interior shine -->
  <path d="M18,74 Q30,78 48,76" fill="none" stroke="#F5C898" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ SPIRE TIP ══ -->
  <path d="M48,12 Q50,4 54,2 Q56,6 54,10"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
