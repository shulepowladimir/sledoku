<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    gardenBed — бесшовный тайл огородной грядки.
    ItemTileOverlay объединяет клетки в полимино и обводит общий контур.
  -->
  <rect width="96" height="96" fill="#8F5A3A"/>

  <!-- Мягкие борозды продолжаются через края тайла. -->
  <path d="M-4 18 Q22 10 49 18 T101 18 M-4 78 Q22 70 49 78 T101 78" fill="none" stroke="#5A3B2B" stroke-width="5" stroke-linecap="round"/>
  <path d="M-4 23 Q22 15 49 23 T101 23 M-4 73 Q22 65 49 73 T101 73" fill="none" stroke="#B87F33" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M-4 47 Q22 39 49 47 T101 47" fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Два повторяющихся рядка молодых овощей. -->
  <g stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M26 40 Q24 31 27 26 M27 34 Q20 28 18 31 Q21 36 27 37 M27 32 Q33 26 37 29 Q34 35 28 36" fill="none" stroke="#5E8A46"/>
    <path d="M69 63 Q67 54 70 49 M70 58 Q63 52 60 55 Q63 60 70 61 M70 56 Q76 50 80 53 Q77 59 71 60" fill="none" stroke="#5E8A46"/>
    <path d="M47 59 Q45 52 48 48 M48 55 Q42 50 39 53 Q42 57 48 58 M48 53 Q54 48 57 51 Q54 56 49 57" fill="none" stroke="#7FA85B"/>
  </g>

  <!-- Земляные комочки и семена. -->
  <path d="M10 57 Q14 53 18 57 M78 37 Q82 33 87 37 M34 84 Q38 80 42 84" fill="none" stroke="#3A2A20" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="54" cy="31" r="1.8" fill="#E8B95F"/>
  <circle cx="13" cy="43" r="1.4" fill="#E8B95F"/>
</svg>
