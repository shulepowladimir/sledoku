<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    pieDisplay — витрина с пирогами дайнера: деревянная тумба, стеклянный
    купол (вода/стекло), внутри пирог с плетёной корочкой и вишенкой (акцент).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="33" ry="4.5" fill="#3A2A20"/>

  <!-- Тумба -->
  <rect x="20" y="66" width="56" height="20" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M20 74 L76 74" stroke="#B87F33" stroke-width="2"/>
  <path d="M24 70 L30 70 M38 79 L44 79 M56 70 L60 79" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Стеклянный купол -->
  <path d="M24 66 L24 36 Q24 15 48 15 Q72 15 72 36 L72 66 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Рама купола -->
  <path d="M24 62 L72 62" stroke="#4A7BA6" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Отражение неба в стекле: светлая и тёмная дуги -->
  <path d="M30 44 Q29 24 43 19" fill="none" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 40 Q64 26 56 21" fill="none" stroke="#4A7BA6" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Пирог: кремовый бок -->
  <path d="M33 62 Q33 45 48 45 Q63 45 63 62 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Корочка -->
  <ellipse cx="48" cy="45" rx="15" ry="6" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Плетёная решётка на корочке -->
  <path d="M37 43 L59 46.5 M39 47 L57 43.5" stroke="#B87F33" stroke-width="2" stroke-linecap="round"/>
  <!-- Волнистый край корочки -->
  <circle cx="36.5" cy="46" r="1.6" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="59.5" cy="46" r="1.6" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Вишенка (красный акцент) -->
  <circle cx="48" cy="41" r="2.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M48 38.5 Q49 36.5 51 36" fill="none" stroke="#44663A" stroke-width="1.4" stroke-linecap="round"/>
</svg>
