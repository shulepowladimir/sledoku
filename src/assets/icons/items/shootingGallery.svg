<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    shootingGallery — carnival shooting-range booth with three duck targets.
    Orange wood counter, gold ducks on a teal rail, red bullseye sign.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="14" y="62" width="72" height="24" rx="4" fill="#3A2A20"/>
  <rect x="14" y="46" width="72" height="8" rx="2" fill="#3A2A20"/>

  <!-- ══ COUNTER ══ -->
  <rect x="10" y="58" width="72" height="24" rx="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="10" y1="66" x2="82" y2="66" stroke="#3A2A20" stroke-width="1.5"/>
  <line x1="10" y1="74" x2="82" y2="74" stroke="#3A2A20" stroke-width="1.5"/>

  <!-- ══ BACK RAIL ══ -->
  <rect x="10" y="42" width="72" height="8" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ DUCK TARGETS ══ -->
  <g>
    <circle cx="24" cy="34" r="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="30" cy="29" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="33,29 39,27 33,31" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="31" cy="28" r="1" fill="#1A1A1A"/>
  </g>
  <g>
    <circle cx="48" cy="30" r="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="54" cy="25" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="57,25 63,23 57,27" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="55" cy="24" r="1" fill="#1A1A1A"/>
  </g>
  <g>
    <circle cx="70" cy="34" r="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="76" cy="29" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <polygon points="79,29 85,27 79,31" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="77" cy="28" r="1" fill="#1A1A1A"/>
  </g>

  <!-- ══ BULLSEYE SIGN ══ -->
  <circle cx="48" cy="12" r="8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="48" cy="12" r="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="12" r="2" fill="#F5E9D0"/>
</svg>
