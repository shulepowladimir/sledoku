<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    pokerTable — стол для покера/блэкджека (occupiable): овальный стол
    top-down 3/4, деревянный борт, зелёное сукно; на сукне — веер из трёх
    карт (червовая, пиковая, рубашка) и стопки фишек; по центру-низу —
    кремовая посадочная зона крупье у ближнего борта.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Ножки -->
  <rect x="27" y="66" width="7" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="62" y="66" width="7" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Толщина столешницы (ближняя грань) -->
  <rect x="13" y="59" width="70" height="9" rx="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M18 62 L78 62" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Посадочная зона крупье: кремовый подпруг у ближнего борта -->
  <path d="M38 66 Q38 64 40.5 64 L55.5 64 Q58 64 58 66 L58 74 Q48 77 38 74 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M42 69 L54 69" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Борт (деревянный овал) -->
  <ellipse cx="48" cy="44" rx="36" ry="24" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M18 36 Q48 27 78 36" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Сукно -->
  <ellipse cx="48" cy="44" rx="29.5" ry="18.5" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M26 38 Q48 31 70 38" fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Веер карт: червовая, пиковая, рубашка -->
  <g transform="rotate(-16 36 45)">
    <rect x="30.5" y="37" width="11" height="15.5" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M36 41.2 c-1.7-2.6-5.3-0.5-3.6 2.3 L36 46.6 l3.6-3.1 c1.7-2.8-1.9-4.9-3.6-2.3 Z" fill="#C8102E"/>
    <circle cx="33.6" cy="39.6" r="0.8" fill="#C8102E"/>
  </g>
  <rect x="42.5" y="36.5" width="11" height="15.5" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M48 41.5 l-2.9 3.1 c-1.6 2.1 1.1 4.4 2.9 2.2 c1.8 2.2 4.5-0.1 2.9-2.2 Z" fill="#3A2A20"/>
  <circle cx="45.6" cy="39.2" r="0.8" fill="#3A2A20"/>
  <g transform="rotate(13 60 45)">
    <rect x="54.5" y="37" width="11" height="15.5" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M60 41.5 L63.5 45 L60 48.5 L56.5 45 Z" fill="#F5E9D0"/>
  </g>

  <!-- Стопки фишек: золотая и кремовая с бирюзовой кромкой -->
  <g stroke="#1A1A1A" stroke-width="1.4">
    <ellipse cx="38" cy="55" rx="5.6" ry="2.6" fill="#E0A94A"/>
    <ellipse cx="38" cy="52.4" rx="5.6" ry="2.6" fill="#E8B95F"/>
    <ellipse cx="38" cy="49.8" rx="5.6" ry="2.6" fill="#E0A94A"/>
  </g>
  <path d="M33.5 55 Q38 56.6 42.5 55 M33.5 52.4 Q38 54 42.5 52.4" fill="none" stroke="#F5E9D0" stroke-width="1" stroke-linecap="round"/>
  <g stroke="#1A1A1A" stroke-width="1.4">
    <ellipse cx="59" cy="55" rx="5.2" ry="2.4" fill="#F5E9D0"/>
    <ellipse cx="59" cy="52.6" rx="5.2" ry="2.4" fill="#F5E9D0"/>
  </g>
  <path d="M54.6 55 Q59 56.4 63.4 55" fill="none" stroke="#2E6E65" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="59" cy="52.6" rx="2.6" ry="1.2" fill="none" stroke="#2E6E65" stroke-width="1"/>
</svg>
