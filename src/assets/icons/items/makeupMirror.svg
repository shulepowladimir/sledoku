<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    makeupMirror — round vanity mirror ringed with light bulbs, on a stand.
    Cream glass, gold bulb ring, gray stand.
  -->

  <!-- ══ SHADOW ══ -->
  <circle cx="50" cy="42" r="30" fill="#3A2A20"/>
  <rect x="44" y="70" width="8" height="14" fill="#3A2A20"/>
  <rect x="30" y="82" width="36" height="7" rx="2" fill="#3A2A20"/>

  <!-- ══ STAND ══ -->
  <rect x="26" y="80" width="36" height="7" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="40" y="66" width="8" height="14" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ MIRROR FRAME ══ -->
  <circle cx="46" cy="38" r="30" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ LIGHT BULBS (12 around rim) ══ -->
  <circle cx="46" cy="10" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="60" cy="14" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="70" cy="24" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="74" cy="38" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="70" cy="52" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="60" cy="62" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="46" cy="66" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="32" cy="62" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="22" cy="52" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="18" cy="38" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="22" cy="24" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="32" cy="14" r="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ GLASS ══ -->
  <circle cx="46" cy="38" r="21" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Reflection highlight -->
  <path d="M34,26 Q40,20 48,22" fill="none" stroke="#7EB9D4" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
