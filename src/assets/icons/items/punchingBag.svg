<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    punchingBag — боксёрская груша (1кл, decorative): цилиндрическая красная
    капсула на стальной цепи, ровные сегменты со швами, скруглённые торцы.
    Свет сверху-слева; тёплый акцент уровня (§1).
  -->
  <!-- Тень на полу -->
  <ellipse cx="48" cy="88" rx="24" ry="6" fill="#3A2A20"/>

  <!-- Потолочное крепление -->
  <rect x="34" y="2" width="28" height="8" rx="3" fill="#545D65" stroke="#1A1A1A" stroke-width="2.6"/>
  <circle cx="48" cy="10" r="3.2" fill="#939CA2" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Цепь (звенья) -->
  <g stroke="#1A1A1A" stroke-width="1.8" fill="none">
    <ellipse cx="48" cy="16" rx="3.2" ry="4.6"/>
    <ellipse cx="48" cy="23" rx="3.2" ry="4.6"/>
    <ellipse cx="48" cy="30" rx="3.2" ry="4.6"/>
  </g>

  <!-- Груша: цилиндр со скруглёнными торцами -->
  <path d="M34 36
           Q34 29 41 29
           L55 29
           Q62 29 62 36
           L62 76
           Q62 83 55 83
           L41 83
           Q34 83 34 76
           Z"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Сегменты-пояса груши (швы, ровная сетка) -->
  <g stroke="#7A0E1D" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M34.8 44 H61.2"/>
    <path d="M34.8 53 H61.2"/>
    <path d="M34.8 62 H61.2"/>
    <path d="M34.8 71 H61.2"/>
  </g>

  <!-- Блик слева (свет сверху-слева) -->
  <path d="M38.5 33 V80" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <path d="M43 32 V79" stroke="#E8607A" stroke-width="2" stroke-linecap="round"/>

  <!-- Верхний кант с люверсами -->
  <path d="M35 34 Q48 38.5 61 34 L60.5 29.5 L35.5 29.5 Z" fill="#7A0E1D" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#F5E9D0">
    <circle cx="41" cy="34" r="1.3"/>
    <circle cx="48" cy="35" r="1.3"/>
    <circle cx="55" cy="34" r="1.3"/>
  </g>
</svg>
