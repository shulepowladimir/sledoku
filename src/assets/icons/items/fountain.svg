<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fountain — three-tier park fountain. Navy basin, teal pool, sky-blue water arcs.
  -->

  <!-- ══ SHADOWS ══ -->
  <ellipse cx="52" cy="88" rx="36" ry="8" fill="#3A2A20"/>
  <rect x="42" y="56" width="16" height="28" rx="4" fill="#3A2A20"/>
  <ellipse cx="52" cy="62" rx="28" ry="8" fill="#3A2A20"/>

  <!-- ══ BASE BASIN ══ -->
  <ellipse cx="48" cy="84" rx="36" ry="10" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="48" cy="80" rx="32" ry="8" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LOWER COLUMN ══ -->
  <rect x="40" y="52" width="16" height="30" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ MID TIER ══ -->
  <ellipse cx="48" cy="58" rx="28" ry="8" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="48" cy="54" rx="24" ry="6" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ UPPER COLUMN ══ -->
  <rect x="44" y="30" width="10" height="26" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ TOP TIER ══ -->
  <ellipse cx="48" cy="36" rx="18" ry="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="48" cy="32" rx="14" ry="4" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ TOP SPOUT ORB ══ -->
  <circle cx="48" cy="26" r="7" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="48" cy="26" r="4" fill="#7EB9D4"/>

  <!-- ══ WATER ARCS (sky blue) ══ -->
  <!-- From top orb outward -->
  <path d="M48,20 C40,14 28,18 22,28" fill="none" stroke="#7EB9D4" stroke-width="3" stroke-linecap="round"/>
  <path d="M48,20 C56,14 68,18 74,28" fill="none" stroke="#7EB9D4" stroke-width="3" stroke-linecap="round"/>
  <!-- From mid tier -->
  <path d="M28,52 C18,44 12,52 14,62" fill="none" stroke="#7EB9D4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M68,52 C78,44 84,52 82,62" fill="none" stroke="#7EB9D4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Water droplets -->
  <circle cx="20" cy="30" r="2.5" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="76" cy="30" r="2.5" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="13" cy="64" r="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="83" cy="64" r="2" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="1"/>
</svg>
