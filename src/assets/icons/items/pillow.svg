<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    pillow — пухлая подушка-гигант (occupiable): кремовая наволочка
    с бирюзовой строчкой по кромке (посадочная зона — вся верхняя грань),
    мягкие «уши» по углам, вмятина-смайл в центре.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Боковая грань (толщина подушки) -->
  <path d="M14 54 L14 74 Q14 82 24 82 L72 82 Q82 82 82 74 L82 54 L76 74 Q76 78 68 78 L28 78 Q20 78 20 74 Z"
        fill="#D5DCE1" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Верхняя грань (посадочная зона) -->
  <path d="M14 54 Q10 40 24 36 Q34 28 48 28 Q62 28 72 36 Q86 40 82 54 Q78 66 62 68 Q48 72 34 68 Q18 66 14 54 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Блик на верхней грани слева-сверху -->
  <path d="M22 44 Q28 36 40 33" fill="none" stroke="#D5DCE1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Бирюзовая строчка по кромке верхней грани -->
  <path d="M19 52 Q16 42 27 38 Q36 32 48 32 Q60 32 69 38 Q80 42 77 52 Q73 62 61 64 Q48 68 35 64 Q23 62 19 52 Z"
        fill="none" stroke="#2E6E65" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ушки-уголки -->
  <path d="M16 50 Q11 46 13 41 Q18 41 20 45 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M80 50 Q85 46 83 41 Q78 41 76 45 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Мягкая вмятина в центре -->
  <path d="M40 56 Q48 51 56 56" fill="none" stroke="#D5DCE1" stroke-width="2.4" stroke-linecap="round"/>
</svg>
