<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Body shadow -->
  <ellipse cx="50" cy="56" rx="26" ry="16" fill="#3A2A20"/>
  <!-- Leg shadows -->
  <rect x="34" y="70" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="44" y="70" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="56" y="70" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="66" y="70" width="8" height="20" rx="3" fill="#3A2A20"/>
  <!-- Head shadow -->
  <circle cx="74" cy="38" r="12" fill="#3A2A20"/>
  <!-- Tail -->
  <path d="M20,50 C10,40 8,60 18,70" fill="none" stroke="#3A2A20" stroke-width="5" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="46" cy="52" rx="26" ry="16" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Neck -->
  <polygon points="54,38 66,38 70,52 58,52" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Mane -->
  <polygon points="54,38 58,22 66,26 66,38" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="70" cy="34" r="12" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Snout -->
  <ellipse cx="79" cy="38" rx="5" ry="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Eye -->
  <circle cx="67" cy="30" r="2.5" fill="#1A1A1A"/>
  <!-- Nostril -->
  <circle cx="81" cy="40" r="1.5" fill="#3A2A20"/>
  <!-- Legs -->
  <rect x="30" y="66" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="40" y="66" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="52" y="66" width="8" height="20" rx="3" fill="#3A2A20"/>
  <rect x="62" y="66" width="8" height="20" rx="3" fill="#3A2A20"/>
  <!-- Hooves -->
  <rect x="30" y="84" width="8" height="4" rx="1" fill="#1A1A1A"/>
  <rect x="40" y="84" width="8" height="4" rx="1" fill="#1A1A1A"/>
  <rect x="52" y="84" width="8" height="4" rx="1" fill="#1A1A1A"/>
  <rect x="62" y="84" width="8" height="4" rx="1" fill="#1A1A1A"/>
</svg>
