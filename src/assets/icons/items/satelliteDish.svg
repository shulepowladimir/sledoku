<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    satelliteDish — parabolic dish on angled mount, 3/4 view.
    Cream dish with gold rim rings, navy mount arm, red feed horn.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="56" cy="42" rx="30" ry="19" fill="#3A2A20"/>
  <rect x="42" y="52" width="10" height="30" rx="3" fill="#3A2A20"/>
  <polygon points="26,90 42,90 50,80 34,80" fill="#3A2A20"/>

  <!-- ══ TRIPOD BASE ══ -->
  <polygon points="22,86 38,86 46,76 30,76" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="38" y="48" width="8" height="30" rx="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ PIVOT JOINT ══ -->
  <circle cx="42" cy="46" r="7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ DISH BACK SUPPORT ══ -->
  <line x1="42" y1="46" x2="70" y2="20" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="46" x2="70" y2="20" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ DISH ══ -->
  <ellipse cx="56" cy="38" rx="26" ry="16" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="56" cy="38" rx="19" ry="11.5" fill="none" stroke="#E0A94A" stroke-width="2.5"/>
  <ellipse cx="56" cy="38" rx="11" ry="6.5" fill="none" stroke="#E0A94A" stroke-width="2"/>

  <!-- ══ FEED HORN ARM ══ -->
  <line x1="56" y1="38" x2="30" y2="24" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="28" cy="22" r="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SIGNAL WAVES ══ -->
  <path d="M18,10 Q14,16 18,22" fill="none" stroke="#7EB9D4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M12,6 Q4,16 12,26" fill="none" stroke="#7EB9D4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
