<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bottle — bottle with a message scroll inside. Teal glass, cream letter, gold wax seal.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="88" rx="22" ry="7" fill="#3A2A20"/>

  <!-- ══ BOTTLE BODY SHADOW ══ -->
  <path d="M50,14 Q66,18 70,38 L72,80 Q72,86 50,86 Q28,86 26,80 L30,38 Q34,18 50,14 Z"
        fill="#3A2A20"/>

  <!-- ══ BOTTLE BODY (teal glass) ══ -->
  <path d="M46,14 Q62,18 66,38 L68,80 Q68,86 46,86 Q24,86 24,80 L26,38 Q30,18 46,14 Z"
        fill="#2E6E65" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- ══ GLASS HIGHLIGHT ══ -->
  <path d="M30,38 Q28,58 30,76" fill="none" stroke="#3A8070" stroke-width="3" stroke-linecap="round"/>
  <path d="M28,38 Q30,22 38,16" fill="none" stroke="#3A8070" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ MESSAGE SCROLL INSIDE ══ -->
  <rect x="32" y="44" width="30" height="30" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Scroll rolled ends -->
  <ellipse cx="46" cy="44" rx="15" ry="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="46" cy="74" rx="15" ry="4" fill="#E0D4B8" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Writing lines on scroll -->
  <line x1="36" y1="52" x2="58" y2="52" stroke="#A8A8A0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="58" x2="58" y2="58" stroke="#A8A8A0" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="64" x2="52" y2="64" stroke="#A8A8A0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ NECK ══ -->
  <rect x="38" y="6"  width="16" height="12" rx="6" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="36" y="14" width="20" height="6"  rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ CORK / WAX SEAL ══ -->
  <rect x="40" y="2"  width="12" height="8" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Wax seal drip -->
  <circle cx="46" cy="2" r="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="46" cy="2" r="2" fill="#E0A94A"/>
</svg>
