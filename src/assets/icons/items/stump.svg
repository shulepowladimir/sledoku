<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    stump — cut tree stump with growth rings, axe, and mushroom.
    Orange bark, gold wood rings, gray axe head.
  -->

  <!-- ══ SHADOW ══ -->
  <path d="M20,86 L24,50 Q48,42 72,50 L76,86 Z" fill="#3A2A20"/>
  <ellipse cx="52" cy="46" rx="26" ry="10" fill="#3A2A20"/>

  <!-- ══ STUMP BODY (bark) ══ -->
  <path d="M18,84 L22,48 Q46,40 70,48 L74,84 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bark texture lines -->
  <line x1="26" y1="56" x2="24" y2="80" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="50" x2="45" y2="82" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="55" x2="67" y2="80" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ TOP SURFACE ══ -->
  <ellipse cx="46" cy="44" rx="26" ry="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Growth rings -->
  <ellipse cx="46" cy="44" rx="19" ry="7" fill="none" stroke="#E0824A" stroke-width="2"/>
  <ellipse cx="46" cy="44" rx="12" ry="4.5" fill="none" stroke="#E0824A" stroke-width="2"/>
  <ellipse cx="46" cy="44" rx="5" ry="2" fill="none" stroke="#E0824A" stroke-width="2"/>

  <!-- ══ MUSHROOM ══ -->
  <rect x="68" y="72" width="5" height="8" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M62,72 Q70,60 78,72 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="67" cy="68" r="1.3" fill="#F5E9D0"/>
  <circle cx="73" cy="67" r="1.3" fill="#F5E9D0"/>

  <!-- ══ AXE ══ -->
  <line x1="28" y1="74" x2="16" y2="30" stroke="#E0824A" stroke-width="4" stroke-linecap="round"/>
  <path d="M12,20 L28,26 Q30,34 24,38 L10,32 Q6,26 12,20 Z" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
