<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cart — supermarket shopping cart. Chrome frame, wire basket, black wheels.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="54" cy="90" rx="36" ry="6" fill="#3A2A20"/>

  <!-- ══ WHEELS ══ -->
  <circle cx="36" cy="82" r="7" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="36" cy="82" r="3" fill="#E0A94A"/>
  <circle cx="70" cy="82" r="7" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="70" cy="82" r="3" fill="#E0A94A"/>

  <!-- ══ BASKET FRAME ══ -->
  <!-- Bottom bar shadow -->
  <rect x="26" y="56" width="52" height="28" rx="4" fill="#3A2A20"/>
  <!-- Bottom bar -->
  <rect x="22" y="52" width="52" height="26" rx="4" fill="none" stroke="#A8A8A0" stroke-width="4"/>
  <!-- Wire grid (horizontal) -->
  <line x1="22" y1="60" x2="74" y2="60" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="22" y1="68" x2="74" y2="68" stroke="#A8A8A0" stroke-width="2"/>
  <!-- Wire grid (vertical) -->
  <line x1="34" y1="52" x2="34" y2="78" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="46" y1="52" x2="46" y2="78" stroke="#A8A8A0" stroke-width="2"/>
  <line x1="58" y1="52" x2="58" y2="78" stroke="#A8A8A0" stroke-width="2"/>
  <!-- Front panel (slightly more opaque) -->
  <rect x="22" y="52" width="52" height="26" rx="4" fill="none" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ CHILD SEAT (folded, front) ══ -->
  <rect x="22" y="52" width="16" height="14" rx="2" fill="#C0BCAE" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="22" y1="59" x2="38" y2="59" stroke="#888880" stroke-width="1.5"/>

  <!-- ══ AXLE / UNDERBODY ══ -->
  <line x1="30" y1="78" x2="36" y2="82" stroke="#A8A8A0" stroke-width="3" stroke-linecap="round"/>
  <line x1="66" y1="78" x2="70" y2="82" stroke="#A8A8A0" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="78" x2="66" y2="78" stroke="#A8A8A0" stroke-width="3" stroke-linecap="round"/>

  <!-- ══ PUSH HANDLE ══ -->
  <rect x="72" y="34" width="6" height="44" rx="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="70" y="32" width="10" height="6" rx="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ DIAGONAL ARM / NECK ══ -->
  <line x1="72" y1="52" x2="36" y2="32" stroke="#A8A8A0" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="52" x2="36" y2="32" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ GOODS IN BASKET ══ -->
  <rect x="28" y="42" width="14" height="12" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="46" y="44" width="10" height="10" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="62" cy="48" rx="7" ry="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
