<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Shadow -->
  <rect x="24" y="34" width="56" height="54" rx="3" fill="#3A2A20"/>
  <!-- Circular seat top -->
  <ellipse cx="48" cy="30" rx="28" ry="10" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Seat side/depth -->
  <rect x="20" y="30" width="56" height="8" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Center pole -->
  <rect x="44" y="38" width="8" height="30" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Foot ring -->
  <ellipse cx="48" cy="64" rx="22" ry="7" fill="none" stroke="#1F3A5F" stroke-width="3"/>
  <!-- Left foot -->
  <rect x="22" y="68" width="6" height="16" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Right foot -->
  <rect x="68" y="68" width="6" height="16" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Center foot -->
  <rect x="45" y="68" width="6" height="16" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
</svg>
