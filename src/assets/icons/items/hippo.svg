<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hippo — front view, emerging from water. Stone-gray, wide muzzle, tiny eyes on top.
  -->

  <!-- ══ WATER / SHADOWS ══ -->
  <ellipse cx="52" cy="68" rx="40" ry="20" fill="#3A2A20"/>

  <!-- ══ WATER SURFACE ══ -->
  <ellipse cx="48" cy="64" rx="40" ry="18" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Water ripple -->
  <path d="M10,62 C20,58 36,66 48,62 C60,58 76,66 86,62" fill="none" stroke="#1F3A5F" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ BODY (submerged, visible as mass) ══ -->
  <ellipse cx="48" cy="68" rx="38" ry="14" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ HEAD ══ -->
  <!-- Main head mass -->
  <ellipse cx="48" cy="46" rx="32" ry="22" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Wide flat muzzle/snout -->
  <ellipse cx="48" cy="58" rx="26" ry="12" fill="#C0BEB8" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Nostrils -->
  <ellipse cx="40" cy="58" rx="5" ry="4" fill="#888880" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="56" cy="58" rx="5" ry="4" fill="#888880" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="40" cy="58" r="2" fill="#1A1A1A"/>
  <circle cx="56" cy="58" r="2" fill="#1A1A1A"/>

  <!-- ══ EYES (high on head, hippo style) ══ -->
  <ellipse cx="34" cy="36" rx="7" ry="6" fill="#C0BEB8" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="62" cy="36" rx="7" ry="6" fill="#C0BEB8" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="34" cy="36" r="3.5" fill="#1A1A1A"/>
  <circle cx="33" cy="35" r="1.2" fill="#F5E9D0"/>
  <circle cx="62" cy="36" r="3.5" fill="#1A1A1A"/>
  <circle cx="61" cy="35" r="1.2" fill="#F5E9D0"/>

  <!-- ══ EARS ══ -->
  <ellipse cx="22" cy="28" rx="7" ry="9" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="22" cy="28" rx="3.5" ry="4.5" fill="#C8102E"/>
  <ellipse cx="74" cy="28" rx="7" ry="9" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <ellipse cx="74" cy="28" rx="3.5" ry="4.5" fill="#C8102E"/>
</svg>
