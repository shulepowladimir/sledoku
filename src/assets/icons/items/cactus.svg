<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cactus — saguaro cactus with two arms. Forest green, spines, red flower.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="40" y="18" width="16" height="68" rx="7" fill="#3A2A20"/>
  <rect x="62" y="36" width="14" height="30" rx="7" fill="#3A2A20"/>
  <rect x="24" y="44" width="14" height="22" rx="7" fill="#3A2A20"/>
  <ellipse cx="52" cy="88" rx="22" ry="6" fill="#3A2A20"/>

  <!-- ══ LEFT ARM ══ -->
  <!-- Horizontal section -->
  <rect x="16" y="40" width="26" height="14" rx="7" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Vertical section going up -->
  <rect x="16" y="28" width="14" height="26" rx="7" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Arm spines -->
  <line x1="12" y1="32" x2="16" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="40" x2="16" y2="42" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="48" x2="16" y2="46" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ RIGHT ARM ══ -->
  <rect x="56" y="32" width="26" height="14" rx="7" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="68" y="20" width="14" height="26" rx="7" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Arm spines -->
  <line x1="84" y1="24" x2="80" y2="28" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="32" x2="80" y2="34" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="84" y1="40" x2="80" y2="38" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ MAIN TRUNK ══ -->
  <rect x="36" y="14" width="16" height="72" rx="7" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Trunk vertical highlight -->
  <rect x="41" y="16" width="4" height="68" rx="2" fill="#2E6E65"/>
  <!-- Trunk spines -->
  <line x1="34" y1="22" x2="38" y2="26" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="36" x2="38" y2="38" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="52" x2="38" y2="52" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="66" x2="38" y2="64" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="22" x2="58" y2="26" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="36" x2="58" y2="38" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="52" x2="58" y2="52" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="66" x2="58" y2="64" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ FLOWER ON TOP ══ -->
  <circle cx="44" cy="14" r="7" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="44" cy="14" r="3" fill="#E0A94A"/>

  <!-- ══ BASE ══ -->
  <ellipse cx="44" cy="86" rx="20" ry="7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
</svg>
