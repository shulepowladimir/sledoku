<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    tractor — компактный дорожный трактор, боковой вид по референсу пользователя.
    Продольный силуэт рассчитан на предмет шириной в две клетки.
  -->
  <!-- Тень на дороге -->
  <ellipse cx="49" cy="82" rx="39" ry="4.5" fill="#3A2A20"/>

  <!-- Крыло и капот: перед трактора обращён влево -->
  <path d="M12 43 Q18 37 33 37 L42 40 L48 48 L81 48 Q87 50 90 56 L86 61 L63 61 Q57 54 47 55 L39 64 L17 62 Q10 59 11 52 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M14 44 Q22 39 39 41 L38 47 L15 50 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M46 49 L82 50 Q86 52 87 56 L62 56 Q56 52 48 54 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Кабина: единый боковой ракурс, без верхних граней -->
  <path d="M39 41 L43 25 Q44 21 49 21 L66 21 Q70 22 71 27 L74 49 L62 51 L56 44 L45 44 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M47 26 Q48 24 51 24 L57 24 L57 39 L44 39 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 24 L65 24 Q67 25 68 28 L70 42 L60 40 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M61 26 L65 26 M62 29 L66 29" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M43 42 L58 42 L61 47 L45 47 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M48 43 L48 46 M53 43 L53 46 M58 43 L58 46" stroke="#B87F33" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Выхлопная труба и глушитель -->
  <path d="M26 42 L26 22 Q26 19 29 19 L32 19" fill="none" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <path d="M24 23 L31 23" stroke="#D5DCE1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Передняя решётка, фары и задний огонь -->
  <path d="M10 47 L16 47 L16 57 L10 57 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M11 49 L15 49 M11 52 L15 52 M11 55 L15 55" stroke="#D5DCE1" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="12" cy="44" r="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="12" cy="60" r="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="85" y="49" width="4" height="4" rx="1.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Крупное заднее колесо -->
  <circle cx="33" cy="64" r="19" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M23 49 Q33 44 43 50 M16 59 L20 57 M17 68 L21 68 M23 77 L26 74 M39 80 L41 76 M48 68 L45 67 M48 58 L44 57" fill="none" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="33" cy="64" r="11" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="33" cy="64" r="6.5" fill="#E8B95F" stroke="#B87F33" stroke-width="2"/>
  <circle cx="33" cy="64" r="2.1" fill="#5C6670"/>

  <!-- Переднее колесо -->
  <circle cx="76" cy="65" r="13" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M69 54 L72 56 M83 57 L81 59 M87 65 L84 65 M82 75 L80 72 M70 76 L72 72 M65 65 L68 65" fill="none" stroke="#5C6670" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="65" r="7.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="76" cy="65" r="3.5" fill="#E8B95F" stroke="#B87F33" stroke-width="1.4"/>

  <!-- Ступенька кабины -->
  <path d="M55 55 L65 55 L66 59 L57 59 Z M57 60 L66 60 L67 63 L58 63 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M58 56 L63 56 M60 61 L65 61" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>
</svg>
