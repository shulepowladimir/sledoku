<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lamp — lighthouse Fresnel lens lamp. Giant lens drum, rotating light, gold beams.
    This is the mechanical lamp assembly inside a lighthouse lantern room.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="14" y="16" width="72" height="72" rx="36" fill="#3A2A20"/>

  <!-- ══ OUTER DRUM / HOUSING ══ -->
  <circle cx="48" cy="48" r="36" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ FRESNEL LENS RINGS (concentric, gold) ══ -->
  <circle cx="48" cy="48" r="30" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="48" r="24" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="48" r="18" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="12" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="6"  fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ LIGHT BULB CORE ══ -->
  <circle cx="48" cy="48" r="4" fill="#1A1A1A" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ LENS PANEL DIVISIONS (vertical spokes) ══ -->
  <line x1="48" y1="12" x2="48" y2="84" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="12" y1="48" x2="84" y2="48" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="22" y1="22" x2="74" y2="74" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="74" y1="22" x2="22" y2="74" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ OUTER FRAME / BEZEL ══ -->
  <circle cx="48" cy="48" r="36" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Frame bolts at 8 positions -->
  <circle cx="48" cy="12" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="74" cy="22" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="84" cy="48" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="74" cy="74" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="84" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="22" cy="74" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="12" cy="48" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="22" cy="22" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ LIGHT BEAM HIGHLIGHT ══ -->
  <polygon points="48,16 56,24 48,30 40,24" fill="#F5E9D0"/>
</svg>
