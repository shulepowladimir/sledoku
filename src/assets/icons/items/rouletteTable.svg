<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    rouletteTable — стол для рулетки (2-клеточный occupiable): длинный стол
    с деревянными бортами и зелёным сукном; слева колесо рулетки (золотое
    кольцо, тёмный диск с красными карманами и золотыми спицами, кремовый
    шарик), справа размётка ставок с фишками; по центру-низу — кремовая
    посадочная зона крупье (фартук). Силуэт растянут на всю ширину кадра:
    рендерится в bounding-box 2 клеток.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="42" ry="4.5" fill="#3A2A20"/>

  <!-- Ножки -->
  <rect x="12" y="66" width="7" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="77" y="66" width="7" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Толщина столешницы (ближняя грань) -->
  <rect x="6" y="59" width="84" height="9" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M10 62 L86 62" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Посадочная зона крупье: кремовый фартук по центру-низу -->
  <path d="M37 66 Q37 64 39.5 64 L56.5 64 Q59 64 59 66 L59 76 Q48 79.5 37 76 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M41 70 L55 70" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Борта (деревянная рама) -->
  <rect x="5" y="23" width="86" height="38" rx="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M9 27 Q48 24 87 27" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Сукно -->
  <rect x="11" y="29" width="74" height="26" rx="3" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M16 33 Q48 30 80 33" fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Колесо рулетки (левый торец) -->
  <circle cx="24" cy="42" r="12" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="24" cy="42" r="9.2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Красные карманы по ободу -->
  <g fill="#C8102E">
    <circle cx="24" cy="34.8" r="1.7"/>
    <circle cx="31.2" cy="42" r="1.7"/>
    <circle cx="24" cy="49.2" r="1.7"/>
    <circle cx="16.8" cy="42" r="1.7"/>
  </g>
  <!-- Золотые спицы и ступица -->
  <path d="M24 34 L24 50 M16 42 L32 42" stroke="#E0A94A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="24" cy="42" r="2.8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Кремовый шарик -->
  <circle cx="28.6" cy="35.6" r="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="0.9"/>

  <!-- Разметка ставок (кремовая сетка) -->
  <path d="M42 33.5 L42 50.5 M51 33.5 L51 50.5 M60 33.5 L60 50.5 M69 33.5 L69 50.5" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 40.5 L77 40.5 M42 47.5 L77 47.5" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Фишки на разметке: крем, бирюза, золото -->
  <circle cx="46.5" cy="37" r="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="64.5" cy="44" r="2.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="55.5" cy="50.5" r="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="73.5" cy="37" r="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
