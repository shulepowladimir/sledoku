<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    haystack — classic round mound of hay. Gold straw, shadow brown, straw detail lines.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="86" rx="44" ry="10" fill="#3A2A20"/>

  <!-- ══ MAIN MOUND ══ -->
  <!-- Shadow layer -->
  <ellipse cx="52" cy="62" rx="42" ry="28" fill="#3A2A20"/>
  <!-- Base ellipse -->
  <ellipse cx="48" cy="58" rx="42" ry="28" fill="#C89830" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Top highlight dome -->
  <ellipse cx="44" cy="46" rx="32" ry="20" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Top bright highlight -->
  <ellipse cx="40" cy="38" rx="18" ry="10" fill="#E8BC5A"/>

  <!-- ══ STRAW TEXTURE LINES ══ -->
  <!-- Draping from top, curved downward -->
  <path d="M30,30 Q28,48 18,64" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M36,28 Q36,52 24,70" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M44,26 Q46,52 38,76" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M52,28 Q56,54 54,78" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,30 Q66,54 68,72" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M68,36 Q76,56 78,68" fill="none" stroke="#C89830" stroke-width="2" stroke-linecap="round"/>
  <path d="M22,40 Q14,58 12,70" fill="none" stroke="#B08020" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dark shadow side of mound -->
  <ellipse cx="48" cy="72" rx="40" ry="14" fill="#B08020" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Ground base — darker shadow straw -->
  <ellipse cx="48" cy="76" rx="36" ry="8"  fill="#C89830" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ WISP STRAWS STICKING OUT ══ -->
  <line x1="10" y1="54" x2="4"  y2="48" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="60" x2="4"  y2="62" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="52" x2="94" y2="48" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="62" x2="94" y2="64" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="22" x2="42" y2="14" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="24" x2="54" y2="16" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="26" x2="62" y2="18" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
</svg>
