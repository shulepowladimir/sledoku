<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    airlock — circular pressure hatch, front view.
    Navy door, gold rivets, recessed teal panel, porthole window, red valve wheel.
  -->

  <!-- ══ SHADOW ══ -->
  <circle cx="52" cy="52" r="38" fill="#3A2A20"/>

  <!-- ══ OUTER DOOR ══ -->
  <circle cx="48" cy="48" r="38" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ RIVET RING ══ -->
  <circle cx="48" cy="16" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="68" cy="21" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="80" cy="38" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="80" cy="58" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="68" cy="75" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="28" cy="75" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="16" cy="58" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="16" cy="38" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="28" cy="21" r="3" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ RECESSED PANEL ══ -->
  <circle cx="48" cy="48" r="27" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ WARNING STRIPE ══ -->
  <rect x="23" y="60" width="50" height="7" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ PORTHOLE WINDOW ══ -->
  <circle cx="48" cy="40" r="15" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="48" cy="40" r="10" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="44" cy="36" rx="3" ry="2" fill="#7EB9D4"/>

  <!-- ══ VALVE WHEEL ══ -->
  <line x1="48" y1="69" x2="48" y2="81" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="42" y1="75" x2="54" y2="75" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="48" cy="75" r="9" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="48" cy="75" r="9" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <circle cx="48" cy="75" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
</svg>
