<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    sarcophagus — upright Egyptian mummy case with gold funerary mask.
    Cream/gold case, teal & black decorative bands, crossed crook & flail.
  -->

  <!-- ══ SHADOW ══ -->
  <path d="M32,86 L32,34 C32,20 40,14 48,14 C56,14 64,20 64,34 L64,86 Z" fill="#3A2A20"/>

  <!-- ══ CASE BODY ══ -->
  <path d="M28,82 L28,30 C28,16 36,10 44,10 C52,10 60,16 60,30 L60,82 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ DECORATIVE BANDS ══ -->
  <rect x="28" y="46" width="32" height="7" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="28" y="60" width="32" height="7" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="28" y="74" width="32" height="7" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Center hieroglyph column -->
  <line x1="44" y1="46" x2="44" y2="81" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ FACE / HEADDRESS ══ -->
  <path d="M30,30 C30,18 36,12 44,12 C52,12 58,18 58,30 L58,40 L30,40 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Nemes headdress stripes -->
  <path d="M22,26 L30,20 L30,40 L22,44 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M66,26 L58,20 L58,40 L66,44 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="30" y1="26" x2="58" y2="26" stroke="#1F3A5F" stroke-width="4"/>
  <line x1="30" y1="26" x2="58" y2="26" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Kohl eyes -->
  <path d="M35,30 Q39,28 43,30" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M45,30 Q49,28 53,30" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="39" cy="31" r="1.5" fill="#1A1A1A"/>
  <circle cx="49" cy="31" r="1.5" fill="#1A1A1A"/>

  <!-- Chin beard -->
  <rect x="42" y="38" width="4" height="8" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CROSSED CROOK & FLAIL ══ -->
  <path d="M38,50 L46,44" stroke="#E0824A" stroke-width="3" stroke-linecap="round"/>
  <path d="M38,50 Q34,45 37,42" fill="none" stroke="#E0824A" stroke-width="3" stroke-linecap="round"/>
  <path d="M50,44 L58,50" stroke="#E0824A" stroke-width="3" stroke-linecap="round"/>
  <line x1="55" y1="42" x2="61" y2="42" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="45" x2="62" y2="45" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round"/>
</svg>
