<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cannon — корабельная пушка на лафете (2-клеточный occupiable):
    растянута по ширине кадра (рендер в bounding-box 2 клеток, как car).
    Бронзовый ствол с дульным срезом, деревянный лафет с колёсами,
    банник и ядра. Посадочная зона — за казённой частью ствола.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="42" ry="4.5" fill="#3A2A20"/>

  <!-- Колёса лафета -->
  <circle cx="30" cy="72" r="11" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6"/>
  <circle cx="30" cy="72" r="4.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M30 62.5 L30 81.5 M20.5 72 L39.5 72 M23.5 65.5 L36.5 78.5 M36.5 65.5 L23.5 78.5" stroke="#E0824A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="72" r="1.4" fill="#1A1A1A"/>
  <circle cx="64" cy="76" r="9" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="64" cy="76" r="3.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M64 68.5 L64 83.5 M56.5 76 L71.5 76" stroke="#E0824A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="64" cy="76" r="1.2" fill="#1A1A1A"/>

  <!-- Лафет (деревянная рама) -->
  <path d="M16 58 L82 58 L86 66 L12 66 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M18 61 L84 61" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Заклёпки на лафете -->
  <circle cx="22" cy="63.5" r="1" fill="#8F5A3A"/>
  <circle cx="76" cy="63.5" r="1" fill="#8F5A3A"/>

  <!-- Ствол (бронза, смотрит влево) -->
  <path d="M8 44 Q8 38 18 36 L62 30 Q74 29 74 38 L74 50 Q74 59 62 58 L18 62 Q8 61 8 56 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Затемнение ствола снизу -->
  <path d="M10 56 Q10 60 18 60 L62 57 Q72 56 73 50 L73 56 Q73 58.6 62 58 L18 62 Q10 61 10 56 Z" fill="#8F5A3A"/>
  <!-- Блики на стволе сверху-слева -->
  <path d="M12 42 Q30 36 52 33" fill="none" stroke="#F5E9D0" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Дульный срез -->
  <ellipse cx="9" cy="50" rx="3.6" ry="7" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Кольца-крепления на стволе -->
  <path d="M22 36.5 L22 61 M52 31.5 L52 57.5" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M23.5 38 L23.5 60 M53.5 33 L53.5 56" stroke="#E8B95F" stroke-width="1.4"/>

  <!-- Запальное отверстие -->
  <circle cx="66" cy="36" r="1.4" fill="#1A1A1A"/>

  <!-- Ядра пирамидкой -->
  <circle cx="84" cy="70" r="4" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="90" cy="70" r="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="87" cy="64" r="4" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="85.5" cy="68.5" r="1" fill="#D5DCE1"/>

  <!-- Красный вымпел на стволе (акцент) -->
  <path d="M38 29 L44 28 L44 20 Q39 18 37 22 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
