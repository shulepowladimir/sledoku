<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    barStool — tall swivel bar stool. Round cushioned seat, four legs, ring footrest.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="90" rx="22" ry="6" fill="#3A2A20"/>

  <!-- ══ LEGS (4, perspective) ══ -->
  <!-- Back-left leg -->
  <line x1="42" y1="48" x2="30" y2="90" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
  <!-- Back-right leg -->
  <line x1="54" y1="48" x2="66" y2="90" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>
  <!-- Front-left leg -->
  <line x1="40" y1="50" x2="28" y2="90"
        stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <!-- Front-right leg -->
  <line x1="56" y1="50" x2="68" y2="90"
        stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>

  <!-- ══ FOOTREST RING ══ -->
  <ellipse cx="48" cy="72" rx="22" ry="6" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <ellipse cx="48" cy="72" rx="22" ry="6" fill="none" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ CENTRAL POLE ══ -->
  <rect x="44" y="28" width="8" height="24" rx="4" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SEAT CUSHION SHADOW ══ -->
  <ellipse cx="50" cy="30" rx="28" ry="10" fill="#3A2A20"/>

  <!-- ══ SEAT CUSHION ══ -->
  <ellipse cx="48" cy="28" rx="28" ry="10" fill="#C8102E" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cushion button centre -->
  <circle cx="48" cy="28" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Cushion seam lines -->
  <path d="M26,22 Q48,18 70,22" fill="none" stroke="#A00018" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26,34 Q48,38 70,34" fill="none" stroke="#A00018" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ SEAT UNDERSIDE RING ══ -->
  <ellipse cx="48" cy="38" rx="28" ry="10" fill="none" stroke="#1A1A1A" stroke-width="2"/>
</svg>
