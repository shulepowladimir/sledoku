<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    giraffe — side profile. Long neck, gold body with dark patches, stubby ossicones.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="20" y="68" width="7" height="24" rx="3" fill="#3A2A20"/>
  <rect x="32" y="68" width="7" height="24" rx="3" fill="#3A2A20"/>
  <rect x="54" y="68" width="7" height="24" rx="3" fill="#3A2A20"/>
  <rect x="66" y="68" width="7" height="24" rx="3" fill="#3A2A20"/>

  <!-- ══ LEGS ══ -->
  <rect x="16" y="64" width="8" height="28" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="28" y="64" width="8" height="28" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="50" y="64" width="8" height="28" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="62" y="64" width="8" height="28" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Hooves -->
  <rect x="15" y="88" width="10" height="5" rx="2" fill="#3A2A20"/>
  <rect x="27" y="88" width="10" height="5" rx="2" fill="#3A2A20"/>
  <rect x="49" y="88" width="10" height="5" rx="2" fill="#3A2A20"/>
  <rect x="61" y="88" width="10" height="5" rx="2" fill="#3A2A20"/>

  <!-- ══ BODY ══ -->
  <ellipse cx="46" cy="60" rx="30" ry="18" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ NECK ══ -->
  <rect x="40" y="14" width="16" height="48" rx="7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ HEAD ══ -->
  <ellipse cx="50" cy="12" rx="16" ry="10" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Snout / muzzle -->
  <ellipse cx="62" cy="14" rx="8" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="62" y="16" width="8" height="4" rx="2" fill="#3A2A20"/>
  <!-- Eye -->
  <circle cx="50" cy="9" r="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="49" cy="8" r="1" fill="#F5E9D0"/>
  <!-- Ear -->
  <ellipse cx="38" cy="8" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Ossicones (small horns) -->
  <rect x="45" y="2" width="4" height="8" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="53" y="2" width="4" height="8" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ PATCHES ══ -->
  <rect x="42" y="18" width="10" height="8" rx="2" fill="#3A2A20"/>
  <rect x="43" y="30" width="8" height="7" rx="2" fill="#3A2A20"/>
  <rect x="42" y="42" width="9" height="6" rx="2" fill="#3A2A20"/>
  <rect x="26" y="52" width="10" height="9" rx="3" fill="#3A2A20"/>
  <rect x="48" y="54" width="12" height="8" rx="3" fill="#3A2A20"/>
  <rect x="62" y="48" width="10" height="10" rx="3" fill="#3A2A20"/>

  <!-- ══ TAIL ══ -->
  <path d="M76,60 C84,58 86,68 80,72" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="80" cy="73" rx="4" ry="3" fill="#3A2A20"/>
</svg>
