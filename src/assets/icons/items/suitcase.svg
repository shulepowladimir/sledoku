<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hard shadow -->
  <rect x="21" y="37" width="56" height="40" rx="5" fill="#3A2A20"/>
  <rect x="38" y="24" width="4" height="15" rx="2" fill="#3A2A20"/>
  <rect x="54" y="24" width="4" height="15" rx="2" fill="#3A2A20"/>
  <rect x="38" y="24" width="20" height="5" rx="2" fill="#3A2A20"/>

  <!-- Handle posts -->
  <rect x="34" y="19" width="4" height="18" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="58" y="19" width="4" height="18" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Handle crossbar -->
  <rect x="34" y="19" width="28" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Body -->
  <rect x="17" y="33" width="56" height="40" rx="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Corner reinforcements -->
  <rect x="17" y="33" width="8" height="40" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="65" y="33" width="8" height="40" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Center band -->
  <rect x="17" y="50" width="56" height="7" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Clasp body -->
  <rect x="44" y="46" width="8" height="15" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Clasp keyhole -->
  <rect x="46" y="50" width="4" height="7" rx="1" fill="#1A1A1A"/>
</svg>
