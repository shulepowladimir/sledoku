<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    slippers — пара домашних тапочек-гигантов, вид сбоку, носками врозь:
    терракотовый носок с кремовой опушкой и помпоном, тёмная подошва,
    открытая пятка со входом для стопы. Без тени-подложки (ревью б7).
  -->
  <!-- Правый тапок (зеркальный, чуть выше и позади) -->
  <g transform="translate(96,2) scale(-1,1)">
    <!-- Подошва -->
    <path d="M11 64 Q10 70 17 70 L43 70 Q48 70 48 65 Q48 61 43 61 L18 60 Q12 60 11 64 Z"
          fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Шов по подошве -->
    <path d="M15 67.5 Q29 66.5 43 67.5" fill="none" stroke="#E0824A" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Верх (носочная часть) -->
    <path d="M13 61 Q12 48 24 46 Q34 46 36 60 Z"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Блик на верхней -->
    <path d="M16 57 Q16 50 22 48" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Кремовая опушка по краю верха -->
    <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4">
      <circle cx="33.5" cy="50" r="2.6"/>
      <circle cx="35.2" cy="55" r="2.4"/>
      <circle cx="36.2" cy="59.6" r="2.2"/>
    </g>
    <!-- Открытая пятка: вход для стопы -->
    <path d="M38 60.5 Q42.5 55.5 47 60.5 Q43.5 66 38 60.5 Z"
          fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Помпон -->
    <circle cx="23.5" cy="45.5" r="3.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M21.6 44.2 Q23.5 43.4 25.4 44.4" fill="none" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Левый тапок (передний) -->
  <g transform="translate(0,12)">
    <!-- Подошва -->
    <path d="M11 64 Q10 70 17 70 L43 70 Q48 70 48 65 Q48 61 43 61 L18 60 Q12 60 11 64 Z"
          fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Шов по подошве -->
    <path d="M15 67.5 Q29 66.5 43 67.5" fill="none" stroke="#E0824A" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Верх (носочная часть) -->
    <path d="M13 61 Q12 48 24 46 Q34 46 36 60 Z"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Блик на верхней -->
    <path d="M16 57 Q16 50 22 48" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Кремовая опушка по краю верха -->
    <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4">
      <circle cx="33.5" cy="50" r="2.6"/>
      <circle cx="35.2" cy="55" r="2.4"/>
      <circle cx="36.2" cy="59.6" r="2.2"/>
    </g>
    <!-- Открытая пятка: вход для стопы -->
    <path d="M38 60.5 Q42.5 55.5 47 60.5 Q43.5 66 38 60.5 Z"
          fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Помпон -->
    <circle cx="23.5" cy="45.5" r="3.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M21.6 44.2 Q23.5 43.4 25.4 44.4" fill="none" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
