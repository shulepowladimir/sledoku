  <path d="M19 62 L37 62 L39 69 L17 69 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 53 Q28 49 32 53" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M14 72 Q28 69 42 72 L44 80 Q28 84 12 80 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M18 74 Q28 72 38 74" fill="none" stroke="#E0824A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Правый передний конус -->
  <path d="M57 74 L62 51 Q68 45 74 51 L79 74 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M59 62 L77 62 L79 69 L57 69 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M64 53 Q68 49 72 53" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M54 72 Q68 69 82 72 L84 80 Q68 84 52 80 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
