<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trafficCone — три дорожных конуса, расставленных у места ремонта.
    Топ-даун 3/4: широкие основания, тёплая оранжевая краска и кремовые полосы.
  -->
  <!-- Мягкие посадочные тени -->
  <ellipse cx="28" cy="78" rx="14" ry="5" fill="#3A2A20"/>
  <ellipse cx="68" cy="78" rx="14" ry="5" fill="#3A2A20"/>
  <ellipse cx="48" cy="48" rx="13" ry="4.5" fill="#3A2A20"/>

  <!-- Дальний конус -->
  <path d="M40 48 L44 29 Q48 24 52 29 L56 48 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M42 39 L54 39 L56 45 L40 45 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M45 31 Q48 28 51 31" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38 46 Q48 44 58 46 L60 51 Q48 54 36 51 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Левый передний конус -->
