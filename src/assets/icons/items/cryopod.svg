<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    cryopod — upright stasis capsule, front view.
    Navy pod shell, teal viewport glass, gold trim, control panel with red button.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="27" y="13" width="42" height="76" rx="20" fill="#3A2A20"/>
  <rect x="35" y="7" width="10" height="10" rx="3" fill="#3A2A20"/>
  <rect x="53" y="7" width="10" height="10" rx="3" fill="#3A2A20"/>

  <!-- ══ TOP VENTS ══ -->
  <rect x="31" y="3" width="10" height="10" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="49" y="3" width="10" height="10" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ POD SHELL ══ -->
  <rect x="23" y="9" width="42" height="76" rx="20" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ VIEWPORT GLASS ══ -->
  <ellipse cx="44" cy="35" rx="15" ry="21" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Frost lines -->
  <path d="M32,26 Q44,22 56,26" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M31,36 Q44,32 57,36" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M32,46 Q44,42 56,46" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Glass highlight -->
  <ellipse cx="36" cy="24" rx="3" ry="6" fill="#7EB9D4"/>

  <!-- ══ SIDE STATUS LIGHTS ══ -->
  <circle cx="60" cy="24" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="60" cy="34" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="60" cy="44" r="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CONTROL PANEL ══ -->
  <rect x="29" y="62" width="30" height="16" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="33" y="66" width="8" height="3" rx="1" fill="#1A1A1A"/>
  <rect x="33" y="71" width="14" height="3" rx="1" fill="#1A1A1A"/>
  <circle cx="52" cy="70" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ BASE FEET ══ -->
  <rect x="26" y="80" width="10" height="7" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="52" y="80" width="10" height="7" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
</svg>
