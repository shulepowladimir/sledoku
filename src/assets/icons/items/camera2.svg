<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    camera2 — 1940s vintage rangefinder/Leica-style camera, 3/4 view.
    Navy body, gold trim, teal lens barrel, cream details.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="12" y="34" width="76" height="50" rx="6" fill="#3A2A20"/>
  <rect x="32" y="26" width="26" height="12" rx="4" fill="#3A2A20"/>

  <!-- ══ BODY ══ -->
  <rect x="8" y="30" width="76" height="50" rx="6" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ VIEWFINDER HUMP ══ -->
  <rect x="28" y="22" width="26" height="12" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="32" y="24" width="18" height="8" rx="2" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ FILM ADVANCE KNOB ══ -->
  <rect x="66" y="22" width="14" height="10" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="69" y1="25" x2="77" y2="29" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="77" y1="25" x2="69" y2="29" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ SHUTTER BUTTON ══ -->
  <circle cx="18" cy="30" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LENS ASSEMBLY ══ -->
  <!-- Lens surround ring -->
  <circle cx="36" cy="56" r="22" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Lens barrel rings -->
  <circle cx="36" cy="56" r="18" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="36" cy="56" r="14" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Lens glass (teal with reflections) -->
  <circle cx="36" cy="56" r="11" fill="#2E6E65"/>
  <ellipse cx="31" cy="51" rx="4" ry="3" fill="#7EB9D4"/>
  <ellipse cx="41" cy="61" rx="3" ry="2" fill="#1F3A5F"/>

  <!-- ══ BODY DETAILS ══ -->
  <!-- Rangefinder window -->
  <rect x="62" y="38" width="14" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Flash sync port -->
  <circle cx="74" cy="56" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Gold trim strip along top -->
  <rect x="8" y="30" width="76" height="5" rx="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Strap lug left -->
  <rect x="6" y="38" width="5" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Strap lug right -->
  <rect x="81" y="38" width="5" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
