<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    carJack — низкий подкатной домкрат: длинная красная станина, четыре
    поворотных колеса, подъёмная лапа и стальная рукоять.
  -->
  <ellipse cx="46" cy="86" rx="31" ry="4.5" fill="#3A2A20"/>

  <!-- Стальная рукоять с широким хватом -->
  <path d="M55 63 L76 25 Q78 22 81 24 Q83 26 81 29 L61 68 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M75 24 L82 12 Q84 9 87 11 Q90 13 88 16 L82 28 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M80 14 L86 12" stroke="#D5DCE1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Низкая станина -->
  <path d="M17 62 Q18 56 25 54 L48 47 Q57 45 63 51 L72 62 Q75 68 70 74 L62 80 L25 79 Q18 76 17 69 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 62 Q24 58 30 57 L49 51 Q56 50 60 54 L67 63 L63 69 L26 71 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M28 60 Q37 56 46 54" fill="none" stroke="#E0824A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Подъёмная лапа и седло -->
  <path d="M39 57 L45 43 Q47 39 51 41 L57 44 L52 61 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M42 42 Q48 38 56 42 L60 46 Q53 48 46 47 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M47 42 Q52 41 56 43" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Колёса: силуэт и стальные ступицы -->
  <ellipse cx="26" cy="77" rx="7" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <ellipse cx="26" cy="76" rx="3.1" ry="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4"/>
  <ellipse cx="62" cy="77" rx="7" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <ellipse cx="62" cy="76" rx="3.1" ry="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Выпускной винт — живая деталь -->
  <circle cx="32" cy="66" r="3" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M30.5 66 H33.5" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
</svg>
