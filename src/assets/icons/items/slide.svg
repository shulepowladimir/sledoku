<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    slide — playground slide with ladder and striped chute.
    Gray ladder, red & cream striped chute, gold platform.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="16" y="16" width="8" height="60" rx="2" fill="#3A2A20"/>
  <rect x="34" y="16" width="8" height="60" rx="2" fill="#3A2A20"/>
  <path d="M42,16 L84,68 L72,74 L34,26 Z" fill="#3A2A20"/>

  <!-- ══ LADDER ══ -->
  <rect x="12" y="12" width="7" height="60" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="30" y="12" width="7" height="60" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="12" y1="22" x2="37" y2="22" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="12" y1="34" x2="37" y2="34" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="12" y1="46" x2="37" y2="46" stroke="#1A1A1A" stroke-width="3"/>
  <line x1="12" y1="58" x2="37" y2="58" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ PLATFORM ══ -->
  <rect x="10" y="8" width="30" height="8" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Rail post -->
  <rect x="12" y="0" width="5" height="9" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SLIDE CHUTE ══ -->
  <path d="M38,12 L80,64 L68,70 L26,22 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stripes -->
  <path d="M42,17 L48,24" stroke="#F5E9D0" stroke-width="5"/>
  <path d="M52,30 L58,37" stroke="#F5E9D0" stroke-width="5"/>
  <path d="M62,43 L68,50" stroke="#F5E9D0" stroke-width="5"/>
  <!-- Side rail -->
  <path d="M38,12 L80,64" fill="none" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ BASE ══ -->
  <ellipse cx="72" cy="76" rx="14" ry="5" fill="#3A2A20"/>
  <ellipse cx="70" cy="74" rx="14" ry="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
</svg>
