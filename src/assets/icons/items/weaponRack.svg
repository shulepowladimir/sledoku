<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    weaponRack — wooden wall rack holding crossed swords and an axe.
    Orange wood backing, gray steel blades, gold hilts.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="24" y="24" width="48" height="56" rx="5" fill="#3A2A20"/>

  <!-- ══ WOOD BACKING PLANK ══ -->
  <rect x="20" y="20" width="48" height="56" rx="5" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Mounting pegs -->
  <circle cx="28" cy="28" r="2.5" fill="#1A1A1A"/>
  <circle cx="60" cy="28" r="2.5" fill="#1A1A1A"/>
  <circle cx="28" cy="68" r="2.5" fill="#1A1A1A"/>
  <circle cx="60" cy="68" r="2.5" fill="#1A1A1A"/>

  <!-- ══ CROSSED SWORDS ══ -->
  <!-- Sword 1 (bottom-left to top-right) -->
  <g>
    <polygon points="26,72 30,76 62,44 58,40" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="57" y="35" width="10" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" transform="rotate(45 62 38)"/>
    <rect x="60" y="30" width="4" height="10" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" transform="rotate(45 62 35)"/>
  </g>
  <!-- Sword 2 (bottom-right to top-left) -->
  <g>
    <polygon points="62,72 58,76 26,44 30,40" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="21" y="35" width="10" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" transform="rotate(-45 26 38)"/>
    <rect x="24" y="30" width="4" height="10" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" transform="rotate(-45 26 35)"/>
  </g>

  <!-- ══ SHIELD EMBLEM (center) ══ -->
  <path d="M44,52 L52,52 L52,60 Q48,66 44,60 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
</svg>
