<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wineRack — стеллаж фронтально: два ряда бутылок, уложенных горлышками
    и донышками к зрителю в чётком чередовании.
  -->
  <ellipse cx="48" cy="86" rx="35" ry="4.5" fill="#3A2A20"/>

  <!-- Корпус и тёмная задняя стенка -->
  <path d="M14 19 Q14 15 19 15 H77 Q82 15 82 20 V80 H14 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 23 H74 V76 H22 Z" fill="#5C3D27" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Шесть бутылок, лежащих в ячейках -->
  <g stroke="#1A1A1A" stroke-width="2">
    <circle cx="31" cy="33" r="7.5" fill="#2E6E65"/>
    <circle cx="48" cy="33" r="7.5" fill="#7B2431"/>
    <circle cx="65" cy="33" r="7.5" fill="#2E6E65"/>
    <circle cx="31" cy="59" r="7.5" fill="#7B2431"/>
    <circle cx="48" cy="59" r="7.5" fill="#2E6E65"/>
    <circle cx="65" cy="59" r="7.5" fill="#7B2431"/>
  </g>

  <!-- Горлышки: толстый ободок и тёмное отверстие -->
  <g stroke="#1A1A1A" stroke-width="1.6">
    <circle cx="31" cy="33" r="4.9" fill="#5E8A46"/>
    <circle cx="31" cy="33" r="2.5" fill="#1A1A1A"/>
    <circle cx="65" cy="33" r="4.9" fill="#5E8A46"/>
    <circle cx="65" cy="33" r="2.5" fill="#1A1A1A"/>
    <circle cx="48" cy="59" r="4.9" fill="#7B2431"/>
    <circle cx="48" cy="59" r="2.5" fill="#1A1A1A"/>
  </g>

  <!-- Донышки: выпуклый обод и вогнутая пятка -->
  <g stroke="#1A1A1A" stroke-width="1.6">
    <circle cx="48" cy="33" r="4.9" fill="#B85F2E"/>
    <circle cx="48" cy="33" r="2.4" fill="#7B2431"/>
    <circle cx="31" cy="59" r="4.9" fill="#B85F2E"/>
    <circle cx="31" cy="59" r="2.4" fill="#7B2431"/>
    <circle cx="65" cy="59" r="4.9" fill="#44663A"/>
    <circle cx="65" cy="59" r="2.4" fill="#2E6E65"/>
  </g>
  <g fill="none" stroke="#E8B95F" stroke-width="1.2">
    <circle cx="48" cy="33" r="3.5"/><circle cx="31" cy="59" r="3.5"/><circle cx="65" cy="59" r="3.5"/>
  </g>

  <!-- Полки и светлая передняя кромка -->
  <path d="M17 44 Q48 47 79 44 L79 50 Q48 53 17 50 Z M17 70 Q48 73 79 70 L79 77 Q48 80 17 77 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M20 45 Q48 48 76 45 M20 71 Q48 74 76 71" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M19 20 H77" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
</svg>
