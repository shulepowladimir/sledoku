<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    table — wooden dining table, slight front perspective.
    Gold tabletop, orange legs with grain.
  -->

  <!-- ══ SHADOWS (back legs + tabletop) ══ -->
  <rect x="22" y="56" width="8" height="38" rx="2" fill="#3A2A20"/>
  <rect x="72" y="56" width="8" height="38" rx="2" fill="#3A2A20"/>
  <rect x="10" y="38" width="84" height="18" rx="3" fill="#3A2A20"/>

  <!-- ══ BACK LEGS ══ -->
  <rect x="18" y="52" width="8" height="38" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="68" y="52" width="8" height="38" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Grain on back legs -->
  <line x1="20" y1="62" x2="24" y2="62" stroke="#3A2A20" stroke-width="1"/>
  <line x1="70" y1="62" x2="74" y2="62" stroke="#3A2A20" stroke-width="1"/>

  <!-- ══ FRONT LEGS ══ -->
  <rect x="12" y="54" width="8" height="38" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="76" y="54" width="8" height="38" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ TABLETOP ══ -->
  <rect x="6" y="32" width="84" height="22" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Wood grain lines -->
  <line x1="6" y1="42" x2="90" y2="42" stroke="#E0824A" stroke-width="2"/>
  <line x1="6" y1="47" x2="90" y2="47" stroke="#E0824A" stroke-width="1.5"/>
  <!-- Knot on surface -->
  <ellipse cx="30" cy="44" rx="5" ry="2.5" fill="#E0824A" stroke="#3A2A20" stroke-width="1"/>
</svg>
