<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    guitar — акустическая гитара: тёплый терракотово-деревянный корпус «восьмёркой»,
    тёмное резонаторное отверстие с розеткой, гриф тёмного дерева с кремовыми ладами,
    колковая головка с золотыми колками; красный ремень-аксент (единственный красный),
    живая деталь — медиатор, зажатый под струнами у нижнего порожка.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="46" cy="88.5" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- Ремень (красный акцент, идёт от нижнего порожка вверх за гриф) -->
  <path d="M52 78 Q66 70 63 50" fill="none" stroke="#C8102E" stroke-width="5" stroke-linecap="round"/>

  <!-- Корпус: восьмёрка (нижний барабан крупнее) -->
  <path d="M46 30
           C 58 30 63 38 63 48
           C 63 52 61 55 59 57.5
           C 63 60 66 65 66 71
           C 66 80 57 86 46 86
           C 35 86 26 80 26 71
           C 26 65 29 60 33 57.5
           C 31 55 29 52 29 48
           C 29 38 34 30 46 30 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Светлая грань слева корпуса -->
  <path d="M34.5 39 C 32.5 43 32 49 33.5 54" fill="none" stroke="#E8B95F" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Нижний блик барабана -->
  <path d="M32 74 C 33 80 39 83.5 46 83.5" fill="none" stroke="#B85F2E" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Резонаторное отверстие с розеткой -->
  <circle cx="46" cy="63" r="7" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="46" cy="63" r="9" fill="none" stroke="#B85F2E" stroke-width="1.6"/>
  <circle cx="44" cy="61" r="1.6" fill="#F5E9D0"/>

  <!-- Нижний порожек и подставка -->
  <rect x="36" y="73.5" width="20" height="3.4" rx="1.7" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Медиатор под струнами (живая деталь) -->
  <path d="M50 78 L54 78 L52.4 82 Q51.4 83 51 81.6 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Гриф -->
  <rect x="42.2" y="8" width="7.6" height="26" rx="2.4" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Лады -->
  <path d="M43.4 15 L48.6 15 M43.4 21 L48.6 21 M43.4 27 L48.6 27" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Светлая кромка грифа слева -->
  <path d="M43.6 10 L43.6 32" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Колковая головка -->
  <path d="M40.5 8 Q40.5 3 46 3 Q51.5 3 51.5 8 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="42.4" cy="6" r="1.7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="49.6" cy="6" r="1.7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Струны -->
  <path d="M42.4 7.5 L44 75 M46 7.5 L46.6 75 M49.6 7.5 L49 75" stroke="#F5E9D0" stroke-width="1" stroke-linecap="round"/>
</svg>
