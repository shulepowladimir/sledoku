<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    grapeVine — бесшовный тайл: основные плети проходят через середины всех
    четырёх сторон, поэтому соседние клетки полиомино соединяются в сеть.
  -->
  <!-- Сквозные плети: парные точки выхода совпадают на противоположных краях -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 48 C16 48 24 40 36 43 Q48 48 60 53 C72 56 80 48 96 48" stroke="#44663A" stroke-width="8"/>
    <path d="M48 0 C48 16 40 24 43 36 Q48 48 53 60 C56 72 48 80 48 96" stroke="#44663A" stroke-width="8"/>
    <path d="M0 48 C16 48 24 40 36 43 Q48 48 60 53 C72 56 80 48 96 48" stroke="#5E8A46" stroke-width="4.5"/>
    <path d="M48 0 C48 16 40 24 43 36 Q48 48 53 60 C56 72 48 80 48 96" stroke="#5E8A46" stroke-width="4.5"/>
  </g>

  <!-- Короткие усики разводят листья от сквозного стебля -->
  <g fill="none" stroke="#44663A" stroke-width="3" stroke-linecap="round">
    <path d="M28 42 Q22 35 19 30 M65 53 Q73 46 77 37 M34 54 Q26 62 20 69 M60 54 Q69 61 74 69"/>
  </g>
  <g stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round">
    <path d="M19 34 Q8 33 7 22 Q17 22 20 14 Q31 20 26 30 Q24 34 19 34 Z" fill="#5E8A46"/>
    <path d="M73 39 Q70 28 80 21 Q83 30 91 30 Q92 40 83 44 Q77 45 73 39 Z" fill="#7FA85B"/>
    <path d="M23 68 Q15 76 7 70 Q12 63 8 56 Q18 51 24 59 Q27 64 23 68 Z" fill="#7FA85B"/>
    <path d="M72 67 Q77 57 88 59 Q86 68 92 73 Q84 81 75 75 Q71 72 72 67 Z" fill="#5E8A46"/>
  </g>
  <g fill="none" stroke="#44663A" stroke-width="1.4" stroke-linecap="round">
    <path d="M12 29 L23 23 M78 39 L87 32 M13 68 L22 60 M77 70 L87 65"/>
  </g>

  <!-- Гроздь сидит у центрального узла, плети остаются видны по краям -->
  <path d="M48 48 Q54 45 58 49" fill="none" stroke="#B87F33" stroke-width="2.6" stroke-linecap="round"/>
  <g stroke="#1A1A1A" stroke-width="1.7">
    <circle cx="51" cy="53" r="5.2" fill="#7B2431"/>
    <circle cx="60" cy="53" r="5.2" fill="#7B2431"/>
    <circle cx="55.5" cy="61" r="5.2" fill="#7B2431"/>
    <circle cx="64" cy="61" r="5.2" fill="#7B2431"/>
    <circle cx="51" cy="68.5" r="5" fill="#7B2431"/>
    <circle cx="59" cy="69" r="4.6" fill="#7B2431"/>
  </g>
  <g fill="#C8102E">
    <circle cx="49.5" cy="51.5" r="1.5"/>
    <circle cx="58.5" cy="51.5" r="1.5"/>
    <circle cx="54" cy="60" r="1.5"/>
    <circle cx="62.5" cy="60" r="1.5"/>
    <circle cx="49.5" cy="67.5" r="1.4"/>
  </g>
</svg>
