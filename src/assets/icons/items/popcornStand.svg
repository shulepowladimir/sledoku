<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    popcornStand — carnival popcorn cart. Red+gold striped top, navy cart body, cream popcorn, wheels.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="91" rx="40" ry="5" fill="#3A2A20"/>

  <!-- ══ WHEELS ══ -->
  <circle cx="22" cy="80" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="22" cy="80" r="5"  fill="#E0A94A"/>
  <circle cx="22" cy="80" r="2"  fill="#1A1A1A"/>
  <circle cx="74" cy="80" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="74" cy="80" r="5"  fill="#E0A94A"/>
  <circle cx="74" cy="80" r="2"  fill="#1A1A1A"/>

  <!-- ══ CART BODY ══ -->
  <rect x="12" y="52" width="72" height="30" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Glass panel (clear case showing popcorn) -->
  <rect x="18" y="28" width="60" height="26" rx="3" fill="#D4E0E8" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Popcorn inside -->
  <ellipse cx="30" cy="42" rx="6" ry="5" fill="#F5E9D0"/>
  <ellipse cx="42" cy="38" rx="7" ry="5" fill="#E0A94A"/>
  <ellipse cx="54" cy="42" rx="6" ry="5" fill="#F5E9D0"/>
  <ellipse cx="66" cy="38" rx="6" ry="5" fill="#E0A94A"/>
  <ellipse cx="36" cy="46" rx="5" ry="4" fill="#E0A94A"/>
  <ellipse cx="60" cy="46" rx="5" ry="4" fill="#F5E9D0"/>

  <!-- ══ TOP ROOF (striped awning) ══ -->
  <!-- Roof shadow -->
  <polygon points="52,4 92,28 10,28" fill="#3A2A20"/>
  <!-- Roof -->
  <polygon points="48,2 88,26 8,26" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Gold stripes -->
  <polygon points="48,2 52,6  42,26 38,26" fill="#E0A94A"/>
  <polygon points="48,2 60,12 54,26 46,26" fill="#E0A94A"/>
  <polygon points="48,2 68,18 64,26 58,26" fill="#E0A94A"/>
  <polygon points="48,2 44,6  56,26 62,26" fill="#E0A94A"/>
  <!-- Scalloped edge -->
  <path d="M8,26 Q14,22 20,26 Q26,30 32,26 Q38,22 44,26 Q50,30 56,26 Q62,22 68,26 Q74,30 80,26 Q86,22 88,26" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Roof ball top -->
  <circle cx="48" cy="2" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ COUNTER RAIL ══ -->
  <rect x="12" y="50" width="72" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ HANDLE / PUSH BAR ══ -->
  <rect x="82" y="40" width="8" height="50" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="80" y="38" width="12" height="6"  rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ POPCORN BOX (small, on counter) ══ -->
  <polygon points="14,52 22,52 20,36 16,36" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Box stripes -->
  <line x1="17" y1="36" x2="15.5" y2="52" stroke="#F5E9D0" stroke-width="2"/>
  <!-- Popcorn top overflow -->
  <ellipse cx="18" cy="35" rx="5" ry="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
</svg>
