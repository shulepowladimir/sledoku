<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    rock — weathered boulder. Stone gray, multiple overlapping shapes, ink cracks.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="52" cy="84" rx="36" ry="10" fill="#3A2A20"/>

  <!-- ══ ROCK BODY (layered shapes) ══ -->
  <!-- Rear slab -->
  <ellipse cx="54" cy="58" rx="32" ry="24" fill="#888880" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Main boulder -->
  <path d="M14,70 Q10,52 22,38 Q34,24 52,26 Q72,26 80,40 Q88,54 80,68 Q68,82 48,80 Q28,80 14,70 Z"
        fill="#A8A8A0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Front facet (slightly lighter) -->
  <path d="M20,68 Q18,54 28,44 Q40,34 54,36 Q68,38 72,50 Q74,62 64,70 Q52,76 36,74 Q22,72 20,68 Z"
        fill="#C0C0B8"/>

  <!-- ══ CRACKS ══ -->
  <path d="M40,34 L36,48 L44,54" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <path d="M60,28 L62,44 L56,52 L60,62" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M26,56 L36,60 L34,70" fill="none" stroke="#3A2A20" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M64,54 L72,58 L68,68" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ══ MINERAL INCLUSIONS / TEXTURE ══ -->
  <circle cx="34" cy="42" r="4" fill="#888880" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="66" cy="40" r="3" fill="#888880" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="44" y="58" width="8" height="5" rx="2" fill="#888880" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ HIGHLIGHT (top-left) ══ -->
  <ellipse cx="34" cy="38" rx="10" ry="6" fill="#D8D8D0"/>

  <!-- ══ MOSS SPOTS (small teal patches) ══ -->
  <ellipse cx="22" cy="64" rx="5" ry="3" fill="#2E6E65"/>
  <ellipse cx="70" cy="66" rx="4" ry="2.5" fill="#2E6E65"/>
  <ellipse cx="46" cy="74" rx="4" ry="2" fill="#2E6E65"/>
</svg>
