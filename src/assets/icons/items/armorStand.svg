<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    armorStand — suit of armor mounted on a wooden display stand.
    Orange wood frame, gray steel breastplate/helmet, red plume.
  -->

  <!-- ══ SHADOW ══ -->
  <polygon points="30,90 66,90 62,82 34,82" fill="#3A2A20"/>
  <rect x="48" y="34" width="8" height="52" fill="#3A2A20"/>
  <rect x="34" y="38" width="36" height="8" rx="3" fill="#3A2A20"/>
  <path d="M34,50 Q48,42 62,50 L62,66 Q48,74 34,66 Z" fill="#3A2A20"/>
  <circle cx="52" cy="26" r="15" fill="#3A2A20"/>

  <!-- ══ BASE FEET ══ -->
  <polygon points="26,86 62,86 58,78 30,78" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ WOOD POLE ══ -->
  <rect x="44" y="30" width="8" height="52" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ SHOULDER CROSSBAR ══ -->
  <rect x="30" y="34" width="36" height="8" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ PAULDRONS ══ -->
  <circle cx="32" cy="40" r="7" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="64" cy="40" r="7" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ BREASTPLATE ══ -->
  <path d="M30,46 Q48,38 66,46 L66,62 Q48,70 30,62 Z" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Center ridge -->
  <line x1="48" y1="42" x2="48" y2="66" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Rivets -->
  <circle cx="36" cy="50" r="2" fill="#1A1A1A"/>
  <circle cx="60" cy="50" r="2" fill="#1A1A1A"/>
  <!-- Emblem -->
  <polygon points="48,52 52,58 48,64 44,58" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ HELMET ══ -->
  <path d="M36,26 C36,15 42,8 48,8 C54,8 60,15 60,26 L60,32 L36,32 Z"
        fill="#A8A8A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Visor slit -->
  <rect x="40" y="20" width="16" height="3" rx="1" fill="#1A1A1A"/>
  <!-- Nose guard -->
  <rect x="46.5" y="20" width="3" height="10" fill="#1A1A1A"/>
  <!-- Plume -->
  <path d="M48,8 Q44,-2 48,-4 Q52,-2 48,8" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" transform="translate(0,8)"/>
</svg>
