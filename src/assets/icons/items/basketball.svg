<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    basketball — orange ball with characteristic black seam lines.
  -->

  <!-- ══ SHADOW ══ -->
  <circle cx="52" cy="52" r="34" fill="#3A2A20"/>

  <!-- ══ BALL ══ -->
  <circle cx="48" cy="48" r="34" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ SEAM LINES ══ -->
  <!-- Vertical seam -->
  <line x1="48" y1="14" x2="48" y2="82" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Horizontal seam -->
  <line x1="14" y1="48" x2="82" y2="48" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Left curved seam -->
  <path d="M28,18 C16,32 16,64 28,78" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right curved seam -->
  <path d="M68,18 C80,32 80,64 68,78" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══ HIGHLIGHT ══ -->
  <ellipse cx="36" cy="32" rx="9" ry="6" fill="#E0A94A"/>
</svg>
