<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    canopicJar — Egyptian canopic jar with Anubis jackal-head lid.
    Cream body, gold neck ring, teal decorative band, black lid with gold ear trim.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="36" y="48" width="32" height="38" rx="6" fill="#3A2A20"/>
  <rect x="40" y="38" width="24" height="12" rx="3" fill="#3A2A20"/>
  <polygon points="38,36 34,18 42,26 48,16 54,26 62,18 58,36" fill="#3A2A20"/>

  <!-- ══ JAR BODY ══ -->
  <rect x="32" y="44" width="32" height="38" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ DECORATIVE BAND ══ -->
  <rect x="32" y="62" width="32" height="9" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="32" y="62" width="32" height="9" fill="none" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ HIEROGLYPH MARK (ankh) ══ -->
  <circle cx="48" cy="52" r="3.5" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="48" y1="55" x2="48" y2="60" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="44" y1="57" x2="52" y2="57" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ NECK RING ══ -->
  <rect x="34" y="36" width="28" height="10" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ LID / JACKAL HEAD ══ -->
  <!-- Ears -->
  <polygon points="34,32 30,14 40,24" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="62,32 66,14 56,24" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="35,30 32,17 39,25" fill="#E0A94A"/>
  <polygon points="61,30 64,17 57,25" fill="#E0A94A"/>
  <!-- Head dome + snout -->
  <path d="M34,32 C34,20 40,14 48,14 C56,14 62,20 62,32 L58,32 C57,26 52,24 48,26 C44,24 39,26 38,32 Z"
        fill="#1A1A1A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Gold stripe (ceremonial) -->
  <rect x="38" y="30" width="20" height="4" rx="1" fill="#E0A94A"/>
  <!-- Eyes -->
  <circle cx="43" cy="22" r="2" fill="#E0A94A"/>
  <circle cx="53" cy="22" r="2" fill="#E0A94A"/>
</svg>
