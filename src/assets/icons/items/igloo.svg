<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    igloo — снежный дом эскимосов: купол из ледяных блоков (W-рампа + N2),
    тёмный вход-проход, дым из очага. Блоки со смещением — кладка «чешуёй».
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="36" ry="4.5" fill="#3A2A20"/>

  <!-- Снежная база -->
  <path d="M12 84 Q10 76 20 76 L76 76 Q86 76 84 84 Z" fill="#EDE7DB" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Купол: тёмный интерьер за входом -->
  <path d="M18 76 L18 48 Q18 20 48 20 Q78 20 78 48 L78 76 Z" fill="#9FBFCF" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cel-тень по нижней и правой части купола -->
  <path d="M18 76 L18 60 Q40 68 62 60 Q74 56 78 48 L78 76 Z" fill="#7FA3B8"/>

  <!-- Кладка блоков: горизонтальные ряды со смещением -->
  <g stroke="#1A1A1A" stroke-width="1.8" fill="none">
    <path d="M19 62 Q48 54 77 62"/>
    <path d="M19 46 Q48 38 77 46"/>
    <path d="M24 32 Q48 26 72 32"/>
  </g>
  <!-- Вертикальные швы нижнего ряда -->
  <path d="M33 59.5 L33 74 M48 57 L48 74 M63 59.5 L63 74" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Вертикальные швы среднего ряда -->
  <path d="M26 44.5 L25 61 M40 42 L40 58 M56 42 L56 58 M70 44.5 L71 61" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Вертикальные швы верхнего ряда -->
  <path d="M32 30.5 L31 45 M48 28.5 L48 43 M64 30.5 L65 45" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Блики на паре блоков (свет сверху-слева) -->
  <path d="M20 46 L20 58" stroke="#D8DDDD" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 30 L42 40" stroke="#D8DDDD" stroke-width="2" stroke-linecap="round"/>

  <!-- Вход-проход -->
  <path d="M38 76 L38 62 Q48 56 58 62 L58 76 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Арка входа-ободок -->
  <path d="M36 76 L36 61 Q48 54 60 61 L60 76" fill="none" stroke="#EDE7DB" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Дым из очага (тепло жилья) -->
  <path d="M48 54 Q46 50 48 46 Q50 42 48 38" fill="none" stroke="#D8DDDD" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M48 34 Q47 32 48 30" fill="none" stroke="#D8DDDD" stroke-width="2" stroke-linecap="round"/>
</svg>
