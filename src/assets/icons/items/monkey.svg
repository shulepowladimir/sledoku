<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    monkey — sitting monkey, front view. Orange-brown fur, large ears, curling tail.
  -->

  <!-- ══ TAIL ══ -->
  <!-- Tail shadow -->
  <path d="M60,72 Q84,68 88,52 Q90,36 80,30"
        fill="none" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Tail body -->
  <path d="M56,70 Q80,66 84,50 Q86,34 76,28"
        fill="none" stroke="#E0824A" stroke-width="7" stroke-linecap="round"/>
  <!-- Tail tip curl -->
  <path d="M76,28 Q70,20 64,26 Q60,32 66,34"
        fill="none" stroke="#E0824A" stroke-width="5" stroke-linecap="round"/>

  <!-- ══ BODY ══ -->
  <!-- Body shadow -->
  <ellipse cx="46" cy="70" rx="22" ry="18" fill="#3A2A20"/>
  <!-- Body -->
  <ellipse cx="42" cy="66" rx="22" ry="18" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Belly (lighter) -->
  <ellipse cx="42" cy="68" rx="12" ry="12" fill="#F5C898"/>

  <!-- ══ ARMS ══ -->
  <!-- Left arm (hanging down) -->
  <path d="M22,58 Q12,66 14,78 Q18,82 22,78 Q24,70 26,64"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M62,58 Q72,66 70,78 Q66,82 62,78 Q60,70 58,64"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ LEGS ══ -->
  <ellipse cx="34" cy="84" rx="10" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="50" cy="84" rx="10" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="34" cy="90" rx="10" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="50" cy="90" rx="10" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ HEAD ══ -->
  <!-- Head shadow -->
  <circle cx="46" cy="32" r="22" fill="#3A2A20"/>
  <!-- Head -->
  <circle cx="42" cy="30" r="22" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ EARS (large, round) ══ -->
  <circle cx="20" cy="28" r="10" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="20" cy="28" r="6"  fill="#F5C898"/>
  <circle cx="64" cy="28" r="10" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="64" cy="28" r="6"  fill="#F5C898"/>

  <!-- ══ FACE ══ -->
  <!-- Muzzle (lighter oval) -->
  <ellipse cx="42" cy="36" rx="12" ry="9" fill="#F5C898" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="36" cy="26" r="5" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="35" cy="25" r="1.5" fill="#F5E9D0"/>
  <circle cx="48" cy="26" r="5" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="47" cy="25" r="1.5" fill="#F5E9D0"/>
  <!-- Nose -->
  <ellipse cx="42" cy="33" rx="4" ry="3" fill="#3A2A20"/>
  <circle cx="40" cy="32" r="1" fill="#1A1A1A"/>
  <circle cx="44" cy="32" r="1" fill="#1A1A1A"/>
  <!-- Mouth grin -->
  <path d="M34,40 Q42,46 50,40" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
