<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    directorConsole — broadcast vision mixer: slanted navy console,
    twin glass monitors, six tactile faders, and one live-red cue button.
  -->
  <!-- Offset sticker shadow -->
  <path d="M10 34 Q10 31 14 30 L75 20 Q80 20 82 24 L89 61 Q90 65 86 67 L25 81 Q20 82 18 78 Z" fill="#3A2A20"/>

  <!-- Console housing -->
  <path d="M8 30 Q8 27 12 26 L73 17 Q78 16 80 20 L88 57 Q89 61 85 63 L24 78 Q19 79 17 75 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M13 30 L73 21 L80 55 L23 69 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M17 31 L70 23 L72 34 L19 42 Z" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20 32 L42 29 L44 38 L22 41 Z" fill="#9CC3E0"/>
  <path d="M48 28 L67 25 L69 34 L50 37 Z" fill="#2E6E65"/>

  <!-- Six mixing faders -->
  <g stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round">
    <path d="M26 48 L29 63 M36 46 L39 60 M46 44 L49 58 M56 42 L59 55 M66 40 L69 53 M75 39 L78 50"/>
  </g>
  <g fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.5">
    <rect x="24" y="52" width="5" height="3.5" rx="1.4" transform="rotate(-12 26.5 53.75)"/>
    <rect x="34" y="48" width="5" height="3.5" rx="1.4" transform="rotate(-12 36.5 49.75)"/>
    <rect x="44" y="51" width="5" height="3.5" rx="1.4" transform="rotate(-12 46.5 52.75)"/>
    <rect x="54" y="45" width="5" height="3.5" rx="1.4" transform="rotate(-12 56.5 46.75)"/>
    <rect x="64" y="48" width="5" height="3.5" rx="1.4" transform="rotate(-12 66.5 49.75)"/>
    <rect x="73" y="43" width="5" height="3.5" rx="1.4" transform="rotate(-12 75.5 44.75)"/>
  </g>

  <!-- Cue buttons and live lamp -->
  <circle cx="27" cy="71" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="35" cy="69" r="2.2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="78" cy="61" r="3.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.7"/>
  <circle cx="77" cy="60" r="0.9" fill="#F5E9D0"/>
</svg>
