<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wardrobe — tall double-door wardrobe. Dark wood body, gold handles, carved panel detail.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="6" y="4" width="80" height="88" rx="5" fill="#3A2A20"/>

  <!-- ══ BODY ══ -->
  <rect x="2" y="0" width="80" height="88" rx="5" fill="#7C5D31" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ TOP CORNICE ══ -->
  <rect x="0" y="0"  width="84" height="8" rx="4" fill="#B08020" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ DOOR DIVISION (centre seam) ══ -->
  <line x1="42" y1="8" x2="42" y2="84" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LEFT DOOR ══ -->
  <rect x="4"  y="10" width="36" height="72" rx="3" fill="#B08020" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Left door carved panels (2 rows) -->
  <rect x="8"  y="14" width="28" height="28" rx="3" fill="none" stroke="#7C5D31" stroke-width="2.5"/>
  <rect x="12" y="18" width="20" height="20" rx="2" fill="none" stroke="#C89830" stroke-width="1.5"/>
  <rect x="8"  y="48" width="28" height="28" rx="3" fill="none" stroke="#7C5D31" stroke-width="2.5"/>
  <rect x="12" y="52" width="20" height="20" rx="2" fill="none" stroke="#C89830" stroke-width="1.5"/>
  <!-- Left carved centre diamond -->
  <polygon points="22,28 27,34 22,40 17,34" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <polygon points="22,60 27,66 22,72 17,66" fill="none" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ RIGHT DOOR ══ -->
  <rect x="44" y="10" width="36" height="72" rx="3" fill="#B08020" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="48" y="14" width="28" height="28" rx="3" fill="none" stroke="#7C5D31" stroke-width="2.5"/>
  <rect x="52" y="18" width="20" height="20" rx="2" fill="none" stroke="#C89830" stroke-width="1.5"/>
  <rect x="48" y="48" width="28" height="28" rx="3" fill="none" stroke="#7C5D31" stroke-width="2.5"/>
  <rect x="52" y="52" width="20" height="20" rx="2" fill="none" stroke="#C89830" stroke-width="1.5"/>
  <polygon points="62,28 67,34 62,40 57,34" fill="none" stroke="#E0A94A" stroke-width="1.5"/>
  <polygon points="62,60 67,66 62,72 57,66" fill="none" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- ══ HANDLES ══ -->
  <!-- Left handle -->
  <rect x="34" y="42" width="6"  height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="37" cy="44" r="2" fill="#C89830"/>
  <circle cx="37" cy="52" r="2" fill="#C89830"/>
  <!-- Right handle -->
  <rect x="44" y="42" width="6"  height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="47" cy="44" r="2" fill="#C89830"/>
  <circle cx="47" cy="52" r="2" fill="#C89830"/>

  <!-- ══ BASE / PLINTH ══ -->
  <rect x="0"  y="82" width="84" height="8"  rx="4" fill="#B08020" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Feet -->
  <rect x="4"  y="86" width="12" height="8"  rx="3" fill="#7C5D31" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="68" y="86" width="12" height="8"  rx="3" fill="#7C5D31" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ KEYHOLE ══ -->
  <circle cx="42" cy="48" r="3" fill="#1A1A1A"/>
  <rect x="40.5" y="48" width="3" height="5" rx="1" fill="#1A1A1A"/>
</svg>
