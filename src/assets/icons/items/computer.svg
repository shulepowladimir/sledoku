<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    computer — retro CRT monitor + keyboard.
    Navy casing, teal screen, cream/gold details.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="12" y="10" width="76" height="54" rx="5" fill="#3A2A20"/>
  <rect x="46" y="64" width="10" height="10" rx="2" fill="#3A2A20"/>
  <rect x="34" y="74" width="36" height="6" rx="3" fill="#3A2A20"/>
  <rect x="22" y="82" width="60" height="10" rx="3" fill="#3A2A20"/>

  <!-- ══ MONITOR BODY ══ -->
  <rect x="8" y="6" width="76" height="54" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ SCREEN ══ -->
  <rect x="14" y="12" width="64" height="42" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Code lines on screen -->
  <rect x="18" y="18" width="36" height="3" rx="1" fill="#F5E9D0"/>
  <rect x="18" y="24" width="50" height="3" rx="1" fill="#E0A94A"/>
  <rect x="18" y="30" width="28" height="3" rx="1" fill="#F5E9D0"/>
  <rect x="18" y="36" width="42" height="3" rx="1" fill="#E0A94A"/>
  <rect x="18" y="42" width="20" height="3" rx="1" fill="#F5E9D0"/>
  <!-- Blinking cursor -->
  <rect x="40" y="42" width="7" height="3" rx="1" fill="#E0824A"/>

  <!-- ══ STAND ══ -->
  <rect x="42" y="60" width="12" height="10" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="30" y="70" width="36" height="6" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ KEYBOARD ══ -->
  <rect x="18" y="78" width="60" height="14" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Key row 1 -->
  <rect x="22" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="29" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="36" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="43" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="50" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="57" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <rect x="64" y="81" width="5" height="4" rx="1" fill="#F5E9D0"/>
  <!-- Space bar row -->
  <rect x="22" y="87" width="10" height="3" rx="1" fill="#F5E9D0"/>
  <rect x="35" y="87" width="26" height="3" rx="1" fill="#F5E9D0"/>
  <rect x="64" y="87" width="10" height="3" rx="1" fill="#F5E9D0"/>
</svg>
