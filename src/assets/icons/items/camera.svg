<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    camera — wall-mounted bullet-style CCTV surveillance camera, 3/4 side view.
    Navy housing, teal lens, gold bracket, red indicator LED.
  -->

  <!-- ══ WALL MOUNT BRACKET (shadow) ══ -->
  <rect x="14" y="18" width="16" height="44" rx="4" fill="#3A2A20"/>
  <!-- Bracket arm shadow -->
  <rect x="26" y="30" width="26" height="10" rx="4" fill="#3A2A20"/>

  <!-- ══ WALL PLATE ══ -->
  <rect x="10" y="14" width="16" height="44" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Screw heads -->
  <circle cx="18" cy="22" r="3" fill="#1A1A1A"/>
  <line x1="16" y1="22" x2="20" y2="22" stroke="#F5E9D0" stroke-width="1.5"/>
  <circle cx="18" cy="52" r="3" fill="#1A1A1A"/>
  <line x1="16" y1="52" x2="20" y2="52" stroke="#F5E9D0" stroke-width="1.5"/>

  <!-- ══ PIVOT ARM ══ -->
  <rect x="22" y="28" width="24" height="10" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Pivot knuckle -->
  <circle cx="44" cy="33" r="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ CAMERA BODY (shadow) ══ -->
  <rect x="40" y="26" width="46" height="22" rx="8" fill="#3A2A20"/>

  <!-- ══ CAMERA BODY ══ -->
  <rect x="36" y="22" width="46" height="22" rx="8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Housing ribs -->
  <line x1="58" y1="22" x2="58" y2="44" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="68" y1="22" x2="68" y2="44" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Rear cap -->
  <rect x="74" y="24" width="8" height="18" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LENS HOOD ══ -->
  <rect x="20" y="26" width="22" height="16" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Hood taper lines -->
  <line x1="22" y1="28" x2="36" y2="26" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="22" y1="40" x2="36" y2="42" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ LENS ══ -->
  <!-- Lens outer ring -->
  <circle cx="24" cy="34" r="11" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Lens barrel -->
  <circle cx="24" cy="34" r="8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Glass -->
  <circle cx="24" cy="34" r="5" fill="#1A1A1A"/>
  <!-- Lens reflections -->
  <ellipse cx="21" cy="31" rx="2.5" ry="1.5" fill="#7EB9D4"/>
  <circle cx="27" cy="37" r="1" fill="#2E6E65"/>

  <!-- ══ INDICATOR LED ══ -->
  <circle cx="76" cy="28" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CABLE ══ -->
  <path d="M18,58 C18,66 18,70 18,76" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <path d="M18,76 C18,82 24,84 24,84" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
