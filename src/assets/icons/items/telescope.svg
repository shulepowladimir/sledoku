<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    telescope — refractor telescope on tripod, diagonal tube.
    Navy tube with gold rings, red eyepiece, black tripod legs.
  -->

  <!-- ══ SHADOW ══ -->
  <polygon points="20,86 30,90 60,50 52,44" fill="#3A2A20"/>
  <polygon points="18,88 12,90 22,66 28,70" fill="#3A2A20"/>
  <polygon points="34,90 28,90 44,68 50,72" fill="#3A2A20"/>
  <circle cx="24" cy="70" r="9" fill="#3A2A20"/>

  <!-- ══ TRIPOD LEGS ══ -->
  <line x1="20" y1="66" x2="10" y2="88" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="26" y2="88" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="40" y2="88" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="10" y2="88" stroke="#E0824A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="26" y2="88" stroke="#E0824A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="40" y2="88" stroke="#E0824A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══ MOUNT HEAD ══ -->
  <circle cx="20" cy="66" r="8" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ TUBE ══ -->
  <polygon points="16,62 28,54 62,14 74,22 40,64 28,72" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Tube rings -->
  <line x1="34" y1="47" x2="42" y2="55" stroke="#E0A94A" stroke-width="3"/>
  <line x1="48" y1="31" x2="56" y2="39" stroke="#E0A94A" stroke-width="3"/>

  <!-- ══ OBJECTIVE LENS ══ -->
  <ellipse cx="68" cy="18" rx="8" ry="8" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5" transform="rotate(-45 68 18)"/>
  <ellipse cx="68" cy="18" rx="8" ry="8" fill="#F5E9D0" transform="rotate(-45 68 18)" opacity="0" />
  <circle cx="70" cy="16" r="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="68" cy="14" rx="1.5" ry="2.5" fill="#7EB9D4"/>

  <!-- ══ EYEPIECE ══ -->
  <rect x="14" y="58" width="12" height="10" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" transform="rotate(-40 20 63)"/>
</svg>
