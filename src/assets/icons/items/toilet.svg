<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    toilet — standard porcelain toilet. Cream body, navy seat, gold flush handle, tank.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="46" cy="90" rx="38" ry="6" fill="#3A2A20"/>

  <!-- ══ TANK ══ -->
  <!-- Tank shadow -->
  <rect x="10" y="8" width="56" height="36" rx="6" fill="#3A2A20"/>
  <!-- Tank body -->
  <rect x="6"  y="4" width="56" height="36" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Tank lid -->
  <rect x="4"  y="2" width="60" height="8"  rx="4" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Water line inside tank -->
  <rect x="10" y="14" width="48" height="20" rx="3" fill="#D4E0E8"/>
  <line x1="10" y1="16" x2="58" y2="16" stroke="#F5E9D0" stroke-width="1.5"/>

  <!-- ══ FLUSH BUTTON ══ -->
  <circle cx="34" cy="6" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="34" cy="6" r="2" fill="#C89830"/>

  <!-- ══ CONNECTION PIPE ══ -->
  <rect x="22" y="38" width="22" height="8" rx="4" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ TOILET BOWL ══ -->
  <!-- Bowl shadow -->
  <path d="M10,50 Q10,88 46,90 Q82,88 82,50 L82,44 L10,44 Z" fill="#3A2A20"/>
  <!-- Seat (lid down) — navy coloring, hinged at back -->
  <path d="M6,44  Q6,82 46,84 Q86,82 86,44 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Seat outline inner -->
  <path d="M12,46 Q12,76 46,78 Q80,76 80,46 Z" fill="none" stroke="#2E5580" stroke-width="2"/>
  <!-- Bowl interior (visible over seat) -->
  <ellipse cx="46" cy="60" rx="28" ry="14" fill="#D4E0E8"/>
  <ellipse cx="46" cy="60" rx="20" ry="10" fill="#7EB9D4"/>
  <ellipse cx="46" cy="60" rx="8"  ry="4"  fill="#5A9AB8"/>

  <!-- ══ SEAT HINGE ══ -->
  <rect x="32" y="40" width="8"  height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="52" y="40" width="8"  height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ BASE / FOOT ══ -->
  <ellipse cx="46" cy="86" rx="36" ry="6" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="2"/>
</svg>
