<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    neonSign — несущая неоновая вывеска дайнера: ночная синяя панель на стальных
    ножках, розовый неоновый пончик с голубыми посыпками и голубой шеврон-стрелка.
    ИСКЛЮЧЕНИЕ ИЗ ПАЛИТРЫ (неон, STYLE-GUIDE §1): свечение имитируется сплошными
    многослойными штрихами без opacity/фильтров — глубокий тон → неон → крем-ядро.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="28" ry="4.5" fill="#3A2A20"/>

  <!-- Ножки-стойки -->
  <path d="M33 84 L35 64 M63 84 L61 64" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <path d="M33 84 L35 64" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ночная панель -->
  <rect x="14" y="10" width="68" height="54" rx="8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Рама панели -->
  <rect x="18.5" y="14.5" width="59" height="45" rx="5.5" fill="none" stroke="#5C6670" stroke-width="2"/>
  <!-- Блик на раме слева-сверху -->
  <path d="M20 20 Q20 16.5 23.5 16" fill="none" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- НЕОН: пончик (розовое кольцо-глазурь) -->
  <!-- Слой 1: halo (глубокий розовый) -->
  <circle cx="48" cy="33" r="13" fill="none" stroke="#D62277" stroke-width="9.5" stroke-linecap="round"/>
  <!-- Слой 2: трубка (неон) -->
  <circle cx="48" cy="33" r="13" fill="none" stroke="#FF4FA3" stroke-width="5"/>
  <!-- Слой 3: ядро (крем, свет сверху-слева) -->
  <path d="M39.5 25.5 Q36.5 30 37.5 35" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Посыпки: голубой неон (halo + трубка) -->
  <path d="M44 24.5 L46.5 22.5 M53.5 23.5 L55.5 25.5 M43 41.5 L45.5 43.5 M54 40.5 L52 42.5"
        stroke="#0E8FA8" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M44 24.5 L46.5 22.5 M53.5 23.5 L55.5 25.5 M43 41.5 L45.5 43.5 M54 40.5 L52 42.5"
        stroke="#29D8F5" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Голубой шеврон-стрелка «вход» -->
  <!-- Halo -->
  <path d="M36.5 49.5 L48 56 L59.5 49.5" fill="none" stroke="#0E8FA8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Трубка -->
  <path d="M36.5 49.5 L48 56 L59.5 49.5" fill="none" stroke="#29D8F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
