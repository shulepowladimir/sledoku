<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stove — gas kitchen stove, top-down perspective. Cream body, four burners, gold knobs.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="8" y="8" width="80" height="80" rx="6" fill="#3A2A20"/>

  <!-- ══ STOVE BODY ══ -->
  <rect x="4" y="4" width="80" height="80" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ GRATE SURFACE (centre cooking area) ══ -->
  <rect x="12" y="14" width="64" height="54" rx="4" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Grate bars (horizontal) -->
  <line x1="12" y1="24" x2="76" y2="24" stroke="#888880" stroke-width="2"/>
  <line x1="12" y1="34" x2="76" y2="34" stroke="#888880" stroke-width="2"/>
  <line x1="12" y1="44" x2="76" y2="44" stroke="#888880" stroke-width="2"/>
  <line x1="12" y1="54" x2="76" y2="54" stroke="#888880" stroke-width="2"/>
  <!-- Grate bars (vertical) -->
  <line x1="24" y1="14" x2="24" y2="68" stroke="#888880" stroke-width="2"/>
  <line x1="44" y1="14" x2="44" y2="68" stroke="#888880" stroke-width="2"/>
  <line x1="64" y1="14" x2="64" y2="68" stroke="#888880" stroke-width="2"/>

  <!-- ══ BURNERS (four) ══ -->
  <!-- Top-left burner -->
  <circle cx="28" cy="28" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="28" cy="28" r="6"  fill="#3A2A20"/>
  <circle cx="28" cy="28" r="3"  fill="#1A1A1A"/>
  <!-- Flame ring -->
  <circle cx="28" cy="28" r="10" fill="none" stroke="#E0824A" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Top-right burner -->
  <circle cx="60" cy="28" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="60" cy="28" r="6"  fill="#3A2A20"/>
  <circle cx="60" cy="28" r="3"  fill="#1A1A1A"/>
  <circle cx="60" cy="28" r="10" fill="none" stroke="#E0824A" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Bottom-left burner (large) -->
  <circle cx="28" cy="56" r="12" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="28" cy="56" r="8"  fill="#3A2A20"/>
  <circle cx="28" cy="56" r="4"  fill="#1A1A1A"/>
  <circle cx="28" cy="56" r="12" fill="none" stroke="#E0A94A" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Bottom-right burner -->
  <circle cx="60" cy="56" r="10" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="60" cy="56" r="6"  fill="#3A2A20"/>
  <circle cx="60" cy="56" r="3"  fill="#1A1A1A"/>
  <circle cx="60" cy="56" r="10" fill="none" stroke="#E0824A" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- ══ CONTROL PANEL (front strip) ══ -->
  <rect x="4" y="70" width="80" height="14" rx="4" fill="#E8E0CC" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ KNOBS (four) ══ -->
  <circle cx="18" cy="77" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="18" y1="72" x2="18" y2="77" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="77" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="33" y1="74" x2="36" y2="77" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="56" cy="77" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="56" y1="72" x2="56" y2="77" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="74" cy="77" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <line x1="77" y1="74" x2="74" y2="77" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
