<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hard shadows -->
  <!-- Wing shadow -->
  <polygon points="40,22 64,44 64,56 40,78" fill="#3A2A20"/>
  <!-- Fuselage shadow -->
  <rect x="18" y="47" width="70" height="12" rx="6" fill="#3A2A20"/>
  <!-- Tail fin shadow -->
  <polygon points="22,36 36,44 22,44" fill="#3A2A20"/>
  <!-- Stabilizer shadow -->
  <rect x="18" y="59" width="22" height="6" rx="2" fill="#3A2A20"/>

  <!-- Wing (cream, behind fuselage) -->
  <polygon points="36,18 60,40 60,56 36,74" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing tip accents -->
  <polygon points="36,18 42,26 36,28" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="36,74 42,70 36,68" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Vertical tail fin -->
  <polygon points="18,32 32,44 18,44" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Horizontal stabilizer -->
  <rect x="14" y="55" width="22" height="6" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Fuselage -->
  <rect x="14" y="43" width="70" height="12" rx="6" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Red racing stripe -->
  <rect x="22" y="46" width="58" height="3" rx="1" fill="#C8102E"/>

  <!-- Cockpit glass -->
  <rect x="66" y="45" width="11" height="8" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Engine cowl -->
  <circle cx="82" cy="49" r="7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Propeller upper blade -->
  <rect x="80" y="29" width="5" height="20" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Propeller lower blade -->
  <rect x="80" y="49" width="5" height="19" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Prop hub -->
  <circle cx="82" cy="49" r="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
</svg>
