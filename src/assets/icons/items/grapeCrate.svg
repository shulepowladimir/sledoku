<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    grapeCrate — приоткрытый ящик с тяжёлой гроздью; верх светлее,
    фронт и боковина разделены крупными деревянными планками.
  -->
  <ellipse cx="49" cy="85" rx="32" ry="4.5" fill="#3A2A20"/>

  <!-- Дальняя кромка и открытая верхушка -->
  <path d="M18 35 L30 24 L79 30 L67 40 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M25 34 L34 28 L71 32 L63 37 Z" fill="#7B2431" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M22 38 L29 33 L75 38 L69 43 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Ящик -->
  <path d="M20 38 L69 43 V78 L20 72 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M69 43 L79 36 V72 L69 78 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M21 48 L68 53 M21 60 L68 65" stroke="#B87F33" stroke-width="2.2"/>
  <path d="M25 42 L29 43 V71 L25 70 Z M59 46 L63 46.5 V77 L59 76 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M71 50 L77 46 M71 62 L77 58" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>

  <!-- Гроздь и листья -->
  <path d="M47 38 Q48 31 53 30" fill="none" stroke="#44663A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M48 35 Q39 26 34 34 Q39 41 47 39 Z M52 33 Q59 25 66 31 Q62 38 53 38 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#7B2431" stroke="#1A1A1A" stroke-width="1.5">
    <circle cx="43" cy="42" r="5"/><circle cx="52" cy="41" r="5"/><circle cx="61" cy="43" r="5"/>
    <circle cx="47" cy="50" r="5"/><circle cx="56" cy="51" r="5"/><circle cx="64" cy="51" r="4.8"/>
    <circle cx="51" cy="59" r="4.8"/><circle cx="59" cy="60" r="4.5"/><circle cx="55" cy="67" r="4.2"/>
  </g>
  <g fill="#C8102E">
    <circle cx="41.5" cy="40.5" r="1.5"/><circle cx="50.5" cy="39.5" r="1.5"/><circle cx="59.5" cy="41.5" r="1.5"/>
    <circle cx="45.5" cy="48.5" r="1.4"/><circle cx="54.5" cy="49.5" r="1.4"/><circle cx="62.5" cy="49.5" r="1.4"/>
  </g>
</svg>
