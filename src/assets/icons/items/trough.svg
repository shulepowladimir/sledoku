<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    trough — wooden water trough for horses/livestock.
    Orange wood planks, gold metal bands, sky-blue water.
  -->

  <!-- ══ SHADOW ══ -->
  <path d="M12,66 L16,84 L80,84 L84,66 Z" fill="#3A2A20"/>
  <ellipse cx="50" cy="66" rx="38" ry="10" fill="#3A2A20"/>

  <!-- ══ TROUGH BODY (front panel) ══ -->
  <path d="M10,62 L14,80 L78,80 L82,62 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Plank lines -->
  <line x1="24" y1="63" x2="21" y2="79" stroke="#3A2A20" stroke-width="1.5"/>
  <line x1="46" y1="63" x2="45" y2="80" stroke="#3A2A20" stroke-width="1.5"/>
  <line x1="68" y1="63" x2="71" y2="79" stroke="#3A2A20" stroke-width="1.5"/>
  <!-- Metal bands -->
  <rect x="10" y="68" width="72" height="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ LEGS ══ -->
  <rect x="16" y="78" width="6" height="10" rx="1.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="72" y="78" width="6" height="10" rx="1.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ WATER SURFACE (rim, ellipse) ══ -->
  <ellipse cx="46" cy="60" rx="38" ry="10" fill="#7EB9D4" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Inner rim -->
  <ellipse cx="46" cy="60" rx="32" ry="7" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Ripples -->
  <path d="M22,58 Q30,55 38,58 Q46,61 54,58" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M50,61 Q56,59 62,61" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
