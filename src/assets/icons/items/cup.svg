<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cup — чайная пара-гигант: чашка с бирюзовым ободком на блюдце,
    изящная ручка, блюдце с золотой каймой, поднимающийся пар.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Блюдце -->
  <ellipse cx="48" cy="78" rx="34" ry="8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="76" rx="28" ry="6" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Золотая кайма блюдца -->
  <ellipse cx="48" cy="78" rx="31" ry="6.5" fill="none" stroke="#E0A94A" stroke-width="1.6"/>

  <!-- Ручка чашки -->
  <path d="M70 46 Q82 46 80 56 Q78 64 68 62" fill="none" stroke="#F5E9D0" stroke-width="5.5"/>
  <path d="M70 46 Q82 46 80 56 Q78 64 68 62" fill="none" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M71.5 48.5 Q78.5 49 77 56" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Корпус чашки -->
  <path d="M20 44 Q20 68 34 74 Q48 80 62 74 Q76 68 76 44 Q48 52 20 44 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тень по нижней части чашки -->
  <path d="M28 62 Q48 72 68 62" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Кромка чашки -->
  <ellipse cx="48" cy="44" rx="28" ry="8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Бирюзовый ободок на кромке -->
  <path d="M21 43.5 Q48 51 75 43.5" fill="none" stroke="#2E6E65" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Чай внутри -->
  <ellipse cx="48" cy="44.5" rx="22" ry="5.5" fill="#B87F33"/>
  <ellipse cx="48" cy="44.5" rx="22" ry="5.5" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Блик на чае -->
  <path d="M32 44 Q38 46.5 44 45.5" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Пар -->
  <path d="M42 30 Q45 24 41 18 M52 32 Q55 26 51 20" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
