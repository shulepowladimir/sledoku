<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bushHedge — full-bleed тайл куста-изгороди (render: 'tile'): листва заполняет
    кадр целиком, соседние тайлы срастаются в непрерывную стену лабиринта — как
    бесшовная текстура (§7), но предмет. Правила бесшовности:
    - кромки — чистая база (детали с отступом ≥5px: на стыке тайлов никогда
      не оказывается полдетали);
    - объём — ПЯТНАМИ, а не градиентом от кромки: пер-тайловое затемнение низа
      дало бы «зебру» в вертикальных стенах; пятна дают ритм листвы.
    Внешний силуэт полиомино рисует движок (ItemTileOverlay svg-контур), поэтому
    stroke по кромкам и грунт-подложка здесь НЕ нужны. Зелёная рампа §1:
    7FA85B/5E8A46/44663A. Тёплый акцент — одна ягодка.
  -->
  <!-- База листвы: весь кадр -->
  <rect x="0" y="0" width="96" height="96" fill="#5E8A46"/>

  <!-- Светлые пятна объёма (свет сверху-слева) -->
  <path d="M14 16 Q22 8 34 12 Q46 16 40 26 Q32 34 20 30 Q10 26 14 16 Z" fill="#7FA85B"/>
  <path d="M58 12 Q68 6 78 12 Q86 18 78 26 Q68 32 60 26 Q52 20 58 12 Z" fill="#7FA85B"/>
  <path d="M12 52 Q20 46 30 50 Q38 56 30 62 Q20 68 12 62 Q6 56 12 52 Z" fill="#7FA85B"/>

  <!-- Тёмные пятна объёма (затемнение снизу-справа) -->
  <path d="M56 56 Q66 50 76 56 Q84 62 76 70 Q64 76 56 70 Q50 62 56 56 Z" fill="#44663A"/>
  <path d="M20 74 Q30 68 40 74 Q46 80 38 86 Q28 90 20 84 Q14 78 20 74 Z" fill="#44663A"/>
  <path d="M70 80 Q78 76 86 80 Q90 86 84 90 Q74 92 70 86 Q66 82 70 80 Z" fill="#44663A"/>

  <!-- Блики-волны (штрихи, свет сверху-слева) -->
  <g fill="none" stroke="#A4B18E" stroke-width="2.2" stroke-linecap="round">
    <path d="M18 38 Q22 34 27 34"/>
    <path d="M64 34 Q68 30 73 31"/>
    <path d="M40 44 Q44 40 49 41"/>
    <path d="M10 68 Q14 64 19 65"/>
    <path d="M50 18 Q54 14 59 15"/>
  </g>

  <!-- Крап листвы (зернистость зелени) -->
  <g fill="#44663A">
    <circle cx="48" cy="8" r="1.6"/>
    <circle cx="86" cy="44" r="1.6"/>
    <circle cx="30" cy="42" r="1.6"/>
    <circle cx="52" cy="38" r="1.6"/>
    <circle cx="8" cy="42" r="1.6"/>
    <circle cx="44" cy="62" r="1.6"/>
    <circle cx="70" cy="42" r="1.6"/>
    <circle cx="12" cy="90" r="1.6"/>
    <circle cx="46" cy="86" r="1.6"/>
    <circle cx="90" cy="70" r="1.6"/>
  </g>

  <!-- Веточка (живая деталь, центр) -->
  <path d="M40 70 Q50 64 60 66 Q66 67 70 64" fill="none" stroke="#44663A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M47 66 Q46 62 47 59 M55 66 Q56 62 55 59" fill="none" stroke="#44663A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Ягодка (единственный тёплый акцент) -->
  <circle cx="26" cy="58" r="2.8" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="25.2" cy="57" r="0.9" fill="#F5E9D0"/>
</svg>
