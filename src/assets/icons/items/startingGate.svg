<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    startingGate — вид сверху: шлагбаум въезда на дорожку ипподрома,
    две деревянные стойки, металлическая перекладина с красно-кремовыми полосами.
  -->
  <!-- Тень-подложка -->
  <path d="M8 32 L88 32 L88 52 L8 52 Z" fill="#3A2A20"/>

  <!-- Опоры -->
  <g stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round">
    <rect x="9" y="13" width="20" height="68" rx="5" fill="#B87F33"/>
    <rect x="67" y="13" width="20" height="68" rx="5" fill="#B87F33"/>
  </g>
  <path d="M13 19 H19 V74 H13 Z M71 19 H77 V74 H71 Z" fill="#E8B95F"/>
  <path d="M21 19 H25 V74 H21 Z M79 19 H83 V74 H79 Z" fill="#8A5A3A"/>

  <!-- Перекладина -->
  <rect x="19" y="34" width="58" height="23" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M25 36 H35 L25 55 H20 Z M44 36 H55 L45 55 H35 Z M64 36 H74 L64 55 H54 Z" fill="#C8102E"/>
  <path d="M21 39 H75 M21 52 H75" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Крепёж и верхние блики -->
  <circle cx="19" cy="45.5" r="2.5" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="77" cy="45.5" r="2.5" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M12 15 H25 M70 15 H83" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>
</svg>
