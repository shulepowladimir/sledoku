<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    portrait — framed oil painting. Ornate gold frame, cream canvas, dark bust silhouette.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="10" y="8" width="78" height="86" rx="6" fill="#3A2A20"/>

  <!-- ══ OUTER FRAME ══ -->
  <rect x="6" y="4" width="78" height="86" rx="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ FRAME INNER BEVEL ══ -->
  <rect x="12" y="10" width="66" height="74" rx="4" fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CANVAS ══ -->
  <rect x="16" y="14" width="58" height="66" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ PAINTED BACKGROUND (dark red drape) ══ -->
  <rect x="16" y="14" width="58" height="66" rx="3" fill="#8A1A28"/>

  <!-- ══ PAINTED SUBJECT — bust silhouette ══ -->
  <!-- Shoulders / jacket -->
  <path d="M16,80 Q20,60 26,56 Q32,54 36,56 Q40,46 45,44 Q50,44 55,46 Q60,56 64,56 Q70,60 74,80 Z"
        fill="#1F3A5F"/>
  <!-- Neck -->
  <rect x="42" y="46" width="10" height="12" rx="4" fill="#E0824A"/>
  <!-- Head -->
  <circle cx="47" cy="36" r="16" fill="#E0824A"/>
  <!-- Hair (dark) -->
  <ellipse cx="47" cy="22" rx="14" ry="8" fill="#3A2A20"/>
  <!-- Face features (small) -->
  <ellipse cx="43" cy="35" rx="2.5" ry="2" fill="#1A1A1A"/>
  <ellipse cx="51" cy="35" rx="2.5" ry="2" fill="#1A1A1A"/>
  <path d="M42,41 Q47,44 52,41" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cravat (red) -->
  <polygon points="44,52 50,52 49,58 45,58" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ FRAME CORNER ORNAMENTS ══ -->
  <circle cx="9"  cy="7"  r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="81" cy="7"  r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="9"  cy="87" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="81" cy="87" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ HANGING WIRE ══ -->
  <path d="M30,4 Q45,0 60,4" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="4" r="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="60" cy="4" r="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
</svg>
