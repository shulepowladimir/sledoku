<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    townhouse — городской домик на площади: кремовый фасад, терракотовая
    черепичная крыша со слуховым окном, красная дверь (акцент), окно воды/стекла.
    3/4-перспектива по канону box: верх светлый, фронт средний, бок тёмный.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="34" ry="4" fill="#3A2A20"/>

  <!-- Фасад (фронтальная стена) -->
  <path d="M20 48 L64 48 L64 84 L20 84 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Боковая стена (тёмная) -->
  <path d="M64 48 L76 40 L76 76 L64 84 Z" fill="#DFD6C6" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Блик на фасаде сверху-слева -->
  <path d="M23 52 L23 62" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Крыша (черепица, тёмный бок) -->
  <path d="M14 48 L42 20 L54 20 L82 48 L70 48 L42 26 L14 48 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M54 20 L82 48 L70 48 L48 26 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Ряды черепицы -->
  <path d="M22 44 Q42 22 58 22 M30 46 Q46 28 64 26 M38 48 L52 48" fill="none" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M60 44 Q70 32 74 30 M56 46 Q66 36 71 35" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Конёк -->
  <path d="M40 20 L56 20" stroke="#E8B95F" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Слуховое окно (живая деталь) -->
  <path d="M46 34 L54 34 L54 27 Q50 23 46 27 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M50 26 L50 34" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Красная дверь (акцент) -->
  <path d="M28 84 L28 60 Q33 56 38 60 L38 84 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M30 84 L30 61 M36 84 L36 61" stroke="#8F5A3A" stroke-width="1.2"/>
  <!-- Ручка -->
  <circle cx="35.5" cy="72" r="1.4" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Окно фасада -->
  <rect x="46" y="58" width="12" height="12" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M52 58 L52 70 M46 64 L58 64" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Блик на стекле -->
  <path d="M48 60 L50 60" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Подоконник -->
  <path d="M44 70 L60 70 L60 73 L44 73 Z" fill="#DFD6C6" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Окно боковой стены -->
  <path d="M67 56 L72 52 L72 64 L67 68 Z" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Цоколь -->
  <path d="M18 84 L66 84 L66 88 L18 88 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
