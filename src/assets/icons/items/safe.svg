<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    safe — heavy floor safe. Navy armoured body, gold combination dial, red indicator.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="10" y="12" width="80" height="80" rx="8" fill="#3A2A20"/>

  <!-- ══ BODY ══ -->
  <rect x="6" y="8" width="80" height="80" rx="8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ RIVETED CORNERS ══ -->
  <circle cx="14" cy="16" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="78" cy="16" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="14" cy="80" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="78" cy="80" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ DOOR PANEL ══ -->
  <rect x="14" y="16" width="64" height="64" rx="6" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Door bevel -->
  <rect x="18" y="20" width="56" height="56" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ COMBINATION DIAL ══ -->
  <!-- Dial outer ring -->
  <circle cx="42" cy="48" r="18" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Dial face -->
  <circle cx="42" cy="48" r="14" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Tick marks around dial -->
  <line x1="42" y1="34" x2="42" y2="38" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="58" x2="42" y2="62" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="48" x2="32" y2="48" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="48" x2="56" y2="48" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="35" y2="41" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="55" x2="52" y2="58" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="41" x2="52" y2="38" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="58" x2="35" y2="55" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dial pointer -->
  <line x1="42" y1="48" x2="50" y2="36" stroke="#C8102E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dial centre -->
  <circle cx="42" cy="48" r="3" fill="#1A1A1A"/>

  <!-- ══ HANDLE ══ -->
  <rect x="60" y="42" width="12" height="12" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="64" y="44" width="4" height="8" rx="2" fill="#1A1A1A"/>

  <!-- ══ INDICATOR LIGHT ══ -->
  <circle cx="68" cy="28" r="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Small ventilation slots -->
  <line x1="22" y1="70" x2="36" y2="70" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="74" x2="36" y2="74" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
