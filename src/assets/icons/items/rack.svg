<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    rack — clothes display rack. Gold rail, hanging garments in palette colours.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="48" cy="91" rx="44" ry="5" fill="#3A2A20"/>

  <!-- ══ FEET ══ -->
  <rect x="4"  y="84" width="22" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="70" y="84" width="22" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ VERTICAL POSTS ══ -->
  <rect x="10" y="20" width="8"  height="66" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="78" y="20" width="8"  height="66" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ HORIZONTAL RAIL ══ -->
  <!-- Rail shadow -->
  <rect x="4"  y="22" width="88" height="8" rx="4" fill="#3A2A20"/>
  <!-- Rail body -->
  <rect x="2"  y="18" width="88" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ CLOTHES HANGERS + GARMENTS ══ -->
  <!-- Hanger 1 — teal coat -->
  <path d="M18,22 Q18,16 22,14 Q26,12 30,16 L18,22 Z" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="22" r="2" fill="#1A1A1A"/>
  <path d="M14,22 L30,22" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="12" y="22" width="20" height="30" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="14" y="22" width="8"  height="12" rx="2" fill="#246058"/>
  <rect x="24" y="22" width="6"  height="12" rx="2" fill="#246058"/>
  <line x1="12" y1="38" x2="32" y2="38" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Hanger 2 — red dress -->
  <path d="M34,22 Q34,14 38,12 Q42,10 46,14 L34,22 Z" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="22" r="2" fill="#1A1A1A"/>
  <path d="M30,22 L46,22" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dress (flared skirt) -->
  <path d="M30,22 L26,56 Q38,60 50,56 L46,22 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M30,30 Q38,34 46,30" fill="none" stroke="#A80020" stroke-width="1.5"/>

  <!-- Hanger 3 — cream shirt -->
  <path d="M52,22 Q52,16 56,14 Q60,12 64,16 L52,22 Z" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="56" cy="22" r="2" fill="#1A1A1A"/>
  <path d="M48,22 L64,22" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="48" y="22" width="18" height="26" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="50" y="22" width="6"  height="10" rx="2" fill="#E0D4B0"/>
  <rect x="58" y="22" width="6"  height="10" rx="2" fill="#E0D4B0"/>
  <line x1="56" y1="22" x2="56" y2="48" stroke="#D0C9B0" stroke-width="1.5"/>
  <!-- Buttons -->
  <circle cx="56" cy="30" r="1.5" fill="#A8A8A0"/>
  <circle cx="56" cy="36" r="1.5" fill="#A8A8A0"/>
  <circle cx="56" cy="42" r="1.5" fill="#A8A8A0"/>

  <!-- Hanger 4 — navy jacket -->
  <path d="M70,22 Q70,16 74,14 Q78,12 82,16 L70,22 Z" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="74" cy="22" r="2" fill="#1A1A1A"/>
  <path d="M66,22 L82,22" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="66" y="22" width="18" height="28" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="68" y="22" width="6"  height="12" rx="2" fill="#162E4A"/>
  <rect x="76" y="22" width="6"  height="12" rx="2" fill="#162E4A"/>
  <line x1="75" y1="22" x2="75" y2="50" stroke="#2E5580" stroke-width="1.5"/>
  <!-- Gold buttons -->
  <circle cx="75" cy="30" r="1.5" fill="#E0A94A"/>
  <circle cx="75" cy="38" r="1.5" fill="#E0A94A"/>
</svg>
