<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    souvenirRack — rotating display rack with souvenir items. Gold frame, postcard/mug/figurine.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="48" cy="91" rx="32" ry="5" fill="#3A2A20"/>

  <!-- ══ BASE ══ -->
  <ellipse cx="48" cy="86" rx="28" ry="8" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="26" y="80" width="44" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ CENTRAL POLE ══ -->
  <rect x="44" y="10" width="8" height="72" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ HORIZONTAL ARMS (3 tiers) ══ -->
  <!-- Top tier -->
  <rect x="12" y="14" width="72" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Middle tier -->
  <rect x="16" y="36" width="64" height="6" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Lower tier -->
  <rect x="20" y="58" width="56" height="6" rx="3" fill="#E0A94A" stroke="#1A1A5F" stroke-width="2"/>

  <!-- ══ ITEMS HANGING FROM TOP TIER ══ -->
  <!-- Postcard -->
  <rect x="14" y="20" width="14" height="14" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="16" y="22" width="10" height="6"  rx="1" fill="#7EB9D4"/>
  <line x1="14" y1="28" x2="28" y2="28" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Hanger string -->
  <line x1="21" y1="14" x2="21" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Snow globe -->
  <circle cx="48" cy="26" r="7" fill="#D4E0E8" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="26" r="4" fill="#2E6E65"/>
  <rect x="44" y="32" width="8" height="4" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="48" y1="14" x2="48" y2="20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Mini flag -->
  <line x1="72" y1="14" x2="72" y2="32" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <rect x="72" y="16" width="10" height="7"  fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="72" y="20" width="10" height="3"  fill="#E0A94A"/>

  <!-- ══ ITEMS ON MIDDLE TIER ══ -->
  <!-- Mug -->
  <rect x="18" y="42" width="10" height="12" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M28,44 Q34,44 34,48 Q34,52 28,52" fill="none" stroke="#2E6E65" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="46" x2="26" y2="46" stroke="#E0A94A" stroke-width="1.5"/>

  <!-- Keychain -->
  <circle cx="48" cy="46" r="6" fill="none" stroke="#E0A94A" stroke-width="2.5"/>
  <rect x="46" y="48" width="4" height="8" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="48" y1="36" x2="48" y2="40" stroke="#E0A94A" stroke-width="2"/>

  <!-- Miniature building -->
  <rect x="64" y="40" width="14" height="14" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <polygon points="64,40 71,34 78,40" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="68" y="46" width="6" height="8" rx="1" fill="#7EB9D4"/>
  <line x1="71" y1="36" x2="71" y2="36" stroke="#E0A94A" stroke-width="2"/>

  <!-- ══ ITEMS ON LOWER TIER ══ -->
  <!-- Fridge magnet (flat) -->
  <rect x="22" y="64" width="12" height="10" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="28" cy="69" r="3" fill="#F5E9D0"/>

  <!-- Shell -->
  <ellipse cx="48" cy="69" rx="7" ry="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M42,69 Q48,65 54,69" fill="none" stroke="#C89830" stroke-width="1.5"/>

  <!-- Tin can (souvenir) -->
  <rect x="58" y="62" width="12" height="14" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="58" y="62" width="12" height="4"  rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
</svg>
