<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    keyBox — wall-mounted key cabinet. Navy box, open door, rows of keys on hooks.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="10" y="8" width="76" height="80" rx="6" fill="#3A2A20"/>

  <!-- ══ CABINET BOX ══ -->
  <rect x="6"  y="4" width="76" height="80" rx="6" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ OPEN DOOR (hinged left, open at right angle) ══ -->
  <rect x="6" y="4" width="20" height="80" rx="4" fill="#2E5580" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Door panel detail -->
  <rect x="8" y="8"  width="16" height="36" rx="2" fill="#1F3A5F"/>
  <rect x="8" y="48" width="16" height="32" rx="2" fill="#1F3A5F"/>
  <!-- Hinge -->
  <rect x="5" y="14" width="4" height="8" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="5" y="64" width="4" height="8" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ INTERIOR BACK PANEL ══ -->
  <rect x="28" y="8"  width="50" height="68" rx="3" fill="#2E5580"/>

  <!-- ══ KEY HOOKS & KEYS ══ -->
  <!-- Row 1 -->
  <!-- Hook 1 -->
  <line x1="38" y1="14" x2="38" y2="22" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="26" r="5" fill="none" stroke="#E0A94A" stroke-width="2.5"/>
  <rect x="33" y="30" width="10" height="3" rx="1" fill="#E0A94A"/>
  <rect x="37" y="30" width="3"  height="6" rx="1" fill="#E0A94A"/>
  <!-- Hook 2 -->
  <line x1="54" y1="14" x2="54" y2="22" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="54" cy="26" r="5" fill="none" stroke="#C8102E" stroke-width="2.5"/>
  <rect x="49" y="30" width="10" height="3" rx="1" fill="#C8102E"/>
  <rect x="53" y="30" width="3"  height="6" rx="1" fill="#C8102E"/>
  <!-- Hook 3 -->
  <line x1="70" y1="14" x2="70" y2="22" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="70" cy="26" r="5" fill="none" stroke="#E0A94A" stroke-width="2.5"/>
  <rect x="65" y="30" width="10" height="3" rx="1" fill="#E0A94A"/>
  <rect x="69" y="30" width="3"  height="6" rx="1" fill="#E0A94A"/>

  <!-- Row 2 -->
  <line x1="38" y1="44" x2="38" y2="52" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="56" r="5" fill="none" stroke="#2E6E65" stroke-width="2.5"/>
  <rect x="33" y="60" width="10" height="3" rx="1" fill="#2E6E65"/>
  <rect x="37" y="60" width="3"  height="5" rx="1" fill="#2E6E65"/>

  <line x1="54" y1="44" x2="54" y2="52" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="54" cy="56" r="5" fill="none" stroke="#E0A94A" stroke-width="2.5"/>
  <rect x="49" y="60" width="10" height="3" rx="1" fill="#E0A94A"/>

  <line x1="70" y1="44" x2="70" y2="52" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Empty hook -->
  <circle cx="70" cy="56" r="5" fill="none" stroke="#A8A8A0" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Row 3 -->
  <line x1="38" y1="68" x2="38" y2="72" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="68" r="3" fill="none" stroke="#E0A94A" stroke-width="2"/>
  <line x1="54" y1="68" x2="54" y2="72" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="54" cy="68" r="3" fill="none" stroke="#C8102E" stroke-width="2"/>
  <line x1="70" y1="68" x2="70" y2="72" stroke="#E0A94A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══ DOOR LOCK ══ -->
  <rect x="22" y="36" width="8" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="26" cy="40" r="2.5" fill="#1F3A5F"/>
</svg>
