<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    tireStack — пит-стоп: стопка покрышек (3 шины) и красный сигнальный
    конус (акцент). Резина — тёмная рампа с бликами, диск верхней шины —
    сталь; покрышки чуть вразнобой, края «ручные».
  -->
  <!-- Тень-подложка -->
  <ellipse cx="46" cy="86" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Нижняя шина -->
  <ellipse cx="44" cy="76" rx="30" ry="11" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="44" cy="74" rx="30" ry="11" fill="#574D4A" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="44" cy="74" rx="12" ry="4.4" fill="#3A2A20"/>
  <!-- Блик на нижней шине -->
  <path d="M20 70 Q26 66 33 65" fill="none" stroke="#9BA5AD" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Средняя шина (чуть смещена) -->
  <ellipse cx="47" cy="62" rx="27" ry="10" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="47" cy="60" rx="27" ry="10" fill="#675A56" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="47" cy="60" rx="11" ry="4" fill="#3A2A20"/>
  <!-- Протектор средней шины -->
  <path d="M27 56 L30 53 M67 55 L64 52" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <!-- Блик на средней шине -->
  <path d="M25 58 Q31 54 38 53" fill="none" stroke="#9BA5AD" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Верхняя шина с диском -->
  <ellipse cx="45" cy="48" rx="24" ry="9" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="45" cy="46" rx="24" ry="9" fill="#675A56" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Диск -->
  <ellipse cx="45" cy="46" rx="10" ry="3.8" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="45" cy="46" r="1.6" fill="#D5DCE1"/>
  <!-- Спицы диска -->
  <path d="M38 45 L52 45 M45 43 L45 48" stroke="#D5DCE1" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Блик на верхней шине -->
  <path d="M26 44 Q32 40 39 39" fill="none" stroke="#9BA5AD" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Сигнальный конус (красный акцент) -->
  <path d="M78 86 L74 62 Q79 58 84 62 L80 86 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Белая полоса конуса -->
  <path d="M75.7 69 L82.3 69 L82.8 73 L75.2 73 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- База конуса -->
  <path d="M71 86 L87 86 L87 84 L71 84 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
