<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    globe — classroom world globe on a stand.
    Teal sphere, cream continents, gold meridian ring, navy base.
  -->

  <!-- ══ SHADOW ══ -->
  <circle cx="52" cy="42" r="26" fill="#3A2A20"/>
  <rect x="44" y="66" width="8" height="16" fill="#3A2A20"/>
  <rect x="30" y="80" width="36" height="8" rx="3" fill="#3A2A20"/>

  <!-- ══ BASE ══ -->
  <rect x="26" y="76" width="36" height="8" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- ══ STAND ARM ══ -->
  <path d="M44,76 C40,60 40,44 46,32" fill="none" stroke="#1F3A5F" stroke-width="6" stroke-linecap="round"/>
  <path d="M44,76 C40,60 40,44 46,32" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" opacity="0"/>

  <!-- ══ SPHERE ══ -->
  <circle cx="48" cy="38" r="26" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ CONTINENTS ══ -->
  <path d="M34,24 Q40,20 44,26 Q42,32 36,32 Q32,28 34,24 Z" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M56,20 Q64,22 62,30 Q58,34 54,30 Q52,24 56,20 Z" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M30,44 Q36,42 38,50 Q34,56 28,52 Q26,46 30,44 Z" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M58,46 Q66,46 66,54 Q60,58 55,52 Q54,48 58,46 Z" fill="#4D8B3A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ MERIDIAN LINES ══ -->
  <ellipse cx="48" cy="38" rx="10" ry="26" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="22" y1="38" x2="74" y2="38" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ EQUATOR RING (gold, tilted) ══ -->
  <ellipse cx="48" cy="42" rx="27" ry="9" fill="none" stroke="#E0A94A" stroke-width="4"/>
  <ellipse cx="48" cy="42" rx="27" ry="9" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ TOP AXIS PIN ══ -->
  <circle cx="55" cy="14" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
