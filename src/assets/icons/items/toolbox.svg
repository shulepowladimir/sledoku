<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Hard shadows -->
  <!-- Handle shadow -->
  <rect x="38" y="28" width="6" height="14" rx="3" fill="#3A2A20"/>
  <rect x="52" y="28" width="6" height="14" rx="3" fill="#3A2A20"/>
  <rect x="38" y="28" width="20" height="6" rx="3" fill="#3A2A20"/>
  <!-- Box shadow -->
  <rect x="18" y="42" width="66" height="38" rx="4" fill="#3A2A20"/>

  <!-- Handle left post -->
  <rect x="34" y="22" width="6" height="18" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Handle right post -->
  <rect x="56" y="22" width="6" height="18" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Handle crossbar -->
  <rect x="34" y="22" width="28" height="7" rx="3.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Box body -->
  <rect x="14" y="38" width="66" height="38" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Lid divider line -->
  <rect x="14" y="50" width="66" height="5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- Clasp left -->
  <rect x="24" y="46" width="10" height="12" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="27" y="49" width="4" height="6" rx="1" fill="#1A1A1A"/>
  <!-- Clasp right -->
  <rect x="62" y="46" width="10" height="12" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="65" y="49" width="4" height="6" rx="1" fill="#1A1A1A"/>

  <!-- Tool handles visible inside (hint of tools) -->
  <rect x="26" y="58" width="5" height="12" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="35" y="55" width="5" height="15" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="44" y="57" width="5" height="13" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="53" y="56" width="5" height="14" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="62" y="58" width="5" height="12" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
