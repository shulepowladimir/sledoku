<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    jackhammer — отбойный молоток: вертикальный корпус-мотор, кольцевые
    рукояти, пика-бур внизу, красный клапан (тёплый акцент). Прислонён
    слегка наискось — живее, чем ровно.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="22" ry="5" fill="#3A2A20"/>

  <g transform="rotate(8 48 48)">
    <!-- Пика-бур (вниз, сталь тёмная) -->
    <path d="M42 70 L54 70 L49 92 L47 92 Z" fill="#545D65" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Корпус-мотор (цилиндр) -->
    <rect x="32" y="22" width="32" height="50" rx="8" fill="#7D878E" stroke="#1A1A1A" stroke-width="3.2"/>
    <!-- Рёбра охлаждения -->
    <g stroke="#545D65" stroke-width="2.4" stroke-linecap="round">
      <path d="M36 38 H60"/>
      <path d="M36 46 H60"/>
      <path d="M36 54 H60"/>
    </g>
    <!-- Блик слева -->
    <path d="M37 28 V66" stroke="#C2C9CB" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Верхняя крышка с гайкой -->
    <rect x="38" y="14" width="20" height="10" rx="3" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.6"/>
    <path d="M44 14 V10 H52 V14" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Рукояти-кольца по бокам -->
    <path d="M32 30 Q18 30 18 40 Q18 48 30 46" fill="none" stroke="#545D65" stroke-width="5" stroke-linecap="round"/>
    <path d="M32 30 Q20 31 20 40 Q20 46 30 45" fill="none" stroke="#939CA2" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M64 30 Q78 30 78 40 Q78 48 66 46" fill="none" stroke="#545D65" stroke-width="5" stroke-linecap="round"/>
    <path d="M64 30 Q76 31 76 40 Q76 46 66 45" fill="none" stroke="#939CA2" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Красный воздушный клапан (тёплый акцент) -->
    <circle cx="58" cy="19" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="57" cy="18" r="1.2" fill="#F5E9D0"/>

    <!-- Кнопка-курок -->
    <rect x="40" y="60" width="16" height="6" rx="3" fill="#454E58" stroke="#1A1A1A" stroke-width="2"/>
  </g>
</svg>
