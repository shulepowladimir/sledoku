<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    goal — football/soccer goal, front view.
    Cream posts, teal net, gold ground.
  -->

  <!-- ══ SHADOWS ══ -->
  <rect x="12" y="16" width="8" height="66" rx="2" fill="#3A2A20"/>
  <rect x="80" y="16" width="8" height="66" rx="2" fill="#3A2A20"/>
  <rect x="12" y="16" width="80" height="8" rx="2" fill="#3A2A20"/>
  <rect x="8"  y="80" width="88" height="8" rx="2" fill="#3A2A20"/>

  <!-- ══ NET BACKGROUND ══ -->
  <rect x="8" y="22" width="80" height="60" fill="#1F3A5F"/>

  <!-- ══ NET LINES ══ -->
  <!-- Vertical -->
  <line x1="24" y1="22" x2="24" y2="82" stroke="#2E6E65" stroke-width="1.5"/>
  <line x1="40" y1="22" x2="40" y2="82" stroke="#2E6E65" stroke-width="1.5"/>
  <line x1="56" y1="22" x2="56" y2="82" stroke="#2E6E65" stroke-width="1.5"/>
  <line x1="72" y1="22" x2="72" y2="82" stroke="#2E6E65" stroke-width="1.5"/>
  <!-- Horizontal -->
  <line x1="8" y1="38" x2="88" y2="38" stroke="#2E6E65" stroke-width="1.5"/>
  <line x1="8" y1="54" x2="88" y2="54" stroke="#2E6E65" stroke-width="1.5"/>
  <line x1="8" y1="70" x2="88" y2="70" stroke="#2E6E65" stroke-width="1.5"/>

  <!-- ══ POSTS ══ -->
  <rect x="8" y="12" width="8" height="72" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="80" y="12" width="8" height="72" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ CROSSBAR ══ -->
  <rect x="8" y="12" width="80" height="8" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ GROUND LINE ══ -->
  <rect x="4" y="82" width="88" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Penalty spot -->
  <circle cx="48" cy="86" r="3" fill="#1A1A1A"/>
</svg>
