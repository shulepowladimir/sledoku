<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    stela — carved stone stele on a pedestal, rounded top.
    Warm-gray stone, black carved hieroglyph pictograms.
  -->

  <!-- ══ SHADOW ══ -->
  <path d="M32,86 L32,26 C32,16 40,10 48,10 C56,10 64,16 64,26 L64,86 Z" fill="#3A2A20"/>
  <rect x="26" y="86" width="44" height="8" rx="2" fill="#3A2A20"/>

  <!-- ══ PEDESTAL ══ -->
  <rect x="22" y="82" width="44" height="8" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ STELE SLAB ══ -->
  <path d="M28,82 L28,22 C28,12 36,6 44,6 C52,6 60,12 60,22 L60,82 Z"
        fill="#A8A8A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Inner carved border -->
  <path d="M33,78 L33,24 C33,17 38,12 44,12 C50,12 55,17 55,24 L55,78 Z"
        fill="none" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SUN DISK PICTOGRAM ══ -->
  <circle cx="44" cy="24" r="6" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="44" y1="16" x2="44" y2="13" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="20" x2="52" y2="18" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="20" x2="36" y2="18" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ EYE OF HORUS ══ -->
  <path d="M36,42 Q44,36 52,42 Q44,48 36,42 Z" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="44" cy="42" r="3" fill="#1A1A1A"/>
  <path d="M44,45 L42,52" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M52,42 L57,40" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ BIRD GLYPH ══ -->
  <path d="M36,62 Q40,58 46,60 Q50,58 54,62 Q48,64 44,63 Q40,64 36,62 Z"
        fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="44" y1="63" x2="44" y2="70" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
