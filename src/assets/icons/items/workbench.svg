<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    workbench — alchemist's potion workbench. Dark table, cauldron, potion bottles, open spellbook.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="92" rx="42" ry="5" fill="#3A2A20"/>
  <rect x="8" y="48" width="82" height="44" rx="4" fill="#3A2A20"/>

  <!-- ══ TABLE LEGS ══ -->
  <rect x="12" y="62" width="8" height="30" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="76" y="62" width="8" height="30" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ TABLE BODY ══ -->
  <rect x="4"  y="44" width="84" height="20" rx="4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Table surface top -->
  <rect x="4"  y="44" width="84" height="8"  rx="4" fill="#4A3220" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ SPELLBOOK (open, left side) ══ -->
  <rect x="8"  y="26" width="28" height="20" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="36" y="26" width="28" height="20" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Spine -->
  <rect x="34" y="24" width="4"  height="24" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Left page (dark rune text) -->
  <rect x="12" y="30" width="12" height="2" rx="1" fill="#7EB9D4"/>
  <rect x="12" y="34" width="18" height="2" rx="1" fill="#7EB9D4"/>
  <rect x="12" y="38" width="14" height="2" rx="1" fill="#7EB9D4"/>
  <!-- Right page lines -->
  <rect x="40" y="30" width="16" height="2" rx="1" fill="#A8A8A0"/>
  <rect x="40" y="34" width="18" height="2" rx="1" fill="#A8A8A0"/>
  <rect x="40" y="38" width="12" height="2" rx="1" fill="#A8A8A0"/>
  <!-- Rune star on right page -->
  <polygon points="56,30 57.5,34 61,34 58.5,36 59.5,40 56,38 52.5,40 53.5,36 51,34 54.5,34"
           fill="#C8102E"/>

  <!-- ══ CAULDRON (centre) ══ -->
  <!-- Cauldron shadow -->
  <ellipse cx="64" cy="50" rx="16" ry="10" fill="#3A2A20"/>
  <!-- Cauldron body -->
  <path d="M50,44 Q48,38 56,34 Q64,30 72,34 Q80,38 78,44 Q76,52 64,52 Q52,52 50,44 Z"
        fill="#1A1A1A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cauldron rim -->
  <ellipse cx="64" cy="44" rx="14" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Bubbling potion -->
  <ellipse cx="64" cy="44" rx="10" ry="4" fill="#2E6E65"/>
  <circle cx="60" cy="42" r="2" fill="#3A8070"/>
  <circle cx="66" cy="43" r="2.5" fill="#3A8070"/>
  <circle cx="70" cy="41" r="1.5" fill="#3A8070"/>
  <!-- Cauldron legs (3) -->
  <line x1="56" y1="50" x2="54" y2="56" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="64" y2="58" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="50" x2="74" y2="56" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

  <!-- ══ POTION BOTTLES (right side) ══ -->
  <!-- Bottle A (red) -->
  <rect x="78" y="28" width="8" height="16" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="80" y="24" width="4" height="6"  rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="81" y="22" width="2" height="4"  rx="1" fill="#F5E9D0"/>
  <!-- Bottle B (gold) -->
  <rect x="68" y="30" width="8" height="14" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="70" y="26" width="4" height="6"  rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ CANDLE ══ -->
  <rect x="14" y="16" width="6" height="12" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Candle wax drip -->
  <path d="M14,24 Q12,28 14,32" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M15,16 Q17,10 19,14 Q20,18 17,18 Q14,18 15,16 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="1"/>
  <path d="M16,16 Q17,12 18,14 Q19,16 17,16 Z" fill="#E0824A"/>
</svg>
