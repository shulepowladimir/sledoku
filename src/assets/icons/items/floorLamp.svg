<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    floorLamp — торшер. Tall pole, gold cone shade, round weighted base, cream glow.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="52" cy="90" rx="26" ry="6" fill="#3A2A20"/>

  <!-- ══ BASE ══ -->
  <!-- Base shadow -->
  <ellipse cx="52" cy="88" rx="22" ry="7" fill="#3A2A20"/>
  <!-- Base body -->
  <ellipse cx="48" cy="86" rx="22" ry="7" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Base weight ring -->
  <rect x="34" y="80" width="28" height="8" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ POLE ══ -->
  <!-- Pole shadow -->
  <rect x="50" y="12" width="8" height="70" rx="4" fill="#3A2A20"/>
  <!-- Pole body -->
  <rect x="46" y="10" width="6" height="72" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Pole detail ring (mid-height) -->
  <rect x="44" y="50" width="10" height="6" rx="3" fill="#C89830" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SHADE SOCKET / NECK ══ -->
  <rect x="42" y="28" width="14" height="10" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ LAMP SHADE SHADOW ══ -->
  <polygon points="52,6 78,36 26,36" fill="#3A2A20"/>

  <!-- ══ LAMP SHADE (cone) ══ -->
  <polygon points="48,4 76,34 22,34"
           fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Shade ribs -->
  <line x1="48" y1="4" x2="34" y2="34" stroke="#C89830" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="4" x2="62" y2="34" stroke="#C89830" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="4" x2="48" y2="34" stroke="#C89830" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shade bottom rim -->
  <line x1="22" y1="34" x2="76" y2="34" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ BULB GLOW (cream) ══ -->
  <ellipse cx="48" cy="22" rx="10" ry="8" fill="#F5E9D0"/>
  <circle  cx="48" cy="20" r="4"  fill="#F5E9D0"/>
</svg>
