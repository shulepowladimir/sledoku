<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wagon — horse-drawn covered wagon. Red body, cream canvas top, spoked wheels.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="90" rx="46" ry="6" fill="#3A2A20"/>

  <!-- ══ WHEELS ══ -->
  <!-- Rear large wheel shadow -->
  <circle cx="28" cy="72" r="20" fill="#3A2A20"/>
  <!-- Rear large wheel -->
  <circle cx="24" cy="68" r="20" fill="none" stroke="#B08020" stroke-width="6"/>
  <circle cx="24" cy="68" r="20" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Spokes (8) -->
  <line x1="24" y1="48" x2="24" y2="88" stroke="#B08020" stroke-width="3"/>
  <line x1="4"  y1="68" x2="44" y2="68" stroke="#B08020" stroke-width="3"/>
  <line x1="10" y1="54" x2="38" y2="82" stroke="#B08020" stroke-width="2.5"/>
  <line x1="38" y1="54" x2="10" y2="82" stroke="#B08020" stroke-width="2.5"/>
  <!-- Hub -->
  <circle cx="24" cy="68" r="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Front small wheel shadow -->
  <circle cx="76" cy="76" r="14" fill="#3A2A20"/>
  <!-- Front small wheel -->
  <circle cx="74" cy="74" r="14" fill="none" stroke="#B08020" stroke-width="5"/>
  <circle cx="74" cy="74" r="14" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Spokes (6) -->
  <line x1="74" y1="60" x2="74" y2="88" stroke="#B08020" stroke-width="2.5"/>
  <line x1="60" y1="74" x2="88" y2="74" stroke="#B08020" stroke-width="2.5"/>
  <line x1="62" y1="62" x2="86" y2="86" stroke="#B08020" stroke-width="2"/>
  <line x1="86" y1="62" x2="62" y2="86" stroke="#B08020" stroke-width="2"/>
  <circle cx="74" cy="74" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ AXLE ══ -->
  <line x1="24" y1="68" x2="74" y2="74" stroke="#3A2A20" stroke-width="4" stroke-linecap="round"/>

  <!-- ══ WAGON BOX SHADOW ══ -->
  <rect x="16" y="38" width="66" height="36" rx="3" fill="#3A2A20"/>

  <!-- ══ WAGON BOX ══ -->
  <rect x="12" y="34" width="66" height="36" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Side planks -->
  <line x1="12" y1="44" x2="78" y2="44" stroke="#A80020" stroke-width="1.5"/>
  <line x1="12" y1="54" x2="78" y2="54" stroke="#A80020" stroke-width="1.5"/>
  <!-- Box corner straps -->
  <rect x="12" y="34" width="6"  height="36" rx="2" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="72" y="34" width="6"  height="36" rx="2" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>

  <!-- ══ CANVAS TOP ══ -->
  <!-- Canvas shadow -->
  <path d="M10,38 Q44,12 78,38" fill="#3A2A20"/>
  <!-- Canvas body -->
  <path d="M8,36 Q44,8 80,36" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Canvas ribs -->
  <path d="M20,34 Q44,14 68,34" fill="none" stroke="#E0D4B0" stroke-width="2"/>
  <path d="M30,32 Q44,18 58,32" fill="none" stroke="#E0D4B0" stroke-width="1.5"/>
  <!-- Canvas end tie -->
  <ellipse cx="44" cy="8" rx="6" ry="3" fill="#E0D4B0" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ TONGUE (shaft pointing forward) ══ -->
  <line x1="78" y1="64" x2="96" y2="60" stroke="#B08020" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="96" y2="60" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
