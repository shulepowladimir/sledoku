<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Pot shadow -->
  <polygon points="32,90 72,90 68,66 36,66" fill="#3A2A20"/>
  <!-- Top leaf shadow -->
  <ellipse cx="52" cy="24" rx="10" ry="14" fill="#3A2A20"/>
  <!-- Left leaf shadow -->
  <ellipse cx="38" cy="40" rx="14" ry="8" transform="rotate(-30 38 40)" fill="#3A2A20"/>
  <!-- Right leaf shadow -->
  <ellipse cx="66" cy="40" rx="14" ry="8" transform="rotate(30 66 40)" fill="#3A2A20"/>
  <!-- Pot -->
  <polygon points="28,86 68,86 64,62 32,62" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Soil -->
  <ellipse cx="48" cy="62" rx="16" ry="5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Main stem -->
  <rect x="46" y="30" width="4" height="34" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Left large leaf -->
  <ellipse cx="34" cy="36" rx="14" ry="8" transform="rotate(-30 34 36)" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Right large leaf -->
  <ellipse cx="62" cy="36" rx="14" ry="8" transform="rotate(30 62 36)" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Top leaf -->
  <ellipse cx="48" cy="20" rx="10" ry="14" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Flower -->
  <circle cx="48" cy="14" r="5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="14" r="2" fill="#E0A94A"/>
</svg>
