<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    ladder — A-frame stepladder / стремянка. Cream aluminium, gold hinges, 4 steps.
  -->

  <!-- ══ SHADOW ══ -->
  <ellipse cx="50" cy="92" rx="38" ry="5" fill="#3A2A20"/>

  <!-- ══ LEFT SIDE (front legs) ══ -->
  <!-- Left leg shadow -->
  <line x1="32" y1="8" x2="18" y2="90" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <line x1="42" y1="8" x2="28" y2="90" stroke="#3A2A20" stroke-width="8" stroke-linecap="round"/>
  <!-- Left leg body -->
  <line x1="28" y1="8" x2="14" y2="90" stroke="#A8A8A0" stroke-width="7" stroke-linecap="round"/>
  <line x1="38" y1="8" x2="24" y2="90" stroke="#C0C0B8" stroke-width="7" stroke-linecap="round"/>

  <!-- ══ RIGHT SIDE (back legs) ══ -->
  <!-- Back leg shadow -->
  <line x1="60" y1="8" x2="74" y2="90" stroke="#3A2A20" stroke-width="6" stroke-linecap="round"/>
  <!-- Back leg body (slightly darker, behind) -->
  <line x1="56" y1="8" x2="70" y2="90" stroke="#888880" stroke-width="6" stroke-linecap="round"/>
  <line x1="64" y1="8" x2="78" y2="90" stroke="#888880" stroke-width="6" stroke-linecap="round"/>

  <!-- ══ SPREADER BAR (rear, horizontal) ══ -->
  <line x1="58" y1="46" x2="68" y2="46" stroke="#888880" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="72" y2="60" stroke="#888880" stroke-width="4" stroke-linecap="round"/>

  <!-- ══ STEPS (4 horizontal rungs on front side) ══ -->
  <!-- Step 1 (top) -->
  <rect x="20" y="22" width="28" height="6" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Step 2 -->
  <rect x="16" y="40" width="32" height="6" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Step 3 -->
  <rect x="12" y="58" width="36" height="6" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Step 4 (bottom) -->
  <rect x="8"  y="76" width="40" height="6" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ TOP CAP (pivot hinge) ══ -->
  <rect x="24" y="4" width="44" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ RUBBER FEET ══ -->
  <ellipse cx="14" cy="90" rx="7" ry="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <ellipse cx="24" cy="90" rx="7" ry="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <ellipse cx="70" cy="90" rx="6" ry="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
  <ellipse cx="78" cy="90" rx="6" ry="3" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1"/>
</svg>
