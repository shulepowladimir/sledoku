<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    luggageRack — train-station luggage shelf with stacked suitcases.
    Gold rail frame, red & teal suitcases with straps.
  -->

  <!-- ══ SHADOW ══ -->
  <rect x="14" y="60" width="72" height="8" rx="3" fill="#3A2A20"/>
  <rect x="20" y="30" width="14" height="34" rx="3" fill="#3A2A20"/>
  <rect x="78" y="30" width="14" height="34" rx="3" fill="#3A2A20"/>
  <rect x="24" y="18" width="42" height="26" rx="4" fill="#3A2A20"/>
  <rect x="40" y="46" width="34" height="20" rx="4" fill="#3A2A20"/>

  <!-- ══ RACK LEGS ══ -->
  <rect x="16" y="26" width="8" height="34" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="74" y="26" width="8" height="34" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ RACK RAILS ══ -->
  <rect x="10" y="56" width="76" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <line x1="14" y1="60" x2="82" y2="60" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ SUITCASE 1 (back, red) ══ -->
  <rect x="20" y="14" width="42" height="26" rx="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="20" y="24" width="42" height="4" fill="#1A1A1A"/>
  <rect x="36" y="10" width="10" height="6" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="28" y1="14" x2="28" y2="40" stroke="#3A2A20" stroke-width="1.5"/>
  <line x1="54" y1="14" x2="54" y2="40" stroke="#3A2A20" stroke-width="1.5"/>

  <!-- ══ SUITCASE 2 (front, teal, on rail) ══ -->
  <rect x="36" y="42" width="34" height="20" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Strap -->
  <rect x="36" y="49" width="34" height="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="53" cy="52" r="2.5" fill="#1A1A1A"/>
  <!-- Handle -->
  <rect x="47" y="38" width="12" height="6" rx="2" fill="#A8A8A0" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
