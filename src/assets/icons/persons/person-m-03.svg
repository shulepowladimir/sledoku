<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-03 — грузчик/докер, портрет по плечи.
    Одежда: fill="var(--person-clothing, #8A8A8A)".
    Кожа, щетина — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <rect x="24" y="12" width="56" height="22" rx="10" fill="#3A2A20"/>
  <rect x="34" y="31" width="28" height="5"  rx="2"  fill="#3A2A20"/>
  <circle cx="52" cy="54" r="20" fill="#3A2A20"/>
  <rect x="10" y="78" width="84" height="22" rx="4"  fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <rect x="6"  y="74" width="84" height="22" rx="4"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Кепка-кепи (плоская, rx=10) -->
  <rect x="20" y="8" width="56" height="22" rx="10"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Малый козырёк (только спереди) -->
  <rect x="30" y="27" width="28" height="5" rx="2"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="28" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="68" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ГОЛОВА И ШЕЯ ══ -->
  <circle cx="48" cy="50" r="20"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="68" width="12" height="12" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Брови (нахмуренные, угловые) -->
  <path d="M37,42 L45,39" fill="none" stroke="#3A2A20" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M51,39 L59,42" fill="none" stroke="#3A2A20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="47" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="40" cy="46" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="47" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="54" cy="46" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Нос -->
  <path d="M44,52 Q48,57 52,52"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Рот (лёгкий скептицизм) -->
  <path d="M40,63 Q48,61 56,63"
        fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Щетина (точки по линии челюсти) -->
  <rect x="36" y="62" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="40" y="64" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="44" y="66" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="48" y="67" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="52" y="66" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="56" y="64" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="60" y="62" width="2" height="2" rx="0.5" fill="#3A2A20"/>
  <rect x="38" y="60" width="1.5" height="1.5" rx="0.5" fill="#3A2A20"/>
  <rect x="43" y="60" width="1.5" height="1.5" rx="0.5" fill="#3A2A20"/>
  <rect x="53" y="60" width="1.5" height="1.5" rx="0.5" fill="#3A2A20"/>
  <rect x="58" y="60" width="1.5" height="1.5" rx="0.5" fill="#3A2A20"/>
  <!-- Рабочий шейный платок (оранжевый) -->
  <polygon points="45,72 51,72 50,88 46,86"
           fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
