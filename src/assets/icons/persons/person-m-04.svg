<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-04 — военный офицер / портрет по плечи.
    Фуражка с козырьком, аккуратные усы, мундир с эполетом.
    Одежда: fill="var(--person-clothing, #8A8A8A)".
    Кожа, волосы, усы, медаль — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <rect x="18" y="6"  width="64" height="16" rx="5"  fill="#3A2A20"/>
  <rect x="8"  y="20" width="84" height="6"  rx="3"  fill="#3A2A20"/>
  <circle cx="52" cy="54" r="20" fill="#3A2A20"/>
  <rect x="10" y="78" width="84" height="22" rx="4"  fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <!-- Мундир / плечи -->
  <rect x="6"  y="74" width="84" height="22" rx="4"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Тулья фуражки -->
  <rect x="14" y="2"  width="64" height="16" rx="5"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Козырёк (выступает вперёд) -->
  <rect x="4"  y="16" width="84" height="6"  rx="3"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Эполет левый -->
  <rect x="6"  y="74" width="18" height="8"  rx="3"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Эполет правый -->
  <rect x="72" y="74" width="18" height="8"  rx="3"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="28" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="68" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ГОЛОВА И ШЕЯ ══ -->
  <circle cx="48" cy="50" r="20"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="68" width="12" height="12" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Кант фуражки (красный) -->
  <rect x="14" y="16" width="64" height="3" rx="1" fill="#C8102E"/>
  <!-- Кокарда (золото) -->
  <circle cx="48" cy="10" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="10" r="1.5" fill="#C8102E"/>
  <!-- Брови (прямые, строгие) -->
  <rect x="36" y="42" width="9"  height="2.5" rx="1" fill="#3A2A20"/>
  <rect x="51" y="42" width="9"  height="2.5" rx="1" fill="#3A2A20"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="48" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="40" cy="47" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="48" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="54" cy="47" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Нос -->
  <path d="M44,53 Q48,58 52,53"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Усы -->
  <path d="M37,60 Q42,63 48,61 Q54,63 59,60"
        fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
  <!-- Рот под усами -->
  <path d="M42,64 Q48,67 54,64"
        fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Медаль на мундире (золото, запечена) -->
  <circle cx="34" cy="82" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="34" cy="82" r="1.5" fill="#C8102E"/>
  <!-- Золотые полосы эполет -->
  <line x1="8"  y1="77" x2="22" y2="77" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <line x1="74" y1="77" x2="88" y2="77" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
</svg>
