<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-01 — элегантная дама 40-х, портрет по плечи.
    Одежда: fill="var(--person-clothing, #8A8A8A)" — без внутренних чёрных деталей.
    Кожа, волосы, помада, брошь — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <rect x="42" y="10" width="24" height="12" rx="4" fill="#3A2A20"/>
  <ellipse cx="52" cy="22" rx="28" ry="9" fill="#3A2A20"/>
  <circle cx="52" cy="48" r="19" fill="#3A2A20"/>
  <polygon points="14,76 90,76 94,96 10,96" fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <!-- Жакет/плечи -->
  <polygon points="10,72 86,72 90,96 6,96"
           fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"
           stroke-linejoin="round"/>
  <!-- Тулья шляпки -->
  <rect x="38" y="6" width="24" height="12" rx="4"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Поля шляпки -->
  <ellipse cx="48" cy="18" rx="28" ry="9"
           fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ ГОЛОВА И ШЕЯ (кожа) ══ -->
  <circle cx="48" cy="44" r="19"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="61" width="12" height="14" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ВОЛОСЫ (запечены) ══ -->
  <!-- Боковые локоны, обрамляют лицо -->
  <ellipse cx="29" cy="44" rx="5" ry="16" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="67" cy="44" rx="5" ry="16" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Волосы сверху (под шляпкой) -->
  <rect x="38" y="24" width="20" height="8" rx="3" fill="#3A2A20"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Лента шляпки -->
  <rect x="38" y="15" width="24" height="3" rx="1" fill="#C8102E"/>
  <!-- Брови (выразительная дуга) -->
  <path d="M37,37 Q43,33 48,37" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <path d="M48,37 Q53,33 59,37" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="40" cy="41" rx="1" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="54" cy="41" rx="1" ry="1" fill="#F5E9D0"/>
  <!-- Ресницы -->
  <line x1="38" y1="40" x2="36" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="39" x2="40" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="39" x2="44" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="39" x2="52" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="39" x2="56" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="60" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Нос -->
  <path d="M45,48 Q48,52 51,48"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Губы (красные) -->
  <path d="M41,56 Q48,62 55,56"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43,56 Q48,59 53,56" fill="#C8102E" stroke="none"/>
  <!-- Брошь (золотая, запечена) -->
  <circle cx="48" cy="76" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="48" cy="76" r="1.5" fill="#C8102E"/>
</svg>
