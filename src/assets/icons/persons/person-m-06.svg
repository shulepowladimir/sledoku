<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-06 — профессор, бюст.
    Свитер красится игрой: fill="var(--person-clothing, #8A8A8A)".
    Первый мужской архетип БЕЗ шляпы: седой зачёс назад, круглые очки
    в золотой оправе, V-вырез свитера поверх кремовой рубашки,
    седая эспаньолка. Кожа бледная F2C9A0 (тень E3B48A).
    Без drop-теней (гайд §5): объём — cel-тени и контур.
  -->

  <!-- ══ СВИТЕР (var) ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 71 L70 71 Q86 71 86 84 L86 92 L62 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Резинка свитера понизу -->
  <rect x="12" y="87.5" width="72" height="1.6" fill="#1A1A1A" opacity="0.15"/>

  <!-- ══ РУБАШКА В V-ВЫРЕЗЕ (кремовая) ══ -->
  <path d="M40 71 L48 85.5 L56 71 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Воротник рубашки -->
  <path d="M44 71 Q46.5 73 48 76 Q49.5 73 52 71 L50 71 Q48.8 72.2 48 73 Q47.2 72.2 46 71 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Кромка V-выреза свитера -->
  <path d="M38.5 71.5 L48 86.5 L57.5 71.5" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ ШЕЯ ══ -->
  <rect x="42" y="60" width="12" height="12" rx="3" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="42" y="60" width="12" height="4.5" rx="2.2" fill="#E3B48A"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="29.5" cy="49" rx="4" ry="6" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="66.5" cy="49" rx="4" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.2 46.8 Q30.6 49 28.8 51.4" fill="none" stroke="#E3B48A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M67.2 46.8 Q64.8 49 66.6 51.4" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="48" r="19" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M60 33.3 A19 19 0 0 1 60 62.7 A15.5 15.5 0 0 0 60 33.3 Z" fill="#E3B48A"/>

  <!-- ══ СЕДЫЕ ВОЛОСЫ: ЗАЧЁС НАЗАД ══ -->
  <path d="M29.5 42 Q27.5 28 40 25 Q48 23.5 56 25 Q68.5 28 66.5 42 L64 42 Q66 31.5 55 29.5 Q48 28 41 29.5 Q30 31.5 32 42 Z"
        fill="#C9A24A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Валик-волна надо лбом (зачёс назад) -->
  <path d="M33 39.5 Q36 34.5 42 34.8 Q47 35 48.5 38.5 Q44 36.5 39.5 37.2 Q35.5 37.8 33 39.5 Z"
        fill="#A9743A" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Пряди-волны (глубина) -->
  <g fill="none" stroke="#A9743A" stroke-width="1.5" stroke-linecap="round">
    <path d="M37 31.5 Q43 28.5 50 29.5"/>
    <path d="M55 30.5 Q60 32.5 62.5 36.5"/>
  </g>
  <!-- Блик на волосах -->
  <path d="M41 27 Q47 25.8 53 27.5" fill="none" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Седые виски (завитки перед ушами) -->
  <path d="M30.5 43 Q29.2 39.5 32 36.5 Q34.5 34.8 36 37 Q34 39 33.8 42.5 Z"
        fill="#C9A24A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M65.5 43 Q66.8 39.5 64 36.5 Q61.5 34.8 60 37 Q62 39 62.2 42.5 Z"
        fill="#C9A24A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cel-тень: полоса лба под линией волос -->
  <path d="M33.5 42.5 Q48 39.5 62.5 42.5 L62 45 Q48 42.2 34 45 Z" fill="#E3B48A"/>
  <!-- Морщина на лбу -->
  <path d="M39 40 Q48 38.2 57 40" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ══ БРОВИ (седые, кустистые, приподнятые — лекторская гримаса) ══ -->
  <path d="M35.4 44 Q39 41.6 44.4 42.6 L44 44.8 Q39.6 44 36.4 46.2 Z" fill="#C9A24A" stroke="#3A2A20" stroke-width="0.5"/>
  <path d="M51.6 42.6 Q57 41.6 60.6 44 L59.6 46.2 Q56.4 44 52 44.8 Z" fill="#C9A24A" stroke="#3A2A20" stroke-width="0.5"/>

  <!-- ══ ГЛАЗА (карие, за очками) ══ -->
  <!-- Левый -->
  <ellipse cx="40.5" cy="48" rx="3.3" ry="3.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.2" cy="48.3" r="2.3" fill="#5A4636"/>
  <circle cx="41.3" cy="48.4" r="1.05" fill="#1A1A1A"/>
  <circle cx="40.5" cy="47.4" r="0.65" fill="#F5E9D0"/>
  <path d="M37.3 46.5 Q40.5 44.2 44 46.3" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M37.8 51.8 Q40.6 52.8 43.6 51.8" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Правый -->
  <ellipse cx="55.5" cy="48" rx="3.3" ry="3.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.8" cy="48.3" r="2.3" fill="#5A4636"/>
  <circle cx="54.7" cy="48.4" r="1.05" fill="#1A1A1A"/>
  <circle cx="54" cy="47.4" r="0.65" fill="#F5E9D0"/>
  <path d="M52 46.3 Q55.5 44.2 58.7 46.5" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M52.4 51.8 Q55.4 52.8 58.2 51.8" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Морщинки под глазами -->
  <path d="M38.6 53.6 Q40.6 54.4 42.8 53.9" fill="none" stroke="#E3B48A" stroke-width="1" stroke-linecap="round"/>
  <path d="M53.2 53.9 Q55.4 54.4 57.4 53.6" fill="none" stroke="#E3B48A" stroke-width="1" stroke-linecap="round"/>

  <!-- ══ ОЧКИ (круглые, золотая оправа) ══ -->
  <circle cx="40.5" cy="48" r="5.6" fill="none" stroke="#E0A94A" stroke-width="2.4"/>
  <circle cx="40.5" cy="48" r="5.6" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
  <circle cx="55.5" cy="48" r="5.6" fill="none" stroke="#E0A94A" stroke-width="2.4"/>
  <circle cx="55.5" cy="48" r="5.6" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
  <path d="M46 47.2 Q48 45.9 50 47.2" fill="none" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <path d="M35 47.4 Q31.8 47.2 30 49.2" fill="none" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <path d="M61 47.4 Q64.2 47.2 66 49.2" fill="none" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <!-- Блики стёкол -->
  <path d="M37.2 45.4 Q38.5 44.3 40.3 44.2" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M52.2 45.4 Q53.5 44.3 55.3 44.2" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ НОС (аккуратный, с горбинкой) ══ -->
  <path d="M48 42.8 Q46.9 47.5 46.1 51.2 Q44.9 53.6 46.2 55" fill="none" stroke="#E3B48A" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="45.3" cy="55.8" rx="1" ry="0.7" fill="#E3B48A"/>
  <ellipse cx="50.9" cy="55.5" rx="1" ry="0.7" fill="#E3B48A"/>
  <circle cx="47" cy="54.1" r="0.8" fill="#F5E9D0"/>

  <!-- ══ РОТ (мягкая лекторская полуулыбка) + тень подбородка ══ -->
  <path d="M42.5 60 Q48 63.6 53.5 59.8" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M44.5 62.2 Q48 64.3 51.6 62 Q48.3 63.4 44.5 62.2 Z" fill="#F2C9A0"/>

  <!-- ══ ЭСПАНЬОЛКА (седая) ══ -->
  <path d="M45.8 65.4 Q48 64.6 50.2 65.4 Q50 69.6 48 70.6 Q46 69.6 45.8 65.4 Z"
        fill="#C9A24A" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
