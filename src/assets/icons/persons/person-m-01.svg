<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-01 — нуарный детектив, портрет по плечи.
    Одежда: fill="var(--person-clothing, #8A8A8A)" — без внутренних чёрных деталей.
    Кожа, волосы, глаза, галстук — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <rect x="26" y="10" width="48" height="20" rx="5" fill="#3A2A20"/>
  <rect x="16" y="27" width="68" height="8"  rx="4" fill="#3A2A20"/>
  <circle cx="52" cy="54" r="20" fill="#3A2A20"/>
  <rect x="10" y="78" width="84" height="22" rx="4" fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <!-- Пальто/плечи -->
  <rect x="6" y="74" width="84" height="22" rx="4"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Тулья федоры -->
  <rect x="22" y="6" width="48" height="20" rx="5"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Поля федоры -->
  <rect x="12" y="23" width="68" height="8" rx="4"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ УШИ (кожа, до головы — голова перекрывает изнутри) ══ -->
  <ellipse cx="28" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="68" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ГОЛОВА И ШЕЯ (кожа) ══ -->
  <circle cx="48" cy="50" r="20"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="68" width="12" height="12" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ВОЛОСЫ — ВИСКИ (запечены) ══ -->
  <rect x="22" y="29" width="6" height="18" rx="3" fill="#3A2A20"/>
  <rect x="64" y="29" width="6" height="18" rx="3" fill="#3A2A20"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Лента шляпы -->
  <rect x="22" y="23" width="48" height="3" rx="1" fill="#C8102E"/>
  <!-- Брови -->
  <rect x="37" y="43" width="8" height="2" rx="1" fill="#3A2A20"/>
  <rect x="51" y="43" width="8" height="2" rx="1" fill="#3A2A20"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="48" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="40" cy="47" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="48" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="54" cy="47" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Нос -->
  <path d="M44,53 Q48,58 52,53"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Рот -->
  <path d="M40,62 Q48,67 56,62"
        fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Галстук (виден в воротнике) -->
  <polygon points="45,72 51,72 50,90 46,88"
           fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
