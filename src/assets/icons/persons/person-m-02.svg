<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-02 — инспектор полиции, портрет по плечи.
    Одежда: fill="var(--person-clothing, #8A8A8A)".
    Кожа, усы, значок — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <rect x="22" y="9"  width="60" height="18" rx="8"   fill="#3A2A20"/>
  <rect x="12" y="25" width="76" height="7"  rx="3.5" fill="#3A2A20"/>
  <circle cx="52" cy="54" r="20" fill="#3A2A20"/>
  <rect x="10" y="78" width="84" height="22" rx="4"   fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <rect x="6"  y="74" width="84" height="22" rx="4"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Кепи (полицейская, широкий купол rx=8) -->
  <rect x="18" y="5"  width="60" height="18" rx="8"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Козырёк -->
  <rect x="8"  y="21" width="76" height="7"  rx="3.5"
        fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="28" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="68" cy="50" rx="4" ry="6" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ГОЛОВА И ШЕЯ ══ -->
  <circle cx="48" cy="50" r="20"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="68" width="12" height="12" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Золотая лента кепи -->
  <rect x="18" y="21" width="60" height="4" rx="1" fill="#E0A94A"/>
  <!-- Значок: золотой крест + красный центр -->
  <rect x="46" y="8"  width="4"  height="12" rx="1" fill="#E0A94A"/>
  <rect x="42" y="12" width="12" height="4"  rx="1" fill="#E0A94A"/>
  <circle cx="48" cy="14" r="2.5" fill="#C8102E"/>
  <!-- Брови (прямые, серьёзные) -->
  <rect x="37" y="42" width="8" height="2.5" rx="0.5" fill="#3A2A20"/>
  <rect x="51" y="42" width="8" height="2.5" rx="0.5" fill="#3A2A20"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="47" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="40" cy="46" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="47" rx="4" ry="3" fill="#1A1A1A"/>
  <ellipse cx="54" cy="46" rx="1.2" ry="1" fill="#F5E9D0"/>
  <!-- Нос -->
  <path d="M44,52 Q48,57 52,52"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Усы -->
  <path d="M38,58 Q48,54 58,58 L57,62 Q48,59 39,62 Z" fill="#3A2A20"/>
  <!-- Рот (прямой, строгий) -->
  <path d="M42,65 L54,65"
        fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Форменный галстук (тёмно-синий) -->
  <polygon points="45,72 51,72 50,88 46,86"
           fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
