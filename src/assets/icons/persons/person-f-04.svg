<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-04 — светская дама с беретом / портрет по плечи.
    Берет набок, каре-причёска, жемчужное колье.
    Одежда: fill="var(--person-clothing, #8A8A8A)".
    Кожа, волосы, губы, жемчуг — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <ellipse cx="52" cy="12" rx="24" ry="12" fill="#3A2A20"/>
  <circle  cx="52" cy="48" r="20"          fill="#3A2A20"/>
  <polygon points="14,76 90,76 94,96 10,96" fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <!-- Жакет/плечи -->
  <polygon points="10,72 86,72 90,96 6,96"
           fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"
           stroke-linejoin="round"/>
  <!-- Берет (большой круг, смещён влево) -->
  <ellipse cx="42" cy="10" rx="26" ry="12"
           fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Подкладка берета / манжет -->
  <rect x="22" y="18" width="36" height="6" rx="3"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ГОЛОВА И ШЕЯ ══ -->
  <circle cx="48" cy="46" r="20"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="63" width="12" height="13" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ВОЛОСЫ (каре, запечены) ══ -->
  <!-- Боковые прямые пряди -->
  <rect x="27" y="36" width="6" height="22" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="63" y="36" width="6" height="22" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Низ каре (прямой срез) -->
  <rect x="27" y="54" width="42" height="5" rx="2" fill="#3A2A20"/>
  <!-- Волосы над лбом (под беретом) -->
  <rect x="32" y="24" width="28" height="6" rx="3" fill="#3A2A20"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Брови (изящные дуги) -->
  <path d="M37,37 Q42,33 47,37" fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M49,37 Q54,33 59,37" fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Глаз левый -->
  <ellipse cx="41" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="40" cy="41" rx="1" ry="1" fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="54" cy="41" rx="1" ry="1" fill="#F5E9D0"/>
  <!-- Ресницы -->
  <line x1="38" y1="40" x2="36" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="39" x2="40" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="39" x2="44" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="39" x2="52" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="39" x2="56" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="60" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Нос -->
  <path d="M45,48 Q48,52 51,48"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Губы (красные) -->
  <path d="M41,56 Q48,62 55,56"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43,56 Q48,59 53,56" fill="#C8102E" stroke="none"/>
  <!-- Жемчужное колье (запечено, белые круги) -->
  <circle cx="36" cy="76" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="42" cy="78" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="48" cy="79" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="54" cy="78" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="60" cy="76" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Берет — украшение (золотой pin) -->
  <circle cx="60" cy="8" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.5"/>
</svg>
