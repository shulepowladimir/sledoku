<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-03 — роковая женщина, портрет по плечи. Берет набекрень, асимметричные волосы.
    Одежда: fill="var(--person-clothing, #8A8A8A)".
    Кожа, волосы, смоки, помада — запечены.
  -->

  <!-- ══ ТЕНИ (+4, +4) ══ -->
  <ellipse cx="62" cy="18" rx="24" ry="10" fill="#3A2A20"/>
  <circle  cx="52" cy="48" r="19"          fill="#3A2A20"/>
  <polygon points="14,76 90,76 94,96 10,96" fill="#3A2A20"/>

  <!-- ══ ОДЕЖДА ══ -->
  <polygon points="10,72 86,72 90,96 6,96"
           fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="2.5"
           stroke-linejoin="round"/>
  <!-- Берет (смещён вправо) -->
  <ellipse cx="58" cy="14" rx="24" ry="10"
           fill="var(--person-clothing,#8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>

  <!-- ══ ГОЛОВА И ШЕЯ ══ -->
  <circle cx="48" cy="44" r="19"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="42" y="61" width="12" height="14" rx="3"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- ══ ВОЛОСЫ (запечены, асимметрия) ══ -->
  <!-- Длинные справа (водопад) -->
  <ellipse cx="68" cy="52" rx="6" ry="22"
           fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Короткие слева -->
  <ellipse cx="29" cy="44" rx="4" ry="12"
           fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Пуговица берета -->
  <circle cx="60" cy="6" r="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- ══ ЛИЦО (запечено) ══ -->
  <!-- Смоки: тёмные тени под глазами -->
  <ellipse cx="41" cy="42" rx="7" ry="4" fill="#3A2A20"/>
  <ellipse cx="55" cy="42" rx="7" ry="4" fill="#3A2A20"/>
  <!-- Брови (высокие, драматичные) -->
  <path d="M36,36 Q42,31 47,36" fill="none" stroke="#3A2A20" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M49,36 Q54,31 60,36" fill="none" stroke="#3A2A20" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Глаз левый (поверх теней) -->
  <ellipse cx="41" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="40" cy="41" rx="1"    ry="1"   fill="#F5E9D0"/>
  <!-- Глаз правый -->
  <ellipse cx="55" cy="42" rx="3.5" ry="2.8" fill="#1A1A1A"/>
  <ellipse cx="54" cy="41" rx="1"    ry="1"   fill="#F5E9D0"/>
  <!-- Длинные ресницы -->
  <line x1="38" y1="40" x2="35" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="39" x2="39" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="39" x2="43" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="39" x2="52" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="39" x2="57" y2="36" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="40" x2="61" y2="37" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Нос -->
  <path d="M45,48 Q48,52 51,48"
        fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Яркие красные губы (полные) -->
  <path d="M40,56 Q48,63 56,56"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42,56 Q48,60 54,56" fill="#C8102E" stroke="none"/>
  <!-- Кремовый воротник (акцентный аксессуар) -->
  <rect x="43" y="71" width="10" height="5" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
</svg>
