<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    medieval — «Заговор в замке»: каменная башня с зубцами,
    коническая крыша, красный флаг. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="18" y="78" width="62" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Башня -->
  <path d="M28 78 V30 H68 V78 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Правая грань (объём) -->
  <path d="M58 30 H68 V78 H58 Z" fill="#5C6670"/>
  <!-- Камни-кладка -->
  <g stroke="#5C6670" stroke-width="1.6" stroke-linecap="round">
    <path d="M31 40 H44 M52 40 H65"/>
    <path d="M36 50 H50 M58 50 H65"/>
    <path d="M31 60 H40 M48 60 H62"/>
    <path d="M34 70 H50 M56 70 H65"/>
  </g>
  <!-- Зубцы -->
  <path d="M26 30 V22 H34 V30 H40 V22 H48 V30 H48 V22 H56 V30 H62 V22 H70 V30 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Крыша-конус (бирюза) -->
  <path d="M24 22 L48 4 L72 22 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 18 Q40 13 48 12" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Флаг (красный акцент) — вымпел от острия -->
  <path d="M49 6 L68 10 L49 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Воротная арка -->
  <path d="M40 78 V64 Q48 56 56 64 V78 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 78 V66 Q48 62.5 52 66 V78 Z" fill="#3A2A20"/>
  <!-- Окошко-щель -->
  <rect x="34" y="44" width="5" height="9" rx="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8"/>
</svg>
