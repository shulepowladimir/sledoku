<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    street — «Тёмные дворы»: ночной переулок, одинокий уличный фонарь
    с тёплым светом, силуэты кирпичных домов, мокрая брусчатка.
  -->
  <!-- Ночная подложка -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#1F3A5F"/>

  <!-- Луна -->
  <circle cx="72" cy="20" r="7" fill="#F5E9D0"/>
  <circle cx="68.5" cy="18" r="1.2" fill="#D5DCE1"/>
  <circle cx="74" cy="22.5" r="0.9" fill="#D5DCE1"/>

  <!-- Дальний дом (слева, темнее) -->
  <rect x="6" y="30" width="30" height="46" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M6 30 L21 22 L36 30 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Тёплые окна -->
  <rect x="12" y="38" width="6" height="8" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="24" y="38" width="6" height="8" rx="1" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="12" y="54" width="6" height="8" rx="1" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="24" y="54" width="6" height="8" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Ближний дом (справа, кирпичный) -->
  <rect x="56" y="24" width="34" height="52" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M56 24 L73 16 L90 24 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Кирпичная фактура -->
  <g stroke="#8F5A3A" stroke-width="1.2">
    <path d="M58 34 L88 34 M58 44 L88 44 M58 54 L88 54 M58 64 L88 64"/>
    <path d="M66 28 L66 34 M80 28 L80 34 M60 39 L60 44 M74 39 L74 44 M88 39 L88 44 M66 49 L66 54 M80 49 L80 54 M60 59 L60 64 M74 59 L74 64 M88 59 L88 64"/>
  </g>
  <!-- Окна ближнего дома -->
  <rect x="63" y="38" width="7" height="9" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="77" y="38" width="7" height="9" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="63" y="56" width="7" height="9" rx="1" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="77" y="56" width="7" height="9" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Фонарь (центральный образ) -->
  <rect x="41" y="30" width="4" height="46" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M43 30 Q43 20 48 18 L52 20 Q54 21 54 24 L54 28 L32 28 L32 24 Q32 21 34 20 L38 18 Q43 20 43 30 Z"
        fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Плафон со светом -->
  <path d="M34 28 L52 28 L50 36 L36 36 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Конус света -->
  <path d="M36 36 L34 52 L52 52 L50 36 Z" fill="#E8B95F"/>
  <path d="M39.5 36 L38 50 M46.5 36 L48 50" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Основание фонаря -->
  <rect x="37" y="72" width="12" height="4" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Брусчатка (намёк) -->
  <g fill="#5C6670">
    <rect x="10" y="78" width="14" height="6" rx="1.5"/>
    <rect x="26" y="78" width="14" height="6" rx="1.5"/>
    <rect x="42" y="78" width="14" height="6" rx="1.5"/>
    <rect x="58" y="78" width="14" height="6" rx="1.5"/>
    <rect x="74" y="78" width="12" height="6" rx="1.5"/>
  </g>
  <path d="M8 81 L88 81" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
