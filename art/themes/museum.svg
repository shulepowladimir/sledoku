<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    museum — «Ночное дежурство в музее»: классический фасад —
    фронтон, колонны, ступени. Красный баннер (акцент).
  -->

  <!-- Тень-подложка -->
  <rect x="12" y="78" width="72" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Задняя стена -->
  <rect x="20" y="30" width="56" height="48" rx="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Колонны (4) -->
  <g>
    <rect x="24" y="32" width="8" height="44" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="40" y="32" width="8" height="44" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="56" y="32" width="8" height="44" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Капители -->
    <rect x="22.5" y="30" width="11" height="4" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="38.5" y="30" width="11" height="4" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="54.5" y="30" width="11" height="4" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  </g>

  <!-- Антаблемент -->
  <rect x="16" y="22" width="64" height="9" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Фронтон -->
  <path d="M10 22 L48 6 L86 22 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M18 20 Q32 13 46 11.5" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Красный баннер между колонн (акцент) -->
  <path d="M53 32 H63 V50 Q58 54 53 50 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Ступени -->
  <rect x="14" y="76" width="68" height="5" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="18" y="70" width="60" height="5" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2"/>
</svg>
