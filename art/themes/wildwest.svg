<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wildwest — «Ограбление банка»: мешок денег с красной маской
    грабителя и высыпающимися монетами. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <ellipse cx="50" cy="80" rx="30" ry="7" fill="#3A2A20"/>

  <!-- Монеты (за мешком, высыпаются) -->
  <g>
    <circle cx="72" cy="70" r="7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
    <circle cx="82" cy="62" r="5.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="70" cy="56" r="4.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M72 70 Q74 70.5 74.5 72" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Мешок -->
  <path d="M36 30 Q30 34 27 46 Q24 58 30 68 Q36 77 48 77 Q60 77 66 68 Q72 58 69 46 Q66 34 60 30 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Правая тень мешка -->
  <path d="M60 30 Q66 34 69 46 Q72 58 66 68 Q60 77 48 77 L48 30 Z" fill="#E8B95F"/>

  <!-- Горловина с завязкой -->
  <path d="M40 30 Q44 24 48 24 Q52 24 56 30 L56 34 Q48 38 40 34 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M38 33 Q48 39 58 33" fill="none" stroke="#8F5A3A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M40 36 Q36 41 38 45 M56 36 Q60 41 58 45" fill="none" stroke="#8F5A3A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Маска грабителя (красный акцент) -->
  <path d="M33 49 Q48 42 63 49 L61 58 Q54 54 48 56 Q42 54 35 58 Z"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="42" cy="51.5" r="3.4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="54" cy="51.5" r="3.4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="42.6" cy="51.5" r="1.2" fill="#1A1A1A"/>
  <circle cx="54.6" cy="51.5" r="1.2" fill="#1A1A1A"/>

  <!-- Шов мешка -->
  <path d="M34 64 Q48 60 62 64" fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>
</svg>
