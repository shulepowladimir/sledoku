<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    shop — «Ночь в универмаге»: витрина с тёплым светом и полосатой
    красной маркизой (акцент). Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="14" y="78" width="68" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Фасад -->
  <rect x="18" y="32" width="60" height="48" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань -->
  <path d="M72 32 H78 V80 H72 Z" fill="#E8B95F"/>

  <!-- Верхняя кромка фасада -->
  <rect x="14" y="28" width="68" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Маркиза (полосатая, красный акцент) -->
  <path d="M14 36 L10 50 H86 L82 36 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#F5E9D0" stroke="none">
    <path d="M24.5 36 L21 50 H31 L33 36 Z"/>
    <path d="M44.5 36 L43 50 H53 L54.5 36 Z"/>
    <path d="M64.5 36 L65 50 H75 L71 36 Z"/>
  </g>
  <path d="M10 50 H86" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Скальпы-фестоны маркизы -->
  <path d="M12 50 Q17 54 22 50 M32 50 Q37 54 42 50 M52 50 Q57 54 62 50 M72 50 Q77 54 82 50"
        fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Витрина с тёплым светом -->
  <rect x="24" y="54" width="48" height="20" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Силуэт манекена в витрине -->
  <circle cx="44" cy="61" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M44 64 Q41 67 41.5 71 H46.5 Q47 67 44 64 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Товар-подарок на витрине -->
  <rect x="56" y="64" width="10" height="8" rx="1.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M61 64 V72 M56 68 H66" stroke="#F5E9D0" stroke-width="1.6"/>
</svg>
