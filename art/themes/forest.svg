<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    forest — «Пропажа в лесу»: две ели, гриб с красной шляпкой
    (живая деталь). Ярусы с тенями, свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <ellipse cx="46" cy="80" rx="36" ry="8" fill="#3A2A20"/>

  <!-- Малая ель (за большой, темнее) -->
  <g>
    <rect x="64" y="66" width="6" height="14" rx="3" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M67 18 L79 40 L73 40 L82 54 L74 54 L83 68 L51 68 L60 54 L52 54 L61 40 L55 40 Z"
          fill="#44663A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Большая ель -->
  <g>
    <rect x="27" y="70" width="8" height="15" rx="3.5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M31 8 L47 36 L39 36 L51 54 L41 54 L54 72 L8 72 L21 54 L11 54 L23 36 L15 36 Z"
          fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Ярусы-тени (правая сторона) -->
    <path d="M31 8 L47 36 L39 36 Z" fill="#44663A" stroke="none"/>
    <path d="M39 36 L51 54 L41 54 Z" fill="#44663A" stroke="none"/>
    <path d="M41 54 L54 72 L31 72 L31 54 Z" fill="#44663A" stroke="none"/>
    <!-- Блики на левых ярусах -->
    <path d="M22 40 L31 26 L28 40 Z" fill="#7FA85B" stroke="none"/>
    <path d="M20 58 L31 44 L26 58 Z" fill="#7FA85B" stroke="none"/>
  </g>

  <!-- Гриб (красная шляпка — акцент) -->
  <g>
    <rect x="50" y="72" width="4.5" height="9" rx="2.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M43 74 Q43 64 52.2 64 Q61.5 64 61.5 74 Q52 77 43 74 Z"
          fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="48" cy="70" r="1.4" fill="#F5E9D0"/>
    <circle cx="55" cy="69" r="1.6" fill="#F5E9D0"/>
  </g>
</svg>
