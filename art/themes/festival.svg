<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    festival — «Песни и крик»: музыкальный фестиваль под открытым небом.
    Сцена-подиум с гирляндой флажков (красный/крем/бирюза), стойка с микрофоном
    в центре, колонка справа; травяная поляна внизу и тёплое пятно света
    прожектора. Живая деталь — сорванный флажок на траве.
  -->
  <!-- Небо (тёплое вечернее) -->
  <rect x="6" y="6" width="84" height="84" rx="8" fill="#F5E9D0"/>
  <rect x="6" y="6" width="84" height="30" rx="8" fill="#E8B95F"/>

  <!-- Пятно света прожектора на траве -->
  <ellipse cx="44" cy="76" rx="26" ry="7" fill="#EDE7DB"/>

  <!-- Трава-поляна (нижняя треть) -->
  <path d="M6 70 Q24 64 48 68 Q72 72 90 66 L90 82 Q90 90 82 90 L14 90 Q6 90 6 82 Z" fill="#5E8A46"/>
  <path d="M10 78 Q30 74 52 77 Q74 80 88 76" fill="none" stroke="#7FA85B" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Травинки -->
  <path d="M20 84 Q21 80 19 78 M76 83 Q75 79 77 77" fill="none" stroke="#44663A" stroke-width="2" stroke-linecap="round"/>

  <!-- Гирлянда флажков (через верх кадра, провис) -->
  <path d="M8 14 Q48 30 88 14" fill="none" stroke="#3A2A20" stroke-width="2.4"/>
  <path d="M18 18.5 L24 30 L13 27 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M35 23.5 L40 34 L30 31 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M52 25 L56 35 L46 32 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M68 22 L73 32 L63 30 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Подиум сцены -->
  <rect x="14" y="58" width="68" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M18 62.5 L78 62.5" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 68 L78 68" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Стойка с микрофоном (центр сцены) -->
  <rect x="44" y="30" width="3.4" height="28" rx="1.7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <ellipse cx="45.7" cy="58" rx="6" ry="2.4" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M45.7 30 Q45.7 25 40 24" fill="none" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="31" y="16" width="9" height="14" rx="4.4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"
        transform="rotate(12 35.5 23)"/>
  <circle cx="33.5" cy="19.5" r="1.1" fill="#C8102E"/>

  <!-- Колонка справа на сцене -->
  <rect x="62" y="34" width="16" height="24" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="64.5" y="37" width="11" height="18" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="70" cy="48.5" r="4" fill="#1A1A1A" stroke="#9BA5AD" stroke-width="1.4"/>
  <circle cx="70" cy="48.5" r="1.5" fill="#9BA5AD"/>

  <!-- Гитара слева на сцене (гриф к небу) -->
  <g transform="rotate(18 26 48)">
    <rect x="23.5" y="22" width="5" height="20" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M26 42 C 32 42 34 46 34 50 C 34 51.6 33 53 32 54 C 34 55.6 35 58 35 60 C 35 65 31 68 26 68 C 21 68 17 65 17 60 C 17 58 18 55.6 20 54 C 19 53 18 51.6 18 50 C 18 46 20 42 26 42 Z"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="26" cy="55" r="2.6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2"/>
  </g>

  <!-- Сорванный флажок на траве (живая деталь) -->
  <path d="M56 82 L64 82 L60 87 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
