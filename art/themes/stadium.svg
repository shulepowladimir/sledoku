<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stadium — «Финальный свисток»: стадион сверху — чаша с трибунами
    (бирюза, один красный сектор) вокруг зелёного поля с разметкой.
  -->

  <!-- Тень-подложка (чаша парит над землёй) -->
  <ellipse cx="51" cy="51" rx="37" ry="27" fill="#3A2A20"/>

  <!-- Чаша стадиона (внешний контур) -->
  <ellipse cx="48" cy="48" rx="37" ry="27" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Трибуны (бирюза) -->
  <ellipse cx="48" cy="48" rx="31" ry="21" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Ряды трибун (дуги) -->
  <path d="M21 48 A27 17 0 0 1 75 48 M25 48 A23 13 0 0 0 71 48"
        fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Красный сектор (акцент) -->
  <path d="M26 34 A31 21 0 0 0 26 62" fill="none" stroke="#C8102E" stroke-width="7" stroke-linecap="round"/>

  <!-- Поле -->
  <ellipse cx="48" cy="48" rx="25" ry="16" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Разметка -->
  <g stroke="#F5E9D0" stroke-width="2" fill="none">
    <path d="M48 33 V63"/>
    <ellipse cx="48" cy="48" rx="6.5" ry="4.5"/>
  </g>
  <circle cx="48" cy="48" r="1.3" fill="#F5E9D0"/>
  <!-- Ворота -->
  <rect x="21.5" y="43.5" width="3.5" height="9" rx="1.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="71" y="43.5" width="3.5" height="9" rx="1.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
