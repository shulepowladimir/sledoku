<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fightclub — «Восьмой раунд»: тёмный подвал, круг света от прожектора,
    в нём — красная боксёрская перчатка. Рендер 40-64px, крупно, без мелочи.
  -->
  <!-- Тёмный фон подвала (асфальтовая тьма) -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#453E3B"/>
  <!-- Шум бетона -->
  <circle cx="16" cy="20" r="2.4" fill="#574D4A"/>
  <circle cx="82" cy="30" r="2" fill="#574D4A"/>
  <circle cx="24" cy="82" r="2.2" fill="#574D4A"/>
  <circle cx="76" cy="80" r="1.8" fill="#574D4A"/>

  <!-- Круг света от прожектора (конус сверху) -->
  <path d="M40 6 L56 6 L74 52 Q48 64 22 52 Z" fill="#786862"/>
  <path d="M44 6 L52 6 L66 50 Q48 59 30 50 Z" fill="#9C8A76"/>
  <!-- Световое пятно на полу -->
  <ellipse cx="48" cy="56" rx="26" ry="10" fill="#DFD6C6"/>
  <ellipse cx="48" cy="56" rx="17" ry="6.5" fill="#F5E9D0"/>

  <!-- Тень перчатки -->
  <ellipse cx="50" cy="72" rx="24" ry="7" fill="#3A2A20"/>

  <!-- Боксёрская перчатка (красная, кулак) -->
  <g>
    <!-- Кулак (основная варежка) -->
    <path d="M30 40
             Q30 30 40 28
             L58 28
             Q66 30 66 38
             Q72 44 68 52
             Q70 62 60 64
             L38 64
             Q28 62 29 52
             Q26 46 30 40 Z"
          fill="#C8102E" stroke="#1A1A1A" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- Большой палец -->
    <path d="M30 44 Q22 44 22 52 Q22 60 32 60 L36 58 Q30 54 31 47 Z"
          fill="#A50D26" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Сгиб кулака -->
    <path d="M36 36 Q48 42 60 36" stroke="#7A0E1D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M35 48 Q48 53 61 48" stroke="#7A0E1D" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- Блики (свет прожектора) -->
    <path d="M38 32 Q46 30 54 32" stroke="#F5E9D0" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="42" r="2.4" fill="#F5E9D0"/>
    <!-- Манжет-ремень -->
    <rect x="34" y="62" width="32" height="10" rx="3" fill="#7A0E1D" stroke="#1A1A1A" stroke-width="2.8"/>
    <path d="M40 65 V69 M48 65 V69 M56 65 V69" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Шнуровка манжета -->
    <circle cx="67" cy="67" r="2.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  </g>
</svg>
