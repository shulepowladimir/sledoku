<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hotel — «Последний постоялец»: звонок на стойке ресепшена,
    звук-дуги, красный флажок «мест нет». Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="16" y="74" width="64" height="10" rx="5" fill="#3A2A20"/>

  <!-- Стойка -->
  <rect x="16" y="58" width="64" height="18" rx="3" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="16" y="58" width="64" height="5" rx="2.5" fill="#B87F33"/>
  <path d="M22 66 Q48 62 74 66" fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Звонок: купол -->
  <path d="M38 44 Q38 26 48 26 Q58 26 58 44 L60 48 Q48 52 36 48 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение правой стороны купола -->
  <path d="M48 26 Q58 26 58 44 L60 48 Q54 50 48 50.5 Z" fill="#B87F33" stroke="none"/>
  <!-- Пояс основания -->
  <rect x="34" y="47" width="28" height="6" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Кнопка -->
  <rect x="46" y="18" width="4" height="9" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="16.5" r="3.2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Блик на куполе -->
  <path d="M42 34 Q43 30 46.5 28.5" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Звук-дуги -->
  <path d="M58 22 Q62 16 60 10" fill="none" stroke="#9BA5AD" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M64 26 Q70 18 67 9" fill="none" stroke="#9BA5AD" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Флажок «мест нет» (красный акцент) -->
  <g>
    <rect x="20" y="34" width="2.6" height="18" fill="#1A1A1A"/>
    <path d="M22.6 34 L36 37 L22.6 41 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>
