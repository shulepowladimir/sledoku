<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    prison — «Пожизненный срок»: зарешечённое арочное окно в каменной
    стене. Решётка — сталь, стекло — вода/стекло пара. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="12" y="76" width="72" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Стена -->
  <rect x="14" y="14" width="68" height="64" rx="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Кладка стены -->
  <g stroke="#5C6670" stroke-width="1.8" stroke-linecap="round">
    <path d="M18 26 H34 M42 26 H58 M66 26 H78"/>
    <path d="M24 38 H40 M48 38 H64 M70 38 H78"/>
    <path d="M18 50 H30 M38 50 H54 M62 50 H78"/>
    <path d="M24 62 H40 M48 62 H64 M70 62 H78"/>
    <path d="M18 72 H34 M42 72 H58 M66 72 H78"/>
  </g>

  <!-- Арочное окно -->
  <path d="M34 68 V42 Q34 26 48 26 Q62 26 62 42 V68 Z"
        fill="#4A7BA6" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на стекле -->
  <path d="M39 60 L52 34" stroke="#9CC3E0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 62 L57 40" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>

  <!-- Решётка -->
  <g stroke="#5C6670" stroke-width="3.5" stroke-linecap="round">
    <path d="M40 68 V36"/>
    <path d="M48 68 V29"/>
    <path d="M56 68 V36"/>
    <path d="M35 44 H61"/>
    <path d="M35 56 H61"/>
  </g>
  <!-- Контур решётки -->
  <g fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round">
    <path d="M40 68 V36 M48 68 V29 M56 68 V36 M35 44 H61 M35 56 H61"/>
  </g>

  <!-- Подоконник -->
  <rect x="30" y="67" width="36" height="5" rx="2.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.5"/>
</svg>
