<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    zoo — «Клетка хищника»: арочная клетка со львом за прутьями,
    красная кормушка. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="18" y="78" width="62" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Задняя стенка клетки (тёмная) -->
  <path d="M26 78 V40 Q26 22 48 22 Q70 22 70 40 V78 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Лев за решёткой -->
  <g>
    <!-- Грива -->
    <circle cx="48" cy="50" r="15" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Уши -->
    <circle cx="37" cy="40" r="4" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="59" cy="40" r="4" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Морда -->
    <circle cx="48" cy="52" r="10" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5"/>
    <!-- Глаза -->
    <circle cx="44" cy="49" r="1.8" fill="#1A1A1A"/>
    <circle cx="52" cy="49" r="1.8" fill="#1A1A1A"/>
    <!-- Нос и рот -->
    <path d="M46.5 55 H49.5 L48 57.5 Z" fill="#1A1A1A"/>
    <path d="M48 57.5 V59 M48 59 Q45.5 61 43.5 59.5 M48 59 Q50.5 61 52.5 59.5" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Кормушка (красный акцент) -->
  <path d="M38 74 H58 L55 70 H41 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Прутья -->
  <g stroke="#9BA5AD" stroke-width="4" stroke-linecap="round">
    <path d="M34 76 V36"/>
    <path d="M41 76 V26"/>
    <path d="M48 76 V23"/>
    <path d="M55 76 V26"/>
    <path d="M62 76 V36"/>
  </g>
  <g fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round">
    <path d="M34 76 V36 M41 76 V26 M48 76 V23 M55 76 V26 M62 76 V36"/>
  </g>

  <!-- Каркас клетки поверх -->
  <path d="M26 78 V40 Q26 22 48 22 Q70 22 70 40 V78" fill="none" stroke="#9BA5AD" stroke-width="6"/>
  <path d="M26 78 V40 Q26 22 48 22 Q70 22 70 40 V78" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Пол клетки -->
  <rect x="22" y="76" width="52" height="6" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.5"/>
</svg>
