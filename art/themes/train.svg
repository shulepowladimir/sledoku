<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    train — «Последний рейс»: паровоз в профиль, клубы пара,
    красная кабина (акцент). Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="14" y="72" width="70" height="10" rx="5" fill="#3A2A20"/>

  <!-- Паровозы пара -->
  <circle cx="30" cy="18" r="6.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="42" cy="12" r="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="52" cy="19" r="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Котёл -->
  <rect x="22" y="38" width="38" height="20" rx="6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Тень котла снизу -->
  <path d="M24 52 H58 V52.5 Q40 56 24 52.5 Z" fill="#5C6670"/>
  <!-- Блики и заклёпки -->
  <path d="M26 43 Q40 41 54 43" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="48" r="1.3" fill="#5C6670"/>
  <circle cx="44" cy="48" r="1.3" fill="#5C6670"/>
  <circle cx="38" cy="48" r="1.3" fill="#5C6670"/>

  <!-- Труба -->
  <rect x="27" y="22" width="10" height="17" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="25.5" y="20" width="13" height="4.5" rx="2" fill="#1A1A1A"/>

  <!-- Кабина (красный акцент) -->
  <rect x="58" y="28" width="20" height="30" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="62" y="33" width="12" height="11" rx="2" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="56" y="25" width="24" height="5" rx="2.5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Буфер + искрогаситель -->
  <rect x="18" y="44" width="6" height="8" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Колёса -->
  <g>
    <circle cx="34" cy="64" r="9" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="34" cy="64" r="3.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="54" cy="66" r="7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="54" cy="66" r="2.8" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="70" cy="66" r="7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="70" cy="66" r="2.8" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  </g>

  <!-- Рельсы -->
  <rect x="12" y="74" width="72" height="4" rx="2" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>
</svg>
