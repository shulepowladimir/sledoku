<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    parking — «Пойман на парковке»: многоэтажный паркинг. Шлагбаум с красно-
    кремовой полосой, знак «P» на столбе (синий квадрат с кремовой буквой-формой),
    асфальт с дорожной разметкой и следом шины (живая деталь).
  -->
  <!-- Асфальт (тёплая ночь, нижняя треть) -->
  <rect x="6" y="58" width="84" height="32" rx="6" fill="#939CA2"/>
  <rect x="6" y="58" width="84" height="6" rx="3" fill="#7D878E"/>
  <!-- Дорожная разметка -->
  <path d="M14 78 L28 78 M40 78 L54 78 M66 78 L80 78" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <!-- След шины (живая деталь) -->
  <path d="M30 86 Q40 83 50 86" fill="none" stroke="#545D65" stroke-width="3" stroke-linecap="round"/>

  <!-- Столб шлагбаума -->
  <rect x="16" y="30" width="6" height="36" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M18 34 L18 62" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Стрелка шлагбаума (в поднятом положении, тёмная штанга с красно-кремовыми полосами) -->
  <g transform="rotate(-32 19 33)">
    <rect x="19" y="29.5" width="62" height="7" rx="3.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M26 31 L33 31 M26 35 L33 35" stroke="#C8102E" stroke-width="3.4"/>
    <path d="M40 31 L47 31 M40 35 L47 35" stroke="#F5E9D0" stroke-width="3.4"/>
    <path d="M54 31 L61 31 M54 35 L61 35" stroke="#C8102E" stroke-width="3.4"/>
    <path d="M68 31 L75 31 M68 35 L75 35" stroke="#F5E9D0" stroke-width="3.4"/>
  </g>

  <!-- Знак «P»: столб + синий квадрат -->
  <rect x="68" y="38" width="6" height="52" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M70 44 L70 84" stroke="#9BA5AD" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="57" y="8" width="32" height="32" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="60.5" y="11.5" width="25" height="25" rx="3" fill="none" stroke="#F5E9D0" stroke-width="2"/>
  <!-- Буква P как форма (стойка + чаша) -->
  <path d="M66 33 L66 15 L74 15 Q80 15 80 21.5 Q80 28 74 28 L71.5 28 L71.5 33 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M71.5 19.5 L73.5 19.5 Q75.5 19.5 75.5 21.5 Q75.5 23.5 73.5 23.5 L71.5 23.5 Z" fill="#1F3A5F"/>

  <!-- Свет фары на асфальте (тёплое пятно) -->
  <ellipse cx="36" cy="70" rx="14" ry="4" fill="#CFC3AF"/>
</svg>
