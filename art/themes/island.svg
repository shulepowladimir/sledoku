<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    island — «Тайна необитаемого острова»: палма на дюне, волна
    с пеной (вода-канон #4A7BA6 + #9CC3E0). Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <path d="M14 72 Q48 62 82 72 Q48 80 14 72 Z" fill="#3A2A20"/>

  <!-- Волна -->
  <path d="M6 76 Q16 70 26 76 T46 76 T66 76 T86 76 L86 84 L6 84 Z"
        fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Пена на гребнях -->
  <path d="M6 76 Q11 73.5 16 76 Q21 78.5 26 76" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 76 Q51 73.5 56 76" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <path d="M66 76 Q71 73.5 76 76" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>

  <!-- Дюна -->
  <path d="M18 78 Q34 62 58 68 Q76 72 84 78 Q50 84 18 78 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M24 75 Q36 67 52 70" fill="none" stroke="#B85F2E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ствол пальмы (изогнутый, сегментами) -->
  <path d="M42 76 Q40 58 52 44" fill="none" stroke="#8F5A3A" stroke-width="7" stroke-linecap="round"/>
  <path d="M42 76 Q40 58 52 44" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <g stroke="#1A1A1A" stroke-width="1.6">
    <path d="M42.5 66 L47 64.5"/>
    <path d="M44 56 L48.5 54.5"/>
    <path d="M47 48 L51.5 46.5"/>
  </g>

  <!-- Листья (5 дуг) -->
  <g fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round">
    <path d="M52 44 Q34 36 24 42 Q36 48 52 46 Z"/>
    <path d="M52 44 Q64 32 76 34 Q68 44 54 47 Z"/>
    <path d="M52 44 Q52 30 62 24 Q66 34 56 46 Z"/>
    <path d="M52 44 Q38 44 32 52 Q44 54 53 48 Z"/>
  </g>
  <path d="M52 44 Q66 42 74 50 Q64 54 54 49 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Кокосы -->
  <circle cx="49" cy="47" r="3.4" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="56" cy="48.5" r="3.4" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>
</svg>
