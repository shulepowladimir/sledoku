<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bania — «Лёгкий пар»: сруб из горизонтальных брёвен, тёплое окошко,
    клубы пара, прислонённый веник и шайка с ковшом. Рендер 40-64px.
  -->
  <!-- Фон-сруб: тёмное дерево -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#5A4636"/>
  <!-- Горизонтальные брёвна -->
  <g fill="#7A4A2A">
    <rect x="6" y="10" width="84" height="12" rx="6"/>
    <rect x="6" y="28" width="84" height="12" rx="6"/>
    <rect x="6" y="46" width="84" height="12" rx="6"/>
    <rect x="6" y="64" width="84" height="12" rx="6"/>
  </g>
  <!-- Торцы брёвен (колечки) -->
  <g stroke="#3A2A20" stroke-width="1.6" fill="none">
    <circle cx="16" cy="16" r="4.5"/><circle cx="80" cy="16" r="4.5"/>
    <circle cx="16" cy="52" r="4.5"/><circle cx="80" cy="52" r="4.5"/>
    <circle cx="16" cy="70" r="4.5"/><circle cx="80" cy="70" r="4.5"/>
  </g>

  <!-- Тёплое окошко со светом -->
  <rect x="34" y="16" width="28" height="22" rx="4" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.8"/>
  <rect x="37.5" y="19.5" width="21" height="15" rx="2.5" fill="#F5E9D0"/>
  <path d="M48 19.5 V34.5 M37.5 27 H58.5" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Конус тёплого света из окна -->
  <path d="M37 38 L59 38 L68 58 L28 58 Z" fill="#E0A94A"/>

  <!-- Тень переднего плана -->
  <ellipse cx="48" cy="80" rx="34" ry="6" fill="#3A2A20"/>

  <!-- Шайка с водой (передний план слева) -->
  <g transform="translate(4,14) scale(0.62)">
    <path d="M12 42 Q12 78 48 78 Q84 78 84 42 L84 40 Q84 34 48 34 Q12 34 12 40 Z"
          fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M60 35.5 Q84 37 84 40 L84 42 Q84 78 48 78 Q62 74 70 62 Z" fill="#B87F33"/>
    <path d="M12 40 Q12 34 48 34 Q84 34 84 40 Q84 46 48 46 Q12 46 12 40 Z"
          fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <ellipse cx="48" cy="40" rx="30" ry="7.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M28 39 Q34 36.5 42 38" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Веник, прислонённый справа -->
  <g transform="translate(56,26) scale(0.55) rotate(14)">
    <path d="M43 88 Q42 76 44 62 L52 62 Q54 76 53 88 Q48 91 43 88 Z"
          fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M44 62 Q28 60 22 48 Q17 37 26 30 Q34 24 42 30 Q46 34 45 40 L46 62 Z"
          fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M52 62 Q68 60 74 48 Q79 37 70 30 Q62 24 54 30 Q50 34 51 40 L50 62 Z"
          fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M46 60 Q43 42 48 26 Q49 18 54 22 Q58 28 56 40 Q54 52 53 60 Z"
          fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  </g>

  <!-- Клубы пара -->
  <path d="M22 12 Q18 6 23 2" fill="none" stroke="#DFD6C6" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M30 10 Q34 4 29 0" fill="none" stroke="#DFD6C6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M74 12 Q70 7 75 3" fill="none" stroke="#DFD6C6" stroke-width="2.4" stroke-linecap="round"/>
</svg>
