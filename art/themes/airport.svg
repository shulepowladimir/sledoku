<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    airport — «Задержка рейса»: самолёт, взлетающий по диагонали,
    красный хвост-акцент, курсовая дуга и облако. Без тени — летит.
  -->

  <!-- Курсовая дуга -->
  <path d="M10 84 Q30 78 42 62" fill="none" stroke="#9BA5AD" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Самолёт (диагональ вверх-вправо) -->
  <g transform="rotate(-42 48 46)">
    <!-- Хвост (красный акцент) -->
    <path d="M14 42 L8 32 Q7 30 9.5 30 L16 32 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Фюзеляж -->
    <path d="M8 44 Q6 40 12 39 L58 36 Q66 36.5 68 41 Q66 45 58 45 L12 46 Q9 46 8 44 Z"
          fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Нос-блик -->
    <path d="M62 39.5 Q65 40.5 65.5 41 Q65 42.5 62 43" fill="#E8B95F" stroke="none"/>
    <!-- Крыло (бирюза) -->
    <path d="M34 40 L22 26 Q20.5 24 24 24 L40 37 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Окна-иллюминаторы -->
    <circle cx="52" cy="40.7" r="1.7" fill="#4A7BA6"/>
    <circle cx="46" cy="40.8" r="1.7" fill="#4A7BA6"/>
    <circle cx="40" cy="41" r="1.7" fill="#4A7BA6"/>
  </g>

  <!-- Облако -->
  <path d="M22 74 Q22 66 30 66 Q32 60 39 61.5 Q46 62 46.5 68 Q52 68 51.5 73 Q51 77 45 77 L27 77 Q22 77 22 74 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
