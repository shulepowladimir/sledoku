<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    mall — «Закрытие торгового центра»: фасад с большой витриной
    и сумкой-вывеской. Витрина — вода/стекло пара. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="14" y="78" width="68" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Фасад -->
  <rect x="18" y="34" width="60" height="46" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань -->
  <path d="M72 34 H78 V80 H72 Z" fill="#E8B95F"/>

  <!-- Крыша-полоса -->
  <rect x="14" y="28" width="68" height="10" rx="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="18" y="30.5" width="60" height="2.5" rx="1.2" fill="#F5E9D0"/>

  <!-- Сумка-вывеска (красный акцент) -->
  <g>
    <path d="M38 16 H58 L61 26 H35 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M42 16 Q43 9 48 9 Q53 9 54 16" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M37 21 H59" stroke="#F5E9D0" stroke-width="1.6"/>
  </g>

  <!-- Большая витрина -->
  <rect x="24" y="44" width="34" height="26" rx="2.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Блик на стекле -->
  <path d="M28 64 L44 48 M36 64 L52 48" stroke="#9CC3E0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Дверь -->
  <rect x="62" y="50" width="12" height="20" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="72" cy="60" r="1.4" fill="#F5E9D0"/>
</svg>
