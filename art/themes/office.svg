<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    office — «Сверхурочные в офисе»: небоскрёб, одно тёплое окно
    горит (сверхурочные). Часы на фасаде. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="18" y="78" width="62" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Корпус -->
  <path d="M28 78 V14 Q28 10 32 10 H64 Q68 10 68 14 V78 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань -->
  <path d="M56 10 H64 Q68 10 68 14 V78 H56 Z" fill="#5C6670"/>

  <!-- Сетка окон (тёмное стекло) -->
  <g fill="#1F3A5F">
    <rect x="34" y="20" width="7" height="9" rx="1.2"/>
    <rect x="45" y="20" width="7" height="9" rx="1.2"/>
    <rect x="34" y="36" width="7" height="9" rx="1.2"/>
    <rect x="45" y="36" width="7" height="9" rx="1.2"/>
    <rect x="45" y="52" width="7" height="9" rx="1.2"/>
    <rect x="45" y="66" width="7" height="9" rx="1.2"/>
  </g>
  <!-- Горящее окно (сверхурочные) -->
  <rect x="34" y="52" width="7" height="9" rx="1.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M36.5 55.5 H39 M36.5 58 H39" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Часы на фасаде -->
  <circle cx="56" cy="25" r="8.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M56 25 V20 M56 25 L60 27" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="56" cy="25" r="1.2" fill="#1A1A1A"/>

  <!-- Крышная надстройка + антенна -->
  <rect x="40" y="6" width="16" height="5" rx="1.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M48 6 V2" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="48" cy="2" r="1.6" fill="#C8102E"/>
</svg>
