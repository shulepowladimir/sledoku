<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bowling — «Это страйк, Чувак»: деревянная дорожка уходит вдаль к тёмному
    пин-деку, шевроны-указатели прицела на досках, большая кегля с красными
    полосами, за ней малая, слева — синий шар с отверстиями. Рендер 40-64px,
    крупно, без мелочи.
  -->
  <!-- Дорожка (подложка) -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#E0A94A"/>
  <!-- Доски дорожки (вертикальные швы) -->
  <g stroke="#B87F33" stroke-width="2" stroke-linecap="round">
    <path d="M21 24 L21 90"/>
    <path d="M35 24 L35 90"/>
    <path d="M49 24 L49 90"/>
    <path d="M63 24 L63 90"/>
    <path d="M77 24 L77 90"/>
  </g>

  <!-- Пин-дек вдали (тёмный горизонт) -->
  <path d="M6 26 Q48 18 90 26 L90 12 Q90 6 84 6 L12 6 Q6 6 6 12 Z" fill="#3A2A20"/>
  <!-- Светлая кромка дека -->
  <path d="M8 25.4 Q48 17.6 88 25.4" fill="none" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>

  <!-- Шевроны-указатели прицела -->
  <g fill="#B87F33">
    <path d="M33 40 L36 46 L39 40 Z"/>
    <path d="M45 42 L48 48 L51 42 Z"/>
    <path d="M57 40 L60 46 L63 40 Z"/>
  </g>

  <!-- Тени кеглей и шара на дорожке -->
  <ellipse cx="64" cy="82" rx="13" ry="3" fill="#3A2A20"/>
  <ellipse cx="46" cy="72" rx="8" ry="2.2" fill="#3A2A20"/>
  <ellipse cx="28" cy="74" rx="12" ry="3" fill="#3A2A20"/>

  <!-- Малая кегля (за большой, левее) -->
  <g transform="translate(17 12) scale(0.62)">
    <path d="M40 12
             C34 12 31 16 31 21
             C31 26.5 33.5 29.5 35 33
             C29 39 23.5 47 23.5 59
             C23.5 71 30 80 40 80
             C50 80 56.5 71 56.5 59
             C56.5 47 51 39 45 33
             C46.5 29.5 49 26.5 49 21
             C49 16 46 12 40 12 Z"
          fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3.4" stroke-linejoin="round"/>
  </g>

  <!-- Большая кегля -->
  <clipPath id="bowlingClip">
    <path d="M64 26
             C58 26 55 30 55 35
             C55 40.5 57.5 43.5 59 47
             C53 53 47.5 61 47.5 73
             C47.5 85 54 94 64 94
             C74 94 80.5 85 80.5 73
             C80.5 61 75 53 69 47
             C70.5 43.5 73 40.5 73 35
             C73 30 70 26 64 26 Z"/>
  </clipPath>
  <path d="M64 26
           C58 26 55 30 55 35
           C55 40.5 57.5 43.5 59 47
           C53 53 47.5 61 47.5 73
           C47.5 85 54 94 64 94
           C74 94 80.5 85 80.5 73
           C80.5 61 75 53 69 47
           C70.5 43.5 73 40.5 73 35
           C73 30 70 26 64 26 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Красные полосы на шейке -->
  <g clip-path="url(#bowlingClip)" fill="#C8102E">
    <path d="M51 43.5 Q64 47.2 77 43.5 L77 47.2 Q64 50.9 51 47.2 Z"/>
    <path d="M51.5 49.6 Q64 53.3 76.5 49.6 L76.5 52.9 Q64 56.6 51.5 52.9 Z"/>
  </g>
  <!-- Блик на голове -->
  <circle cx="59.5" cy="31.5" r="2" fill="#E8B95F"/>

  <!-- Шар (синий, с отверстиями) -->
  <circle cx="28" cy="58" r="16" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <g fill="#1A1A1A">
    <circle cx="24" cy="52" r="1.9"/>
    <circle cx="29.5" cy="50.5" r="1.9"/>
    <circle cx="27" cy="56.5" r="1.9"/>
  </g>
  <path d="M18 50 Q21 45 26 43.5" fill="none" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>
</svg>
