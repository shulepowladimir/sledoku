<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    heavy — «Тяжкое дело»: пустыня на закате, солнце над дюнами, силуэт
    кемпера-моторхоума с поясом-полосой и кактус. Рендер 40-64px, крупно.
  -->
  <!-- Небо (сумерки, плоские полосы тонов) -->
  <rect x="6" y="6" width="84" height="84" rx="6" fill="#574D4A"/>
  <rect x="6" y="6" width="84" height="30" rx="6" fill="#675A56"/>
  <rect x="6" y="6" width="84" height="16" rx="6" fill="#786862"/>

  <!-- Солнце над дюнами -->
  <circle cx="70" cy="26" r="13" fill="#E0824A"/>
  <circle cx="70" cy="26" r="8" fill="#F5E9D0"/>

  <!-- Дюны (песок) -->
  <path d="M6 50 Q30 40 54 48 Q76 54 90 46 L90 90 L6 90 Z" fill="#AE9C86"/>
  <path d="M6 62 Q36 52 66 60 Q80 64 90 58 L90 90 L6 90 Z" fill="#C9A183"/>

  <!-- Кактус (слева от кемпера) -->
  <g stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round">
    <path d="M18 78 L18 58 Q18 54 21 54 Q24 54 24 58 L24 78 Z" fill="#5E8A46"/>
    <path d="M13 68 Q10 68 10 63 Q10 60 13 60 L18 60 L18 68 Z" fill="#5E8A46"/>
    <path d="M29 72 Q32 72 32 66 Q32 63 29 63 L24 63 L24 72 Z" fill="#5E8A46"/>
  </g>
  <path d="M20 58 V74" stroke="#44663A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Тень кемпера -->
  <ellipse cx="56" cy="80" rx="32" ry="6" fill="#3A2A20"/>

  <!-- Кемпер (силуэт с поясом) -->
  <path d="M28 76
           L28 54
           Q28 51 31 51
           L74 51
           Q77 51 77 54
           L77 76 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Кабина-ступенька слева -->
  <path d="M24 76 L24 60 Q24 57 27 57 L34 57 L34 76 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Пояс-полоса -->
  <path d="M24 66 L77 66 L77 71 L24 71 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Лобовое стекло -->
  <path d="M27 58 L27 62 L33 62 L33 58 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Окна -->
  <rect x="39" y="57" width="9" height="8" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="52" y="57" width="9" height="8" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Дверь -->
  <rect x="66" y="56" width="8" height="18" rx="1.5" fill="#DFD6C6" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="68" y="58" width="4" height="5" rx="1" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Колёса -->
  <circle cx="33" cy="76" r="6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="33" cy="76" r="2.2" fill="#9BA5AD"/>
  <circle cx="68" cy="76" r="6" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="68" cy="76" r="2.2" fill="#9BA5AD"/>
  <!-- Стоп-сигнал (акцент) -->
  <rect x="74.5" y="60" width="3" height="4" rx="1" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Камешки на переднем плане -->
  <ellipse cx="84" cy="86" rx="4" ry="2" fill="#AE9C86" stroke="#1A1A1A" stroke-width="1.6"/>
  <ellipse cx="10" cy="88" rx="3" ry="1.6" fill="#AE9C86" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
