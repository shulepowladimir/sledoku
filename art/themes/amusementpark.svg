<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    amusementpark — «Закрытие сезона»: колесо обозрения, крупно.
    Стальные спицы, разноцветные кабинки (одна красная — акцент),
    мягкое затемнение на нижней дуге обода. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <circle cx="49" cy="45" r="28" fill="#3A2A20"/>

  <!-- Опоры (за колесом) -->
  <path d="M48 45 L28 82 M48 45 L68 82" stroke="#5C6670" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 45 L28 82 M48 45 L68 82" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" fill="none"/>
  <rect x="22" y="80" width="52" height="6" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Спицы -->
  <g stroke="#9BA5AD" stroke-width="2.5" stroke-linecap="round">
    <path d="M48 18 V72 M21 45 H75 M29 26 L67 64 M67 26 L29 64"/>
  </g>

  <!-- Обод -->
  <circle cx="48" cy="45" r="27" fill="none" stroke="#9BA5AD" stroke-width="5"/>
  <circle cx="48" cy="45" r="27" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Затемнение нижней дуги -->
  <path d="M27.5 53 A24.5 24.5 0 0 0 68.5 53" fill="none" stroke="#5C6670" stroke-width="3.5"/>

  <!-- Ступица -->
  <circle cx="48" cy="45" r="6.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="46" cy="43" r="2" fill="#D5DCE1"/>

  <!-- Кабинки (свисают на дужках) -->
  <g stroke="#1A1A1A" stroke-width="1.6">
    <path d="M48 72 V78" /><rect x="43" y="78" width="10" height="9" rx="2.5" fill="#C8102E" stroke-width="2"/>
    <path d="M21 45 V51" /><rect x="16" y="51" width="10" height="9" rx="2.5" fill="#2E6E65" stroke-width="2"/>
    <path d="M75 45 V51" /><rect x="70" y="51" width="10" height="9" rx="2.5" fill="#E0A94A" stroke-width="2"/>
    <path d="M29 26 L26.5 31" /><rect x="21.5" y="31" width="10" height="9" rx="2.5" fill="#F5E9D0" stroke-width="2"/>
    <path d="M67 26 L69.5 31" /><rect x="64.5" y="31" width="10" height="9" rx="2.5" fill="#E0824A" stroke-width="2"/>
  </g>
</svg>
