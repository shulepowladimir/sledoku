<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    station — «Пропажа на вокзале»: вокзальный фасад с часами на
    фронтоне, арочный вход, красный семафор. Внизу — рельсы со шпалами.
  -->

  <!-- Рельсы (шпалы) -->
  <g fill="#8F5A3A" stroke="#1A1A1A" stroke-width="1.8">
    <rect x="14" y="80" width="6" height="10" rx="1.5"/>
    <rect x="26" y="80" width="6" height="10" rx="1.5"/>
    <rect x="38" y="80" width="6" height="10" rx="1.5"/>
    <rect x="50" y="80" width="6" height="10" rx="1.5"/>
    <rect x="62" y="80" width="6" height="10" rx="1.5"/>
    <rect x="74" y="80" width="6" height="10" rx="1.5"/>
  </g>
  <!-- Нитки рельсов -->
  <path d="M10 83.5 H86 M10 87.5 H86" stroke="#9BA5AD" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 83.5 H86 M10 87.5 H86" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>

  <!-- Корпус -->
  <rect x="16" y="42" width="64" height="36" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань -->
  <path d="M72 42 H80 V78 H72 Z" fill="#E8B95F"/>

  <!-- Крыша с фронтоном -->
  <path d="M10 42 L48 22 L86 42 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M20 38 Q34 30 46 27.5" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Часы на фронтоне -->
  <circle cx="48" cy="34" r="8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M48 34 V29.5 M48 34 L51.5 36" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="48" cy="34" r="1.1" fill="#1A1A1A"/>

  <!-- Арочный вход -->
  <path d="M40 78 V64 Q48 56 56 64 V78 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 78 V66 Q48 62.5 52 66 V78 Z" fill="#3A2A20"/>

  <!-- Окна -->
  <rect x="24" y="54" width="9" height="11" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="64" y="54" width="9" height="11" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Красный семафор (акцент) -->
  <g>
    <rect x="84" y="52" width="3" height="26" rx="1.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="85.5" cy="48" r="4.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2"/>
  </g>

  <!-- Платформа -->
  <rect x="12" y="76" width="74" height="5" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
</svg>
