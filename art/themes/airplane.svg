<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    airplane — иллюминатор самолёта на высоте: небесное стекло, облака и дуга горизонта.
    Отличается от airport: это вид из салона, а не самолёт в полёте.
  -->
  <!-- Тень-подложка иллюминатора -->
  <ellipse cx="50" cy="53" rx="37" ry="37" fill="#3A2A20"/>

  <!-- Наружная рамка -->
  <circle cx="47" cy="47" r="36" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M27 19 Q39 10 53 12" fill="none" stroke="#D5DCE1" stroke-width="3" stroke-linecap="round"/>

  <!-- Кромка и стекло -->
  <circle cx="47" cy="47" r="29" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="47" cy="47" r="24.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Далёкая поверхность земли и светлая линия горизонта -->
  <path d="M23 53 Q47 40 71 53 L69 65 Q47 76 25 65 Z" fill="#1F3A5F"/>
  <path d="M24 52 Q47 39 70 52" fill="none" stroke="#E8B95F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Облака за стеклом -->
  <path d="M31 43 Q31 39 36 39 Q38 34 43 36 Q47 36 48 41 Q53 40 54 44 Q54 47 50 47 L35 47 Q31 47 31 43 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M53 34 Q53 31 57 31 Q59 27 63 29 Q66 30 66 34 Q70 34 70 38 L57 38 Q53 38 53 34 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Крепления иллюминатора -->
  <circle cx="47" cy="16" r="2.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="47" cy="78" r="2.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="16" cy="47" r="2.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="78" cy="47" r="2.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
