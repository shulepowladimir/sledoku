<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    apartment — «Тихий вечер в квартире»: уютный домик, тёплый свет
    в окне, красный почтовый ящик у двери. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <rect x="16" y="76" width="66" height="10" rx="5" fill="#3A2A20"/>

  <!-- Стены -->
  <rect x="22" y="36" width="52" height="45" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань (лёгкий объём) -->
  <path d="M68 36 H74 V81 H68 Z" fill="#E8B95F"/>

  <!-- Крыша -->
  <path d="M16 40 L48 16 L80 40 Q66 34 48 34 Q30 34 16 40 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на скате -->
  <path d="M30 30 Q40 25 50 24" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Труба -->
  <rect x="60" y="20" width="9" height="16" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="58.5" y="18" width="12" height="4" rx="2" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Окно с тёплым светом -->
  <rect x="30" y="44" width="22" height="18" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M41 44 V62 M30 53 H52" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Дверь -->
  <rect x="58" y="56" width="13" height="25" rx="2" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="68" cy="68" r="1.5" fill="#E8B95F"/>

  <!-- Почтовый ящик (красный акцент) -->
  <g>
    <path d="M28 68 H44 V75 Q44 77 42 77 H30 Q28 77 28 75 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M28 68 H44 V71 H28 Z" fill="#E0824A" stroke="none"/>
    <rect x="34" y="65" width="2.6" height="5" fill="#1A1A1A"/>
  </g>
</svg>
