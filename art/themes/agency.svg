<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    agency — «Твоё первое дело»: лупа детектива на книге дела.
    Стекло — вода/стекло пара, под линзой красная улика-пуговица,
    прямая деревянная ручка вниз-вправо. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <ellipse cx="49" cy="82" rx="33" ry="6" fill="#3A2A20"/>

  <!-- Книга дела -->
  <rect x="24" y="60" width="50" height="22" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Корешок -->
  <path d="M24 63 Q21 71 24 79" fill="none" stroke="#B85F2E" stroke-width="4"/>
  <!-- Строчки-записи на обложке -->
  <g stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round">
    <path d="M34 67 H58 M34 71 H52 M34 75 H62"/>
  </g>
  <!-- Красная закладка (акцент) -->
  <path d="M64 60 V74 L68 70.5 L72 74 V60 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Прямая ручка (диагональ вниз-вправо) -->
  <path d="M55 55 L82 82" stroke="#1A1A1A" stroke-width="13" stroke-linecap="round"/>
  <path d="M56 56 L81 81" stroke="#8F5A3A" stroke-width="8" stroke-linecap="round"/>
  <!-- Металлический ободок у линзы -->
  <path d="M54 54 L62 62" stroke="#9BA5AD" stroke-width="8" stroke-linecap="round"/>

  <!-- Стекло -->
  <circle cx="42" cy="42" r="21" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Улика под линзой (красная пуговица) -->
  <circle cx="41" cy="46" r="5.5" fill="#C8102E"/>
  <circle cx="41" cy="46" r="1.6" fill="#3A2A20"/>
  <path d="M41 41.5 V44.5 M41 47.5 V50.5" stroke="#3A2A20" stroke-width="1.2"/>
  <!-- Обод линзы поверх -->
  <circle cx="42" cy="42" r="21" fill="none" stroke="#9BA5AD" stroke-width="4.5"/>
  <circle cx="42" cy="42" r="21" fill="none" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блики -->
  <path d="M30 34 Q33 28.5 39 27" fill="none" stroke="#9CC3E0" stroke-width="3" stroke-linecap="round"/>
  <path d="M27 31 A18 18 0 0 1 32 26" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
</svg>
