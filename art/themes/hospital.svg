<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hospital — «Ложный диагноз»: больница с красным крестом
    на фронтоне. Окна — вода/стекло пара (#4A7BA6 + блики).
  -->

  <!-- Тень-подложка -->
  <rect x="18" y="78" width="62" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="24" y="34" width="48" height="46" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Правая грань (объём) -->
  <path d="M66 34 H72 V80 H66 Z" fill="#E8B95F"/>

  <!-- Крыша-карниз -->
  <rect x="18" y="28" width="60" height="10" rx="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="22" y="30.5" width="52" height="2.5" rx="1.2" fill="#D5DCE1"/>

  <!-- Красный крест на фронтоне -->
  <g fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round">
    <path d="M42 40 H54 V46 H60 V58 H54 V64 H42 V58 H36 V46 H42 Z"/>
  </g>
  <path d="M38 42.5 H46 V45.5 H38 Z" fill="#F5E9D0" stroke="none"/>

  <!-- Вход -->
  <rect x="40" y="68" width="16" height="12" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M48 68 V80" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Окна (верхний ряд) -->
  <g>
    <rect x="29" y="70" width="7" height="9" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="60" y="70" width="7" height="9" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="29" y="46" width="7" height="9" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="60" y="46" width="7" height="9" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  </g>
</svg>
