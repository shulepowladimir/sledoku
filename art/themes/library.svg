<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    library — «Не суди по обложке»: открытая книга под зелёной лампой читального зала.
    Тёплый свет падает сверху-слева, красная закладка — единственный яркий акцент.
  -->

  <!-- Тёплый круг света за книгой -->
  <path d="M35 29 Q48 34 61 29 L78 57 Q50 49 20 58 Z" fill="#E8B95F"/>

  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="34" ry="4" fill="#3A2A20"/>

  <!-- Корпус лампы -->
  <path d="M48 31 V48" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M48 31 V48" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <path d="M39 50 Q48 46 57 50 L54 54 Q48 52 42 54 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M33 28 Q36 14 48 11 Q60 14 63 28 Q48 24 33 28 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M34 28 Q48 33 62 28" fill="none" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <path d="M39 20 Q42 15 47 14" fill="none" stroke="#7FA85B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Обложка открытой книги -->
  <path d="M12 53 Q29 48 45 56 Q49 58 52 56 Q68 48 84 53 L82 82 Q67 77 52 85 Q49 87 46 85 Q29 77 14 82 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Страницы -->
  <path d="M16 56 Q31 52 46 60 L46 79 Q31 72 17 77 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M52 60 Q67 52 80 56 L79 77 Q66 72 52 79 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M49 58 Q48 68 49 82" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Короткие строки текста и закладка -->
  <g fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round">
    <path d="M22 62 Q32 59 40 64 M21 67 Q31 64 40 69 M21 72 Q31 69 40 74"/>
    <path d="M58 64 Q67 59 75 61 M58 69 Q67 64 75 66 M58 74 Q67 69 75 71"/>
  </g>
  <path d="M68 58 V70 L71 67.5 L74 70 V57" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Светлый кант страниц -->
  <path d="M17 77 Q31 72 46 79 M52 79 Q66 72 79 77" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
</svg>
