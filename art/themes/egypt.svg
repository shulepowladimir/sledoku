<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    egypt — «Тайна пирамиды»: пирамида с солнцем, дюна внизу.
    Передняя грань светлая, боковая затемнена. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <path d="M14 76 Q48 66 82 76 Q48 84 14 76 Z" fill="#3A2A20"/>

  <!-- Солнце -->
  <circle cx="74" cy="22" r="9" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M70 18 Q73 15.5 77 17" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Пирамида: боковая (тёмная) грань -->
  <path d="M48 16 L84 74 L48 74 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Передняя (светлая) грань -->
  <path d="M48 16 L12 74 L48 74 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Вход-проём -->
  <path d="M44 74 V62 Q48 58 52 62 V74 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Блик на ребре -->
  <path d="M48 18 L46 24" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Дюна -->
  <path d="M8 80 Q30 70 52 78 Q72 84 88 78 L88 84 Q48 90 8 84 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
