<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    space — «Тайна орбитальной станции»: планета с кольцом и звёзды.
    Планета — пара воды/стекла (#4A7BA6 + блик #9CC3E0, тень #1F3A5F),
    кольцо золотое, задняя дуга за планетой, передняя — поверх.
  -->

  <!-- Тень-подложка -->
  <circle cx="47" cy="49" r="23" fill="#3A2A20"/>

  <!-- Звёзды -->
  <g stroke="#E8B95F" stroke-width="2" stroke-linecap="round">
    <path d="M14 20 V26 M11 23 H17"/>
    <path d="M82 30 V35 M79.5 32.5 H84.5"/>
  </g>
  <circle cx="24" cy="70" r="1.8" fill="#F5E9D0"/>
  <circle cx="76" cy="62" r="1.5" fill="#F5E9D0"/>

  <!-- Задняя дуга кольца -->
  <g transform="rotate(-18 46 47)">
    <path d="M8 47 A38 10 0 0 1 84 47" fill="none" stroke="#B87F33" stroke-width="5"/>
  </g>

  <!-- Планета -->
  <circle cx="46" cy="47" r="22" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Тень правой стороны -->
  <path d="M58 30 A22 22 0 0 1 58 64 A17 22 0 0 0 58 30 Z" fill="#1F3A5F"/>
  <!-- Полосы планеты -->
  <path d="M29 41 Q46 37 63 41 M28 52 Q46 48 64 52" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <!-- Блик -->
  <path d="M32 36 Q35 31 41 29.5" fill="none" stroke="#9CC3E0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Передняя дуга кольца -->
  <g transform="rotate(-18 46 47)">
    <path d="M8 47 A38 10 0 0 0 84 47" fill="none" stroke="#E0A94A" stroke-width="5"/>
    <path d="M8 47 A38 10 0 0 0 84 47" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
    <path d="M8 47 A38 10 0 0 1 84 47" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
    <path d="M12 49 A38 10 0 0 0 80 49" fill="none" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
