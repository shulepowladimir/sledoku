  <path d="M20 62 L26 61 M73 62 L79 62" stroke="#F5E9D0" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="33" cy="69" r="7" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="33" cy="69" r="3" fill="#9BA5AD"/>
  <circle cx="67" cy="69" r="7" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="67" cy="69" r="3" fill="#9BA5AD"/>

  <!-- Домкрат под порогом и сигнальная деталь -->
