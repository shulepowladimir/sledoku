<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lighthouse — «Пропавший смотритель»: маяк на скале, красные
    полосы (акцент), фонарь с кремовыми лучами. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <path d="M14 82 Q48 74 82 82 Q48 90 14 82 Z" fill="#3A2A20"/>

  <!-- Скала -->
  <path d="M18 84 L24 66 H72 L78 84 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M30 74 L36 70 M54 72 L60 76" stroke="#5C6670" stroke-width="2" stroke-linecap="round"/>

  <!-- Башня (слегка сужается вверх) -->
  <path d="M38 66 L36 22 H60 L58 66 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Красные полосы -->
  <path d="M36.5 52 H59.5 L59 58 H37 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M37 32 H59 L58.8 38 H37.2 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Правая грань (объём) -->
  <path d="M52 22 H60 L58 66 H52 Z" fill="#E8B95F"/>

  <!-- Фонарная комнатка -->
  <rect x="35" y="14" width="26" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="40" y="15.5" width="16" height="7" rx="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="48" cy="19" r="2.2" fill="#F5E9D0"/>
  <!-- Крыша -->
  <path d="M33 14 L48 5 L63 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Лучи (сплошные полигоны, без прозрачности) -->
  <path d="M62 16 L84 10 L86 20 L63 21 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M34 16 L14 12 L12 21 L33 21 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Волны у скалы -->
  <path d="M10 86 Q15 83.5 20 86 M76 86 Q81 83.5 86 86" fill="none" stroke="#4A7BA6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
