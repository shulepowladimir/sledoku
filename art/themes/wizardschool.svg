<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wizardschool — «Тайна школы волшебников»: фиолетовый колпак
    с конусовидным верхом (слегка загнутый кончик), синяя лента
    с золотой пряжкой, звёзды-блёстки. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <ellipse cx="48" cy="80" rx="30" ry="6" fill="#3A2A20"/>

  <!-- Поля шляпы -->
  <ellipse cx="48" cy="68" rx="29" ry="9" fill="#7C5EC9" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Свет на полях слева -->
  <path d="M22 65 Q30 60 42 59.5" fill="none" stroke="#9B7CE0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Конусовидный верх (кончик загнут вправо) -->
  <path d="M30 66 Q33 34 44 16 Q47 11 52 14 Q57 18 52 23 Q43 32 66 66 Z"
        fill="#7C5EC9" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Светая грань конуса (слева) -->
  <path d="M36 62 Q39 38 46 20" fill="none" stroke="#9B7CE0" stroke-width="3" stroke-linecap="round"/>

  <!-- Лента с пряжкой -->
  <path d="M31 61 Q48 70 65 61 L66 68 Q48 77 30 68 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="44.5" y="62.5" width="7" height="7" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Звезда на конусе -->
  <path d="M48 40 L50 45 L55 47 L50 49 L48 54 L46 49 L41 47 L46 45 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Блёстки-искры -->
  <g stroke="#E8B95F" stroke-width="2" stroke-linecap="round">
    <path d="M36 44 V50 M33 47 H39"/>
    <path d="M60 52 V56 M57.5 54 H62.5"/>
  </g>
  <circle cx="58" cy="34" r="2" fill="#F5E9D0"/>
  <circle cx="33" cy="58" r="1.7" fill="#F5E9D0"/>
</svg>
