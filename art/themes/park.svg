<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    park — «Происшествие в парке»: дерево и скамейка, красный
    воздушный шар у дерева. Свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <ellipse cx="48" cy="80" rx="36" ry="7" fill="#3A2A20"/>

  <!-- Скамейка -->
  <g>
    <!-- Ножки-сталь -->
    <rect x="60" y="62" width="4" height="16" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
    <rect x="78" y="62" width="4" height="16" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Сиденье и спинка (дерево) -->
    <rect x="56" y="66" width="30" height="5" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="56" y="57" width="30" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M62 61 V66 M74 61 V66 M86 61 V66" stroke="#1A1A1A" stroke-width="1.6"/>
  </g>

  <!-- Ствол -->
  <path d="M30 78 Q28 62 34 52 H40 Q44 62 42 78 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M31 66 Q33 60 36 56" fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Крона (три облака-лобы) -->
  <path d="M14 50 Q10 36 24 32 Q26 20 40 22 Q46 14 56 22 Q70 20 72 34 Q84 38 78 50 Q70 58 58 56 Q48 62 38 58 Q24 62 14 50 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тени справа в кроне -->
  <path d="M58 56 Q70 58 78 50 Q84 44 78 38 Q72 52 58 56 Z" fill="#44663A"/>
  <path d="M40 22 Q46 14 56 22 Q52 28 44 28 Z" fill="#7FA85B"/>
  <!-- Блики слева -->
  <circle cx="26" cy="42" r="3" fill="#7FA85B"/>
  <circle cx="44" cy="36" r="2.4" fill="#7FA85B"/>

  <!-- Воздушный шар (красный акцент) -->
  <g>
    <circle cx="70" cy="34" r="7.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M66 30 Q68 27 71 27.5" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M67.5 41 Q70 45 69 50" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
  </g>
</svg>
