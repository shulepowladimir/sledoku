<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wildwest2 — «Тень шерифа»: звезда шерифа с петлёй, центр —
    медальон со стали. Золото/дерево, свет сверху-слева.
  -->

  <!-- Тень-подложка -->
  <circle cx="50" cy="50" r="26" fill="#3A2A20"/>

  <!-- Петля-ремень -->
  <circle cx="50" cy="42" r="9" fill="none" stroke="#8F5A3A" stroke-width="4"/>

  <!-- Звезда -->
  <path d="M50 12 L59 34 L83 36 L65 52 L71 76 L50 64 L29 76 L35 52 L17 36 L41 34 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Затемнение нижних лучей (объём) -->
  <path d="M50 64 L71 76 L65 52 Z" fill="#B87F33" stroke="none"/>
  <path d="M50 64 L29 76 L35 52 Z" fill="#B87F33" stroke="none"/>

  <!-- Центральный медальон -->
  <circle cx="50" cy="47" r="9.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <circle cx="50" cy="47" r="5.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M46.5 43.5 Q48.5 42.5 50.5 43.5" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Заклёпки на лучах -->
  <circle cx="50" cy="19" r="1.6" fill="#B87F33"/>
  <circle cx="72" cy="38" r="1.6" fill="#B87F33"/>
  <circle cx="28" cy="38" r="1.6" fill="#B87F33"/>
</svg>
