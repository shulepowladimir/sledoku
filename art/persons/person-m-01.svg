<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-01 — нуарный детектив, бюст.
    Шляпа и пальто красятся игрой: fill="var(--person-clothing, #8A8A8A)".
    Лицо — мультяшный реализм: радужки с бликами, веки, tapered-брови со шрамом,
    нос с переносицей и ноздрями, smirk с нижней губой, cel-тени сплошными тонами,
    мешки под глазами. БЕЗ drop-теней: сдвинутая копия силуэта головы читается
    как «вторая голова» — глубину дают cel-тени и контур (стиль-гайд §5).
    Объём на красимом — затемнения #1A1A1A opacity ≤ 0.2.
  -->

  <!-- ══ ПЛАЩИ ПАЛЬТО (var) ══ -->
  <path d="M8 92 L8 84 Q8 70 24 70 L72 70 Q88 70 88 84 L88 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M62 70 L72 70 Q88 70 88 84 L88 92 L62 92 Z" fill="#1A1A1A" opacity="0.15"/>

  <!-- ══ ВОРОТНИК И ГАЛСТУК ══ -->
  <path d="M40 70 L48 81 L36 92 L26 92 Q26 77 40 70 Z" fill="#1A1A1A" opacity="0.2"/>
  <path d="M56 70 L48 81 L60 92 L70 92 Q70 77 56 70 Z" fill="#1A1A1A" opacity="0.2"/>
  <path d="M40 70 L48 81 L36 92 L26 92 Q26 77 40 70 Z" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M56 70 L48 81 L60 92 L70 92 Q70 77 56 70 Z" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M40 70 L48 84 L56 70 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M45.5 70.5 L50.5 70.5 L48.8 74 L47.2 74 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M46.8 74 L49.2 74 L48.4 90 L47.6 90 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- ══ ШЕЯ ══ -->
  <rect x="42" y="60" width="12" height="12" rx="3" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="42" y="60" width="12" height="4.5" rx="2.2" fill="#C98B5E"/>

  <!-- ══ УШИ (до головы) ══ -->
  <ellipse cx="29.5" cy="49" rx="4" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="66.5" cy="49" rx="4" ry="6" fill="#C98B5E" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.2 46.8 Q30.6 49 28.8 51.4" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M67.2 46.8 Q64.8 49 66.6 51.4" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="48" r="19" fill="#E3B48A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M60 33.3 A19 19 0 0 1 60 62.7 A15.5 15.5 0 0 0 60 33.3 Z" fill="#C98B5E"/>
  <!-- Cel-тень: полоса лба под полями шляпы -->
  <path d="M32 45 Q48 40.5 64 45 L63.3 48.2 Q48 43.7 32.7 48.2 Z" fill="#C98B5E"/>

  <!-- ══ БРОВИ (tapered, левая разорвана шрамом) ══ -->
  <path d="M35.2 44.3 Q37.6 41 39.4 40.6 L39.9 43 Q38 43.4 36.2 45.6 Z" fill="#3A2A20"/>
  <path d="M42 40.9 Q44.2 41.3 45.6 42.3 L44.8 44.2 Q43.2 43.2 41.7 42.9 Z" fill="#3A2A20"/>
  <path d="M50.8 41.2 Q55.6 40.2 60.6 43.6 L60 45.4 Q55.4 42.2 51 43 Z" fill="#3A2A20"/>
  <!-- Шрам через левую бровь -->
  <path d="M39.9 39.5 L41.8 46.3" stroke="#C98B5E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M41.9 40.6 L42.9 44.9" stroke="#C98B5E" stroke-width="1" stroke-linecap="round"/>

  <!-- ══ ГЛАЗА ══ -->
  <!-- Левый -->
  <ellipse cx="40.5" cy="47.6" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.2" cy="47.9" r="2.3" fill="#5A4636"/>
  <circle cx="41.3" cy="48" r="1.05" fill="#1A1A1A"/>
  <circle cx="40.5" cy="47" r="0.65" fill="#F5E9D0"/>
  <path d="M37.3 46.2 Q40.5 43.8 44 45.9" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M37.8 51.4 Q40.6 52.6 43.6 51.6" fill="none" stroke="#C98B5E" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Правый -->
  <ellipse cx="55.5" cy="47.6" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.8" cy="47.9" r="2.3" fill="#5A4636"/>
  <circle cx="54.7" cy="48" r="1.05" fill="#1A1A1A"/>
  <circle cx="54" cy="47" r="0.65" fill="#F5E9D0"/>
  <path d="M52 45.9 Q55.5 43.8 58.7 46.2" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M52.4 51.6 Q55.4 52.6 58.2 51.4" fill="none" stroke="#C98B5E" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ══ НОС (переносица + кончик + ноздри + блик) ══ -->
  <path d="M47.6 43.5 Q46.4 49 45.9 52.4" fill="none" stroke="#C98B5E" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M45.9 52.4 Q47.4 56 50.3 54.9" fill="none" stroke="#C98B5E" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="45.2" cy="54.6" rx="1" ry="0.7" fill="#C98B5E"/>
  <ellipse cx="51.4" cy="54.3" rx="1" ry="0.7" fill="#C98B5E"/>
  <circle cx="46.9" cy="53.1" r="0.8" fill="#F2C9A0"/>

  <!-- ══ РТ (smirk + нижняя губа + тень подбородка) ══ -->
  <path d="M41 59.2 Q47.5 63.6 55 57.6" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M55 57.6 L56.8 56.9" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M43.5 61.6 Q48 64.6 52.8 61 Q48.5 63.2 43.5 61.6 Z" fill="#F2C9A0"/>
  <ellipse cx="48" cy="64.5" rx="4.5" ry="1.6" fill="#C98B5E"/>

  <!-- ══ ЩЕТИНА ══ -->
  <path d="M39 61.8 Q48 66.2 57 61.4" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="#C98B5E">
    <circle cx="41" cy="62.6" r="0.7"/>
    <circle cx="44.5" cy="65" r="0.7"/>
    <circle cx="52" cy="65.2" r="0.7"/>
    <circle cx="56" cy="62.8" r="0.7"/>
    <circle cx="48" cy="66.8" r="0.7"/>
  </g>

  <!-- ══ ФЕДОРА (var) ══ -->
  <path d="M28 37 L28 24 Q28 14.5 38.5 14.5 L57.5 14.5 Q68 14.5 68 24 L68 37 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M48 14.5 L57.5 14.5 Q68 14.5 68 24 L68 37 L48 37 Z" fill="#1A1A1A" opacity="0.15"/>
  <path d="M40 16 Q48 20 56 16" fill="none" stroke="#3A2A20" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="26" y="32" width="44" height="6" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="22" y="36" width="52" height="8" rx="4"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="48" y="36" width="26" height="8" rx="4" fill="#1A1A1A" opacity="0.15"/>
</svg>
