  <ellipse cx="46.2" cy="60.3" rx="1.6" ry="0.9" fill="#F5E9D0"/>

  <!-- ══ РУМЯНЕЦ + хайлайт скулы ══ -->
  <circle cx="36" cy="52.8" r="2" fill="#E0824A"/>
  <circle cx="60" cy="52.8" r="2" fill="#E0824A"/>
  <circle cx="37.8" cy="50.9" r="0.9" fill="#F5E9D0"/>

  <!-- ══ СЕРЬГИ-ПОДВЕСКИ ══ -->
  <circle cx="30" cy="54" r="1.3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
  <path d="M30 56 Q31.6 58.5 30 61 Q28.4 58.5 30 56 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9" stroke-linejoin="round"/>
  <circle cx="66" cy="54" r="1.3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
  <path d="M66 56 Q67.6 58.5 66 61 Q64.4 58.5 66 56 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9" stroke-linejoin="round"/>

