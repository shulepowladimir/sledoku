  <circle cx="54.6" cy="48.2" r="1.2" fill="#1A1A1A"/>
  <circle cx="53.8" cy="46.9" r="0.95" fill="#F5E9D0"/>
  <circle cx="55.7" cy="49.3" r="0.5" fill="#F5E9D0"/>
  <path d="M51.7 45.5 Q55.6 43.4 59 46" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
