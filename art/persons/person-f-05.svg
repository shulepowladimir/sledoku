  <ellipse cx="66" cy="48.5" rx="4" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.7 46.3 Q31.1 48.5 29.3 50.9" fill="none" stroke="#E3B48A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M66.7 46.3 Q64.3 48.5 66.1 50.9" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="47.5" r="18" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M59.5 33.7 A18 18 0 0 1 59.5 61.3 A14 14 0 0 0 59.5 33.7 Z" fill="#E3B48A"/>

  <!-- ══ ЛОКОНЫ У ЛИЦА (каштановые) ══ -->
  <path d="M33.2 41.5 Q31.8 48 34.2 53 Q36 56.5 39.6 55.6 Q36.8 51.8 36.6 47.2 Q36.4 43.6 35.8 41 Z"
