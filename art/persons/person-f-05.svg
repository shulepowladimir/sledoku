    серьги-подвески, зелёные глаза, воротничок с брошью.
    Кожа F2C9A0 (тень E3B48A). Без drop-теней (гайд §5).
  -->

  <!-- ══ ПЛАТЬЕ (var) ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
