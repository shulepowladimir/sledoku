  <!-- Полотно над лбом -->
  <path d="M31.5 41 Q29 26.5 42 22.5 Q48 21.5 54 22.5 Q67 26.5 64.5 41 L62 41 Q64.5 30 53.5 27.5 Q48 26 42.5 27.5 Q31.5 30 34 41 Z"
