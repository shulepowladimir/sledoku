  <path d="M45.8 71.5 Q43.3 73.5 42.8 76 Q45.3 75.5 47 73.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50.2 71.5 Q52.7 73.5 53.2 76 Q50.7 75.5 49 73.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
</svg>
