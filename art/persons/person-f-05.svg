  <!-- Cel-тень: полоска лба под кромкой косынки -->
  <path d="M35 41.5 Q48 38.8 61 41.5 L60.5 43.5 Q48 40.8 35.5 43.5 Z" fill="#E3B48A"/>

  <!-- ══ ЗАВЯЗКИ И УЗЕЛ КОСЫНКИ (var): сходятся ПОД подбородком, не на рту ══ -->
