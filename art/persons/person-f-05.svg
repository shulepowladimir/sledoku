        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M62.5 41 Q63.2 52 57 62 Q55 65 51.5 66.5 L52.5 63.8 Q55.5 61.5 57.5 55.5 Q59.8 49 60 42.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Узел под подбородком (голова кончается на y=65.5, губы на y≈63) -->
  <circle cx="48" cy="69" r="3.4" fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M45.6 67.4 Q48 69.2 50.4 67.4" fill="none" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
