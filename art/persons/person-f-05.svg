  <path d="M34 40 Q38 37.5 42 39 Q46 40.5 50 39 Q54 37.5 58 39 Q60.5 39.8 62.5 41"
        fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Складки на полотне -->
  <g fill="none" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round">
    <path d="M38.5 34 Q39.5 29 43 26.5"/>
    <path d="M57.5 34 Q56.5 29 53 26.5"/>
