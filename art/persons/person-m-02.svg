<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-02 — бармен Гектор: южный тип, восьмиклинка набок, пышные усы.
    Кепка и жилет красятся игрой: fill="var(--person-clothing, #8A8A8A)".
    Кожа C98B5E (тень 8F5A3A, блик E3B48A), волосы запечены.
    Без drop-теней (гайд §5): объём — cel-тени и контур.
  -->

  <!-- ══ ПЛЕЧИ: ЖИЛЕТ (var) ПОВЕРХ КРЕМОВОЙ РУБАШКИ ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Жилет (var) -->
  <path d="M10 92 L10 84 Q10 71 26 71 L32 71 L32 92 Z
           M64 71 L70 71 Q86 71 86 84 L86 92 L64 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M79 71 Q86 71 86 84 L86 92 L76 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Пуговицы жилета -->
  <circle cx="21" cy="80" r="1.3" fill="#1A1A1A"/>
  <circle cx="21" cy="86" r="1.3" fill="#1A1A1A"/>
  <circle cx="75" cy="80" r="1.3" fill="#1A1A1A"/>
  <!-- Воротник рубашки -->
  <path d="M38 71 L48 79 L58 71" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ ШЕЯ ══ -->
  <rect x="42" y="60" width="12" height="12" rx="3" fill="#C98B5E" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="42" y="60" width="12" height="4.5" rx="2.2" fill="#8F5A3A"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="29.5" cy="49" rx="4" ry="6" fill="#C98B5E" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="66.5" cy="49" rx="4" ry="6" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.2 46.8 Q30.6 49 28.8 51.4" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M67.2 46.8 Q64.8 49 66.6 51.4" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="48" r="19" fill="#C98B5E" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M60 33.3 A19 19 0 0 1 60 62.7 A15.5 15.5 0 0 0 60 33.3 Z" fill="#8F5A3A"/>
  <!-- Cel-тень: полоса лба под кепкой -->
  <path d="M32 42 Q48 37.5 64 42 L63.3 45 Q48 40.5 32.7 45 Z" fill="#8F5A3A"/>

  <!-- ══ БРОВИ (густые, tapered) ══ -->
  <path d="M35.4 42.8 Q39 39.8 44.6 41 L44.2 43 Q39.6 42 36.4 44.2 Z" fill="#3A3238"/>
  <path d="M51.4 41 Q57 39.8 60.6 42.8 L59.6 44.2 Q56.4 42 51.8 43 Z" fill="#3A3238"/>

  <!-- ══ ГЛАЗА (карие, тёплый взгляд) ══ -->
  <ellipse cx="40.5" cy="47.4" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.2" cy="47.7" r="2.3" fill="#5A4636"/>
  <circle cx="41.3" cy="47.8" r="1.05" fill="#1A1A1A"/>
  <circle cx="40.5" cy="46.8" r="0.65" fill="#F5E9D0"/>
  <path d="M37.3 45.9 Q40.5 43.6 43.9 45.7" fill="none" stroke="#1A1A1A" stroke-width="1.9" stroke-linecap="round"/>
  <ellipse cx="55.5" cy="47.4" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.8" cy="47.7" r="2.3" fill="#5A4636"/>
  <circle cx="54.7" cy="47.8" r="1.05" fill="#1A1A1A"/>
  <circle cx="54" cy="46.8" r="0.65" fill="#F5E9D0"/>
  <path d="M52.1 45.7 Q55.5 43.6 58.7 45.9" fill="none" stroke="#1A1A1A" stroke-width="1.9" stroke-linecap="round"/>

  <!-- ══ НОС (широкий, с блик) ══ -->
  <path d="M47.6 43.5 Q46.2 49.5 45.5 53" fill="none" stroke="#8F5A3A" stroke-width="1.9" stroke-linecap="round"/>
  <ellipse cx="44.7" cy="55" rx="1.2" ry="0.8" fill="#8F5A3A"/>
  <ellipse cx="51.6" cy="54.7" rx="1.2" ry="0.8" fill="#8F5A3A"/>
  <circle cx="46.6" cy="53.4" r="0.85" fill="#E3B48A"/>

  <!-- ══ УСЫ (главная деталь) + РТ ПОД НИМИ ══ -->
  <path d="M38.5 57.5 Q43 54.8 48 56.8 Q53 54.8 57.5 57.5 Q55 62.2 48 60.8 Q41 62.2 38.5 57.5 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Кончики усов вверх -->
  <path d="M38.5 57.5 Q36 56 35.3 53.9" fill="none" stroke="#3A3238" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M57.5 57.5 Q60 56 60.7 53.9" fill="none" stroke="#3A3238" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Нижняя губа чуть видна под усами -->
  <path d="M44 61.8 Q48 63.6 52 61.8" fill="none" stroke="#1A1A1A" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M45 62.6 Q48 64.4 51 62.6" fill="#E3B48A"/>

  <!-- ══ ВОЛОСЫ (зачёсаны назад, прядь из-под кепки) ══ -->
  <path d="M31 40 Q31 31.5 40 28.5 L56 28.5 Q65 31.5 65 40 Q57 34 48 34.5 Q39 34 31 40 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M36 33 Q42 30.5 49 31" fill="none" stroke="#5A4636" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ВОСЬМИКЛИНКА (var, набок) ══ -->
  <path d="M27 29.5 Q28 17.5 43 16 Q59 14.8 66.5 24 Q69 28.5 64 30 L34 31 Q27.5 31.2 27 29.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M49 15.6 Q59 15 66.5 24 Q69 28.5 64 30 L49 30 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Шов клиньев -->
  <path d="M43 16.2 Q44 23 42.5 30.6" fill="none" stroke="#3A2A20" stroke-width="1.5"/>
  <path d="M53 16.6 Q53.5 23.5 52.5 30.4" fill="none" stroke="#3A2A20" stroke-width="1.5"/>
  <!-- Козырёк -->
  <path d="M26.5 30 Q22 31.5 22.5 34.5 Q23 36.5 27 36 L38 34.5 L37 30 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M31 34.8 Q34.5 34.3 38 33.9" fill="none" stroke="#3A2A20" stroke-width="1.2"/>
</svg>
