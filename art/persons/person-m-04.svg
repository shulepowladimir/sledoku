<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-04 — посыльный Тимми: юный, веснушки, торчающие пряди из-под кепки,
    озорная ухмылка с ямочкой. Кепка и рубашка красятся игрой:
    fill="var(--person-clothing, #8A8A8A)". Кожа E3B48A (тень C98B5E).
    Без drop-теней (гайд §5).
  -->

  <!-- ══ РУБАШКА (var) С ВОРОТНИКОМ ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 71 L70 71 Q86 71 86 84 L86 92 L60 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Воротник -->
  <path d="M40 71 L48 79 L56 71" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 71 L44 76.5 L41.5 81 Q37.5 76 36.5 71.5 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M56 71 L52 76.5 L54.5 81 Q58.5 76 59.5 71.5 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Лямка сумки через плечо -->
  <path d="M10 76 L86 90" stroke="#3A2A20" stroke-width="5" stroke-linecap="round"/>

  <!-- ══ ШЕЯ ══ -->
  <rect x="42" y="60" width="12" height="12" rx="3" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="42" y="60" width="12" height="4.5" rx="2.2" fill="#C98B5E"/>

  <!-- ══ УШИ (оттопыренные, юные) ══ -->
  <ellipse cx="29" cy="49" rx="4.5" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="67" cy="49" rx="4.5" ry="6" fill="#C98B5E" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M27.6 46.6 Q30.4 49 28.4 51.6" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M68.4 46.6 Q65.6 49 67.6 51.6" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="48" r="19" fill="#E3B48A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M60 33.3 A19 19 0 0 1 60 62.7 A15.5 15.5 0 0 0 60 33.3 Z" fill="#C98B5E"/>

  <!-- ══ ТОРЧАЩИЕ ВОЛОСЫ (из-под кепки, рыжеватые) ══ -->
  <path d="M30.5 36 Q28 28 32 22.5 Q34 26 36 24 Q36.5 27.5 38 25 Q38.5 28.5 38.5 31 Q33.5 32.5 31.5 38 Z"
        fill="#A9743A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M58 30 Q59.5 24.5 63.5 21.5 Q62.5 25.5 65 24.5 Q63.5 27.5 64 30.5 Q61 29 58 30 Z"
        fill="#A9743A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- ══ БРОВИ (весёлые, приподнятые) ══ -->
  <path d="M35.6 42.6 Q39.4 39.8 44.4 40.8 L44 43 Q39.6 42.2 36.6 44 Z" fill="#A9743A" stroke="#3A2A20" stroke-width="0.5"/>
  <path d="M51.6 40.8 Q56.6 39.8 60.4 42.6 L59.4 44 Q56.4 42.2 52 43 Z" fill="#A9743A" stroke="#3A2A20" stroke-width="0.5"/>

  <!-- ══ ГЛАЗА (зелёные, озорные, сведённые к переносице) ══ -->
  <ellipse cx="40.5" cy="47.4" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.6" cy="47.7" r="2.3" fill="#2E6E65"/>
  <circle cx="41.7" cy="47.8" r="1.05" fill="#1A1A1A"/>
  <circle cx="40.9" cy="46.8" r="0.65" fill="#F5E9D0"/>
  <path d="M37.3 46 Q40.5 43.7 43.9 45.8" fill="none" stroke="#1A1A1A" stroke-width="1.9" stroke-linecap="round"/>
  <ellipse cx="55.5" cy="47.4" rx="3.3" ry="3.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.4" cy="47.7" r="2.3" fill="#2E6E65"/>
  <circle cx="54.3" cy="47.8" r="1.05" fill="#1A1A1A"/>
  <circle cx="53.6" cy="46.8" r="0.65" fill="#F5E9D0"/>
  <path d="M52.1 45.8 Q55.5 43.7 58.7 46" fill="none" stroke="#1A1A1A" stroke-width="1.9" stroke-linecap="round"/>

  <!-- ══ НОС (курносый, юный) ══ -->
  <path d="M47.4 44 Q47 48 46.2 50.6" fill="none" stroke="#C98B5E" stroke-width="1.7" stroke-linecap="round"/>
  <ellipse cx="45.3" cy="52.6" rx="0.9" ry="0.6" fill="#C98B5E"/>
  <ellipse cx="50.2" cy="52.4" rx="0.9" ry="0.6" fill="#C98B5E"/>
  <circle cx="46.6" cy="51.6" r="0.7" fill="#F2C9A0"/>

  <!-- ══ ВЕСНУШКИ ══ -->
  <g fill="#B85F2E">
    <circle cx="37" cy="51.5" r="0.7"/>
    <circle cx="40.5" cy="53.5" r="0.7"/>
    <circle cx="44.5" cy="52.8" r="0.7"/>
    <circle cx="51.5" cy="52.6" r="0.7"/>
    <circle cx="55.5" cy="53.3" r="0.7"/>
    <circle cx="58.8" cy="51.2" r="0.7"/>
  </g>

  <!-- ══ РТ (широкая озорная ухмылка + ямочка) ══ -->
  <path d="M40.5 58.5 Q47.5 65.5 55 58" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M55 58 L57.2 57.6" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M43 61 Q47.8 64.4 52.5 60.6 Q48 63.4 43 61 Z" fill="#F2C9A0"/>
  <!-- Ямочка на щеке -->
  <path d="M57.5 60.5 Q58.6 61.2 58.2 62.6" fill="none" stroke="#C98B5E" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ══ КЕПКА-ТВИСТ (var, надвинута) ══ -->
  <path d="M28 33 Q28.5 20.5 44 19 Q60 17.8 67.5 27.5 Q69.5 31.5 65 33 L33 34 Q28 34.3 28 33 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M49 18.6 Q60 18 67.5 27.5 Q69.5 31.5 65 33 L49 33 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Козырёк (чуть загнут вверх) -->
  <path d="M27 33 Q21.5 34 21.5 36.5 Q21.7 38.5 26 38.2 L38 37 L37.5 33.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Пуговка сверху -->
  <circle cx="47" cy="19.5" r="1.6" fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
