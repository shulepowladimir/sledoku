  <path d="M36.6 41.2 Q40.4 38.6 44.8 40 L44.4 41.8 Q40.5 40.6 37.3 42.6 Z" fill="#B85F2E" stroke="#3A2A20" stroke-width="0.5"/>
  <path d="M51.2 40 Q55.6 38.6 59.4 41.2 L58.7 42.6 Q55.5 40.6 51.6 41.8 Z" fill="#B85F2E" stroke="#3A2A20" stroke-width="0.5"/>

  <!-- ══ ГЛАЗА (зелёные, искристые) ══ -->
  <ellipse cx="40.6" cy="47.9" rx="3.4" ry="3.9" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.3" cy="48.1" r="2.6" fill="#2E6E65"/>
  <circle cx="41.4" cy="48.2" r="1.15" fill="#1A1A1A"/>
  <circle cx="40.4" cy="47" r="0.9" fill="#F5E9D0"/>
  <path d="M37.2 46 Q40.5 43.4 44.2 45.5" fill="none" stroke="#1A1A1A" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M38.2 51.5 Q40.7 52.4 43.4 51.7" fill="none" stroke="#E3B48A" stroke-width="1.1" stroke-linecap="round"/>
  <ellipse cx="55.4" cy="47.9" rx="3.4" ry="3.9" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.7" cy="48.1" r="2.6" fill="#2E6E65"/>
  <circle cx="54.6" cy="48.2" r="1.15" fill="#1A1A1A"/>
  <circle cx="53.7" cy="47" r="0.9" fill="#F5E9D0"/>
  <path d="M51.8 45.5 Q55.5 43.4 58.8 46" fill="none" stroke="#1A1A1A" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M52.6 51.7 Q55.3 52.4 57.8 51.5" fill="none" stroke="#E3B48A" stroke-width="1.1" stroke-linecap="round"/>

  <!-- ══ НОС (курносый, с веснушками) ══ -->
  <path d="M47.5 44.3 Q47 48 46.3 50.5" fill="none" stroke="#E3B48A" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="45.5" cy="52.2" rx="0.9" ry="0.6" fill="#E3B48A"/>
  <ellipse cx="50.3" cy="52" rx="0.9" ry="0.6" fill="#E3B48A"/>
  <circle cx="46.7" cy="51.4" r="0.7" fill="#F5E9D0"/>

  <!-- ══ ВЕСНУШКИ (щедро, через нос) ══ -->
  <g fill="#E0824A">
    <circle cx="36.5" cy="51" r="0.75"/>
    <circle cx="39.5" cy="53.2" r="0.75"/>
    <circle cx="43.5" cy="52.5" r="0.75"/>
    <circle cx="45.8" cy="55" r="0.75"/>
    <circle cx="50.2" cy="54.8" r="0.75"/>
    <circle cx="52.5" cy="52.3" r="0.75"/>
    <circle cx="56.5" cy="53" r="0.75"/>
    <circle cx="59.5" cy="50.8" r="0.75"/>
  </g>

  <!-- ══ РТ (задорная улыбка до щёк, видны зубы) ══ -->
  <path d="M41 57.8 Q48 65.6 55 57.8" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Зубы (лёгкая полоска) -->
  <path d="M43.5 59.2 Q48 61 52.5 59.2" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <path d="M43.6 58.9 Q48 60.6 52.4 58.9 Q48 61.6 43.6 58.9 Z" fill="#F5E9D0"/>
  <!-- Ямочки на обеих щеках -->
  <path d="M38.5 58.6 Q37.5 59.4 38 60.6" fill="none" stroke="#E3B48A" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M57.5 58.6 Q58.5 59.4 58 60.6" fill="none" stroke="#E3B48A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- ══ РУМЯНЕЦ ══ -->
  <circle cx="36.2" cy="53.8" r="1.8" fill="#E0824A"/>
  <circle cx="59.8" cy="53.8" r="1.8" fill="#E0824A"/>
</svg>
