  <path d="M38 33 Q43 29.5 49 30.5" fill="none" stroke="#F2C9A0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ОЛИМПИЙКА (var) С МОЛНИЕЙ ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 71 L70 71 Q86 71 86 84 L86 92 L60 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Молния -->
  <path d="M43 71 L52 78 L45 80 L54 88" fill="none" stroke="#F5E9D0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M43 71 L52 78 L45 80 L54 88" fill="none" stroke="#1A1A1A" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
