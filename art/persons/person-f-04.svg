  <!-- Чёлка-зигзаг (характер сорванца) -->
  <path d="M33 40 Q34 30 42 27 Q49 24.8 57 27.5 L58 32 L54 31 L55 36 L50 34 L51 39 L46 36.5 L45 41 L41 37 L38 42 Z"
