<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-04 — сорванец Руби: рыжий хвост набок, веснушки, задорная
    улыбка. Олимпийка красится игрой: fill="var(--person-clothing, #8A8A8A)".
    Кожа F2C9A0 (тень E3B48A), волосы терракотовые. Без drop-теней (гайд §5).
  -->

  <!-- ══ ВОЛОСЫ: ХВОСТ НАБОК (запечён, рыжий) ══ -->
  <path d="M60 24 Q70 20 75 26 Q80 32 76.5 39.5 Q73.5 45.5 67.5 44 Q72 41 72.5 35.5 Q72.8 30 67 28.5 Q63.5 27.6 60 30 Z"
