  <path d="M64.5 30 Q70 30.5 70.8 35.5 Q71.4 39.5 68.5 41.5" fill="none" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Резинка хвоста -->
  <rect x="58.5" y="26.5" width="6" height="5" rx="2.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Основная шапка волос -->
  <path d="M29.5 47 Q27 30 40 26 Q48 24 56 26 Q68 29 66.5 47 L64.5 47 Q65.8 32 55 29.5 Q48 27.8 41 29.5 Q30.2 32 31.5 47 Z"
