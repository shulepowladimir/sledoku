<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-01 — клиентка детектива, бюст.
    Берет и платье красятся игрой: fill="var(--person-clothing, #8A8A8A)".
    Лицо — мультяшный реализм: большие глаза с двумя бликами, стрелки-cat eye
    и ресницы, синие радужки, губы с луком Купидона и глянцем, мушка, румянец,
    cel-тень сплошным тоном, тёмный боб с бликами на волосах.
    БЕЗ drop-теней: сдвинутая копия силуэта читается как «вторая голова» —
    глубину дают cel-тени и контур (стиль-гайд §5).
  -->

  <!-- ══ ВОЛОСЫ (тёмный боб, запечён) ══ -->
  <path d="M26 61 Q20.5 45 26.5 30.5 Q33 14 48 14 Q63 14 69.5 30.5 Q75.5 45 70 61 Q65.5 66.5 60.5 61 Q63.5 50 60 45 L36 45 Q32.5 50 35.5 61 Q30.5 66.5 26 61 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Волны и блики в волосах -->
  <g fill="none" stroke="#5A4636" stroke-width="1.6" stroke-linecap="round">
    <path d="M30 55 Q33.5 59 30.5 62.5"/>
    <path d="M66 55 Q62.5 59 65.5 62.5"/>
    <path d="M33 38 Q35 33 40 31"/>
    <path d="M63 38 Q61 33 56 31"/>
  </g>
  <g fill="none" stroke="#7A4A2A" stroke-width="1.4" stroke-linecap="round">
    <path d="M37 25 Q42 21.5 48 21.5"/>
    <path d="M52 22 Q57 23 60 27"/>
  </g>

  <!-- ══ ПЛАТЬЕ (var) ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 71 L70 71 Q86 71 86 84 L86 92 L60 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <path d="M41 71 L48 81 L55 71 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M41 71 Q48 75 55 71" fill="none" stroke="#3A2A20" stroke-width="1.5"/>

  <!-- ══ ЖЕМЧУЖНОЕ ОЖЕРЕЛЬЕ ══ -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="0.7">
    <circle cx="43.5" cy="74.5" r="1.5"/>
    <circle cx="46" cy="76.5" r="1.5"/>
    <circle cx="50" cy="76.5" r="1.5"/>
    <circle cx="52.5" cy="74.5" r="1.5"/>
  </g>

  <!-- ══ ШЕЯ ══ -->
  <rect x="43" y="60" width="10" height="12" rx="3" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="43" y="60" width="10" height="4.5" rx="2.2" fill="#E3B48A"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="47.5" r="18" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M59.5 33.7 A18 18 0 0 1 59.5 61.3 A14 14 0 0 0 59.5 33.7 Z" fill="#E3B48A"/>

  <!-- ══ БРОВИ (тонкие, изогнутые, tapered) ══ -->
  <path d="M36.3 41.9 Q40.4 39.6 44.8 41.2 L44.5 42.6 Q40.4 41.2 37 43 Z" fill="#3A2A20"/>
  <path d="M51.2 41.2 Q55.6 39.6 59.7 41.9 L59 43 Q55.6 41.2 51.5 42.6 Z" fill="#3A2A20"/>

  <!-- ══ ГЛАЗА (большие, cat eye, два блика) ══ -->
  <!-- Левый -->
  <ellipse cx="40.6" cy="47.9" rx="3.5" ry="4.1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.3" cy="48.1" r="2.7" fill="#1F3A5F"/>
  <circle cx="41.4" cy="48.2" r="1.2" fill="#1A1A1A"/>
  <circle cx="40.4" cy="46.9" r="0.95" fill="#F5E9D0"/>
  <circle cx="42.3" cy="49.3" r="0.5" fill="#F5E9D0"/>
  <!-- Веки и складка -->
  <path d="M37 46 Q40.4 43.4 44.3 45.5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M37.2 45.8 Q36 44.6 34.9 44.3" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M38.6 43.7 Q40.8 42.6 43.4 43.2" fill="none" stroke="#E3B48A" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Нижние ресницы -->
  <path d="M38.2 51.4 Q40.6 52.3 43.4 51.7" fill="none" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Правый -->
  <ellipse cx="55.4" cy="47.9" rx="3.5" ry="4.1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.7" cy="48.1" r="2.7" fill="#1F3A5F"/>
  <circle cx="54.6" cy="48.2" r="1.2" fill="#1A1A1A"/>
  <circle cx="53.8" cy="46.9" r="0.95" fill="#F5E9D0"/>
  <circle cx="55.7" cy="49.3" r="0.5" fill="#F5E9D0"/>
  <path d="M51.7 45.5 Q55.6 43.4 59 46" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M58.8 45.8 Q60 44.6 61.1 44.3" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M52.6 43.2 Q55.2 42.6 57.4 43.7" fill="none" stroke="#E3B48A" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M52.6 51.7 Q55.4 52.3 57.8 51.4" fill="none" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round"/>

  <!-- ══ НОС (изящный: переносица + ноздри + блик) ══ -->
  <path d="M47.8 44.5 Q47.2 48.5 46.6 51" fill="none" stroke="#E3B48A" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="46" cy="52.3" rx="0.9" ry="0.6" fill="#E3B48A"/>
  <ellipse cx="50.6" cy="52.1" rx="0.9" ry="0.6" fill="#E3B48A"/>
  <circle cx="47.3" cy="51.4" r="0.75" fill="#F5E9D0"/>

  <!-- ══ ГУБЫ (лук Купидона + глянец) ══ -->
  <path d="M42.3 57.2 Q44.8 55.6 46.6 56.8 Q48 57.7 49.4 56.8 Q51.2 55.6 53.7 57.2 Q51.2 62.8 48 62.8 Q44.8 62.8 42.3 57.2 Z"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M43.4 57.9 Q48 59.4 52.6 57.9" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="46.2" cy="60.3" rx="1.6" ry="0.9" fill="#F5E9D0"/>
  <ellipse cx="50.6" cy="60.5" rx="1" ry="0.6" fill="#F5E9D0"/>

  <!-- ══ МУШКА ══ -->
  <circle cx="53.9" cy="55.2" r="0.85" fill="#3A2A20"/>

  <!-- ══ РУМЯНЕЦ + хайлайт скулы ══ -->
  <circle cx="35.8" cy="52.5" r="2" fill="#E0824A"/>
  <circle cx="60.2" cy="52.5" r="2" fill="#E0824A"/>
  <circle cx="37.6" cy="50.6" r="0.9" fill="#F5E9D0"/>

  <!-- ══ ЧЁЛКА (запечена, с бликом) ══ -->
  <path d="M31.5 37 Q33 21.5 48 20 Q63 21.5 64.5 37 Q57 29.5 48 31.5 Q39 29.5 31.5 37 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M38 27 Q48 23.5 58 27" fill="none" stroke="#7A4A2A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ══ БЕРЕТ (var, набекрень) ══ -->
  <path d="M29.5 21.5 Q32.5 9.5 47 9 Q63 8.5 66.5 19.5 Q68 25.5 60 25.5 L37 25.5 Q29.5 25.5 29.5 21.5 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 9.2 Q63 8.8 66.5 19.5 Q68 25.5 60 25.5 L50 25.5 Z" fill="#1A1A1A" opacity="0.15"/>
  <rect x="46.5" y="6.5" width="3.5" height="5" rx="1.7"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- ══ СЕРЬГИ-ЖЕМЧУЖИНЫ ══ -->
  <circle cx="31.5" cy="52" r="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="64.5" cy="52" r="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
</svg>
