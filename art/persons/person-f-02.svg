  <path d="M44 58.2 Q48 59.5 52 58.2" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round"/>
  <ellipse cx="46.4" cy="59.8" rx="1.4" ry="0.8" fill="#F5E9D0"/>

  <!-- ══ РУМЯНЕЦ ══ -->
  <circle cx="35.6" cy="53" r="1.8" fill="#E0824A"/>
  <circle cx="60.4" cy="53" r="1.8" fill="#E0824A"/>

  <!-- ══ СЕРЬГИ-ГВОЗДИКИ ══ -->
  <circle cx="31.5" cy="52.5" r="1.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
  <circle cx="64.5" cy="52.5" r="1.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
</svg>
