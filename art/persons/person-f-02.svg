  <circle cx="40.6" cy="47.8" r="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="55.4" cy="47.8" r="6" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M46.6 47.8 L49.4 47.8" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
