  <circle cx="47.3" cy="51.4" r="0.75" fill="#F5E9D0"/>

  <!-- ══ ГУБЫ (сдержанная полуулыбка) ══ -->
  <path d="M43 57.6 Q45.6 56 47.9 57.3 Q48 57.4 48.1 57.3 Q50.4 56 53 57.6 Q51 61.8 48 61.8 Q45 61.8 43 57.6 Z"
