  <path d="M45.5 78 L40.5 75.5 Q38.8 77.5 39.3 80.5 Q39.8 82.8 41.2 83 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.3" stroke-linejoin="round"/>
