    fill="var(--person-clothing, #8A8A8A)". Кожа F2C9A0 (тень E3B48A).
    Без drop-теней (гайд §5).
  -->

  <!-- ══ ВОЛОСЫ: ПУЧОК (запечён, тёмный) ══ -->
  <circle cx="48" cy="17.5" r="8.5" fill="#3A3238" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M43 13.5 Q48 10 53.5 14" fill="none" stroke="#5A4636" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42 19 Q48 22.5 54.5 19.5" fill="none" stroke="#5A4636" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Причёска: гладкие волосы по бокам головы -->
  <path d="M29.5 47 Q27.5 30 40 26.5 Q48 24.5 56 26.5 Q68.5 30 66.5 47 L64.5 47 Q66 32 55 29.5 Q48 27.8 41 29.5 Q30 32 31.5 47 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
