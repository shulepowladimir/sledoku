<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-m-03 — архивариус Себастьян: лысина с седым венцом, монокль,
    морщины, бабочка. Свитер красится игрой: fill="var(--person-clothing, #8A8A8A)".
    Кожа F2C9A0 (тень E3B48A) — бледный книжный тип. Без drop-теней (гайд §5).
  -->

  <!-- ══ СВИТЕР (var) С ВОРОТНИКОМ-ПОЛО ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
        fill="var(--person-clothing, #8A8A8A)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 71 L70 71 Q86 71 86 84 L86 92 L60 92 Z" fill="#1A1A1A" opacity="0.15"/>
  <!-- Воротник-поло -->
  <path d="M38 71 L44 78 L48 73 L52 78 L58 71" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 71 Q43 76.5 44 78 L41.5 82 Q38 77 36.5 72 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M58 71 Q53 76.5 52 78 L54.5 82 Q58 77 59.5 72 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Резинка свитера -->
  <rect x="12" y="87.5" width="72" height="1.6" fill="#1A1A1A" opacity="0.15"/>

  <!-- ══ БАБОЧКА (акцент) ══ -->
  <path d="M44.5 80 L39 76.5 Q37 78.5 37.5 82 Q38 85 39.5 85.5 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M51.5 80 L57 76.5 Q59 78.5 58.5 82 Q58 85 56.5 85.5 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="45.5" y="78.6" width="5" height="4.8" rx="1.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- ══ ШЕЯ ══ -->
  <rect x="42" y="60" width="12" height="12" rx="3" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="42" y="60" width="12" height="4.5" rx="2.2" fill="#E3B48A"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="29.5" cy="49" rx="4" ry="6" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="66.5" cy="49" rx="4" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.2 46.8 Q30.6 49 28.8 51.4" fill="none" stroke="#E3B48A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M67.2 46.8 Q64.8 49 66.6 51.4" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ ГОЛОВА ══ -->
  <circle cx="48" cy="48" r="19" fill="#F2C9A0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Cel-тень: правая сторона лица -->
  <path d="M60 33.3 A19 19 0 0 1 60 62.7 A15.5 15.5 0 0 0 60 33.3 Z" fill="#E3B48A"/>
  <!-- Блик на лысине -->
  <ellipse cx="42" cy="36" rx="5.5" ry="3" fill="#F5E9D0"/>
  <!-- Морщины на лбу -->
  <path d="M37 36.5 Q48 33.5 59 36.5" fill="none" stroke="#E3B48A" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M38.5 40 Q48 37.4 57.5 40" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ══ СЕДОЙ ВЕНЕЦ (по бокам за ушами) ══ -->
  <path d="M29.2 43 Q26.8 33.5 33.5 29 Q37 26.8 40 28.5 L38 33.5 Q31.5 36 32.6 44.5 Q30.6 45.2 29.2 43 Z"
        fill="#C9A24A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M66.8 43 Q69.2 33.5 62.5 29 Q59 26.8 56 28.5 L58 33.5 Q64.5 36 63.4 44.5 Q65.4 45.2 66.8 43 Z"
