  <!-- ══ БРОВИ (седые, кустистые, приподнятые) ══ -->
  <path d="M35.6 43.4 Q39.2 40.2 44.6 41.4 L44.2 43.6 Q39.8 42.6 36.6 44.8 Z" fill="#C9A24A" stroke="#3A2A20" stroke-width="0.5"/>
  <path d="M51.4 41.4 Q56.8 40.2 60.4 43.4 L59.4 44.8 Q56.2 42.6 51.8 43.6 Z" fill="#C9A24A" stroke="#3A2A20" stroke-width="0.5"/>

  <!-- ══ ГЛАЗА (зелёные, чуть уставшие) ══ -->
  <ellipse cx="40.5" cy="47.6" rx="3.3" ry="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="41.2" cy="47.9" r="2.3" fill="#2E6E65"/>
  <circle cx="41.3" cy="48" r="1.05" fill="#1A1A1A"/>
  <circle cx="40.5" cy="47" r="0.65" fill="#F5E9D0"/>
  <path d="M37.3 46.1 Q40.5 43.8 43.9 45.9" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M38 51.6 Q40.6 52.6 43.4 51.8" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="55.5" cy="47.6" rx="3.3" ry="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.3"/>
  <circle cx="54.8" cy="47.9" r="2.3" fill="#2E6E65"/>
  <circle cx="54.7" cy="48" r="1.05" fill="#1A1A1A"/>
  <circle cx="54" cy="47" r="0.65" fill="#F5E9D0"/>
  <path d="M52.1 45.9 Q55.5 43.8 58.7 46.1" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M52.6 51.8 Q55.4 52.6 58 51.6" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ══ НОС (длинный, с горбинкой) ══ -->
  <path d="M48 42.5 Q46.8 47.5 46 51.5 Q44.8 53.8 46 55.2" fill="none" stroke="#E3B48A" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="45.2" cy="56" rx="1" ry="0.7" fill="#E3B48A"/>
  <ellipse cx="50.8" cy="55.7" rx="1" ry="0.7" fill="#E3B48A"/>
  <circle cx="46.9" cy="54" r="0.8" fill="#F5E9D0"/>

  <!-- ══ РТ (мягкая улыбка + морщины у глаз... у рта) ══ -->
  <path d="M42 60 Q48 64.4 54 59.4" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 62.4 Q48 64.6 51.8 62.2 Q48.5 63.6 44 62.4 Z" fill="#E3B48A"/>
  <!-- Морщинки-скобки у рта -->
  <path d="M39.5 58.8 Q38.4 60.8 39.6 62.6" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M56.5 58.4 Q57.6 60.4 56.4 62.2" fill="none" stroke="#E3B48A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- ══ МОНОКЛЬ (на правом глазу) + ЦЕПОЧКА ══ -->
  <circle cx="55.5" cy="47.6" r="5.4" fill="none" stroke="#E0A94A" stroke-width="2.4"/>
  <circle cx="55.5" cy="47.6" r="5.4" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
  <!-- Блик стекла -->
  <path d="M52.2 45 Q53.5 43.9 55.3 43.8" fill="none" stroke="#F5E9D0" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Цепочка вниз к жилету -->
  <path d="M58.5 52 Q61 60 60.5 66 Q60.2 70 62 73.5" fill="none" stroke="#E0A94A" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="62.3" cy="74.5" r="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.8"/>
</svg>
