  <path d="M35 41.3 Q48 38.6 61 41.3 L60.5 43.3 Q48 40.6 35.5 43.3 Z" fill="#C98B5E"/>

  <!-- ══ ГАРДЕНИЯ (красная, над левым ухом) ══ -->
  <g stroke="#1A1A1A" stroke-width="1.1" stroke-linejoin="round">
    <path d="M33 34.5 Q30.5 31.5 32.8 29.2 Q35.5 28.6 36.8 31.2 Q36 33.6 33 34.5 Z" fill="#C8102E"/>
    <path d="M36.8 31.2 Q39.8 29.8 41 32.4 Q40.2 34.9 37.2 34.8 Q35.9 33.3 36.8 31.2 Z" fill="#C8102E"/>
    <path d="M37.2 34.8 Q39.5 37 37.6 39 Q35.2 39.8 33.8 37.6 Q33.9 35.6 37.2 34.8 Z" fill="#C8102E"/>
    <path d="M33.8 37.6 Q31 38.4 30.2 36.2 Q30.8 33.9 33 34.5 Q33.7 35.7 33.8 37.6 Z" fill="#C8102E"/>
    <circle cx="35.1" cy="34.2" r="1.7" fill="#E0A94A" stroke-width="1"/>
  </g>
  <!-- Листик -->
  <path d="M31 38.5 Q28.5 40.5 27.5 43.5 Q30.5 42.5 32 40.5 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
