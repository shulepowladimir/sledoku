  <path d="M47.8 44.5 Q47.2 48.5 46.6 51" fill="none" stroke="#C98B5E" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="46" cy="52.3" rx="0.9" ry="0.6" fill="#C98B5E"/>
  <ellipse cx="50.6" cy="52.1" rx="0.9" ry="0.6" fill="#C98B5E"/>
  <circle cx="47.3" cy="51.4" r="0.75" fill="#F5E9D0"/>

  <!-- ══ ГУБЫ (выразительная улыбка, лук Купидона + глянец) ══ -->
  <path d="M41.8 56.8 Q44.8 55.4 46.6 56.6 Q48 57.5 49.4 56.6 Q51.2 55.4 54.2 56.8 Q51.6 63.4 48 63.4 Q44.4 63.4 41.8 56.8 Z"
