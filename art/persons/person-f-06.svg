  <path d="M43 57.6 Q48 59.4 53 57.6" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="46" cy="60.6" rx="1.6" ry="0.9" fill="#F5E9D0"/>
  <ellipse cx="50.4" cy="60.8" rx="1" ry="0.6" fill="#F5E9D0"/>

  <!-- ══ РУМЯНЕЦ (сценический) ══ -->
  <circle cx="36" cy="52.8" r="2.2" fill="#E0824A"/>
  <circle cx="60" cy="52.8" r="2.2" fill="#E0824A"/>
  <circle cx="37.8" cy="50.8" r="0.9" fill="#F5E9D0"/>

  <!-- ══ ВОЛОСЫ: ВЫСОКАЯ ГЛАДКАЯ УКЛАДКА (запечена) ══ -->
  <!-- Валик надо лбом -->
  <path d="M31.5 40 Q27 21 44 16.5 Q48 16 52 16.5 Q69 21 64.5 40 L61.5 40 Q65 24.5 52 20 Q48 19.4 44 20 Q31 24.5 34.5 40 Z"
        fill="#3A3238" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Гладкие боковые пряди к ушам -->
  <path d="M31.5 40 Q30.5 30 34 24 Q32 30.5 33.5 40 Z" fill="#3A3238" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M64.5 40 Q65.5 30 62 24 Q64 30.5 62.5 40 Z" fill="#3A3238" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Волны укладки (блики) -->
  <g fill="none" stroke="#5A4636" stroke-width="1.5" stroke-linecap="round">
    <path d="M37 34 Q39.5 26 46 22.5"/>
    <path d="M59 34 Q56.5 26 50 22.5"/>
  </g>
  <path d="M42 20.5 Q48 18.5 54 20.5" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
