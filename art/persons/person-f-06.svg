  <g fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.7">
    <circle cx="40" cy="73.5" r="1.3"/>
    <circle cx="43" cy="76" r="1.4"/>
    <circle cx="48" cy="77" r="1.5"/>
    <circle cx="53" cy="76" r="1.4"/>
    <circle cx="56" cy="73.5" r="1.3"/>
