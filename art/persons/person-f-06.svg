  <path d="M58.8 45.8 Q60.2 44.4 61.7 44" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M52.6 51.7 Q55.4 52.3 57.8 51.4" fill="none" stroke="#1A1A1A" stroke-width="1.1" stroke-linecap="round"/>

