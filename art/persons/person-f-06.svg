  <rect x="43" y="60" width="10" height="4.5" rx="2.2" fill="#C98B5E"/>

  <!-- ══ УШИ ══ -->
  <ellipse cx="30" cy="48.5" rx="4" ry="6" fill="#E3B48A" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="66" cy="48.5" rx="4" ry="6" fill="#C98B5E" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M28.7 46.3 Q31.1 48.5 29.3 50.9" fill="none" stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M66.7 46.3 Q64.3 48.5 66.1 50.9" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ══ СЕРЬГИ-ЦЕПОЧКИ (длинные) ══ -->
  <path d="M30 55 Q30 57 30 59" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M30 56.2" fill="none" stroke="#E0A94A" stroke-width="1.4"/>
  <circle cx="30" cy="55.2" r="1.1" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.8"/>
  <path d="M30 60.5 Q31.7 63 30 65.8 Q28.3 63 30 60.5 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9" stroke-linejoin="round"/>
