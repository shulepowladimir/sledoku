  <path d="M66 56.6 Q66 58.4 66 60.2" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M66 61.5 Q67.7 64 66 66.8 Q64.3 64 66 61.5 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9" stroke-linejoin="round"/>

