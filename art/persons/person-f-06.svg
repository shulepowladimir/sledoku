<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    person-f-06 — певица, бюст.
    Высокая гладкая укладка (запечена, чёрная с бликами), красная гардения
    над левым ухом, длинные серьги-цепочки, золотое колье. Платье красится
    игрой: fill="var(--person-clothing, #8A8A8A)". Кожа E3B48A
    (тень C98B5E), карие глаза, драматичный макияж.
    Без drop-теней (гайд §5): объём — cel-тени и контур.
  -->

  <!-- ══ ПЛАТЬЕ (var) ══ -->
  <path d="M10 92 L10 84 Q10 71 26 71 L70 71 Q86 71 86 84 L86 92 Z"
