<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    coconut — кокос: коричневый ворсистый орех с тремя «глазками»,
    из него торчат соломинка (красная в полоску) и лист пальмы.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="82" rx="28" ry="5.5" fill="#3A2A20"/>

  <!-- Лист пальмы за кокосом -->
  <path d="M72 66 Q84 58 88 44 Q76 48 70 60 Q68 64 72 66 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M74 62 Q80 54 84 48" fill="none" stroke="#44663A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Орех -->
  <circle cx="46" cy="56" r="26" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Ворс (волокнистые штрихи) -->
  <g fill="none" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round">
    <path d="M26 48 Q28 44 31 41"/>
    <path d="M60 34 Q64 36 67 40"/>
    <path d="M24 60 Q25 64 28 68"/>
    <path d="M63 68 Q66 64 67 60"/>
    <path d="M38 32 Q42 30 46 30"/>
    <path d="M34 80 Q38 82 42 82"/>
    <path d="M52 81 Q56 80 59 78"/>
  </g>
  <!-- Блик (верх-слева) -->
  <path d="M28 42 Q34 35 42 33" fill="none" stroke="#E0824A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Три «глазка» -->
  <g fill="#3A2A20">
    <circle cx="40" cy="46" r="2.2"/>
    <circle cx="52" cy="46" r="2.2"/>
    <circle cx="46" cy="54" r="2.2"/>
  </g>

  <!-- Трещинка -->
  <path d="M62 52 Q65 56 63 60" fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Соломинка (красная в кремовую полоску) -->
  <g transform="rotate(18 56 40)">
    <rect x="54" y="14" width="4.5" height="30" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Полоски -->
    <path d="M55 20 H58 M55 26 H58 M55 32 H58" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Сгиб соломинки -->
    <path d="M54 14 L50 8 L58.5 11 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Зонтик-мини не влез: капелька сока у глазка (юмор) -->
  <path d="M46 58 Q47.2 60.5 46 62 Q44.8 60.5 46 58 Z" fill="#F5E9D0"/>
</svg>
