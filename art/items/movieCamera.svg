<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    movieCamera — старая кинокамера: два бобинных диска сверху,
    латунный корпус, объектив, видоискатель, тренога.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Тренога -->
  <g stroke="#8F5A3A" stroke-width="4" stroke-linecap="round">
    <path d="M42 72 L30 84"/>
    <path d="M54 72 L66 84"/>
    <path d="M48 72 L48 86"/>
  </g>
  <g stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round">
    <path d="M41 76 L33 82"/>
    <path d="M55 76 L63 82"/>
  </g>
  <!-- Болты -->
  <circle cx="48" cy="72" r="2.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Корпус (латунь) -->
  <rect x="28" y="38" width="40" height="26" rx="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="31" y="42" width="3.4" height="18" rx="1.7" fill="#E8B95F"/>
  <!-- Дверца с заклёпками -->
  <circle cx="62" cy="44" r="1.3" fill="#B87F33"/>
  <circle cx="62" cy="58" r="1.3" fill="#B87F33"/>

  <!-- Катушка 1 (левая) -->
  <circle cx="36" cy="22" r="10" fill="none" stroke="#B87F33" stroke-width="4"/>
  <circle cx="36" cy="22" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="36" cy="22" r="1.2" fill="#3A2A20"/>
  <!-- Плёнка на катушке (дуга) -->
  <path d="M29 26 Q36 33 43 26" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
  <!-- Катушка 2 (правая) -->
  <circle cx="58" cy="22" r="10" fill="none" stroke="#B87F33" stroke-width="4"/>
  <circle cx="58" cy="22" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="58" cy="22" r="1.2" fill="#3A2A20"/>
  <path d="M51 26 Q58 33 65 26" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
  <!-- Соединение катушек с корпусом -->
  <path d="M36 32 V38 M58 32 V38" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Объектив (труба вперёд) -->
  <rect x="66" y="44" width="12" height="10" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="79" cy="49" rx="2.6" ry="5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="79" cy="49" rx="1.1" ry="2.2" fill="#9CC3E0"/>

  <!-- Видоискатель сверху -->
  <rect x="44" y="30" width="8" height="6" rx="1.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="46" y="31.5" width="4" height="3" rx="0.8" fill="#9CC3E0"/>

  <!-- Кривая ручка-рычаг -->
  <circle cx="33" cy="36" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M33 33 L33 27" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
