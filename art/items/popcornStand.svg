<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    popcornStand — стойка с попкорном: тележка с колёсами, полосатый
    навес, стеклянный барабан с попкорном, стопка пакетов.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Колёса -->
  <circle cx="28" cy="80" r="7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="28" cy="80" r="2.2" fill="#5C6670"/>
  <circle cx="66" cy="80" r="7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="66" cy="80" r="2.2" fill="#5C6670"/>
  <!-- Спицы -->
  <path d="M28 74 V86 M22 80 H34 M24 76 L32 84 M32 76 L24 84" stroke="#5C6670" stroke-width="1.2"/>
  <path d="M66 74 V86 M60 80 H72 M62 76 L70 84 M70 76 L62 84" stroke="#5C6670" stroke-width="1.2"/>

  <!-- Корпус тележки -->
  <rect x="18" y="46" width="58" height="30" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик -->
  <path d="M22 50 L22 72" stroke="#E8B95F" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Филёнка-витрина -->
  <rect x="30" y="54" width="26" height="16" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Пакеты попкорна в витрине -->
  <path d="M33 60 L40 57 L43 68 L36 70 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M42 59 L49 56.5 L51 67.5 L44 69.5 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Столешница -->
  <rect x="16" y="42" width="62" height="7" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M20 45 L74 45" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Барабан с попкорном (стеклянный куб с крышкой) -->
  <rect x="34" y="22" width="22" height="20" rx="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Попкорн внутри (кремово-золотые комки) -->
  <circle cx="39" cy="35" r="3.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="46" cy="37" r="3.4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="52" cy="34" r="3" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="43" cy="31" r="2.8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="49" cy="29" r="2.6" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Блики стекла -->
  <path d="M37 26 L37 36" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Крышка барабана -->
  <rect x="36" y="18" width="18" height="5" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Навес (полосатый тент) -->
  <path d="M14 18 Q48 10 82 18 L78 14 Q48 6 18 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M14 18 Q48 10 82 18 L82 26 Q48 18 14 26 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Полосы тента -->
  <path d="M27 24.5 Q27 20.5 28.5 16 L36.5 14.5 Q34.5 19 34.5 23 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M48 22 Q48 17 48 12.5 L56 13.5 Q54 18 54 22.5 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M66 24.5 Q65 20 63.5 15.5 L71 17.5 Q71 21.5 71 25 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Стойки навеса -->
  <path d="M17 24 L17 42 M79 24 L79 42" stroke="#B87F33" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Пакет попкорна на столешнице (готовый) -->
  <path d="M56 34 L68 32 L70 42 L58 44 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Торчащий попкорн из пакета -->
  <circle cx="61" cy="32" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="65" cy="31" r="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Полоска на пакете -->
  <path d="M59 38.5 L68 37" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
</svg>
