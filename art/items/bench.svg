<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bench — парковая скамейка: спинка ШИРЕ сиденья, деревянные планки,
    металлические боковины-ножки (сталь: D5DCE1/9BA5AD/5C6670).
    Посадочная зона — центр-низ.
  -->
  <!-- Тень-подложка -->
  <rect x="15.5" y="82.5" width="66" height="8" rx="4" fill="#3A2A20"/>

  <!-- Металлические боковины (выходят вверх под широкую спинку) -->
  <path d="M17 86 L15 46 Q15 38 21 38 Q26 38 25 44 L23 86 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M79 86 L81 46 Q81 38 75 38 Q70 38 71 44 L73 86 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Завиток-декор (тёмная сталь) -->
  <path d="M20 54 Q15 58 19 62 Q23 65 21 70" fill="none" stroke="#5C6670" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M76 54 Q81 58 77 62 Q73 65 75 70" fill="none" stroke="#5C6670" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Блики на боковинах -->
  <path d="M18.5 48 L17.5 82 M77.5 48 L78.5 82" stroke="#D5DCE1" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Подлокотники-крюки -->
  <path d="M21 38 Q21 30 29 30" fill="none" stroke="#9BA5AD" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M75 38 Q75 30 67 30" fill="none" stroke="#9BA5AD" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Планки спинки (ШИРЕ сиденья) -->
  <rect x="12" y="16" width="72" height="7" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="12" y="27" width="72" height="7" rx="3" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Планки сиденья (уже, посадочная зона) -->
  <rect x="21" y="46" width="54" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="21" y="57" width="54" height="8" rx="3" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Блики на планках -->
  <path d="M20 18.5 H40 M26 49.5 H44" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Болты на боковинах -->
  <circle cx="20" cy="50" r="1.4" fill="#5C6670"/>
  <circle cx="76" cy="50" r="1.4" fill="#5C6670"/>
</svg>
