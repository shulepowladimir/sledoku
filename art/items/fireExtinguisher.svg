<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fireExtinguisher — огнетушитель (1кл, decorative): красный баллон,
    стальной рычаг-ручка, манометр, шланг с раструбом. Функциональный
    красный (прецедент punchingBag), свет сверху-слева.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="20" ry="5" fill="#3A2A20"/>

  <!-- Основание-подставка -->
  <path d="M34 80 Q48 88 62 80 L62 84 Q48 90 34 84 Z" fill="#545D65" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Баллон: капсула шире снизу -->
  <path d="M36 30
           Q36 24 42 23
           L54 23
           Q60 24 60 30
           L62 78
           Q62 83 57 83
           L39 83
           Q34 83 34 78
           Z"
        fill="#C8102E" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Тёмная грань справа -->
  <path d="M55 23.4 L54 23 Q60 24 60 30 L62 78 Q62 83 57 83 L52 83 L58 32 Z" fill="#7A0E1D"/>
  <!-- Блик слева -->
  <path d="M40 29 V79" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>

  <!-- Горловина -->
  <rect x="42" y="16" width="12" height="9" rx="2.5" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Рычаг-ручка -->
  <path d="M36 13 Q48 8 62 14 L60 18 Q48 13 38 17 Z" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="48" cy="15" r="2.6" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Манометр -->
  <circle cx="68" cy="22" r="6.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M68 22 L71 18.5" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42 19 Q55 15 64 19" fill="none" stroke="#545D65" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Шланг с раструбом -->
  <path d="M42 19 Q24 24 26 42 Q27 56 38 62" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 19 Q26 24 28 42 Q29 54 38 60" fill="none" stroke="#453E3B" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Раструб-конус -->
  <path d="M36 58 L46 66 L38 76 Q30 72 32 64 Z" fill="#453E3B" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M38 65 L43 69" stroke="#939CA2" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Живая деталь: этикетка-ромб на баллоне -->
  <rect x="44" y="46" width="10" height="10" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" transform="rotate(45 49 51)"/>
  <path d="M49 47.5 V50 M49 52.5 V54.5" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
