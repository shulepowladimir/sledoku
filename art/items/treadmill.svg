<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    treadmill — беговой тренажёр: вид сбоку, стальная рама,
    наклонная беговая дорожка, консоль с дугой-поручнем.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Беговое полотно (наклонная плита с лентой) -->
  <polygon points="18,70 70,56 76,66 24,80" fill="#5C6670" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Лента (тёмная, с поперечными валиками) -->
  <polygon points="22,68 68,56 72,63 26,75" fill="#3A2A20"/>
  <g stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round">
    <path d="M30 74.5 L26.5 67"/>
    <path d="M40 72 L36.5 64.5"/>
    <path d="M50 69.5 L46.5 62"/>
    <path d="M60 67 L56.5 59.5"/>
  </g>
  <!-- Вал спереди -->
  <ellipse cx="72" cy="61" rx="4" ry="7" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Вал сзади -->
  <ellipse cx="21" cy="75" rx="3.4" ry="6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Рама (сталь) -->
  <path d="M24 80 L30 60 L70 50" fill="none" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <path d="M25 77 L30.5 61 L69 51" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Задняя стойка рамы -->
  <path d="M24 80 L22 84" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <!-- Передняя опора -->
  <path d="M70 50 L74 82" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <path d="M71.5 55 L74.5 80" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Поперечина у пола -->
  <path d="M22 84 L74 82" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>

  <!-- Стойка консоли -->
  <path d="M70 50 L66 34" stroke="#9BA5AD" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Консоль (панель) -->
  <rect x="52" y="20" width="24" height="15" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Экранчик -->
  <rect x="56" y="23" width="12" height="7" rx="1.5" fill="#F5E9D0"/>
  <path d="M58 25.5 H66 M58 27.5 H63" stroke="#2E6E65" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Кнопка -->
  <circle cx="71" cy="30" r="1.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="0.9"/>

  <!-- Дуга-поручень -->
  <path d="M56 30 Q42 34 38 48" fill="none" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M56.5 31.5 Q44 35 40 46.5" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Перекладина поручня -->
  <path d="M38 48 L30 52" stroke="#9BA5AD" stroke-width="3.6" stroke-linecap="round"/>
</svg>
