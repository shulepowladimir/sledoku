<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    roadBarrier — переносное дорожное ограждение со светоотражающими полосами.
    Диагональная постановка добавляет живую форму дорожному разделителю.
  -->
  <!-- Тень-подложка -->
  <path d="M19 70 Q48 61 79 70 L82 77 Q50 84 17 77 Z" fill="#3A2A20"/>

  <!-- Ножки со стальными опорами -->
  <path d="M29 56 L36 57 L31 78 L24 78 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M66 56 L73 55 L78 76 L71 78 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M23 76 Q28 73 34 76 L34 81 Q28 83 22 81 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M69 76 Q75 73 80 75 L82 80 Q75 83 70 81 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Перекладина -->
  <path d="M13 28 Q47 20 82 28 L80 56 Q47 63 15 56 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M17 31 Q25 29 33 28 L42 29 L25 57 L16 55 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M42 28 L57 27 L40 60 L30 58 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M67 27 Q75 27 82 29 L80 39 L71 57 L57 59 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Скруглённые торцы и стальные крепления -->
  <path d="M15 32 Q47 24 80 31" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="20" cy="43" r="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="76" cy="42" r="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
