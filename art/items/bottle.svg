<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bottle — бутылка с письмом: голубая стеклянная бутылка лежит на песке,
    пробка, свиток письма виден сквозь стекло и торчит из горлышка.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="74" rx="38" ry="6" fill="#3A2A20"/>

  <!-- Песчаная дюна -->
  <path d="M10 72 Q30 62 48 70 Q68 78 86 68 Q88 72 84 76 L14 76 Q10 74 10 72 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Песчинки -->
  <circle cx="20" cy="70" r="1" fill="#B87F33"/>
  <circle cx="74" cy="72" r="1.2" fill="#B87F33"/>
  <circle cx="60" cy="74" r="0.9" fill="#B87F33"/>

  <!-- Бутылка (лёжа, слегка под углом) -->
  <g transform="rotate(-7 48 52)">
    <!-- Корпус -->
    <path d="M27 41 H55 Q64 41 66 47 L66 57 Q64 63 55 63 H27 Q17 63 17 52 Q17 41 27 41 Z"
          fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Горлышко -->
    <path d="M66 47.5 L78 47.5 Q83 47.5 83 52 Q83 56.5 78 56.5 L66 56.5 Z"
          fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Письмо внутри (свиток сквозь стекло) -->
    <rect x="26" y="48.5" width="30" height="7" rx="3.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M32 52 H50" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="26" cy="52" r="2.4" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
    <!-- Пробка -->
    <rect x="80" y="46.5" width="10" height="11" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M82 49.5 L88 49.5" stroke="#8F5A3A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Свиток, торчащий из пробки -->
    <path d="M88 48 Q95 45 94 50 Q96 54 89 55 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Блик стекла -->
    <path d="M24 46 Q34 44.5 44 46" fill="none" stroke="#9CC3E0" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M70 49.5 L74 49.5" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Морская звезда на песке (юмор-деталь) -->
  <path d="M24 72 L26.5 67.5 L31 67 L28.5 71 L30.5 75.5 L25.5 73.5 L20.8 76 L22.5 71.5 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
