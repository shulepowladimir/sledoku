<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    telescope — телескоп на штативе: латунная труба под углом к небу,
    три ноги штатива, окуляр. Вид 3/4.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Ноги штатива (три, расходятся) -->
  <g stroke="#8F5A3A" stroke-width="4" stroke-linecap="round">
    <path d="M48 60 L28 82"/>
    <path d="M48 60 L68 82"/>
    <path d="M48 60 L48 84"/>
  </g>
  <!-- Блики на ногах -->
  <g stroke="#C98B5E" stroke-width="1.4" stroke-linecap="round">
    <path d="M46.5 64 L31 80"/>
    <path d="M49.5 64 L63 80"/>
  </g>
  <!-- Болты-скрепы -->
  <circle cx="48" cy="60" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Наконечники -->
  <g fill="#3A2A20">
    <circle cx="28" cy="82.5" r="2"/>
    <circle cx="68" cy="82.5" r="2"/>
    <circle cx="48" cy="84" r="2"/>
  </g>

  <!-- Платформа-голова штатива -->
  <ellipse cx="48" cy="56" rx="10" ry="4.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Труба телескопа (под углом вверх-влево... вверх-вправо) -->
  <g transform="rotate(-32 48 46)">
    <!-- Основная труба -->
    <rect x="22" y="38" width="44" height="14" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
    <!-- Блик вдоль трубы -->
    <rect x="25" y="40.5" width="38" height="3" rx="1.5" fill="#E8B95F"/>
    <!-- Кольца-муфты -->
    <rect x="34" y="37.5" width="5" height="15" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
    <rect x="52" y="37.5" width="5" height="15" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Объектив (широкий конец) -->
    <rect x="64" y="35" width="8" height="20" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
    <ellipse cx="72" cy="45" rx="2.5" ry="8.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
    <ellipse cx="72" cy="45" rx="1.2" ry="4.5" fill="#D5DCE1"/>
    <!-- Окуляр (узкий конец) -->
    <rect x="14" y="40" width="8" height="10" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  </g>

  <!-- Искра-звёздочка у объектива (смотрит в небо) -->
  <g stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round">
    <path d="M20 18 L20 23"/>
    <path d="M14 21 L17 23.5"/>
    <path d="M26 21 L23 23.5"/>
  </g>
  <circle cx="20" cy="15.5" r="1.6" fill="#E8B95F"/>
</svg>
