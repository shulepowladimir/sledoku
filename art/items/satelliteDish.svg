<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    satelliteDish — спутниковая тарелка (станция): параболическая
    стальная чаша под углом к небу, облучатель на штанге, сигнал-дуги.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Сигнал-дуги (голубые) -->
  <path d="M26 26 Q20 18 22 8" fill="none" stroke="#9CC3E0" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M32 30 Q28 22 30 14" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="21.5" cy="6" r="1.6" fill="#9CC3E0"/>
  <circle cx="29.5" cy="12" r="1.3" fill="#9CC3E0"/>

  <!-- Чаша (параболическая, вид 3/4 сбоку) -->
  <path d="M22 58 Q18 34 40 24 Q44 22.5 48 23 Q42 42 52 62 Q36 66 22 58 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Внутренняя поверхность (светлее) -->
  <path d="M27 55 Q25 38 40 30 Q41 46 47 58 Q37 61 27 55 Z" fill="#D5DCE1"/>
  <!-- Концентрические дуги чаши -->
  <path d="M31 52 Q31 40 40 34 M35 55 Q36 46 44 57" fill="none" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Внешняя кромка -->
  <path d="M22 58 Q36 66 52 62" fill="none" stroke="#5C6670" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Штанга облучателя -->
  <path d="M47 44 L58 36" stroke="#5C6670" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Облучатель (латунный конус) -->
  <path d="M56 38 L64 30 L66 36 L60 42 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="63.5" cy="32" r="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Поворотный узел -->
  <circle cx="49" cy="62" r="5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="49" cy="62" r="1.8" fill="#D5DCE1"/>
  <!-- Стойка -->
  <rect x="46" y="66" width="6" height="14" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="47.2" y="68" width="1.6" height="10" fill="#D5DCE1"/>
  <!-- База -->
  <path d="M34 84 H64" stroke="#5C6670" stroke-width="5" stroke-linecap="round"/>
  <path d="M38 82 H60" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
</svg>
