<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    flowerbed — клумба: деревянный бордер, тёмная земля,
    тюльпаны (красный + терракота) и ромашка, зелёные стебли.
  -->
  <!-- Деревянный бордер (передняя доска) -->
  <rect x="12" y="62" width="72" height="12" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M16 66 H80" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Торцы досок -->
  <path d="M30 62 V74 M66 62 V74" stroke="#8F5A3A" stroke-width="1.6"/>

  <!-- Земля (задник клумбы) -->
  <path d="M16 52 Q48 44 80 52 L80 62 L16 62 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Тюльпан красный (центр) -->
  <path d="M42 28 Q42 20 47 20 Q52 20 52 28 Q52 34 47 36 Q42 34 42 28 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M45 22 Q46.5 24 46 26 M49 22 Q50.5 24 50 26" fill="none" stroke="#F5E9D0" stroke-width="1" stroke-linecap="round"/>
  <path d="M47 36 Q46 45 44 54" stroke="#5E8A46" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Тюльпан терракотовый (слева) -->
  <path d="M24 34 Q24 27 28.5 27 Q33 27 33 34 Q33 39 28.5 41 Q24 39 24 34 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M28.5 41 Q28 47 27 53" stroke="#5E8A46" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Тюльпан терракотовый (справа) -->
  <path d="M62 32 Q62 25 66.5 25 Q71 25 71 32 Q71 37 66.5 39 Q62 37 62 32 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M66.5 39 Q67 45 68 52" stroke="#5E8A46" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Ромашка (кремовая, между красным и правым) -->
  <g transform="translate(56 30)">
    <ellipse cx="0" cy="-7" rx="3" ry="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="-7" rx="3" ry="5" transform="rotate(60)" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
    <ellipse cx="0" cy="-7" rx="3" ry="5" transform="rotate(120)" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="2.8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
  </g>
  <path d="M56 37 Q57 44 58 51" stroke="#5E8A46" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Листья -->
  <path d="M44 48 Q38 46 35 49 Q39 52 44 51 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M50 46 Q56 43 59 46 Q55 49 50 49 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M29 46 Q25 44 23 46 Q26 49 29 48 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Бутон-росток справа -->
  <path d="M74 48 Q76 44 79 45 Q78 49 74 50 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M76 49 Q77 53 78 56" stroke="#5E8A46" stroke-width="1.8" stroke-linecap="round"/>
</svg>
