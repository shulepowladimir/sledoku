<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    sofa — широкий диван: терракотовая ткань, кремовые подушки сиденья,
    валики-подлокотники, пуговицы капитоне. Посадочная зона — центр-низ.
  -->
  <!-- Тень-подложка -->
  <rect x="11.5" y="83.5" width="74" height="8" rx="4" fill="#3A2A20"/>

  <!-- Задние ножки -->
  <rect x="36" y="78" width="6" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="54" y="78" width="6" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Спинка -->
  <path d="M16 60 L16 34 Q16 22 28 22 L68 22 Q80 22 80 34 L80 60 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение правой части спинки -->
  <path d="M62 22 L68 22 Q80 22 80 34 L80 60 L62 60 Z" fill="#B85F2E"/>
  <!-- Блик на спинке -->
  <path d="M24 30 Q32 25 42 24.5" fill="none" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Пуговицы капитоне -->
  <g fill="#B85F2E" stroke="#3A2A20" stroke-width="0.8">
    <circle cx="32" cy="34" r="2"/>
    <circle cx="48" cy="34" r="2"/>
    <circle cx="64" cy="34" r="2"/>
    <circle cx="40" cy="46" r="2"/>
    <circle cx="56" cy="46" r="2"/>
  </g>

  <!-- Подушки сиденья (крем) -->
  <rect x="25" y="52" width="21" height="14" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="50" y="52" width="21" height="14" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M29 58 Q35.5 56 42 58 M54 58 Q60.5 56 67 58" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Основание (юбка) -->
  <rect x="22" y="66" width="52" height="10" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Валики-подлокотники -->
  <rect x="8" y="40" width="17" height="32" rx="8.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="71" y="40" width="17" height="32" rx="8.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Строчки на подлокотниках -->
  <rect x="12.5" y="45" width="8" height="22" rx="4" fill="none" stroke="#F5E9D0" stroke-width="1.5"/>
  <rect x="75.5" y="45" width="8" height="22" rx="4" fill="none" stroke="#F5E9D0" stroke-width="1.5"/>

  <!-- Передние ножки -->
  <rect x="24" y="76" width="7" height="11" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="65" y="76" width="7" height="11" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
</svg>
