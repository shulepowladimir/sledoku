<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    rock — валун: серый камень (стальная тройка тонов) с мшистой
    макушкой, трещинами и бликом. Органический, почти круглый силуэт.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="49" cy="82" rx="33" ry="6" fill="#3A2A20"/>

  <!-- Тело валуна (низ, потяжелевший) -->
  <path d="M20 78 Q13 62 20 48 Q27 32 46 30 Q66 28 75 44 Q83 60 76 72 Q70 80 58 81 L30 81 Q23 81 20 78 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик слева-сверху -->
  <path d="M28 44 Q32 36 42 34" fill="none" stroke="#D5DCE1" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 54 Q24 60 27 66" fill="none" stroke="#D5DCE1" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Затемнение правого низа -->
  <path d="M62 78 Q72 74 76 66 Q78 74 72 79 Z" fill="#5C6670"/>

  <!-- Мох на макушке -->
  <path d="M36 32 Q42 26 52 27 Q62 28 66 35 Q58 33 52 34 Q44 35 39 38 Q35 36 36 32 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M44 31.5 Q48 29.8 53 30.5" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Трещины -->
  <path d="M46 44 Q47 52 44 58" fill="none" stroke="#5C6670" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M47 50 Q52 53 55 52" fill="none" stroke="#5C6670" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M30 60 Q33 64 32 69" fill="none" stroke="#5C6670" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Отколотая плитка-осколок у подножия -->
  <polygon points="68,79 76,76 80,80 74,83" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Пара камешков -->
  <ellipse cx="24" cy="80" rx="4" ry="2.6" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.6"/>
  <ellipse cx="80" cy="82" rx="3" ry="2" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
