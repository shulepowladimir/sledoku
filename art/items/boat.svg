<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    boat — ял: деревянная парусная шлюпка, мачта с гротом и стакселем,
    красный вымпел, волны (голубая вода по канону).
  -->
  <!-- Тень-подложка (в воде) -->
  <ellipse cx="48" cy="80" rx="38" ry="5" fill="#3A2A20"/>

  <!-- Корпус -->
  <path d="M14 58 Q48 70 82 58 L74 76 Q48 84 22 76 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Фальшборт (линия планширя) -->
  <path d="M18 61 Q48 72 78 61" fill="none" stroke="#B87F33" stroke-width="2" stroke-linecap="round"/>
  <!-- Блик на борту -->
  <path d="M26 66 Q40 71 54 71" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Мачта -->
  <path d="M48 58 L48 12" stroke="#8F5A3A" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Гик -->
  <path d="M48 52 L76 52" stroke="#8F5A3A" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Грот (правый парус, надут) -->
  <path d="M51 17 Q62 38 79 53 L51 53 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Шов на гроте -->
  <path d="M54 26 Q60 38 70 49" fill="none" stroke="#9BA5AD" stroke-width="1.2"/>

  <!-- Стаксель (левый парус) -->
  <path d="M45 22 Q39 40 31 53 L45 53 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Красный вымпел на топе мачты -->
  <path d="M48 10 L59 13 L48 16 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Волны (голубые, поверх корпуса) -->
  <path d="M8 72 Q14 68 20 72 T32 72 T44 72 T56 72 T68 72 T80 72 T92 72"
        fill="none" stroke="#4A7BA6" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Блики волн -->
  <path d="M14 76 Q19 73.5 24 76 M52 77 Q57 74.5 62 77" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Брызги -->
  <circle cx="12" cy="67" r="1.4" fill="#9CC3E0"/>
  <circle cx="84" cy="67" r="1.4" fill="#9CC3E0"/>
</svg>
