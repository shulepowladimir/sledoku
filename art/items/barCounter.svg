<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    barCounter — барная стойка из тёмного коричневого дерева (top-down 3/4):
    филёнчатый фронт, латунный поручень, на столешнице — ряд разноцветных
    бутылок, стакан и латунный пивной кран над кружкой.
  -->
  <!-- Тень-подложка -->
  <rect x="13.5" y="81.5" width="70" height="8" rx="4" fill="#3A2A20"/>

  <!-- Фронт (тёмное дерево, панель с филёнками) -->
  <rect x="16" y="46" width="64" height="36" rx="3" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Филёнки -->
  <g fill="none" stroke="#B85F2E" stroke-width="2">
    <rect x="22" y="52" width="14" height="24" rx="2"/>
    <rect x="41" y="52" width="14" height="24" rx="2"/>
    <rect x="60" y="52" width="14" height="24" rx="2"/>
  </g>
  <!-- Блик слева на фронте -->
  <rect x="19" y="49" width="3.5" height="30" rx="1.7" fill="#B85F2E"/>

  <!-- Толщина столешницы (ближняя грань) -->
  <rect x="13" y="38" width="70" height="9" rx="2.5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M17 42 L79 42" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Столешница (тёмное дерево, top-down) -->
  <rect x="16" y="20" width="64" height="19" rx="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик-кант дальней кромки -->
  <path d="M21 24 Q48 21.5 75 24" fill="none" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Волокна -->
  <path d="M26 30 Q48 28 70 30 M30 35 Q48 33 66 35" fill="none" stroke="#8F5A3A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Латунный поручень у пола -->
  <rect x="18" y="72" width="60" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="22" cy="74" r="1.4" fill="#E8B95F"/>
  <circle cx="74" cy="74" r="1.4" fill="#E8B95F"/>

  <!-- Бутылки (слева, три разноцветные) -->
  <!-- Зелёная бутылка -->
  <path d="M22 36 L22 25 L24 22 L24 18 L26.5 18 L26.5 22 L28.5 25 L28.5 36 Q28.5 37.5 27 37.5 L23.5 37.5 Q22 37.5 22 36 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="23.6" y="15.5" width="3.4" height="3.4" rx="1" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M23.8 26 L23.8 34" stroke="#7FA85B" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Синяя бутылка (пузатая) -->
  <path d="M31 36 L31 27 L33 24.5 L33 21 L35.5 21 L35.5 24.5 L37.5 27 L37.5 36 Q37.5 37.5 36 37.5 L32.5 37.5 Q31 37.5 31 36 Z"
        fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="32.6" y="18.5" width="3.4" height="3.4" rx="1" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M32.8 28 L32.8 34" stroke="#4A7BA6" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Янтарная бутылка (высокая) -->
  <path d="M40 36 L40 23 L42 20.5 L42 16 L44.5 16 L44.5 20.5 L46.5 23 L46.5 36 Q46.5 37.5 45 37.5 L41.5 37.5 Q40 37.5 40 36 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="41.6" y="13.5" width="3.4" height="3.4" rx="1" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M41.8 24 L41.8 34" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Стакан с виски (голубое стекло) -->
  <path d="M48 27 L56 27 L55 37 Q55 38 54 38 L50 38 Q49 38 49 37 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Жидкость -->
  <path d="M49.6 32 L54.4 32 L54 37 Q54 38 53.6 38 L50.4 38 Q50 38 50 37 Z" fill="#E0A94A"/>
  <!-- Блик стекла -->
  <path d="M50 29 L50 34" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Пивной кран (латунная колонна справа) -->
  <rect x="67" y="23" width="6" height="13" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M68.4 25 L68.4 34" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Основание крана -->
  <ellipse cx="70" cy="36" rx="6.5" ry="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Рычаг -->
  <path d="M70 23 L63 17" stroke="#B87F33" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="62" cy="16" r="2.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Носик -->
  <path d="M67 29 Q63.5 29 63 31.5" fill="none" stroke="#E0A94A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Струйка пива -->
  <path d="M62.8 33 L62.8 35.5" stroke="#E0A94A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Кружка под краном -->
  <rect x="57" y="24.5" width="10" height="13" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Пиво в кружке -->
  <rect x="58.5" y="28" width="7" height="8" rx="1" fill="#E0A94A"/>
  <!-- Пена -->
  <circle cx="60" cy="26" r="1.4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="0.9"/>
  <circle cx="63.5" cy="25.5" r="1.7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="0.9"/>
  <circle cx="66" cy="26.8" r="1.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="0.9"/>
  <!-- Ручка кружки -->
  <path d="M58.5 27 Q55.5 29.5 58.5 32" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
