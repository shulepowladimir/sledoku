<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    shell — ракушка-спираль (остров): округлая аммонитовая спираль,
    терракота с молочно-кремовыми полосами, лежит на песке.
  -->
  <!-- Песок -->
  <path d="M8 78 Q28 68 48 74 Q68 80 88 70 Q90 74 86 78 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Песчинки -->
  <circle cx="16" cy="73" r="1" fill="#B87F33"/>
  <circle cx="76" cy="73" r="1.2" fill="#B87F33"/>
  <circle cx="64" cy="76" r="0.9" fill="#B87F33"/>

  <!-- Ракушка: округлая спираль -->
  <g transform="rotate(-6 49 44)">
    <!-- Внешний виток (терракота) -->
    <path d="M49 12 Q76 14 79 40 Q81 62 64 72 Q55 78 48 75 Q34 79 25 68 Q15 57 19 39 Q23 17 49 12 Z"
          fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Молочно-кремовый виток -->
    <path d="M49 21 Q68 23 71 41 Q72 57 59 64 Q53 68 48 66 Q38 70 30 60 Q23 51 26 40 Q29 23 49 21 Z"
          fill="#F5E9D0"/>
    <!-- Внутренний виток (терракота) -->
    <path d="M48 30 Q60 32 62 43 Q63 52 55 56 Q51 58 48 57 Q41 60 36 54 Q31 48 33 41 Q35 31 48 30 Z"
          fill="#E0824A"/>
    <!-- Кремовое ядро -->
    <ellipse cx="48.5" cy="43" rx="6.5" ry="6" fill="#F5E9D0"/>
    <!-- Центральная точка спирали -->
    <circle cx="48.5" cy="43" r="2.4" fill="#E0824A"/>

    <!-- Линия спирали (от центра наружу) -->
    <path d="M48.5 43 Q45 42.8 45 46 Q45.2 50.5 50.5 50 Q56.5 49 56 42.5 Q55.5 34 48 34.5 Q40 35 40.5 44 Q41 55 50 54.5 Q60 54 59.5 43 Q59 30.5 48.5 30.5"
          fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

    <!-- Рёбра на внешнем витке -->
    <g fill="none" stroke="#B85F2E" stroke-width="1.8" stroke-linecap="round">
      <path d="M49 13 L49 21"/>
      <path d="M65 17 L62 24"/>
      <path d="M79 42 L71 41.5"/>
      <path d="M68 63 L62 58"/>
      <path d="M55 73 L53 66"/>
      <path d="M33 68 L38 62"/>
      <path d="M22 55 L29 52"/>
      <path d="M27 22 L33 27"/>
    </g>

    <!-- Устье ракушки (тёмный проём снизу) -->
    <ellipse cx="48" cy="73.5" rx="4" ry="2.4" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.4"/>

    <!-- Молочный блик слева-сверху -->
    <path d="M34 22 Q28 28 27 36" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
