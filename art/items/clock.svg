<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    clock — круглые часы на золотом корпусе (та же версия, что была в батче 1,
    но без ножек и колокольчиков — настенный формат: вокзал, аэропорт).
    Стрелки 10:10, терракотовая секундная.
  -->
  <!-- Тень-подложка (стикер) -->
  <circle cx="50" cy="50" r="28" fill="#3A2A20"/>

  <!-- Корпус -->
  <circle cx="48" cy="50" r="27" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик на корпусе (слева-сверху) -->
  <path d="M29 34 Q33 27.5 40 25.5" fill="none" stroke="#E8B95F" stroke-width="3" stroke-linecap="round"/>

  <!-- Циферблат -->
  <circle cx="48" cy="50" r="21" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Деления -->
  <g stroke="#3A2A20" stroke-width="1.6" stroke-linecap="round">
    <path d="M48 31 L48 34"/>
    <path d="M48 66 L48 69"/>
    <path d="M29 50 L32 50"/>
    <path d="M64 50 L67 50"/>
  </g>
  <g stroke="#3A2A20" stroke-width="1" stroke-linecap="round">
    <path d="M34.6 36.6 L36.4 38.4 M61.4 36.6 L59.6 38.4"/>
    <path d="M34.6 63.4 L36.4 61.6 M61.4 63.4 L59.6 61.6"/>
  </g>
  <!-- Стрелки 10:10 (как в исходной версии) -->
  <line x1="48" y1="50" x2="37" y2="40" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="48" y1="50" x2="59" y2="39" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="48" y1="50" x2="48" y2="64" stroke="#C8102E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="50" r="2.4" fill="#1A1A1A"/>

  <!-- Ушко-крепление сверху -->
  <path d="M42 15 Q48 10 54 15" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
