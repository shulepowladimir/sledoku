<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    examTable — смотровой стол (кабинет врача): кремовая кушетка
    на стальной раме, бумажное полотенце с рулона у изголовья,
    полочка с красным крестом.
  -->
  <!-- Тень-подложка -->
  <rect x="14.5" y="82.5" width="68" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Стальная рама-ноги -->
  <path d="M22 50 L22 78 M74 50 L74 78" stroke="#9BA5AD" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M22 72 L74 72" stroke="#9BA5AD" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Опоры-пятки -->
  <path d="M14 80 H30 M66 80 H82" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <!-- Блики ног -->
  <path d="M20.8 54 L20.8 74 M72.8 54 L72.8 74" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Полочка с красным крестом -->
  <rect x="30" y="60" width="36" height="5" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="34" y="55" width="10" height="6" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="38" y="56" width="2.2" height="4" rx="0.6" fill="#C8102E"/>
  <rect x="36.9" y="57.1" width="4.4" height="1.8" rx="0.6" fill="#C8102E"/>

  <!-- Кушетка (кремовый матрас) -->
  <rect x="14" y="38" width="68" height="13" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Кнопки-утяжки -->
  <circle cx="34" cy="44.5" r="1.3" fill="#D5DCE1"/>
  <circle cx="62" cy="44.5" r="1.3" fill="#D5DCE1"/>
  <!-- Толщина матраса (нижняя грань) -->
  <rect x="16" y="47" width="64" height="4" rx="2" fill="#D5DCE1"/>

  <!-- Рулон бумаги у изголовья -->
  <rect x="8" y="36" width="10" height="17" rx="4" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="13" cy="40" r="1.6" fill="#B87F33"/>
  <!-- Лист бумаги поверх кушетки -->
  <path d="M18 40 Q30 36 48 38 Q66 40 80 37 L80 42 Q66 45 48 43 Q30 41 18 45 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Загнутый кончик листа (юмор-деталь) -->
  <path d="M80 37 Q84 36 84 40 Q82 42 80 42" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
