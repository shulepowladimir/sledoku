<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cryopod — криокапсула: вертикальная стальная капсула с круглым
    иллюминатором (голубое стекло, изморозь), панель управления,
    зелёный индикатор, холодный пар у шва. Стиль станции = сталь+латунь.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- База -->
  <rect x="28" y="78" width="40" height="8" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M32 81.5 H64" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Корпус капсулы -->
  <rect x="30" y="14" width="36" height="66" rx="17" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="35" y="22" width="4" height="50" rx="2" fill="#D5DCE1"/>
  <!-- Монтажные болты -->
  <circle cx="33.5" cy="30" r="1.4" fill="#5C6670"/>
  <circle cx="33.5" cy="64" r="1.4" fill="#5C6670"/>
  <circle cx="62.5" cy="30" r="1.4" fill="#5C6670"/>
  <circle cx="62.5" cy="64" r="1.4" fill="#5C6670"/>

  <!-- Иллюминатор (голубое стекло) -->
  <circle cx="48" cy="42" r="14" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Спящий силуэт в капсуле -->
  <path d="M44 40 Q44 34.5 49.5 34.5 Q55 34.5 55 40 L54 50 H45 Z" fill="#1F3A5F"/>
  <circle cx="49.5" cy="32.5" r="4.5" fill="#1F3A5F"/>
  <!-- Дыхание-пузырёк -->
  <circle cx="52" cy="26" r="1.3" fill="#9CC3E0"/>
  <!-- Изморозь по краям стекла -->
  <path d="M37 48 Q40 52 45 53.5 M59 48 Q56 52 51 53.5" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Снежинка-блик на стекле -->
  <g stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round">
    <path d="M40 34 L40 40 M37.5 35.5 L42.5 38.5 M37.5 38.5 L42.5 35.5"/>
  </g>
  <!-- Обод иллюминатора -->
  <circle cx="48" cy="42" r="14" fill="none" stroke="#5C6670" stroke-width="1.6"/>

  <!-- Люк-шов -->
  <path d="M30 58 Q48 64 66 58" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M32 59.5 Q48 64.5 64 59.5" fill="none" stroke="#5C6670" stroke-width="1.2"/>

  <!-- Панель управления -->
  <rect x="40" y="66" width="16" height="11" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Кнопки -->
  <circle cx="44" cy="70" r="1.6" fill="#F5E9D0"/>
  <circle cx="49" cy="70" r="1.6" fill="#E0A94A"/>
  <circle cx="54" cy="70" r="1.6" fill="#F5E9D0"/>
  <!-- Полоска-экран -->
  <rect x="43" y="73.5" width="10" height="1.8" rx="0.9" fill="#9CC3E0"/>

  <!-- Верхняя шапка с индикатором -->
  <rect x="36" y="8" width="24" height="8" rx="4" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="48" cy="12" r="2.2" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Холодный пар из шва -->
  <path d="M28 62 Q24 58 26 54 Q28 50 24 47" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M70 64 Q74 60 72 56" fill="none" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>
</svg>
