<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    basketball — баскетбольный мяч: терракотовая сфера с классическими
    швами (вертикаль, горизонталь, две дуги), блик. Посадочная зона — центр.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="28" ry="5.5" fill="#3A2A20"/>

  <!-- Сфера мяча -->
  <circle cx="48" cy="48" r="32" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Швы -->
  <g fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round">
    <!-- Вертикальный (чуть изогнут) -->
    <path d="M48 16 Q44 48 48 80"/>
    <!-- Горизонтальный (чуть изогнут) -->
    <path d="M16 48 Q48 52 80 48"/>
    <!-- Левая дуга (выгнута к центру) -->
    <path d="M30 27 Q46 48 30 69"/>
    <!-- Правая дуга -->
    <path d="M66 27 Q50 48 66 69"/>
  </g>

  <!-- Блик (верх-слева) -->
  <path d="M28 32 Q33 23 43 20" fill="none" stroke="#F5E9D0" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="34" cy="28" r="1.6" fill="#F5E9D0"/>
</svg>
