<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    globe — глобус: сфера с материками (зелень на синем океане),
    латунная дуга-меридиан и подставка. Наклон по оси.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Подставка -->
  <path d="M44 78 L40 84" stroke="#B87F33" stroke-width="4" stroke-linecap="round"/>
  <path d="M52 78 L56 84" stroke="#B87F33" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="48" cy="85" rx="14" ry="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M42 84 Q48 82.5 54 84" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Стержень -->
  <rect x="46" y="72" width="4" height="9" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Дуга-меридиан (латунная, за сферой) -->
  <path d="M48 14 Q74 30 70 50" fill="none" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>

  <!-- Сфера -->
  <circle cx="44" cy="42" r="26" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Материки (зелень, стилизованные) -->
  <path d="M28 34 Q34 26 44 26 Q50 27 52 32 Q48 36 42 35 Q36 36 32 40 Q26 40 28 34 Z" fill="#7FA85B"/>
  <path d="M50 36 Q58 34 62 40 Q64 46 60 50 Q54 52 52 46 Q50 42 50 36 Z" fill="#7FA85B"/>
  <path d="M30 48 Q36 46 40 50 Q40 56 34 58 Q28 56 28 52 Z" fill="#5E8A46"/>
  <!-- Полюс-шапка -->
  <ellipse cx="42" cy="19" rx="9" ry="3.5" fill="#F5E9D0"/>
  <!-- Блик на океане -->
  <path d="M30 28 Q36 22 44 21" fill="none" stroke="#7FA85B" stroke-width="2" stroke-linecap="round"/>
  <!-- Ось -->
  <path d="M34 22 L56 64" stroke="#B87F33" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Дуга-меридиан (перед сферой, слева) -->
  <path d="M44 16 Q22 28 20 46" fill="none" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <!-- Верхний держатель -->
  <circle cx="44" cy="15" r="3.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Нижний держатель -->
  <circle cx="44" cy="70" r="3.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M44 70 L48 76" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
</svg>
