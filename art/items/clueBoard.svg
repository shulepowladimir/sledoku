<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    clueBoard — доска улик детектива: пробковая доска в деревянной раме,
    фото подозреваемых, записки, красные булавки и красные нити,
    связывающие улики. Ключевой предмет игры.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Рама (дерево) -->
  <rect x="10" y="10" width="76" height="76" rx="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M13 14 Q48 11.5 83 14" fill="none" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Пробковое поле -->
  <rect x="17" y="17" width="62" height="62" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Фактура пробки (лёгкие штрихи) -->
  <g stroke="#B85F2E" stroke-width="1" stroke-linecap="round">
    <path d="M24 24 L30 24 M58 30 L64 30 M26 62 L31 62 M60 66 L66 66 M42 70 L47 70"/>
  </g>

  <!-- Красные нити (под карточками, но поверх пробки — рисуем до фото?) 
       Нет: нити идут ПОВЕРХ карточек к булавкам. Сначала карточки, потом нити. -->

  <!-- Фото 1 (снимок подозреваемого, верх-лево) -->
  <g>
    <rect x="21" y="21" width="19" height="15" rx="1" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
    <!-- Силуэт в рамке фото -->
    <circle cx="30.5" cy="26.5" r="3" fill="#3A2A20"/>
    <path d="M25 36 Q25 30.5 30.5 30.5 Q36 30.5 36 36 Z" fill="#3A2A20"/>
  </g>

  <!-- Записка 1 (верх-право, чуть повернута) -->
  <g transform="rotate(4 60 30)">
    <rect x="52" y="23" width="17" height="13" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M55 27 H66 M55 30 H63" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Центральная записка (главная улика) -->
  <g transform="rotate(-3 48 47)">
    <rect x="40" y="41" width="16" height="12" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <path d="M43 45 H53 M43 48 H49" stroke="#1F3A5F" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Кружок-отметка -->
    <circle cx="51" cy="49" r="1.6" fill="none" stroke="#1F3A5F" stroke-width="1.1"/>
  </g>

  <!-- Записка 2 (низ-лево) -->
  <g transform="rotate(-5 32 62)">
    <rect x="23" y="55" width="18" height="13" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M26 59 H38 M26 62 H34 M26 65 H37" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Фото 2 (низ-право) -->
  <g>
    <rect x="55" y="55" width="16" height="14" rx="1" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="63" cy="60" r="2.8" fill="#3A2A20"/>
    <path d="M58 69 Q58 63.5 63 63.5 Q68 63.5 68 69 Z" fill="#3A2A20"/>
    <!-- Линия места происшествия -->
    <path d="M56 68 H70" stroke="#4A7BA6" stroke-width="1.2"/>
  </g>

  <!-- Красные нити (соединяют булавки) -->
  <g fill="none" stroke="#C8102E" stroke-width="1.6">
    <path d="M30.5 22.5 Q40 36 44.5 43"/>
    <path d="M60.5 25 Q56 34 52 41"/>
    <path d="M44 45.5 Q36 50 31 57"/>
    <path d="M53.5 46.5 Q60 50 63 57"/>
    <path d="M32 60.5 Q48 72 61 63"/>
    <path d="M30.5 24.5 Q14 44 30 58"/>
    <path d="M63 24.5 Q80 42 64.5 58.5"/>
  </g>

  <!-- Булавки (красные головки) -->
  <g>
    <circle cx="30.5" cy="22.5" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="60.5" cy="24.5" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="48" cy="44" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="31" cy="58" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="63" cy="57.5" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <!-- Одна стальная (недоказанная версия) -->
    <circle cx="72" cy="35" r="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.2"/>
  </g>
  <!-- Нить к стальной булавке (порванная связь) -->
  <path d="M62 26 Q72 28 72 33" fill="none" stroke="#C8102E" stroke-width="1.4" stroke-dasharray="3 2.5"/>
</svg>
