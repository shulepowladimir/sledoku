<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    pants — брюки-хаки, брошенные в пустыне: бежевая ткань (крем), коричневый
    ремень с железной пряжкой и высвободившимся концом, строчка карманов,
    гульфик с пуговицей, мягкие заломы на штанинах. Мягкий текстиль —
    без тени-подложки (прецедент б7: slippers/kettle/plate).
  -->
  <g transform="rotate(-6 48 54)">
    <!-- Силуэт: пояс + две расходящиеся штанины -->
    <path d="M30 16 Q48 10 66 16 L70 34 Q76 42 71 48 L68 82 Q69 87 63 87 L49 87 L46 60 Q46 55 42 60 L40 87 L27 87 Q21 87 22 82 L25 48 Q20 42 26 34 Z"
          fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

    <!-- Ремень: полоса по поясу -->
    <path d="M29 19 Q48 14 67 19 L69 33 Q48 38 27 33 Z"
          fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Свободный конец ремня (высунулся из пряжки) -->
    <path d="M66 22 Q76 23.5 79.5 29 Q73 32.5 66 31 Z"
          fill="#B87F33" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="72.5" cy="26.5" r="1.1" fill="#3A2A20"/>
    <circle cx="75.5" cy="27.6" r="1.1" fill="#3A2A20"/>

    <!-- Пряжка -->
    <rect x="42" y="18" width="13" height="16" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M45 21 H52" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Шлёвки -->
    <path d="M33 18.5 V33.5 M62 18.5 V33.5" stroke="#1A1A1A" stroke-width="1.6"/>

    <!-- Гульфик с пуговицей -->
    <path d="M48 36 Q47 41 48.5 46" fill="none" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="48" cy="38.5" r="1.8" fill="#B87F33" stroke="#1A1A1A" stroke-width="1"/>

    <!-- Строчка карманов -->
    <path d="M34 38 Q31 43.5 37 46.5" fill="none" stroke="#B87F33" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M62 38 Q65 43.5 59 46.5" fill="none" stroke="#B87F33" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Мягкие заломы на штанинах -->
    <path d="M31 58 Q33 63 32 68" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M57 60 Q59 65 58 70" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M53 51 Q55.5 55 54.5 59" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

    <!-- Подрубка манжет -->
    <path d="M25 81 Q31.5 77.5 39 81" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 81 Q56.5 77.5 66 81" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
