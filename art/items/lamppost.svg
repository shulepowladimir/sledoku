<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lamppost — кованый парковый фонарь: тёплое стекло, огонёк, шпиль.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="22" ry="4.5" fill="#3A2A20"/>

  <!-- Столб -->
  <rect x="44" y="40" width="8" height="42" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Блик на столбе -->
  <rect x="45.5" y="42" width="2" height="36" fill="#2E6E65"/>
  <!-- Основание -->
  <path d="M36 82 L60 82 L57 72 L39 72 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M38.5 78.5 L57.5 78.5" stroke="#2E6E65" stroke-width="1.8"/>

  <!-- Корона-кронштейн -->
  <path d="M42 40 Q48 36 54 40 L54 44 L42 44 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Фонарь: стеклянная часть (тёплый свет) -->
  <rect x="36" y="18" width="24" height="24" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Огонёк внутри -->
  <path d="M48 24 Q52 29 48 34 Q44 29 48 24 Z" fill="#E0824A" stroke="#B85F2E" stroke-width="1.2"/>
  <!-- Стойки-рамки на стекле -->
  <path d="M40 18 L40 42 M56 18 L56 42" stroke="#1F3A5F" stroke-width="2.2"/>

  <!-- Крыша фонаря -->
  <polygon points="33,18 48,7 63,18" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 16 Q43 11.5 47 10.5" fill="none" stroke="#2E6E65" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Шпиль -->
  <rect x="46.5" y="1.5" width="3" height="7" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="48" cy="1.8" r="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
