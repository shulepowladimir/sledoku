<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    sculpture — скульптура на постаменте (музей): абстрактная
    бронзовая лента-восьмёрка на мраморном постаменте с табличкой.
    Современное искусство (юмор).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Постамент (мрамор, две ступени) -->
  <rect x="28" y="66" width="40" height="18" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M32 70 H64" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="24" y="82" width="48" height="6" rx="2" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Табличка -->
  <rect x="36" y="74" width="24" height="6" rx="1" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M39 77 H57" stroke="#3A2A20" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Скульптура: бронзовая лента-восьмёрка -->
  <path d="M36 24 Q46 18 54 24 Q60 30 54 36 Q48 42 46 46 Q42 52 46 56 Q50 60 56 57"
        fill="none" stroke="#B85F2E" stroke-width="9" stroke-linecap="round"/>
  <!-- Светлая грань ленты -->
  <path d="M36 22 Q46 16 54 22 Q59 27 54 32" fill="none" stroke="#E0824A" stroke-width="3" stroke-linecap="round"/>
  <!-- Нижний завиток светлее -->
  <path d="M47 47 Q44 51 47 54 Q50 56 53 55" fill="none" stroke="#E0824A" stroke-width="3" stroke-linecap="round"/>

  <!-- Крепление к постаменту -->
  <ellipse cx="50" cy="64" rx="5" ry="2.4" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Блик на постаменте -->
  <path d="M32 68 L32 82" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
</svg>
