<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    exerciseBike — велотренажёр: вид сбоку, стальная рама, маховик,
    седло, руль с грипсами, педаль.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Задняя опора рамы -->
  <path d="M60 64 L46 84" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 84 L64 84" stroke="#9BA5AD" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Передняя опора -->
  <path d="M64 46 L78 84" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 84 L86 84" stroke="#9BA5AD" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Блики опор -->
  <path d="M59 66 L48 81 M65.5 50 L77 80" stroke="#D5DCE1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Рама (основная дуга) -->
  <path d="M38 68 Q48 70 60 64" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 67.5 Q49 69.5 58 64.5" fill="none" stroke="#E0824A" stroke-width="2" stroke-linecap="round"/>
  <!-- Наклонная труба рамы -->
  <path d="M60 64 L66 44" stroke="#C8102E" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M61.5 62 L66 47" stroke="#E0824A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Маховик (большой диск) -->
  <circle cx="44" cy="68" r="13" fill="none" stroke="#5C6670" stroke-width="5"/>
  <circle cx="44" cy="68" r="13" fill="none" stroke="#9BA5AD" stroke-width="1.6"/>
  <circle cx="44" cy="68" r="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Спицы маховика -->
  <path d="M44 57 L44 60 M55 68 L52 68 M44 79 L44 76 M33 68 L36 68" stroke="#9BA5AD" stroke-width="2" stroke-linecap="round"/>

  <!-- Педаль (на шатуне) -->
  <path d="M44 68 L52 74" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <rect x="49" y="72.5" width="11" height="4.5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Подседельная труба + седло -->
  <path d="M38 68 L34 46" stroke="#C8102E" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 42 Q33 36 42 42 L41 46 Q33 41 25 46 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 43 Q33 39.5 39 43" fill="none" stroke="#E0824A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Руль (дуга с грипсами) -->
  <path d="M66 44 Q64 34 54 32" fill="none" stroke="#9BA5AD" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Поперечина руля -->
  <path d="M44 30 L62 30" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 30 L60 30" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Грипсы -->
  <rect x="40" y="27.5" width="8" height="5" rx="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="58" y="27.5" width="8" height="5" rx="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Стержень руля -->
  <path d="M54 32 L54 26" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>

  <!-- Мини-дисплей на руле -->
  <rect x="49" y="14" width="12" height="9" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M51.5 17.5 H58.5 M51.5 19.5 H56" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M55 23 L55 26" stroke="#9BA5AD" stroke-width="2.6" stroke-linecap="round"/>
</svg>
