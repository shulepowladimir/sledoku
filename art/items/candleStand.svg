<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    candleStand — канделябр на три свечи: латунная основа, изогнутые
    рожки, капающий воск, живые огоньки с бликами.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Основание (ступенчатое) -->
  <ellipse cx="48" cy="83" rx="22" ry="6" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="48" cy="80" rx="15" ry="4.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M36 79.5 Q48 82.5 60 79.5" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Центральный стержень -->
  <rect x="45.5" y="48" width="5" height="32" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M47 52 L47 76" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Узел-декор -->
  <ellipse cx="48" cy="56" rx="5.5" ry="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Боковые рожки (изгибы) -->
  <path d="M48 56 Q30 52 24 42" fill="none" stroke="#E0A94A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M48 56 Q66 52 72 42" fill="none" stroke="#E0A94A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M46.5 55 Q31 51 26 43" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Подсвечники-чашечки -->
  <ellipse cx="24" cy="40" rx="6" ry="2.8" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="48" cy="44" rx="6" ry="2.8" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="72" cy="40" rx="6" ry="2.8" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Свечи (крем) -->
  <rect x="21" y="24" width="6" height="16" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="45" y="27" width="6" height="17" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="69" y="24" width="6" height="16" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Потёки воска -->
  <path d="M22 30 Q21.4 33 22.2 36" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52 33 Q52.6 36 51.8 39" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 28 Q69.4 31 70.2 34" fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Фитили -->
  <path d="M24 24 L24 21 M48 27 L48 24 M72 24 L72 21" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Огоньки (три слоя: терракота + крем) -->
  <g>
    <path d="M24 12 Q26.5 15.5 26 18 Q25.8 20 24 20 Q22.2 20 22 18 Q21.5 15.5 24 12 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M24 15.5 Q25 17.5 24.7 18.7 Q24.6 19.6 24 19.6 Q23.4 19.6 23.3 18.7 Q23 17.5 24 15.5 Z" fill="#F5E9D0"/>
  </g>
  <g>
    <path d="M48 15 Q50.5 18.5 50 21 Q49.8 23 48 23 Q46.2 23 46 21 Q45.5 18.5 48 15 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M48 18.5 Q49 20.5 48.7 21.7 Q48.6 22.6 48 22.6 Q47.4 22.6 47.3 21.7 Q47 20.5 48 18.5 Z" fill="#F5E9D0"/>
  </g>
  <g>
    <path d="M72 12 Q74.5 15.5 74 18 Q73.8 20 72 20 Q70.2 20 70 18 Q69.5 15.5 72 12 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M72 15.5 Q73 17.5 72.7 18.7 Q72.6 19.6 72 19.6 Q71.4 19.6 71.3 18.7 Q71 17.5 72 15.5 Z" fill="#F5E9D0"/>
  </g>
  <!-- Блики огоньков -->
  <circle cx="23" cy="14" r="0.8" fill="#F5E9D0"/>
  <circle cx="47" cy="17" r="0.8" fill="#F5E9D0"/>
  <circle cx="71" cy="14" r="0.8" fill="#F5E9D0"/>
</svg>
