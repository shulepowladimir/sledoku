<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    jukebox — музыкальный автомат дайнера 1940-х: арочный деревянный корпус,
    тёплые световые трубки по дуге, окно селектора с полосками пластинок,
    терракотовая решётка динамика, панель кнопок. Красный акцент — кнопка.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="33" ry="4.5" fill="#3A2A20"/>

  <!-- Корпус: арка -->
  <path d="M27 84 L27 46 Q27 12 48 12 Q69 12 69 46 L69 84 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тёмная окантовка арки -->
  <path d="M31 84 L31 49 Q31 18 48 18 Q65 18 65 49 L65 84" fill="none" stroke="#B87F33" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Блик слева на корпусе -->
  <path d="M29.5 52 Q29.5 28 41 20" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Световые трубки по арке (тёплое свечение: два сплошных слоя) -->
  <path d="M34 50 Q34 24 48 24 Q62 24 62 50" fill="none" stroke="#E8B95F" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M34 50 Q34 24 48 24 Q62 24 62 50" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Окно селектора -->
  <rect x="37" y="42" width="22" height="19" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="39.5" y="44.5" width="17" height="14" rx="2" fill="#F5E9D0"/>
  <!-- Полоски-строки пластинок -->
  <path d="M41.5 48 L54.5 48" stroke="#B85F2E" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M41.5 52 L54.5 52" stroke="#2E6E65" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M41.5 56 L50 56" stroke="#E0824A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Нижний корпус: решётка динамика -->
  <rect x="27" y="64" width="42" height="20" rx="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <g stroke="#B85F2E" stroke-width="2.4" stroke-linecap="round">
    <path d="M32 69.5 L48 69.5"/>
    <path d="M32 74.5 L48 74.5"/>
    <path d="M32 79.5 L48 79.5"/>
  </g>
  <!-- Тень планок справа -->
  <path d="M32 71.5 L48 71.5 M32 76.5 L48 76.5 M32 81.5 L48 81.5" stroke="#8F5A3A" stroke-width="1" stroke-linecap="round"/>

  <!-- Панель кнопок -->
  <rect x="53" y="68" width="12" height="12" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="56" cy="71" r="1.5" fill="#2E6E65"/>
  <circle cx="61" cy="71" r="1.5" fill="#E8B95F"/>
  <circle cx="56" cy="76.5" r="1.5" fill="#F5E9D0"/>
  <!-- Красный акцент: кнопка -->
  <circle cx="61" cy="76.5" r="1.8" fill="#C8102E"/>

  <!-- Блик-точка на стекле селектора -->
  <circle cx="41" cy="46.5" r="1.1" fill="#F5E9D0"/>
</svg>
