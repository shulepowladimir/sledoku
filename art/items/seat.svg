<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    seat — откидное сиденье трибуны: стальная рама, пластиковые спинка и
    сиденье (терракота), номер на спинке. Посадочная зона — сиденье.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="49" cy="86" rx="26" ry="5" fill="#3A2A20"/>

  <!-- Стальные ножки-опоры -->
  <path d="M28 58 L24 84 L31 84 L34 60 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M68 58 L72 84 L65 84 L62 60 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M30 62 L27 80" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Боковины (стальной каркас) -->
  <path d="M24 34 Q20 34 20 40 L22 60 L30 60 L30 40 Q30 34 24 34 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M72 34 Q76 34 76 40 L74 60 L66 60 L66 40 Q66 34 72 34 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Спинка (откинута назад) -->
  <path d="M26 20 Q26 15 33 15 L63 15 Q70 15 70 20 L69 38 Q48 33 27 38 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M31 19 Q48 16.5 65 19" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Швы спинки -->
  <path d="M40 18 L38 36 M56 18 L58 36" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Сиденье (откидное, поднято) -->
  <path d="M27 40 Q48 35 69 40 L69 52 Q48 47 27 52 Z"
        fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M30 43 Q48 39.5 66 43" fill="none" stroke="#E0824A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Живая деталь: номер на спинке -->
  <circle cx="48" cy="26" r="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M46 23 L46 29 M46 23 L50 23 Q51.5 23 51.5 25 Q51.5 26 50 26 L46 26 M48 26 L51.5 29" fill="none" stroke="#3A2A20" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
