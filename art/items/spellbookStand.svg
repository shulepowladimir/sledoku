<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    spellbookStand — деревянный пюпитр с раскрытой книгой заклинаний,
    закладка-лента, светящаяся руна на странице.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="26" ry="5" fill="#3A2A20"/>

  <!-- Ножка пюпитра -->
  <path d="M44 46 L52 46 L56 80 L40 80 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M46 50 L45 76" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- База -->
  <ellipse cx="48" cy="81" rx="24" ry="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="79" rx="24" ry="6" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Наклонная столешница пюпитра -->
  <path d="M18 46 L78 46 L74 34 L22 34 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M23 37 Q48 33 73 37" fill="none" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>

  <!-- Раскрытая книга -->
  <path d="M22 45 L47 39 L47 20 L24 25 Q22 26 22 29 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M74 45 L49 39 L49 20 L72 25 Q74 26 74 29 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M47 20 L47 39 L49 39 L49 20" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Строчки текста -->
  <path d="M27 30 L41 27 M27 34 L41 31.5" stroke="#B87F33" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M55 27 L69 30 M55 31.5 L69 34" stroke="#B87F33" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Живая деталь: светящаяся руна на левой странице -->
  <circle cx="34" cy="35" r="4.5" fill="none" stroke="#2E6E65" stroke-width="1.8"/>
  <path d="M34 31.5 L34 38.5 M31.5 35 L36.5 35" stroke="#2E6E65" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Закладка-лента -->
  <path d="M60 20 L60 44 L63 41 L66 44 L66 20 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
