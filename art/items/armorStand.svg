<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    armorStand — стойка с доспехом: деревянная стойка-вешалка,
    на ней стальной доспех (торс, шлем с плюмажем, щит).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- База (три лапы) -->
  <path d="M30 84 L40 76 M66 84 L56 76 M48 86 L48 76" stroke="#B87F33" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="30" cy="84" r="2.4" fill="#E0A94A"/>
  <circle cx="66" cy="84" r="2.4" fill="#E0A94A"/>
  <circle cx="48" cy="85" r="2.4" fill="#E0A94A"/>

  <!-- Стойка -->
  <rect x="45.5" y="42" width="5" height="36" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M47 46 L47 74" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Крюк-верхушка -->
  <path d="M48 42 Q48 36 54 36" fill="none" stroke="#B87F33" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Доспех: кираса (торс, сталь) -->
  <path d="M36 46 Q36 40 42 39 L54 39 Q60 40 60 46 L59 60 Q48 65 37 60 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Центральный ребро-грань -->
  <path d="M48 40 L48 63" stroke="#5C6670" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Горизонтальные сегменты -->
  <path d="M38 50 Q48 53 58 50 M38.5 56 Q48 58.5 57.5 56" fill="none" stroke="#5C6670" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Блик кирасы -->
  <path d="M40 44 Q42 41.5 45 41" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Наплечники -->
  <path d="M32 46 Q32 41 38 40 L40 46 Q35 48 32 46 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M64 46 Q64 41 58 40 L56 46 Q61 48 64 46 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Шлем на крюке -->
  <path d="M42 36 Q42 26 48 26 Q54 26 54 36 L54 38 L42 38 Z" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Забрало-прорезь -->
  <path d="M43.5 33 L52.5 33" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M43.5 30 L52.5 30" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Плюмаж (красный — акцент) -->
  <path d="M48 26 Q46 16 52 10 Q52 18 50 26 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Щит прислонён (сталь с крестом) -->
  <path d="M18 52 Q18 44 26 43 L32 43 Q34 48 33 56 Q31 65 25 67 Q19 65 17 56 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M25 48 L25 62 M19 54 L31 54" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Меч прислонён справа -->
  <path d="M76 60 L70 76" stroke="#D5DCE1" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 60 L70 76" stroke="#1A1A1A" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M73.5 66 L67 68.5" stroke="#E0A94A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
