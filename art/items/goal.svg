<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    goal — футбольные ворота: кремовая рама (штанги + перекладина),
    сетка из тонких линий, трава у основания. Посадочная зона — центр.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Сетка (за рамой) -->
  <g stroke="#9BA5AD" stroke-width="1.2">
    <path d="M28 34 V78 M37 34 V78 M46 34 V78 M55 34 V78 M64 34 V78"/>
    <path d="M24 40 H70 M24 48 H70 M24 56 H70 M24 64 H70 M24 72 H70"/>
  </g>
  <!-- Затемнение сетки к низу -->
  <rect x="24" y="66" width="46" height="12" fill="#9BA5AD" stroke="none"/>

  <!-- Рама: перекладина -->
  <rect x="20" y="28" width="56" height="6" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Левая штанга -->
  <rect x="20" y="28" width="6" height="52" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Правая штанга -->
  <rect x="70" y="28" width="6" height="52" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Блики на раме -->
  <path d="M24 31 H72 M22.5 34 V76" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Трава у штанг -->
  <g fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round">
    <path d="M14 82 Q12 78 13 75"/>
    <path d="M19 82 Q18 79 19.5 76"/>
    <path d="M77 82 Q79 78 78 75"/>
    <path d="M82 82 Q84 79 83 76"/>
    <path d="M44 82 Q43 79 44 77"/>
  </g>
  <!-- Земля-линия -->
  <path d="M12 83 Q48 80.5 84 83" fill="none" stroke="#5E8A46" stroke-width="2.4" stroke-linecap="round"/>
</svg>
