<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hitchingPost — коновязь: два деревянных столба с шляпками
    и горизонтальная перекладина, на ней петля-узда. Вид спереди.
  -->
  <!-- Тень-подложка -->
  <rect x="15.5" y="82.5" width="66" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Левый столб -->
  <rect x="19" y="26" width="11" height="58" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M22 32 L22 78" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>
  <path d="M23 44 Q26 47 24 52 M23 60 Q26 63 24.5 68" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Шляпка столба (срез) -->
  <rect x="16.5" y="20" width="16" height="8" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Правый столб -->
  <rect x="66" y="26" width="11" height="58" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M69 32 L69 78" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 44 Q73 47 71 52 M70 60 Q73 63 71.5 68" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Шляпка -->
  <rect x="63.5" y="20" width="16" height="8" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Перекладина -->
  <rect x="12" y="40" width="72" height="9" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Волокна перекладины -->
  <path d="M18 43.5 Q40 42 58 43.5 M22 46.5 Q40 45 66 46.5" fill="none" stroke="#B87F33" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Блик на перекладине -->
  <path d="M18 42.5 L76 42.5" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Узда-петля, висящая на перекладине -->
  <path d="M40 49 Q36 58 42 64 Q48 68 54 64 Q58 58 52 49"
        fill="none" stroke="#B85F2E" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M42 51 Q39.5 57 43.5 61 Q48 64 52 61 Q55.5 57 53 51"
        fill="none" stroke="#E0824A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Кольцо узды -->
  <circle cx="47" cy="57" r="2.4" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
</svg>
