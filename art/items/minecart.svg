<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    minecart — шахтная вагонетка (2-клеточная вертикальная, occupiable):
    стальной корыто-кузов с рёбрами, гружён углём, внизу колёсные пары на
    invisible рельсах (рельсы рисует текстура пола). Шире кверху (прецедент
    trashcan), опрокидыватель-ручка сбоку.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Колёсные пары (за кузовом, чёрные на светлых осях) -->
  <g stroke="#1A1A1A" stroke-width="2.6" fill="#454E58">
    <circle cx="34" cy="82" r="7"/>
    <circle cx="62" cy="82" r="7"/>
  </g>
  <circle cx="34" cy="82" r="2" fill="#C2C9CB"/>
  <circle cx="62" cy="82" r="2" fill="#C2C9CB"/>

  <!-- Кузов: трапеция шире кверху -->
  <path d="M20 30 L76 30 L70 78 L26 78 Z"
        fill="#7D878E" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Верхний кант кузова -->
  <path d="M20 30 L76 30 L74.4 38 L21.6 38 Z" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Рёбра-раскосы борта -->
  <g stroke="#545D65" stroke-width="2.4" stroke-linecap="round">
    <path d="M28 40 L30 74"/>
    <path d="M40 40 L40 74"/>
    <path d="M56 40 L56 74"/>
    <path d="M68 40 L66 74"/>
  </g>
  <!-- Блик слева -->
  <path d="M25 42 L28 72" stroke="#C2C9CB" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Уголь в кузове (глыбы поверх канта) -->
  <g stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
    <path d="M28 30 L36 20 L46 28 Z" fill="#453E3B"/>
    <path d="M44 28 L54 16 L64 26 Z" fill="#574D4A"/>
    <path d="M60 26 L70 22 L72 30 Z" fill="#453E3B"/>
  </g>
  <!-- Блики на глыбах -->
  <path d="M36 22 L40 26 M52 20 L56 24" stroke="#939CA2" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Опрокидыватель-ручка сбоку -->
  <path d="M76 44 Q86 48 82 58" fill="none" stroke="#545D65" stroke-width="4" stroke-linecap="round"/>
  <path d="M76 44 Q84 47 81 55" fill="none" stroke="#939CA2" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Сцепка-крюк спереди -->
  <path d="M48 78 V86 Q48 90 44 90" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
</svg>
