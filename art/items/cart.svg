<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cart — тележка из универмага: стальная проволочная корзина,
    красная ручка, колёсики, внутри — покупка (красная коробка).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Колёса -->
  <circle cx="32" cy="78" r="6.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="32" cy="78" r="2" fill="#5C6670"/>
  <circle cx="68" cy="78" r="6.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="68" cy="78" r="2" fill="#5C6670"/>
  <!-- Стойки ног -->
  <path d="M32 71 L32 62 M68 71 L68 62" stroke="#9BA5AD" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Дно корзины -->
  <path d="M28 58 L72 58 L68 64 L32 64 Z" fill="#D5DCE1" stroke="#5C6670" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Корзина (проволочная, трапеция) -->
  <path d="M22 28 L76 28 L72 58 L26 58 Z" fill="#D5DCE1" stroke="#5C6670" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Проволочная сетка -->
  <g stroke="#9BA5AD" stroke-width="1.4">
    <path d="M31 28 L29.5 58 M40 28 L39 58 M49 28 L49 58 M58 28 L59 58 M67 28 L68.5 58"/>
    <path d="M22 38 L76 38 M23.5 48 L74.5 48"/>
  </g>
  <!-- Блик на корзине -->
  <path d="M27 32 L26.5 44" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Коробка в корзине (красная покупка) -->
  <g transform="rotate(-4 52 40)">
    <rect x="44" y="32" width="16" height="12" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M44 36 H60" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Лента -->
    <rect x="50.5" y="32" width="3" height="12" fill="#F5E9D0"/>
  </g>

  <!-- Ручка (сталь + красная накладка) -->
  <path d="M76 30 L88 40" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <rect x="84" y="36" width="10" height="5.5" rx="2.5" transform="rotate(38 89 38.5)" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
</svg>
