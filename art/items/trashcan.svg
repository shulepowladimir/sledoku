<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trashcan — уличный бак, расширяющийся КВЕРХУ: стальной корпус,
    приоткрытая крышка с торчащей банановой шкуркой, рядом на земле —
    скелет рыбы. Металл: D5DCE1/9BA5AD/5C6670 (гайд §1).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="46" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Корпус (трапеция: шире кверху) -->
  <polygon points="22,34 70,34 66,82 26,82" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Вертикальный блик слева -->
  <path d="M28 38 L31 78" stroke="#D5DCE1" stroke-width="4" stroke-linecap="round"/>
  <!-- Затемнение правой стороны -->
  <path d="M64 34 L70 34 L66 82 L61.5 82 Z" fill="#5C6670"/>

  <!-- Рёбра жёсткости (горизонтальные, следуют расширению) -->
  <path d="M24 50 L68.7 50" stroke="#5C6670" stroke-width="3" stroke-linecap="round"/>
  <path d="M25 66 L67.3 66" stroke="#5C6670" stroke-width="3" stroke-linecap="round"/>
  <!-- Светлая кромка рёбер (свет сверху) -->
  <path d="M24.4 48.5 L68.4 48.5 M25.4 64.5 L67 64.5" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Обод-воротник под крышкой (шире корпуса) -->
  <rect x="19" y="30" width="54" height="8" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M23 33.5 H56" stroke="#D5DCE1" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Крышка (приоткрыта: левый край приподнят на петле справа) -->
  <g transform="rotate(-9 46 26)">
    <path d="M26 28 Q26 18 33 17 L61 17 Q68 18 68 28 Z"
          fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M31 21.5 Q34 18.8 39 18.4" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
    <!-- Скоба-ручка -->
    <path d="M40 17 Q40 11.5 47 11.5 Q54 11.5 54 17" fill="none" stroke="#5C6670" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Петля крышки (правый край обода) -->
  <circle cx="70" cy="33" r="2.6" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Банановая шкурка (торчит из щели под приподнятым левым краем крышки) -->
  <path d="M52 30 Q46 22 39 22 Q35 22 33.5 25 Q37 24.5 39 26.5 Q37.5 29 34.5 29.5 Q38 32 42 31 Q47 30 52 30 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Кончики шкурки -->
  <path d="M36 24 Q34.6 23 33.6 23.6 M37.8 27.6 Q36 27.8 34.8 28.8" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Блик на шкурке -->
  <path d="M44 26.5 Q41 24.8 38.6 24.8" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Скелет рыбы на земле (справа от бака) -->
  <g>
    <!-- Позвоночник -->
    <path d="M72 80 Q80 77 87 79" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
    <!-- Рёбра -->
    <g fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round">
      <path d="M75 79.4 Q74 82.5 72.6 84"/>
      <path d="M78.5 78.4 Q78 81.8 77 84"/>
      <path d="M82 77.8 Q82 81.2 81.4 83.5"/>
      <path d="M75 79.4 Q74.4 76.4 73.4 74.6"/>
      <path d="M78.5 78.4 Q78.4 75.4 77.6 73.6"/>
      <path d="M82 77.8 Q82.4 75 82 73.2"/>
    </g>
    <!-- Голова -->
    <path d="M71.5 79.5 Q68.5 77.5 68.8 80.8 Q69 82.6 71.8 81.2 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="69.8" cy="79.6" r="0.8" fill="#1A1A1A"/>
    <!-- Хвост -->
    <path d="M87 79 L91 76 L90 79 L91.5 81.5 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
