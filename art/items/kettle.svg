<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    kettle — эмалированный чайник-гигант: пузатый кремовый корпус
    с синим ободком, носик, дуговая ручка, крышка с шариком-ручкой.
    Блик-точка слева-сверху (керамика).
  -->
  <!-- Корпус -->
  <path d="M24 78 Q16 78 18 62 Q20 44 34 38 L58 38 Q72 44 74 62 Q76 78 68 78 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тень по нижней кромке -->
  <path d="M24 72 Q48 78 70 72" fill="none" stroke="#D5DCE1" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Блик слева -->
  <path d="M26 62 Q25 50 32 44" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Синий ободок -->
  <path d="M25 66 Q48 72 71 66" fill="none" stroke="#1F3A5F" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M26 70.5 Q48 76 70 70.5" fill="none" stroke="#1F3A5F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Носик -->
  <path d="M22 52 Q12 48 10 36 Q9 32 12.5 31.5 Q15.5 31.5 17 36 Q19 44 27 46 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <ellipse cx="13" cy="34.5" rx="3" ry="2.2" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Блик на носике -->
  <path d="M19 44 Q14 41 13 36" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ручка-дуга -->
  <path d="M34 38 Q34 22 48 22 Q62 22 62 38" fill="none" stroke="#5C6670" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M36 36 Q37 25 47 24.5" fill="none" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Крышка -->
  <path d="M36 38 Q48 32 60 38 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Шарик на крышке -->
  <circle cx="48" cy="29" r="3.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="47" cy="28" r="1" fill="#E8B95F"/>

  <!-- Пар (две завитка) -->
  <path d="M44 14 Q46 10 44 6 M52 15 Q54 11 52 7" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Блик-точка -->
  <circle cx="30" cy="50" r="1.6" fill="#F5E9D0"/>
</svg>
