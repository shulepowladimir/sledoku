<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    well — колодец (замок): каменное кольцо с деревянными стойками,
    двускатная крыша, ворот с бадьёй на верёвке, голубая вода внутри,
    основание из каменной кладки. Без тени.
  -->
  <!-- Стойки -->
  <path d="M24 66 V22 M72 66 V22" stroke="#B87F33" stroke-width="5" stroke-linecap="round"/>
  <path d="M25.5 62 V26 M73.5 62 V26" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Крыша (двускатная) -->
  <path d="M14 22 L48 6 L82 22 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Прогиб черепицы -->
  <path d="M20 20 Q48 8 76 20" fill="none" stroke="#8F5A3A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Конёк -->
  <rect x="44" y="4" width="8" height="5" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Ворот (ось с намоткой) -->
  <path d="M28 32 H68" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M29 33.5 H67" stroke="#E8B95F" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Рукоять ворота -->
  <path d="M66 32 L74 26" stroke="#8F5A3A" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="25" r="2.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Верёвка и бадья -->
  <path d="M48 34 V44" stroke="#8F5A3A" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 44 H54 L52 54 H44 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M45.5 47 H50.5" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Каменное кольцо (внешнее) -->
  <ellipse cx="48" cy="66" rx="30" ry="11" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Камни-кладка -->
  <g fill="none" stroke="#5C6670" stroke-width="1.6">
    <path d="M26 62 Q30 59 36 60"/>
    <path d="M44 58 Q50 56.5 56 58"/>
    <path d="M62 60 Q68 59 70 62"/>
    <path d="M28 68 Q34 66 40 67"/>
    <path d="M56 67 Q62 66 68 68"/>
  </g>
  <!-- Внутренняя кромка (тёмная) -->
  <ellipse cx="48" cy="66" rx="22" ry="7.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Вода (голубая) -->
  <ellipse cx="48" cy="66" rx="17" ry="5" fill="#4A7BA6"/>
  <!-- Блики воды -->
  <path d="M38 65 Q42 63.5 46 64.5 M52 67 Q56 66 60 67" fill="none" stroke="#9CC3E0" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Капля с бадьи -->
  <circle cx="55" cy="58" r="1.2" fill="#9CC3E0"/>

  <!-- Основание из каменной кладки -->
  <path d="M20 72 L76 72 L81 84 L15 84 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Швы: верхний ряд -->
  <path d="M31 72 L29.5 78 M45 72 L45 78 M59 72 L60.5 78" stroke="#5C6670" stroke-width="1.3"/>
  <path d="M17.5 78 H78.5" stroke="#5C6670" stroke-width="1.3"/>
  <!-- Швы: нижний ряд (со смещением) -->
  <path d="M24.5 78 L23 84 M38 78 L37.5 84 M52 78 L52.5 84 M66 78 L67.5 84" stroke="#5C6670" stroke-width="1.3"/>
  <!-- Блик кладки -->
  <path d="M22 74 L20 82" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
</svg>
