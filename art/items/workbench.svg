<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    workbench — рабочий стол (обобщённый): деревянный стол с фартуком
    и балясинами, на нём — стопка книг, стакан с карандашами, бутылка.
    Композиция собрана в пределах столешницы.
  -->
  <!-- Тень-подложка -->
  <rect x="15.5" y="83.5" width="66" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Ножки-балясины -->
  <g fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6">
    <path d="M24 50 L22.5 86 L27.5 86 L29 50 Q26.5 53 24 50 Z"/>
    <path d="M72 50 L73.5 86 L68.5 86 L67 50 Q69.5 53 72 50 Z"/>
  </g>
  <path d="M25 60 Q27 64 25.2 68 M71 60 Q69 64 70.8 68" fill="none" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Фартук -->
  <rect x="21" y="45" width="54" height="6" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M25 48 H71" stroke="#B87F33" stroke-width="1.3"/>
  <!-- Столешница -->
  <rect x="14" y="35" width="68" height="11" rx="3.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="18" y="37.5" width="26" height="3" rx="1.5" fill="#E8B95F"/>

  <!-- Стопка книг (слева): нижняя синяя, верхняя терракотовая -->
  <g stroke="#1A1A1A" stroke-width="2.2">
    <rect x="22" y="30" width="21" height="6.5" rx="1.5" fill="#1F3A5F"/>
    <path d="M24.5 33.2 H40" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="25" y="23.5" width="19" height="6.5" rx="1.5" fill="#E0824A"/>
    <path d="M27.5 26.7 H41" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Ленточка-закладка -->
  <path d="M42 24 L44.5 19.5" stroke="#C8102E" stroke-width="2" stroke-linecap="round"/>

  <!-- Стакан с карандашами (центр) -->
  <path d="M49 22 L58 22 L56.5 36 L50.5 36 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Карандаши -->
  <g stroke-width="2.6" stroke-linecap="round">
    <path d="M51 33 L48.5 15" stroke="#E0824A"/>
    <path d="M53.5 33 L53.5 12" stroke="#5E8A46"/>
    <path d="M56 33 L58.5 16" stroke="#1F3A5F"/>
  </g>
  <!-- Грифели -->
  <path d="M48.5 15 L47.7 12.8 M53.5 12 L53.5 9.8 M58.5 16 L59.3 13.8" stroke="#3A2A20" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Блик на стакане -->
  <path d="M51 25 L50.5 32" stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Бутылка (справа) -->
  <path d="M66 20 L66 24 Q62 26 62 30 L62 34 Q62 36 64 36 L72 36 Q74 36 74 34 L74 30 Q74 26 70 24 L70 20 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Пробка -->
  <rect x="65" y="15" width="6" height="5.5" rx="1.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Блик на бутылке -->
  <path d="M64.5 28 L64.5 33" stroke="#7FA85B" stroke-width="2" stroke-linecap="round"/>
  <!-- Этикетка -->
  <rect x="64" y="28.5" width="8" height="5" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <path d="M65.5 31 H70.5" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>
</svg>
