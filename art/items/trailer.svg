<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trailer — кемпер-моторхоум (2-клеточный горизонтальный, occupiable):
    кремовый корпус с коричневым поясом-полосой, интегрированная кабина слева
    с лобовым стеклом, тонированные окна, открытая дверь с сиденьем
    (посадочная зона), кондиционер на крыше. Свет сверху-слева.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="43" ry="4.5" fill="#3A2A20"/>

  <!-- Колёса: переднее и задняя пара -->
  <circle cx="22" cy="75" r="9.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6"/>
  <circle cx="22" cy="75" r="3.8" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="22" cy="75" r="1.2" fill="#D5DCE1"/>
  <circle cx="66" cy="75" r="9.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6"/>
  <circle cx="66" cy="75" r="3.8" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="66" cy="75" r="1.2" fill="#D5DCE1"/>

  <!-- Корпус: кабина ниже слева, жилой объём выше -->
  <path d="M6 72
           L6 54
           Q6 50 10 50
           L24 50
           L24 34
           Q24 30 28 30
           L86 30
           Q90 30 90 34
           L90 72 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Кондиционер на крыше -->
  <rect x="38" y="22" width="18" height="9" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M41 25 H53" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Пояс-полоса (коричневый) + тонкая терракотовая -->
  <path d="M6 56 L90 56 L90 66 L6 66 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M6 53 L90 53 L90 56 L6 56 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Лобовое стекло кабины -->
  <path d="M10 48 L10 36 Q10 34 12 34 L22 34 L22 48 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M12 37 L20 37" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Сиденье кабины -->
  <path d="M14 48 L14 44 Q14 42.5 16 42.5 L19 42.5 L19 48 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Окна жилого объёма (тонированные) -->
  <rect x="30" y="36" width="13" height="12" rx="2" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M32.5 39 L40.5 39" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="47" y="36" width="13" height="12" rx="2" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M49.5 39 L57.5 39" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Дверь с открытым проёмом и сиденьем (посадочная зона) -->
  <path d="M64 70 L64 34 Q64 32 66 32 L78 32 Q80 32 80 34 L80 70 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M67 44 L67 37 Q67 36 68 36 L76 36 Q77 36 77 37 L77 44 Z" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M68 47 L66 47" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Сиденье у двери -->
  <path d="M66 70 L66 58 Q66 55.5 69 55.5 L75 55.5 L75 70 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M68 62 L73 62" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Бамперы -->
  <path d="M2 68 Q5 71.5 8 68" fill="none" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>
  <path d="M88 68 Q91 71.5 94 68" fill="none" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>

  <!-- Фара и стоп-сигнал (акцент) -->
  <circle cx="8" cy="62" r="2.8" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="87.5" y="44" width="4" height="5" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Блик по верхней кромке -->
  <path d="M28 33 L84 33" stroke="#DFD6C6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Антенна (живая деталь) -->
  <path d="M86 30 L88 20" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="88" cy="19" r="1.6" fill="#1A1A1A"/>
</svg>
