<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    ferrisWheel — колесо обозрения: стальное колесо со спицами,
    латунная ступица, кабинки (терракота/крем, одна красная),
    А-образные опоры.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Опоры (А-образные) -->
  <path d="M48 40 L28 84 M48 40 L68 84" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 68 L60 68" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>
  <path d="M24 84 H32 M64 84 H72" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <!-- Блики опор -->
  <path d="M46.5 46 L32 78 M49.5 46 L62 76" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Обод колеса -->
  <circle cx="48" cy="38" r="30" fill="none" stroke="#9BA5AD" stroke-width="4"/>
  <!-- Внутренний обод -->
  <circle cx="48" cy="38" r="24" fill="none" stroke="#5C6670" stroke-width="2"/>
  <!-- Спицы -->
  <g stroke="#5C6670" stroke-width="2">
    <path d="M48 8 V68 M18 38 H78 M27 17 L69 59 M69 17 L27 59"/>
  </g>

  <!-- Ступица (латунь) -->
  <circle cx="48" cy="38" r="5.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="48" cy="38" r="2" fill="#B87F33"/>

  <!-- Кабинки -->
  <!-- Верхняя (красная) -->
  <g>
    <path d="M48 8 L48 12" stroke="#5C6670" stroke-width="2"/>
    <path d="M42 12 H54 L52 22 H44 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M45 15 H51" stroke="#F5E9D0" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Право-верхняя (терракота) -->
  <g>
    <path d="M69 23 L68 26" stroke="#5C6670" stroke-width="2"/>
    <path d="M63 27 L75 25 L74 35 L62 37 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M65 30 H72" stroke="#F5E9D0" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Право-нижняя (крем) -->
  <g>
    <path d="M72 55 L71 58" stroke="#5C6670" stroke-width="2"/>
    <path d="M66 59 L78 57 L76 67 L64 69 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M68 62 H75" stroke="#9BA5AD" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Лево-верхняя (крем) -->
  <g>
    <path d="M27 23 L28 26" stroke="#5C6670" stroke-width="2"/>
    <path d="M21 25 L33 27 L32 37 L20 35 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M23 29 H30" stroke="#9BA5AD" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Лево-нижняя (терракота) -->
  <g>
    <path d="M24 55 L25 58" stroke="#5C6670" stroke-width="2"/>
    <path d="M18 57 L30 59 L28 69 L16 67 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M20 61 H27" stroke="#F5E9D0" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- Нижняя (крем, за опорами) -->
  <g>
    <path d="M48 68 L48 71" stroke="#5C6670" stroke-width="2"/>
    <path d="M42 71 H54 L52 81 H44 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M45 74 H51" stroke="#9BA5AD" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
