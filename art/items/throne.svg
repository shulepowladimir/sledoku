<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    throne — королевский трон: высокая резная спинка с навершием,
    терракотовая подушка, золочёные подлокотники-грифоны.
  -->
  <!-- Тень-подложка -->
  <rect x="24" y="80" width="48" height="8" rx="4" fill="#3A2A20"/>

  <!-- Ножки -->
  <rect x="28" y="66" width="7" height="20" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="61" y="66" width="7" height="20" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Высокая спинка -->
  <path d="M32 66 L32 20 Q32 12 48 10 Q64 12 64 20 L64 66 Z"
        fill="#B87F33" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Навершие -->
  <path d="M40 14 Q48 4 56 14 L52 20 L44 20 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="48" cy="16" r="2.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Обивка спинки -->
  <path d="M37 60 L37 24 Q37 18 48 17 Q59 18 59 24 L59 60 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M41 55 L41 26 M55 55 L55 26" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M40 24 Q48 20 56 24" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Сиденье -->
  <rect x="26" y="60" width="44" height="10" rx="4" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M30 63 Q48 60.5 66 63" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="26" y="69" width="44" height="5" rx="2.2" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Подлокотники -->
  <path d="M22 68 Q18 68 18 62 L18 50 Q18 44 26 44 L32 44 L32 68 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M74 68 Q78 68 78 62 L78 50 Q78 44 70 44 L64 44 L64 68 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Живая деталь: навершия подлокотников -->
  <circle cx="22" cy="47" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="74" cy="47" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
