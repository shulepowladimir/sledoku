<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    berth — полка в купе поезда: деревянная стеновая панель с окном,
    откидная полка с матрасом, подушкой и пледом, пристяжной ремень.
  -->
  <!-- Тень-подложка -->
  <rect x="13.5" y="82.5" width="70" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Стеновая панель (вагонное дерево) -->
  <rect x="14" y="14" width="68" height="70" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Вертикальные плашки -->
  <path d="M26 16 L26 82 M66 16 L66 82" stroke="#B87F33" stroke-width="1.6"/>
  <path d="M17 18 L17 80" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Окно поезда (справа, с голубым стеклом) -->
  <rect x="52" y="22" width="22" height="18" rx="3" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M56 38 L63 24 M62 39 L69 25" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Рама окна -->
  <path d="M63 22 V40" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Кронштейн полки -->
  <path d="M24 64 L24 74 L34 64 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Доска полки (торец) -->
  <rect x="18" y="56" width="52" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M22 60 L66 60" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Матрас на полке -->
  <rect x="18" y="47" width="52" height="10" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M22 52 Q30 50 38 52" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Подушка -->
  <rect x="20" y="40" width="16" height="9" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M23 44 Q28 42.5 33 44" fill="none" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Плед (терракота, сложен) -->
  <rect x="42" y="42" width="24" height="7" rx="2" fill="#E0824A" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M45 45.5 H63" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Пристяжной ремень (вертикально через постель) -->
  <rect x="37" y="40" width="5" height="19" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Пряжка -->
  <rect x="35.5" y="46" width="8" height="7" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
