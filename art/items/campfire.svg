<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    campfire — костёр: крест брёвен с торцами, каменное кольцо,
    живое пламя в три слоя (терракота → красный → крем) с искрами.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="34" ry="6" fill="#3A2A20"/>

  <!-- Каменное кольцо -->
  <g stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round">
    <ellipse cx="22" cy="78" rx="7" ry="5.5" fill="#5C6670"/>
    <ellipse cx="35" cy="82" rx="7.5" ry="5" fill="#9BA5AD"/>
    <ellipse cx="61" cy="82" rx="7.5" ry="5" fill="#9BA5AD"/>
    <ellipse cx="74" cy="78" rx="7" ry="5.5" fill="#5C6670"/>
    <ellipse cx="48" cy="84" rx="8" ry="5" fill="#9BA5AD"/>
  </g>
  <!-- Блики на камнях -->
  <path d="M31 80 Q33.5 78.5 36 79" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M58 80 Q60.5 78.8 63 79.2" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Нижнее бревно (горизонтальное) -->
  <rect x="26" y="66" width="44" height="10" rx="5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Торец бревна (справа) -->
  <ellipse cx="70" cy="71" rx="4" ry="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="70" cy="71" rx="1.8" ry="2.4" fill="#B87F33"/>

  <!-- Верхнее бревно (диагональное) -->
  <g transform="rotate(-24 48 62)">
    <rect x="28" y="57" width="40" height="9" rx="4.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
    <!-- Торец -->
    <ellipse cx="68" cy="61.5" rx="3.6" ry="4.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2"/>
    <ellipse cx="68" cy="61.5" rx="1.6" ry="2.2" fill="#B87F33"/>
    <!-- Волокно -->
    <path d="M34 61.5 Q44 59.5 54 61.5" fill="none" stroke="#B87F33" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Пламя: внешний слой (терракота) -->
  <path d="M48 12 Q56 24 60 34 Q64 44 58 52 Q66 50 68 44 Q72 56 62 62 Q54 66 48 66 Q42 66 34 62 Q24 56 28 44 Q30 50 38 52 Q32 44 36 34 Q40 24 48 12 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Средний слой (красный) -->
  <path d="M48 24 Q53 32 55.5 39 Q58 47 53 53 Q58 52 60 48 Q62 56 55 60 Q50 63 48 63 Q46 63 41 60 Q34 56 36 48 Q38 52 43 53 Q38 47 40.5 39 Q43 32 48 24 Z"
        fill="#C8102E"/>
  <!-- Ядро (крем) -->
  <path d="M48 38 Q50.5 43 51.5 48 Q52 54 48 57 Q44 54 44.5 48 Q45.5 43 48 38 Z" fill="#F5E9D0"/>

  <!-- Искры -->
  <g stroke="#E0824A" stroke-width="1.6" stroke-linecap="round">
    <path d="M40 16 L41.5 20"/>
    <path d="M57 15 L55.5 19"/>
    <path d="M64 28 L61.5 30"/>
    <path d="M31 26 L34 28.5"/>
  </g>
  <circle cx="48" cy="8" r="1.6" fill="#E0A94A"/>
</svg>
