<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    toolbox — ящик с инструментами: синий металлический корпус со стальной
    кромкой, ручка-скоба; из проёма торчат молоток с выраженной стальной
    головкой и гаечный ключ. Вид 3/4.
  -->
  <!-- Тень-подложка -->
  <rect x="20.5" y="81.5" width="56" height="8" rx="4" fill="#3A2A20"/>

  <!-- Верхняя грань (открытый проём с инструментами) -->
  <polygon points="22,32 74,32 80,44 28,44" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Молоток (торчит из проёма, выраженная головка) -->
  <path d="M40 42 L37 20" stroke="#B87F33" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M38.4 40 L36 24" stroke="#E0A94A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Головка молотка (стальной клин с бойком) -->
  <g transform="rotate(-14 35 15)">
    <rect x="27" y="11.5" width="16" height="7" rx="1.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Бойок (расширяющийся) -->
    <path d="M27 11.5 L24 10.5 L24 19.5 L27 18.5 Z" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Клюв с другой стороны -->
    <path d="M43 12.5 L48 15 L43 17.5 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Блик головки -->
    <rect x="29.5" y="13" width="9" height="1.6" rx="0.8" fill="#D5DCE1"/>
  </g>

  <!-- Гаечный ключ (торчит рядом) -->
  <path d="M56 42 L60 22" stroke="#9BA5AD" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="60.5" cy="18.5" r="4" fill="none" stroke="#9BA5AD" stroke-width="3"/>
  <circle cx="60.5" cy="18.5" r="1.6" fill="#3A2A20"/>
  <path d="M57.5 21 L59.5 23.5" stroke="#9BA5AD" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Левая боковина (тёмный синий) -->
  <polygon points="22,32 28,44 28,82 22,72" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Фронт (синий металл) -->
  <polygon points="28,44 80,44 80,82 28,82" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение низа -->
  <rect x="29.5" y="74" width="49" height="6.5" fill="#1A1A1A"/>
  <!-- Блик слева -->
  <rect x="32" y="47" width="3.5" height="28" rx="1.7" fill="#4A7BA6"/>

  <!-- Стальная кромка-пояс -->
  <rect x="26" y="52" width="56" height="7" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M30 55.5 H78" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Передняя защёлка -->
  <rect x="48" y="58" width="12" height="8" rx="1.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="54" cy="62" r="1.4" fill="#5C6670"/>

  <!-- Ручка-скоба (сталь, поверх) -->
  <path d="M38 44 Q38 30 49 30 Q60 30 60 44" fill="none" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 43 Q40 33 49 33 Q58 33 58 43" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
</svg>
