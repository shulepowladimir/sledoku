<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    artifactChest — сундук с артефактами: полубочка-крышка, тёмные полосы,
    золотой замок, волшебная искра над замком.
  -->
  <!-- Тень-подложка -->
  <rect x="18.5" y="82.5" width="60" height="8" rx="4" fill="#3A2A20"/>

  <!-- Ножки-пятки -->
  <path d="M24 82 L24 86 L30 86 L30 82 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M66 82 L66 86 L72 86 L72 82 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Корпус -->
  <rect x="20" y="44" width="56" height="38" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Доски корпуса -->
  <path d="M22 57 L74 57 M22 70 L74 70" stroke="#B87F33" stroke-width="1.6"/>
  <!-- Блик на корпусе -->
  <rect x="24" y="48" width="4" height="30" rx="2" fill="#E8B95F"/>

  <!-- Крышка (полубочка) -->
  <path d="M20 44 L20 40 Q20 16 48 16 Q76 16 76 40 L76 44 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение правой части крышки -->
  <path d="M48 16 Q76 16 76 40 L76 44 L48 44 Z" fill="#E0A94A"/>
  <!-- Доски крышки -->
  <path d="M32 17 Q29 28 28.5 43 M64 17 Q67 28 67.5 43" stroke="#B87F33" stroke-width="1.6" fill="none"/>
  <!-- Блик на крышке -->
  <path d="M28 32 Q29 22 37 18.5" fill="none" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Вертикальные полосы-оковки -->
  <rect x="30" y="16" width="7" height="66" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="59" y="16" width="7" height="66" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Заклёпки на оковках -->
  <g fill="#E0A94A">
    <circle cx="33.5" cy="22" r="1.2"/>
    <circle cx="33.5" cy="63" r="1.2"/>
    <circle cx="62.5" cy="22" r="1.2"/>
    <circle cx="62.5" cy="63" r="1.2"/>
  </g>

  <!-- Замок -->
  <rect x="42" y="42" width="12" height="12" rx="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="45" y="47" width="6" height="4.5" rx="1.5" fill="#3A2A20"/>
  <path d="M47.5 47 L47.5 44" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="47.5" cy="42" r="2" fill="none" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Волшебная искра над замком -->
  <g stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round">
    <path d="M48 6 L48 11"/>
    <path d="M41 9 L43.8 11.8"/>
    <path d="M55 9 L52.2 11.8"/>
  </g>
  <circle cx="48" cy="3.8" r="1.6" fill="#E8B95F"/>
</svg>
