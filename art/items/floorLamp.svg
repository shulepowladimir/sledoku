<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    floorLamp — торшер: стальная стойка-тренога, абажур-конус
    (терракота с кремовой подсветкой изнутри), тёплый свет.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="27" ry="4.5" fill="#3A2A20"/>

  <!-- Ножки-тренога -->
  <g stroke="#9BA5AD" stroke-width="4" stroke-linecap="round">
    <path d="M44 66 L32 84"/>
    <path d="M52 66 L64 84"/>
    <path d="M48 68 L48 85"/>
  </g>
  <!-- Блики на ножках -->
  <path d="M43 70 L34 82 M51 70 L60 82" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Наконечники -->
  <circle cx="32" cy="84.5" r="2.2" fill="#5C6670"/>
  <circle cx="64" cy="84.5" r="2.2" fill="#5C6670"/>
  <!-- Узел треноги -->
  <circle cx="48" cy="66" r="3.4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Стойка -->
  <rect x="46" y="30" width="4" height="37" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="46.8" y="32" width="1.4" height="33" fill="#D5DCE1"/>

  <!-- Абажур (конус, терракота) -->
  <path d="M30 30 L66 30 L58 8 Q48 5 38 8 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение правой стороны абажура -->
  <path d="M52 6.7 L58 8 L66 30 L52 30 Z" fill="#B85F2E"/>
  <!-- Блик слева -->
  <path d="M35 26 Q42 12 47 9.5" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Строчки-гофра -->
  <path d="M32.5 24 L63.5 24 M34 18 L62 18" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Нижняя кромка абажура с тёплым светом -->
  <rect x="30" y="30" width="36" height="5" rx="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Тёплый отблеск (конус света под абажуром, сплошной тон) -->
  <polygon points="34,35 62,35 58,52 38,52" fill="#E8B95F"/>
  <path d="M38 38 L58 38" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Выключатель-шнурок -->
  <path d="M66 33 Q70 38 69 44" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="69" cy="46" r="1.8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
