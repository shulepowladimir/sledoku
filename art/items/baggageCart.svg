<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    baggageCart — тележка багажа: стальная платформа на колёсах,
    решётчатые борта, стопка чемоданов и сумка сверху.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Колёса -->
  <circle cx="28" cy="82" r="6.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="28" cy="82" r="2" fill="#5C6670"/>
  <circle cx="68" cy="82" r="6.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="68" cy="82" r="2" fill="#5C6670"/>

  <!-- Платформа -->
  <rect x="16" y="72" width="64" height="8" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M20 76 L76 76" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Решётчатые борта (задний + боковой вид 3/4) -->
  <g stroke="#5C6670" stroke-width="2.2" stroke-linecap="round">
    <path d="M16 72 L16 56 M80 72 L80 56"/>
    <path d="M16 62 L80 62"/>
    <path d="M24 72 L24 60 M32 72 L32 60 M40 72 L40 60 M48 72 L48 60 M56 72 L56 60 M64 72 L64 60 M72 72 L72 60"/>
  </g>
  <!-- Верхняя перекладина борта -->
  <rect x="14" y="53" width="68" height="4.5" rx="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Чемодан 1 (большой, снизу) -->
  <rect x="24" y="48" width="34" height="18" rx="2.5" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M27 52 L55 52" stroke="#E0824A" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="36" y="46.5" width="10" height="4" rx="1.5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Наклейки на чемодане -->
  <rect x="29" y="56" width="8" height="6" rx="1" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="50" cy="58" r="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Чемодан 2 (средний) -->
  <rect x="44" y="36" width="28" height="14" rx="2.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M47 40 H69" stroke="#2E6E65" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="54" y="34.5" width="8" height="3.6" rx="1.5" fill="#1A1A1A"/>

  <!-- Сумка-дипломат сверху -->
  <rect x="28" y="28" width="24" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M36 28 L36 24 L44 24 L44 28" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M30 33 L50 33" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ручка тележки (справа) -->
  <path d="M80 64 L88 54" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <path d="M88 54 Q90 52 88.5 50" fill="none" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>
</svg>
