<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    giraffe — жираф (зоопарк): стоячий силуэт с длинной шеей,
    пятна, рожки-оссиконы, добродушная морда. Посадочная зона — спина.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="46" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Дальние ноги (темнее) -->
  <path d="M32 66 L31 82 L36.5 82 L37 66 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M62 66 L66 82 L71 82 L67 66 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="30.5" y="80" width="6.5" height="5" rx="1.5" fill="#3A2A20"/>
  <rect x="65.5" y="80" width="6.5" height="5" rx="1.5" fill="#3A2A20"/>

  <!-- Хвост с кисточкой -->
  <path d="M68 60 Q76 62 76 70" fill="none" stroke="#E8B95F" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 70 Q78 69 77 74 Q73 74 74 70 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Тело -->
  <path d="M26 64 Q24 52 34 50 L60 50 Q70 52 68 64 L64 68 L30 68 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на крупе -->
  <path d="M34 54 Q42 51.5 50 52.5" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ближние ноги -->
  <path d="M36 66 L35 82 L41 82 L41.5 66 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M56 66 L57 82 L63 82 L60 66 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="34.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="56.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Шея (вверх-влево) -->
  <path d="M31 56 Q26 40 31 24 L42 26 Q39 42 42 56 Q36 60 31 56 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Грива (задняя кромка шеи) -->
  <path d="M31 24 Q26 40 30 55 Q28 40 33 26 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Голова -->
  <path d="M30 24 Q29 15 37 13 Q46 12 48 19 Q49 24 45 27 L33 28 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Морда (кремовая) -->
  <path d="M30 22 Q28 18 30 15 Q33 13 36 14 L37 20 Q34 23 30 22 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Ноздря -->
  <circle cx="31.5" cy="17.5" r="1.1" fill="#3A2A20"/>
  <!-- Улыбка -->
  <path d="M33 21 Q35 22.5 37 22" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Глаз (мультяшный реализм) -->
  <ellipse cx="39" cy="19" rx="2.4" ry="2.8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="39" cy="19.5" r="1.4" fill="#1A1A1A"/>
  <circle cx="38.4" cy="18.8" r="0.5" fill="#F5E9D0"/>
  <!-- Ушко -->
  <path d="M44 12 Q43 7 47 6 Q50 7 48 12 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M45.5 10.5 Q45.5 8.5 47 8" fill="none" stroke="#B85F2E" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Оссиконы (рожки) -->
  <path d="M36 13 L34 7" stroke="#B85F2E" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="34" cy="6" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.2"/>
  <path d="M41 12.5 L41 6" stroke="#B85F2E" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="41" cy="5" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Пятна -->
  <path d="M38 58 Q35 56 34 59 Q35 62 39 61 Z" fill="#B85F2E"/>
  <path d="M50 56 Q48 53 52 53 Q55 54 53 57 Q51 59 50 56 Z" fill="#B85F2E"/>
  <path d="M60 60 Q58 58 61 57 Q64 58 62 61 Q60 62 60 60 Z" fill="#B85F2E"/>
  <path d="M43 63 Q41 61 44 61 Q46 62 44 64 Z" fill="#B85F2E"/>
  <path d="M34 36 Q32 34 34 32 Q37 32 36 35 Q35 37 34 36 Z" fill="#B85F2E"/>
  <path d="M38 46 Q36 44 39 44 Q41 45 39 47 Z" fill="#B85F2E"/>
</svg>
