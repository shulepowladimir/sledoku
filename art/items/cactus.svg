<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cactus — уличный сагуаро без горшка: ствол и руки уходят
    в земляной холмик с камешками. Рельефные риды, колючки-штрихи,
    блик слева, красный цветок — единственный акцент.
  -->

  <!-- Ствол -->
  <rect x="40" y="14" width="17" height="62" rx="8.5" fill="#5E8A46" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Левая рука (капсула с округлым верхом) -->
  <path d="M40 28 L34 28 L34 19 Q34 14 30.5 14 Q27 14 27 19 L27 31 Q27 36 31 36 L40 36 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Правая рука (ниже и короче) -->
  <path d="M56 40 L62 40 L62 33 Q62 29 65.5 29 Q69 29 69 33 L69 43 Q69 47 65 47 L56 47 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Блик слева на стволе (свет сверху-слева) -->
  <rect x="43" y="18" width="4" height="50" rx="2" fill="#7FA85B"/>
  <!-- Риды -->
  <g fill="none" stroke="#44663A" stroke-width="1.8" stroke-linecap="round">
    <path d="M50 20 L50 60"/>
    <path d="M54 22 L54 58"/>
    <path d="M30.5 17 L30.5 32"/>
    <path d="M66 31 L66 44"/>
  </g>
  <!-- Колючки-штрихи -->
  <g fill="none" stroke="#7FA85B" stroke-width="1.3" stroke-linecap="round">
    <path d="M47 26 L45.4 24.8"/>
    <path d="M47 38 L45.4 39.2"/>
    <path d="M47 50 L45.4 48.8"/>
    <path d="M53 32 L54.8 30.9"/>
    <path d="M53 46 L54.8 47.1"/>
    <path d="M28.6 22 L27 20.9"/>
    <path d="M64.8 35 L66.3 34"/>
  </g>

  <!-- Цветок (акцент) -->
  <g fill="#C8102E">
    <circle cx="48" cy="9" r="2.6"/>
    <circle cx="43.6" cy="11.6" r="2.6"/>
    <circle cx="52.4" cy="11.6" r="2.6"/>
    <circle cx="45.6" cy="14.6" r="2.6"/>
    <circle cx="50.4" cy="14.6" r="2.6"/>
  </g>
  <circle cx="48" cy="12" r="2.2" fill="#F5E9D0"/>

  <!-- Земляной холмик (уличная посадка) -->
  <path d="M22 76 Q30 66 42 68 Q48 62 56 67 Q66 63 74 72 Q80 78 76 84 L26 84 Q20 82 22 76 Z"
        fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тень-подложка под холмиком -->
  <ellipse cx="49" cy="86" rx="30" ry="4.5" fill="#3A2A20"/>
  <!-- Камешки -->
  <ellipse cx="30" cy="78" rx="3" ry="2.2" fill="#3A2A20"/>
  <ellipse cx="64" cy="80" rx="2.4" ry="1.8" fill="#3A2A20"/>
  <ellipse cx="46" cy="81.5" rx="2" ry="1.5" fill="#E0824A"/>
  <!-- Блик на холмике -->
  <path d="M28 73 Q34 68.5 40 69.5" fill="none" stroke="#E0824A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
