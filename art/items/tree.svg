<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    tree — ёлка: три яруса лап (два тона зелени), ствол, снежная
    шапка не нужна — просто живая ель с бликами и шишкой.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="28" ry="5.5" fill="#3A2A20"/>

  <!-- Ствол -->
  <rect x="44" y="70" width="8" height="14" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Корни-расширение -->
  <path d="M40 84 Q44 79 44 76 L52 76 Q52 79 56 84 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Нижний ярус (самый широкий) -->
  <path d="M48 38 Q28 44 20 62 Q30 60 34 63 Q28 66 26 72 Q38 70 48 73 Q58 70 70 72 Q68 66 62 63 Q66 60 76 62 Q68 44 48 38 Z"
        fill="#44663A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Средний ярус -->
  <path d="M48 26 Q33 31 26 46 Q34 44 38 47 Q33 50 32 55 Q41 53 48 56 Q55 53 64 55 Q63 50 58 47 Q62 44 70 46 Q63 31 48 26 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Верхний ярус -->
  <path d="M48 12 Q38 16 33 28 Q39 26 42 29 Q38 32 38 36 Q44 34 48 37 Q52 34 58 36 Q58 32 54 29 Q57 26 63 28 Q58 16 48 12 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Блики на лапах (свет сверху-слева) -->
  <g fill="none" stroke="#7FA85B" stroke-width="2" stroke-linecap="round">
    <path d="M42 22 Q46 19 51 19"/>
    <path d="M36 40 Q42 36.5 49 36.5"/>
    <path d="M28 58 Q36 54 45 54"/>
  </g>

  <!-- Шишка-акцент -->
  <ellipse cx="60" cy="50" rx="2.8" ry="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M58.6 49 H61.4 M58.6 51.5 H61.4" stroke="#3A2A20" stroke-width="0.9"/>

  <!-- Макушка -->
  <path d="M48 12 Q44 9 48 5 Q52 9 48 12" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.8"/>
</svg>
