<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    journal — журнал бронирований: раскрытая книга на столе,
    кремовые страницы со строчками, красная закладка, кожаная обложка.
  -->
  <!-- Обложка (кожа, раскрытая) -->
  <path d="M14 30 Q30 24 46 30 L46 70 Q30 64 14 70 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M82 30 Q66 24 50 30 L50 70 Q66 64 82 70 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Корешок -->
  <path d="M46 30 L50 30 L50 70 L46 70 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Страницы (левая) -->
  <path d="M18 32 Q32 27 45 32 L45 66 Q32 61 18 66 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Строчки левой страницы -->
  <g stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round">
    <path d="M23 38 Q32 35 41 37.5"/>
    <path d="M23 43 Q32 40 41 42.5"/>
    <path d="M23 48 Q32 45 41 47.5"/>
    <path d="M23 53 Q32 50 41 52.5"/>
    <path d="M23 58 Q32 55 40 57"/>
  </g>

  <!-- Страницы (правая) -->
  <path d="M78 32 Q64 27 51 32 L51 66 Q64 61 78 66 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Строчки правой страницы (клетка-таблица бронирований) -->
  <g stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round">
    <path d="M55 38 Q64 35 73 37.5"/>
    <path d="M55 43 Q64 40 73 42.5"/>
    <path d="M55 48 Q64 45 73 47.5"/>
    <path d="M55 53 Q64 50 73 52.5"/>
    <path d="M55 58 Q64 55 72 57"/>
  </g>
  <!-- Галочка-отметка бронирования (юмор: одна подтверждена) -->
  <path d="M68 47 L70 49.5 L74.5 43.5" fill="none" stroke="#7FA85B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Красная закладка (сверху справа) -->
  <path d="M68 28 L74 26.5 L73 42 L70.5 39.5 L68 42 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Очки поверх книги (юмор-деталь детектива) -->
  <circle cx="38" cy="51" r="6.5" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="56" cy="51" r="6.5" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M44.5 51 Q47 49 49.5 51" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M31.5 50 Q29 49 27 50 M62.5 50 Q65 49 67 50" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Блик на линзе -->
  <path d="M35 48.5 Q36.5 47.5 38 48" fill="none" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>
</svg>
