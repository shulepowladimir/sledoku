<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    carousel — карусель: полосатый шатёр (красный/крем) с фестонами,
    латунный шест, карусельный конь с красным седлом, деревянная платформа.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Платформа -->
  <ellipse cx="48" cy="78" rx="30" ry="8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="76" rx="30" ry="8" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M24 76 Q48 70 72 76" fill="none" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Латунный шест -->
  <rect x="45.5" y="24" width="5" height="52" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="46.6" y="28" width="1.2" height="44" fill="#E8B95F"/>

  <!-- Конь карусели (кремовый, в галопе) -->
  <g>
    <!-- Корпус -->
    <path d="M28 56 Q27 48 36 47 L56 47 Q64 48 63 55 Q62 61 54 62 L34 62 Q28 62 28 56 Z"
          fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Шея и голова -->
    <path d="M34 50 L38 47 L42 36 L49 37 L47 48 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M42 36 L49 37 Q54 38 53 42 L47 43 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Грива -->
    <path d="M41 35 Q43 42 47 47 Q42 46 39 48 Q40 42 38 37 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Глаз -->
    <circle cx="48.5" cy="39.5" r="1.3" fill="#1A1A1A"/>
    <!-- Ноги (галоп: перед подогнут, зад откинут) -->
    <path d="M34 61 Q31 67 34 70 Q37 69 37 63" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M52 61 Q55 68 52 72 Q49 70 50 63" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Хвост -->
    <path d="M62 52 Q68 56 67 64 Q64 60 62 58 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Седло (красный акцент) -->
    <path d="M40 47 L54 48 L53 54 Q47 56 41 53 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M40 47 Q37 46 37 49 Q38 51 41 51" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Попона-полоска -->
    <path d="M36 57 Q48 60 60 57" fill="none" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Шест сквозь коня (передний сегмент) -->
  <rect x="45.5" y="46" width="5" height="18" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Шатёр (полосатый конус) -->
  <path d="M16 26 Q48 4 80 26 L76 14 Q48 -2 20 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M16 26 Q48 8 80 26 L80 32 Q48 14 16 32 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Кремовые полосы шатра -->
  <path d="M30 28.5 Q31 21.5 34.5 16.5 L41 13 Q37 19 36 27 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M48 26.5 Q48 18 48 11 L55 12 Q52 18 52 26 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M64 29 Q62 21 58.5 15.5 L52 12 Q57 18.5 58 28 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Фестоны по краю шатра -->
  <path d="M16 32 Q20 36 24 32 Q28 36 32 32 Q36 36 40 32 Q44 36 48 32 Q52 36 56 32 Q60 36 64 32 Q68 36 72 32 Q76 36 80 32"
        fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Шпиль с флажком -->
  <path d="M48 4 L48 -2" stroke="#E0A94A" stroke-width="0"/>
  <circle cx="48" cy="6" r="2.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
