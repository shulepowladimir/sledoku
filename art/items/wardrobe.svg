<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wardrobe — платяной шкаф: массивный, top-down 3/4, две створки,
    одна приоткрыта (висит халат), ящик внизу, замочный ключ.
  -->
  <!-- Тень-подложка -->
  <rect x="16.5" y="83.5" width="64" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Ножки -->
  <rect x="22" y="81" width="7" height="6" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="67" y="81" width="7" height="6" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Толщина (ближняя грань) -->
  <rect x="18" y="74" width="60" height="9" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M22 77.5 L74 77.5" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ящик внизу -->
  <rect x="30" y="64" width="36" height="10" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="40" y="67.5" width="16" height="3" rx="1.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Корпус -->
  <rect x="18" y="16" width="60" height="50" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Карниз сверху -->
  <rect x="14" y="10" width="68" height="8" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M18 13 Q48 11 78 13" fill="none" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Правая створка (закрытая) -->
  <rect x="50" y="22" width="24" height="38" rx="2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M53 26 L53 56" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Филёнка -->
  <rect x="55" y="28" width="14" height="26" rx="2" fill="none" stroke="#B87F33" stroke-width="1.8"/>
  <!-- Ручка -->
  <rect x="52" y="38" width="3" height="9" rx="1.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Левая створка (приоткрыта — темнее, видно нутро) -->
  <rect x="22" y="22" width="26" height="38" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Вешалка внутри -->
  <path d="M24 30 L46 30" stroke="#9BA5AD" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Халат на вешалке (светлый) -->
  <path d="M31 30 Q28 40 29 54 L37 54 Q38 40 35 30 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M33 30 L33 54" stroke="#E8B95F" stroke-width="1.4"/>
  <path d="M29.5 38 Q33 36.5 36.5 38" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Крючок вешалки -->
  <path d="M33 30 Q33 26 36 26 Q38 26 38 28" fill="none" stroke="#9BA5AD" stroke-width="2" stroke-linecap="round"/>

  <!-- Ключ в замке (юмор: ключ забыт) -->
  <circle cx="49" cy="44" r="2" fill="none" stroke="#E0A94A" stroke-width="1.8"/>
  <path d="M49 46 L49 53 M49 50 L52 50" stroke="#E0A94A" stroke-width="1.8" stroke-linecap="round"/>
</svg>
