<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stove — кухонная плита: top-down 3/4, варочная панель с 4 конфорками
    (одна с чайником), духовка с окошком, ручки-переключатели.
  -->
  <!-- Тень-подложка -->
  <rect x="18.5" y="82.5" width="60" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Ближние ножки -->
  <rect x="23" y="80" width="6" height="6" rx="2" fill="#5C6670"/>
  <rect x="67" y="80" width="6" height="6" rx="2" fill="#5C6670"/>

  <!-- Толщина плиты (ближняя грань) -->
  <rect x="20" y="60" width="56" height="22" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M24 64 L72 64" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Духовка (дверца с окошком) -->
  <rect x="27" y="64" width="42" height="15" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="33" y="67" width="30" height="9" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Ручка духовки -->
  <rect x="40" y="62.5" width="16" height="2.6" rx="1.3" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Подсветка духовки (блик) -->
  <path d="M36 70 Q42 68 48 70" fill="none" stroke="#7FA85B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Варочная панель (плита) -->
  <rect x="22" y="26" width="52" height="36" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Блик-кант дальней кромки -->
  <path d="M26 30 Q48 27.5 70 30" fill="none" stroke="#5C6670" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Конфорки (4 шт) -->
  <g fill="none" stroke="#9BA5AD" stroke-width="2">
    <circle cx="36" cy="38" r="7"/>
    <circle cx="60" cy="38" r="7"/>
    <circle cx="36" cy="52" r="7"/>
    <circle cx="60" cy="52" r="7"/>
  </g>
  <g fill="none" stroke="#5C6670" stroke-width="1.4">
    <circle cx="36" cy="38" r="4"/>
    <circle cx="60" cy="38" r="4"/>
    <circle cx="36" cy="52" r="4"/>
    <circle cx="60" cy="52" r="4"/>
  </g>

  <!-- Чайник на конфорке (юмор-деталь: закипел) -->
  <path d="M53 52 Q52 44 60 43 Q68 44 67 52 Q68 54 66 54 L54 54 Q52 54 53 52 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Носик -->
  <path d="M53 47 L48 42 L49.5 40 L54 44" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Ручка -->
  <path d="M66 46 Q70 47 69.5 50 Q69 52.5 66 52" fill="none" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Крышка -->
  <rect x="57.5" y="41" width="5" height="2.5" rx="1" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Пар из носика -->
  <path d="M48.5 38 Q47 36 48.5 34 Q50 32 48.5 30" fill="none" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M52 37 Q50.5 35 52 33" fill="none" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Ручки-переключатели на фронтальной панели -->
  <circle cx="30" cy="70" r="2.8" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="66" cy="70" r="2.8" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M30 68.5 V70 M66 68.5 V70" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
