<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    trough — корыто с водой: деревянное корыто (top-down 3/4:
    видна поверхность воды), стальные обручи, капли/блеск на воде.
  -->
  <!-- Тень-подложка -->
  <rect x="19.5" y="76.5" width="58" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Ножки-пятки -->
  <rect x="26" y="74" width="8" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="62" y="74" width="8" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Стенки корыта (дерево) -->
  <path d="M16 46 L80 46 L74 74 L22 74 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Доски стенок -->
  <path d="M18.6 55 L77.4 55 M20 64 L76 64" stroke="#B87F33" stroke-width="1.6"/>
  <!-- Блик слева -->
  <path d="M21 50 L19.5 70" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Обручи (сталь) -->
  <rect x="19" y="57" width="58" height="6" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M23 60 H73" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Поверхность воды (внутри, эллипс) -->
  <ellipse cx="48" cy="46" rx="30" ry="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="48" cy="46" rx="25" ry="6.5" fill="#4A7BA6"/>
  <!-- Блики на воде -->
  <path d="M32 44.5 Q38 43 44 44.5" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M52 48 Q58 46.8 64 48" fill="none" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Капля-блеск -->
  <path d="M44 41 Q45.5 43.5 44 44.5 Q42.5 43.5 44 41 Z" fill="#F5E9D0"/>
</svg>
