<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hippo — бегемот (зоопарк): сине-серый (стальная тройка), открытая
    пасть с кремовыми зубами, круглые ушки, брызги воды.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Дальние ноги -->
  <rect x="32" y="68" width="9" height="14" rx="4" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="58" y="68" width="9" height="14" rx="4" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Тело (пузатое) -->
  <path d="M22 66 Q20 48 36 44 L58 44 Q76 48 74 66 Q74 70 68 70 L28 70 Q22 70 22 66 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на спине -->
  <path d="M32 50 Q44 46.5 56 47.5" fill="none" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Ближние ноги -->
  <rect x="27" y="66" width="10" height="16" rx="4.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="62" y="66" width="10" height="16" rx="4.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Голова с открытой пастью -->
  <path d="M18 46 Q14 32 26 26 L34 28 L34 36 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Верхняя челюсть -->
  <path d="M18 46 Q16 38 24 33 L40 30 Q50 29 52 35 L50 42 Q36 46 18 46 Z"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Нижняя челюсть -->
  <path d="M22 52 Q26 62 40 60 Q50 58 51 50 L49 44 Q36 50 22 52 Z"
        fill="#5C6670" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Пасть (внутри) -->
  <path d="M23 47 Q34 55 49 45 L48 41 Q34 47 22 46 Z" fill="#3A2A20"/>
  <!-- Зубы (кремовые клыки) -->
  <path d="M26 46 L28 52 L30 46 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M45 44 L47 50 L49 43 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Ноздри -->
  <circle cx="26" cy="36" r="1.3" fill="#3A2A20"/>
  <circle cx="33" cy="34" r="1.3" fill="#3A2A20"/>
  <!-- Глаз (полуприкрытый, довольный) -->
  <circle cx="38" cy="33" r="2.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="38" cy="33.5" r="1.2" fill="#1A1A1A"/>
  <path d="M35.5 32 Q38 30.5 40.5 32" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Ушко -->
  <circle cx="46" cy="28" r="2.6" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Хвостик -->
  <path d="M74 60 Q79 58 78 53" fill="none" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>

  <!-- Брызги воды -->
  <circle cx="58" cy="56" r="1.5" fill="#9CC3E0"/>
  <circle cx="64" cy="52" r="1.2" fill="#9CC3E0"/>
  <circle cx="61" cy="61" r="1" fill="#9CC3E0"/>
</svg>
