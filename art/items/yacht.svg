<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    yacht — спортивная парусная яхта (occupiable): белый корпус с синей ватерлинией,
    высокая мачта с гротом, кокпит с кремовой подушкой (посадочная зона),
    красный вымпел на топе. Волны — по канону голубой воды.
  -->
  <!-- Тень-подложка (в воде) -->
  <ellipse cx="48" cy="82" rx="36" ry="5" fill="#3A2A20"/>

  <!-- Корпус (белый, клиперский нос влево) -->
  <path d="M12 58 Q48 68 84 58 L78 74 Q48 82 18 74 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Синяя ватерлиния -->
  <path d="M16 70 Q48 78 80 70" fill="none" stroke="#1F3A5F" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Затемнение борта снизу -->
  <path d="M20 74 Q48 81 76 74 L78 74 Q48 82 18 74 Z" fill="#DFD6C6"/>
  <!-- Блик на борту -->
  <path d="M24 63 Q40 67 56 67" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Кокпит (посадочная зона) -->
  <path d="M34 66 L34 60 Q42 57 50 60 L50 66 Z" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M36 64 L48 64" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Мачта -->
  <path d="M60 56 L60 10" stroke="#8F5A3A" stroke-width="3.4" stroke-linecap="round"/>
  <!-- Гик -->
  <path d="M60 52 L82 52" stroke="#8F5A3A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Грот (треугольный, надут вправо) -->
  <path d="M63 15 Q73 34 84 52 L63 52 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Швы грота -->
  <path d="M66 24 Q71 34 78 49 M69 30 Q72 38 76 48" fill="none" stroke="#DFD6C6" stroke-width="1.3"/>

  <!-- Красный вымпел на топе мачты -->
  <path d="M60 8 L72 11 L60 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Фаловый блок (живая деталь) -->
  <circle cx="61" cy="12" r="1.6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Волны (голубые, поверх корпуса) -->
  <path d="M6 76 Q12 72 18 76 T30 76 T42 76 T54 76 T66 76 T78 76 T90 76"
        fill="none" stroke="#4A7BA6" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M16 80 Q21 77.5 26 80 M58 81 Q63 78.5 68 80" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Брызги -->
  <circle cx="10" cy="70" r="1.3" fill="#9CC3E0"/>
  <circle cx="86" cy="70" r="1.3" fill="#9CC3E0"/>
</svg>
