<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    piano — пианино (вертикальное): деревянный корпус, открытая крышка,
    клавиатура, педали, ноты и подсвечник сверху.
  -->
  <!-- Тень-подложка -->
  <rect x="14.5" y="83.5" width="68" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Корпус -->
  <path d="M20 30 L76 30 L76 78 L20 78 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Верхняя панель -->
  <rect x="18" y="26" width="60" height="7" rx="2.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Открытая крышка (поднята) -->
  <path d="M22 26 L14 8 Q30 4 44 8 L38 26 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M18 10 Q29 7 40 9.5" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Блик корпуса -->
  <rect x="24" y="34" width="4" height="38" rx="2" fill="#E8B95F"/>

  <!-- Пюпитр с нотами (в центре корпуса) -->
  <rect x="38" y="40" width="20" height="18" rx="1.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="40.5" y="42" width="15" height="12" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Нотные строчки -->
  <path d="M42.5 45.5 H53.5 M42.5 48 H53.5 M42.5 50.5 H50" stroke="#9BA5AD" stroke-width="1" stroke-linecap="round"/>
  <circle cx="49.5" cy="45" r="1.1" fill="#3A2A20"/>
  <path d="M50.6 45 L50.6 50" stroke="#3A2A20" stroke-width="1" stroke-linecap="round"/>

  <!-- Клавиатурный блок -->
  <rect x="16" y="58" width="64" height="12" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Белые клавиши -->
  <rect x="19" y="59.5" width="58" height="7" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Чёрные клавиши -->
  <rect x="24" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="30" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="39" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="45" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="51" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="60" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>
  <rect x="66" y="59.5" width="3.4" height="4.5" fill="#1A1A1A"/>

  <!-- Педали -->
  <rect x="40" y="74" width="16" height="6" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="43.5" y="76" width="3" height="4" rx="1" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.2"/>
  <rect x="50" y="76" width="3" height="4" rx="1" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Ножки -->
  <rect x="20" y="78" width="6" height="6" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="70" y="78" width="6" height="6" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Подсвечник на верхней панели (атмосфера) -->
  <rect x="64" y="19" width="2.6" height="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M65.3 13 Q66.8 15.5 66.3 17.5 Q66.1 18.6 65.3 18.6 Q64.5 18.6 64.3 17.5 Q63.8 15.5 65.3 13 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
