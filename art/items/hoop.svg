<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hoop — цирковой обруч на подставке: кольцо с чередованием
    красных и кремовых сегментов (акцент), стальная стойка,
    золотое основание-подиум.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="26" ry="4" fill="#3A2A20"/>

  <!-- Подиум -->
  <path d="M28 82 L68 82 L64 88 L32 88 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32 84.5 L64 84.5" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ножка-стойка -->
  <path d="M48 72 L48 82" stroke="#5C6670" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M48 74 L48 80" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Раскосины -->
  <path d="M48 78 L38 84 M48 78 L58 84" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Тело кольца: кремовая база -->
  <circle cx="48" cy="48" r="31" fill="none" stroke="#F5E9D0" stroke-width="10"/>
  <!-- Красные сегменты (чередование по дуге: 6 красных / 6 кремовых) -->
  <circle cx="48" cy="48" r="31" fill="none" stroke="#C8102E" stroke-width="10"
          stroke-dasharray="16.23 16.23" stroke-dashoffset="8.1"/>
  <!-- Контуры кольца -->
  <circle cx="48" cy="48" r="36" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="48" cy="48" r="26" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Хомут-крепление сверху -->
  <rect x="45.6" y="10.8" width="4.8" height="6.4" rx="1.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
