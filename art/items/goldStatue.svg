<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    goldStatue — золотая статуя кошки (египетский зал): сидящая кошка
    из золота на каменном постаменте, ожерелье, хвост обвивает лапы.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Постамент (камень) -->
  <rect x="30" y="74" width="36" height="12" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M33 78 H63" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="26" y="84" width="44" height="6" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Сидящая кошка (золото) -->
  <path d="M32 74 Q30 56 38 48 Q36 44 38 38 L44 40 Q48 38 52 40 L58 38 Q60 44 58 48 Q66 56 64 74 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Голова -->
  <ellipse cx="48" cy="36" rx="10" ry="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Уши -->
  <path d="M39 31 L37 22 L44 27 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M57 31 L59 22 L52 27 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Глаза (кошачьи, золотые) -->
  <ellipse cx="44" cy="35" rx="1.8" ry="2.4" fill="#3A2A20"/>
  <ellipse cx="52" cy="35" rx="1.8" ry="2.4" fill="#3A2A20"/>
  <!-- Носик и усы -->
  <path d="M47 38.5 Q48 39.5 49 38.5" fill="none" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M42 39 L38 40 M54 39 L58 40" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <!-- Ожерелье (латунное) -->
  <path d="M40 45 Q48 49 56 45" fill="none" stroke="#B87F33" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="1.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="0.9"/>
  <!-- Хвост, обвивающий лапы -->
  <path d="M64 72 Q74 70 73 62 Q72 58 68 60" fill="none" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M64.5 71 Q72.5 68.5 71.5 62" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Лапы-полоски -->
  <path d="M38 74 V68 M44 74 V69 M52 74 V69 M58 74 V68" stroke="#B87F33" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Блик на спине -->
  <path d="M38 56 Q37 50 41 46" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Табличка -->
  <rect x="38" y="80" width="20" height="4.5" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
