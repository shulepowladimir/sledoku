<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    clapperboard — кинематографическая хлопушка: тёмная доска с полями,
    верхняя планка с диагональными кремовыми полосами приоткрыта,
    карандаш за полями, красная точка REC.
  -->
  <!-- Доска -->
  <rect x="14" y="34" width="68" height="44" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик -->
  <path d="M18 39 L18 74" stroke="#4A7BA6" stroke-width="2" stroke-linecap="round"/>

  <!-- Поля-строки (что снимаем) -->
  <g stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 44 H66 M22 48.5 H56"/>
    <path d="M22 58 H62 M22 62.5 H48 M22 67 H58"/>
  </g>

  <!-- Неподвижная полосатая планка (на доске) -->
  <rect x="16" y="34" width="64" height="9" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <polygon points="22,34 30,34 26,43 18,43" fill="#F5E9D0"/>
  <polygon points="34,34 42,34 38,43 30,43" fill="#F5E9D0"/>
  <polygon points="46,34 54,34 50,43 42,43" fill="#F5E9D0"/>
  <polygon points="58,34 66,34 62,43 54,43" fill="#F5E9D0"/>
  <polygon points="70,34 78,34 74,43 66,43" fill="#F5E9D0"/>

  <!-- Откидная планка (приоткрыта) -->
  <g transform="rotate(-16 20 34)">
    <rect x="16" y="25" width="64" height="9" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
    <polygon points="24,25 32,25 28,34 20,34" fill="#F5E9D0"/>
    <polygon points="36,25 44,25 40,34 32,34" fill="#F5E9D0"/>
    <polygon points="48,25 56,25 52,34 44,34" fill="#F5E9D0"/>
    <polygon points="60,25 68,25 64,34 56,34" fill="#F5E9D0"/>
    <polygon points="72,25 80,25 76,34 68,34" fill="#F5E9D0"/>
  </g>

  <!-- Петля-ось слева -->
  <circle cx="19" cy="33" r="3.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="77" cy="33" r="3.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Карандаш за планкой (юмор-деталь) -->
  <g transform="rotate(24 68 56)">
    <rect x="62" y="54" width="22" height="4" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M84 54 L88 56 L84 58 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M86.4 55.2 L87.6 56 L86.4 56.8 Z" fill="#1A1A1A"/>
    <rect x="62" y="54" width="4" height="4" rx="1.5" fill="#C8102E"/>
  </g>

  <!-- REC-точка -->
  <circle cx="74" cy="70" r="2.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
