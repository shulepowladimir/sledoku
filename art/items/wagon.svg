<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wagon — повозка (вестерн): деревянный кузов с откидным бортом,
    большие спицованные колёса, дышло, тюк на кузове.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="38" ry="5" fill="#3A2A20"/>

  <!-- Дышло -->
  <path d="M20 58 L6 74" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M20 58 L8 71" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Оглобля-крюк -->
  <circle cx="6" cy="75" r="2.4" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Заднее большое колесо -->
  <circle cx="64" cy="70" r="15" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <circle cx="64" cy="70" r="10" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="64" cy="70" r="3.4" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Спицы -->
  <g stroke="#B87F33" stroke-width="2">
    <path d="M64 60.5 L64 79.5 M54.5 70 L73.5 70 M57.3 63.3 L70.7 76.7 M70.7 63.3 L57.3 76.7"/>
  </g>
  <!-- Обод -->
  <circle cx="64" cy="70" r="15" fill="none" stroke="#B87F33" stroke-width="1.8"/>

  <!-- Переднее колесо -->
  <circle cx="28" cy="72" r="12" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <circle cx="28" cy="72" r="7.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="28" cy="72" r="2.8" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
  <g stroke="#B87F33" stroke-width="1.8">
    <path d="M28 64.8 L28 79.2 M20.8 72 L35.2 72 M22.9 66.9 L33.1 77.1 M33.1 66.9 L22.9 77.1"/>
  </g>
  <circle cx="28" cy="72" r="12" fill="none" stroke="#B87F33" stroke-width="1.6"/>

  <!-- Кузов (деревянный, с досками) -->
  <path d="M18 44 L72 44 L76 58 L14 58 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Доски борта -->
  <path d="M17 50 L75 50" stroke="#B87F33" stroke-width="1.8"/>
  <path d="M22 47 L70 47 M20 54 L74 54" stroke="#E8B95F" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Металлические уголки -->
  <path d="M16 45 L16 57 M74 45 L74 57" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Тюк на кузове (посадочная зона сверху) -->
  <path d="M30 44 Q30 34 44 33 Q58 34 58 44 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Перевязь тюка -->
  <path d="M38 34.5 L37 44 M50 34.5 L51 44" stroke="#E0824A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M33 39 Q44 36 55 39" fill="none" stroke="#8F5A3A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Сиденье-облучок -->
  <rect x="12" y="38" width="16" height="7" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Изножье -->
  <path d="M70 58 L74 66" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
</svg>
