<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    washingMachine — стиральная машина с фронтальной загрузкой:
    кремовый корпус, стальная панель управления с ручкой-переключателем,
    большое круглое окошко с водой и бельём, ножки.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="20" y="8" width="56" height="78" rx="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева на корпусе -->
  <path d="M24 16 Q23 48 24 78" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Панель управления -->
  <rect x="24" y="13" width="48" height="11" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Ручка-переключатель -->
  <circle cx="32" cy="18.5" r="3.6" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M32 16.5 L32 18.5" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Кнопки на панели -->
  <circle cx="58" cy="17" r="1.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="64" cy="17" r="1.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="70" cy="17" r="1.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Дисплей -->
  <rect x="54" y="20.5" width="12" height="2.6" rx="1" fill="#1F3A5F"/>

  <!-- Окошко загрузки: внешний обод -->
  <circle cx="48" cy="52" r="21" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Блик на ободе -->
  <path d="M32 38 Q36 32 43 30" fill="none" stroke="#9BA5AD" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Стекло с водой -->
  <circle cx="48" cy="52" r="15.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Волна воды -->
  <path d="M36 50 Q40 47.5 44 50 Q48 52.5 52 50 Q56 47.5 60 50" fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round"/>
  <!-- Бельё в барабане -->
  <path d="M38 58 Q42 54 47 57 Q52 60 57 56 Q59 58 58 61 Q48 66 38 61 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Пузыри -->
  <circle cx="43" cy="44" r="1.8" fill="#9CC3E0"/>
  <circle cx="54" cy="42" r="1.4" fill="#9CC3E0"/>
  <circle cx="49" cy="47" r="1.1" fill="#9CC3E0"/>

  <!-- Люк: ручка дверцы -->
  <rect x="63" y="49" width="4.5" height="6" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Ножки -->
  <path d="M28 86 L27 89 M68 86 L69 89" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
</svg>
