<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    mannequin — манекен (ателье/универмаг): портновский бюст на стойке,
    кремовый корпус с швами, деревянная шапочка, булавки и терракотовая
    ткань на плече (юмор-деталь).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- База (три лапы) -->
  <path d="M34 84 L42 78 M62 84 L54 78 M48 86 L48 78" stroke="#B87F33" stroke-width="4" stroke-linecap="round"/>
  <circle cx="34" cy="84" r="2.2" fill="#E0A94A"/>
  <circle cx="62" cy="84" r="2.2" fill="#E0A94A"/>
  <circle cx="48" cy="85" r="2.2" fill="#E0A94A"/>

  <!-- Стойка -->
  <rect x="45.5" y="54" width="5" height="26" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M47 58 L47 78" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Бюст (торс) -->
  <path d="M34 56 Q32 40 40 32 Q44 28 48 28 Q52 28 56 32 Q64 40 62 56 Q48 62 34 56 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Швы бюста (вертикальный центральный + вытачки) -->
  <path d="M48 28 V60" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M42 36 L38 42 M54 36 L58 42" stroke="#9BA5AD" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Блик слева -->
  <path d="M38 38 Q36 46 37 53" fill="none" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Шейный диск -->
  <ellipse cx="48" cy="26" rx="6" ry="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Деревянная шапочка (голова-колпак) -->
  <path d="M40 26 Q40 12 48 12 Q56 12 56 26 Q48 29 40 26 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M43 20 Q46 16.5 50 17" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="48" cy="10.5" r="2.4" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Терракотовая ткань, перекинутая через плечо -->
  <path d="M54 30 Q66 34 64 46 Q58 52 52 48 Q60 44 58 38 Q56 33 52 34 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M56 36 Q60 40 59 45" fill="none" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Булавки с головками -->
  <circle cx="40" cy="44" r="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="0.8"/>
  <path d="M40 45.5 L41 48" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
  <circle cx="56" cy="46" r="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="0.8"/>
  <path d="M56 47.5 L55 50" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>
</svg>
