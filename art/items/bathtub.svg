<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bathtub — ванна на львиных лапах: классическая фаянсовая ванна,
    вода с пеной, золотой кран, резиновая утёнок (юмор-деталь).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="36" ry="5" fill="#3A2A20"/>

  <!-- Львиные лапы (латунь) -->
  <path d="M26 74 Q24 82 28 84 Q31 84 30 78" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M70 74 Q72 82 68 84 Q65 84 66 78" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Корпус ванны -->
  <path d="M14 44 Q14 32 28 32 L68 32 Q82 32 82 44 L80 64 Q78 76 66 76 L30 76 Q18 76 16 64 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Тень по нижней кромке -->
  <path d="M18 66 Q48 72 78 66" fill="none" stroke="#D5DCE1" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Блик слева -->
  <path d="M21 48 L20 62" stroke="#D5DCE1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Вода (голубая) -->
  <path d="M20 46 Q48 52 76 46 L75 54 Q48 59 21 54 Z" fill="#4A7BA6"/>
  <!-- Волна на воде -->
  <path d="M26 50 Q32 48 38 50 M56 51 Q62 49 68 51" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Пена по краям -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4">
    <circle cx="22" cy="46" r="2.8"/>
    <circle cx="28" cy="44.5" r="2.2"/>
    <circle cx="73" cy="46" r="2.6"/>
    <circle cx="68" cy="44.5" r="2"/>
  </g>

  <!-- Резиновая утёнок -->
  <path d="M50 38 Q50 33 55 33 Q60 33 60 38 Q60 42 55 42 Q50 42 50 38 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="56.5" cy="31" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M59.5 31 L63 31.8 L59.5 32.8 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="0.9" stroke-linejoin="round"/>
  <circle cx="57.5" cy="30" r="0.8" fill="#1A1A1A"/>

  <!-- Кран (латунь) -->
  <path d="M74 32 L74 22 Q74 16 66 16 L60 16" fill="none" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M60 16 L60 22" stroke="#E0A94A" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="70" cy="20" r="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Капля из крана -->
  <path d="M60 25 Q61 27 60 28.4 Q59 27 60 25 Z" fill="#4A7BA6"/>
</svg>
