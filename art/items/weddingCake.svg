<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    weddingCake — трёхъярусный кремовый торт с розовыми цветами и золотым подносом.
  -->
  <!-- Тень-подложка -->
  <path d="M10 80 Q48 72 86 80 L82 86 Q48 92 14 86 Z" fill="#3A2A20"/>

  <!-- Поднос -->
  <path d="M9 75 Q48 70 87 75 L82 81 Q48 86 14 81 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M17 76 Q48 73 79 76" fill="none" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>

  <!-- Нижний ярус -->
  <path d="M17 54 Q48 49 79 54 V73 Q48 80 17 73 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M17 58 Q25 63 33 58 Q41 63 49 58 Q57 63 65 58 Q73 63 79 58" fill="none" stroke="#E08BA0" stroke-width="3" stroke-linecap="round"/>
  <path d="M23 67 Q30 64 37 67 M59 67 Q66 64 73 67" fill="none" stroke="#C9536B" stroke-width="2" stroke-linecap="round"/>

  <!-- Средний ярус -->
  <path d="M27 35 Q48 31 69 35 V53 Q48 59 27 53 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M27 39 Q34 43 41 39 Q48 43 55 39 Q62 43 69 39" fill="none" stroke="#E08BA0" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M32 48 Q37 45 42 48 M54 48 Q59 45 64 48" fill="none" stroke="#C9536B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Верхний ярус и свеча -->
  <path d="M37 21 Q48 18 59 21 V34 Q48 39 37 34 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M37 24 Q43 28 48 24 Q53 28 59 24" fill="none" stroke="#E08BA0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 20 V12" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 12 Q44 8 48 5 Q52 8 48 12 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Розетка из цветов -->
  <g stroke="#1A1A1A" stroke-width="1.3">
    <circle cx="43" cy="33" r="3.5" fill="#C9536B"/>
    <circle cx="43" cy="33" r="1.2" fill="#E8B95F"/>
    <circle cx="53" cy="33" r="3.5" fill="#E08BA0"/>
    <circle cx="53" cy="33" r="1.2" fill="#E8B95F"/>
  </g>
</svg>
