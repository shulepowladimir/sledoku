<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    airlock — шлюзовой люк орбитальной станции: круглый стальной люк
    с иллюминатором, ремонтными петлями и жёлтой полосой-предупреждением.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Внешнее кольцо (сталь) -->
  <circle cx="48" cy="46" r="34" fill="#5C6670" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Среднее кольцо -->
  <circle cx="48" cy="46" r="28" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Блик на кольце -->
  <path d="M28 28 Q34 21 43 19" fill="none" stroke="#D5DCE1" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Болты по периметру -->
  <g fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.2">
    <circle cx="48" cy="14" r="2.2"/>
    <circle cx="71" cy="23" r="2.2"/>
    <circle cx="80" cy="46" r="2.2"/>
    <circle cx="71" cy="69" r="2.2"/>
    <circle cx="48" cy="78" r="2.2"/>
    <circle cx="25" cy="69" r="2.2"/>
    <circle cx="16" cy="46" r="2.2"/>
    <circle cx="25" cy="23" r="2.2"/>
  </g>

  <!-- Иллюминатор (внутреннее окно) -->
  <circle cx="48" cy="46" r="18" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Звёзды в иллюминаторе -->
  <circle cx="40" cy="38" r="1.4" fill="#F5E9D0"/>
  <circle cx="56" cy="42" r="1.1" fill="#F5E9D0"/>
  <circle cx="46" cy="54" r="1.3" fill="#F5E9D0"/>
  <circle cx="54" cy="55" r="0.9" fill="#F5E9D0"/>
  <!-- Блик-полумесяц на стекле -->
  <path d="M36 40 Q40 32 48 30" fill="none" stroke="#7FA85B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Штурвал-запор (маленький, сверху) -->
  <circle cx="48" cy="24" r="5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M48 19 V29 M43 24 H53 M44.5 20.5 L51.5 27.5 M51.5 20.5 L44.5 27.5" stroke="#5C6670" stroke-width="1.8"/>
  <circle cx="48" cy="24" r="1.6" fill="#5C6670"/>

  <!-- Жёлтая полоса-предупреждение снизу (терракота=warning в палитре) -->
  <path d="M26 68 Q48 78 70 68 L68 64 Q48 73 28 64 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Индикатор «шлюз открыт» -->
  <circle cx="48" cy="66" r="2.4" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
