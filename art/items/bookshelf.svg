<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bookshelf — книжный шкаф: три полки с разноцветными корешками,
    одна книга наклонена, сверху стопка-свиток.
  -->
  <!-- Тень-подложка -->
  <rect x="22.5" y="83.5" width="54" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="20" y="12" width="56" height="74" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Задник -->
  <rect x="25" y="17" width="46" height="64" fill="#B87F33"/>

  <!-- Полка 1 (верхняя): книги -->
  <g stroke="#1A1A1A" stroke-width="1.8">
    <rect x="28" y="19" width="6" height="18" rx="1" fill="#1F3A5F"/>
    <rect x="35" y="21" width="5" height="16" rx="1" fill="#C8102E"/>
    <rect x="41" y="19" width="7" height="18" rx="1" fill="#2E6E65"/>
    <rect x="49" y="22" width="5" height="15" rx="1" fill="#E0824A"/>
    <rect x="55" y="19" width="6" height="18" rx="1" fill="#F5E9D0"/>
    <!-- Наклонная книга -->
    <polygon points="63,37 69,37 67,19 61,19" fill="#5E8A46"/>
  </g>
  <!-- Корешки-полоски -->
  <path d="M30 23 H32 M36.5 25 H38.5 M43 23 H46 M50.5 26 H52.5 M57 23 H59" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Полка-доска 1 -->
  <rect x="25" y="37" width="46" height="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Полка 2: книги + свиток -->
  <g stroke="#1A1A1A" stroke-width="1.8">
    <rect x="28" y="44" width="7" height="17" rx="1" fill="#E0824A"/>
    <rect x="36" y="46" width="5" height="15" rx="1" fill="#1F3A5F"/>
    <rect x="42" y="44" width="6" height="17" rx="1" fill="#F5E9D0"/>
    <!-- Свиток (справа) -->
    <rect x="52" y="52" width="16" height="9" rx="2" fill="#E8B95F"/>
    <ellipse cx="52" cy="56.5" rx="2.2" ry="4.5" fill="#F5E9D0"/>
    <ellipse cx="68" cy="56.5" rx="2.2" ry="4.5" fill="#F5E9D0"/>
  </g>
  <path d="M56 55 H64" stroke="#B87F33" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Полка-доска 2 -->
  <rect x="25" y="61" width="46" height="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Полка 3 (низ): большие тома -->
  <g stroke="#1A1A1A" stroke-width="1.8">
    <rect x="28" y="68" width="10" height="12" rx="1" fill="#2E6E65"/>
    <rect x="39" y="68" width="9" height="12" rx="1" fill="#C8102E"/>
    <rect x="49" y="68" width="8" height="12" rx="1" fill="#E0A94A"/>
    <rect x="58" y="68" width="9" height="12" rx="1" fill="#1F3A5F"/>
  </g>
  <path d="M31 72 H35 M42 72 H45 M51.5 72 H54.5 M60.5 72 H64.5" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Цоколь -->
  <rect x="25" y="80" width="46" height="5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Блик на корпусе -->
  <path d="M22.5 16 L22.5 80" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
</svg>
