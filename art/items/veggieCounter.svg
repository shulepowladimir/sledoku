<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    veggieCounter — прилавок с овощами (универмаг/рынок): прилавок
    с наклонной витриной, корзинки с морковью, помидорами и капустой,
    весы-гирька. Godрое изобилие.
  -->
  <!-- Тень-подложка -->
  <rect x="14.5" y="82.5" width="68" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Фронт прилавка -->
  <rect x="14" y="54" width="68" height="28" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Филёнки -->
  <rect x="20" y="60" width="14" height="16" rx="2" fill="none" stroke="#B87F33" stroke-width="1.8"/>
  <rect x="41" y="60" width="14" height="16" rx="2" fill="none" stroke="#B87F33" stroke-width="1.8"/>
  <rect x="62" y="60" width="14" height="16" rx="2" fill="none" stroke="#B87F33" stroke-width="1.8"/>
  <path d="M17 58 H79" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Столешница -->
  <rect x="12" y="48" width="72" height="8" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M16 51.5 H80" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Корзинка 1: морковь (зелень ботвы) -->
  <path d="M16 42 Q16 32 26 32 Q36 32 36 42 L36 48 L16 48 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18 44 L34 44" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Морковки (терракота) -->
  <path d="M20 32 Q19 38 22 41 Q24 37 23 32 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M26 31 Q25 38 28 41 Q30 36 29 31 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M32 32 Q31 38 34 41 Q35 37 34 32 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Ботва -->
  <path d="M21 30 Q20 26 18 25 M27 29 Q27 25 25 24 M33 30 Q34 26 36 25" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Корзинка 2: помидоры (красные) -->
  <path d="M40 42 Q40 32 50 32 Q60 32 60 42 L60 48 L40 48 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M42 44 L58 44" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="45" cy="33" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="53" cy="32" r="4.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="49" cy="36" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Черенки -->
  <path d="M45 29.5 L44.5 27 M53 28.5 L53.5 26 M49 32 L49 30" stroke="#5E8A46" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Блик -->
  <circle cx="44" cy="32" r="1" fill="#F5E9D0"/>

  <!-- Корзинка 3: капуста (зелень) -->
  <path d="M64 42 Q64 32 74 32 Q84 32 84 42 L84 48 L64 48 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M66 44 L82 44" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="72" cy="32" r="5.5" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M72 27 Q69 29 68.5 32 M72 27 Q75 29 75.5 32" fill="none" stroke="#5E8A46" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="79" cy="33" r="4" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Весы-гирька на столешнице (юмор) -->
  <path d="M46 48 L46 42 M42 48 Q42 44 46 42 Q50 44 50 48" fill="none" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="46" cy="39" r="3.4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Стрелка -->
  <path d="M46 39 L48.5 37" stroke="#C8102E" stroke-width="1.4" stroke-linecap="round"/>
</svg>
