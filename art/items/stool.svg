<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stool — круглый табурет: сиденье с бликом, царга,
    три расходящиеся ножки. Посадочная зона — центр.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- Задняя ножка -->
  <polygon points="46.5,44 50.5,44 52.5,84 48.5,84" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Боковые ножки (расходятся) -->
  <polygon points="32,46 37,46 26,84 21,84" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <polygon points="59,46 64,46 75,84 70,84" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Блики на ножках -->
  <path d="M34 50 L26.5 78" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M62 50 L69.5 78" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Царга (юбка под сиденьем) -->
  <path d="M32 42 L64 42 L62 50 L34 50 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Сиденье (эллипс) -->
  <ellipse cx="48" cy="38" rx="24" ry="9.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик на сиденье -->
  <path d="M32 35 Q38 30.5 46 30" fill="none" stroke="#E8B95F" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Волоконце -->
  <path d="M40 39 Q48 37 56 39" fill="none" stroke="#B87F33" stroke-width="1.3" stroke-linecap="round"/>
</svg>
