<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    chair — деревянный стул, вид спереди-сбоку.
    Стиль «уютный детектив»: сплошная тень-подложка, двухтональное дерево,
    изогнутая царга, органические скругления. Посадочная зона — центр-низ.
  -->

  <!-- Тень-подложка -->
  <rect x="25" y="79" width="56" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Задние ножки (тёмнее и короче — глубина) -->
  <rect x="33" y="56" width="6" height="26" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="57" y="56" width="6" height="26" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Стойки спинки -->
  <rect x="26" y="14" width="9" height="42" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="61" y="14" width="9" height="42" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Изогнутая царга (crest rail) -->
  <path d="M23 24 Q48 8 73 24 L73 33 Q48 18 23 33 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на царге -->
  <path d="M30 24 Q46 15 58 20" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Планка спинки (светлее — ловит свет) -->
  <path d="M27 40 Q48 32 69 40 L69 47 Q48 40 27 47 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Сиденье -->
  <rect x="18" y="52" width="60" height="10" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Передняя апартамента (темнее — нижняя грань) -->
  <rect x="18" y="61" width="60" height="5" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Передние ножки -->
  <rect x="22" y="63" width="7" height="22" rx="3.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="67" y="63" width="7" height="22" rx="3.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Живые детали: шурупы в сиденье -->
  <circle cx="30" cy="57" r="1.4" fill="#3A2A20"/>
  <circle cx="66" cy="57" r="1.4" fill="#3A2A20"/>
  <!-- Волоконце на сиденье -->
  <path d="M34 57 Q48 55.5 62 57" fill="none" stroke="#B87F33" stroke-width="1.2" stroke-linecap="round"/>
</svg>
