<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lamp — маячная лампа: латунная рама с круглой линзой Френеля,
    голубое стекло, луч света (кремовые лучи), поворотный механизм.
  -->
  <!-- Лучи света (кремовые, вправо-вверх) -->
  <polygon points="66,40 90,28 86,42" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="66,46 92,49 88,60" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Латунная рама (круглая) -->
  <circle cx="44" cy="44" r="26" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Крепёжные спицы -->
  <path d="M44 18 V26 M44 62 V70 M18 44 H26 M62 44 H70" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
  <!-- Винты по ободу -->
  <circle cx="44" cy="18" r="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="44" cy="70" r="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="18" cy="44" r="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="70" cy="44" r="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Линза (голубое стекло, концентрические кольца) -->
  <circle cx="44" cy="44" r="19" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="44" cy="44" r="13" fill="none" stroke="#9CC3E0" stroke-width="2"/>
  <circle cx="44" cy="44" r="8" fill="none" stroke="#9CC3E0" stroke-width="1.6"/>
  <!-- Ядро-лампочка -->
  <circle cx="44" cy="44" r="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Блик-полумесяц -->
  <path d="M32 36 Q36 29 43 27.5" fill="none" stroke="#9CC3E0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Поворотный механизм снизу -->
  <rect x="38" y="68" width="12" height="8" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="44" cy="72" r="1.4" fill="#E0A94A"/>

  <!-- Стойка -->
  <rect x="41" y="76" width="6" height="8" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <!-- База -->
  <path d="M30 84 H58" stroke="#5C6670" stroke-width="5" stroke-linecap="round"/>
</svg>
