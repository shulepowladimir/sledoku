<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    departureBoard — табло отправления: тёмная доска с флип-строками,
    наверху — надпись SLE-D-OKU в стиле сплит-флэп табло аэропортов
    (буквы-перевёртыши на плитках), красная строка-задержка, стойка.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Стойка-опора -->
  <rect x="43" y="72" width="8" height="16" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M34 88 L62 88" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>
  <rect x="44.5" y="74" width="1.8" height="12" fill="#D5DCE1"/>

  <!-- Рама табло -->
  <rect x="12" y="10" width="72" height="64" rx="5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M16 15 Q48 12 80 15" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Поле табло (тёмное) -->
  <rect x="17" y="15" width="62" height="54" rx="3" fill="#1F3A5F"/>

  <!-- Заголовок: SLE-D-OKU на флип-плитках -->
  <g>
    <!-- Плитки -->
    <g fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2">
      <rect x="19" y="19.5" width="6" height="9" rx="1"/>
      <rect x="25.5" y="19.5" width="6" height="9" rx="1"/>
      <rect x="32" y="19.5" width="6" height="9" rx="1"/>
      <rect x="38.5" y="19.5" width="6" height="9" rx="1"/>
      <rect x="45" y="19.5" width="6" height="9" rx="1"/>
      <rect x="51.5" y="19.5" width="6" height="9" rx="1"/>
      <rect x="58" y="19.5" width="6" height="9" rx="1"/>
      <rect x="64.5" y="19.5" width="6" height="9" rx="1"/>
      <rect x="71" y="19.5" width="6" height="9" rx="1"/>
    </g>
    <!-- Линии разлома плиток -->
    <g stroke="#1A1A1A" stroke-width="0.7">
      <path d="M19.8 24 H24.2 M26.3 24 H30.7 M32.8 24 H37.2 M39.3 24 H43.7 M45.8 24 H50.2 M52.3 24 H56.7 M58.8 24 H63.2 M65.3 24 H69.7 M71.8 24 H76.2"/>
    </g>
    <!-- Буквы (золотистые штрихи) -->
    <g fill="none" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- S -->
      <path d="M20.4 22.6 Q20.4 21.2 22 21.2 Q23.7 21.2 23.7 22.6 Q23.7 23.9 22 23.9 Q20.3 23.9 20.3 25.3 Q20.3 26.7 22 26.7 Q23.6 26.7 23.6 25.6"/>
      <!-- L -->
      <path d="M26.5 21.2 V26.7 H30.5"/>
      <!-- E -->
      <path d="M37 21.2 H33 V26.7 H37 M33 24 H36.2"/>
      <!-- дефис -->
      <path d="M40 24 H43"/>
      <!-- D -->
      <path d="M46 21.2 V26.7 H47.6 Q50 26.7 50 23.95 Q50 21.2 47.6 21.2 Z"/>
      <!-- дефис -->
      <path d="M53 24 H56"/>
      <!-- O -->
      <ellipse cx="61" cy="23.95" rx="2" ry="2.75"/>
      <!-- K -->
      <path d="M65.5 21.2 V26.7 M69.5 21.2 L65.8 24 L69.5 26.7"/>
      <!-- U -->
      <path d="M72 21.2 V25.4 Q72 26.7 73.6 26.7 H74.4 Q76 26.7 76 25.4 V21.2"/>
    </g>
  </g>

  <!-- Ряды флип-строк -->
  <g>
    <rect x="21" y="31" width="54" height="8" rx="1.2" fill="#F5E9D0"/>
    <path d="M24 35 H46 M50 35 H58 M62 35 H72" stroke="#1F3A5F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 31 V39 M45 31 V39 M57 31 V39" stroke="#1A1A1A" stroke-width="0.7"/>
  </g>
  <g>
    <rect x="21" y="41.5" width="54" height="8" rx="1.2" fill="#E8B95F"/>
    <path d="M24 45.5 H42 M66 45.5 H71" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Акцент: строка с задержкой (красная) -->
    <rect x="46" y="41.5" width="16" height="8" rx="1.2" fill="#C8102E"/>
    <path d="M49 45.5 H59" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 41.5 V49.5 M45 41.5 V49.5 M57 41.5 V49.5" stroke="#1A1A1A" stroke-width="0.7"/>
  </g>
  <g>
    <rect x="21" y="52" width="54" height="8" rx="1.2" fill="#F5E9D0"/>
    <path d="M24 56 H38 M42 56 H54 M58 56 H70" stroke="#1F3A5F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M33 52 V60 M45 52 V60 M57 52 V60" stroke="#1A1A1A" stroke-width="0.7"/>
  </g>

  <!-- Крепление к стойке -->
  <rect x="38" y="71" width="20" height="6" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
</svg>
