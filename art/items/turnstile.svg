<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    turnstile — турникет: триплет-турникет со стальными стойками,
    считыватель-таблетка со стрелкой, проход с барьером.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Левая стойка (корпус) -->
  <rect x="16" y="30" width="12" height="54" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M19 34 L19 80" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <!-- База стойки -->
  <ellipse cx="22" cy="83" rx="13" ry="4.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Правая стойка -->
  <rect x="68" y="30" width="12" height="54" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M71 34 L71 80" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="74" cy="83" rx="13" ry="4.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Верхний блок левой стойки (механизм) -->
  <rect x="14" y="24" width="16" height="10" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="22" cy="29" r="2.2" fill="#C8102E"/>
  <!-- Зелёная стрелка «проход открыт» -->
  <path d="M24 18 L28 22 L24.5 22 L24.5 26 L21.5 26 L21.5 22 L18 22 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Трёхплечий ротор (вид 3/4: три планки) -->
  <g transform="rotate(-12 48 40)">
    <!-- Планка 1 (вверх-влево) -->
    <rect x="24" y="38" width="24" height="5.5" rx="2.7" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Планка 2 (вверх-вправо) -->
    <rect x="48" y="38" width="24" height="5.5" rx="2.7" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Планка 3 (вниз) -->
    <rect x="45.2" y="43" width="5.5" height="24" rx="2.7" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
  </g>
  <!-- Втулка ротора -->
  <circle cx="48" cy="40" r="5.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="48" cy="40" r="2" fill="#D5DCE1"/>
  <!-- Крепление ротора к стойке -->
  <path d="M28 40 Q38 40 42.5 40" fill="none" stroke="#5C6670" stroke-width="4" stroke-linecap="round"/>

  <!-- Билеты/жетон у правой стойки (юмор-деталь) -->
  <g transform="rotate(10 78 62)">
    <rect x="72" y="56" width="16" height="10" rx="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M75 60 H85" stroke="#3A2A20" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Считыватель-таблетка на стойке -->
  <circle cx="22" cy="48" r="4.2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="22" cy="48" r="1.6" fill="#7FA85B"/>
</svg>
