<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    portrait — портрет дамы в золочёной раме: тёмный холст,
    кремовый силуэт, диагональный блик на раме.
  -->
  <!-- Тень-подложка -->
  <rect x="24.5" y="17.5" width="51" height="69" rx="4" fill="#3A2A20"/>

  <!-- Рама (золотая, двойная) -->
  <rect x="21" y="14" width="54" height="69" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="26" y="19" width="44" height="59" rx="1.5" fill="none" stroke="#B87F33" stroke-width="2.2"/>
  <!-- Уголки-розетки -->
  <circle cx="26" cy="19" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="70" cy="19" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="26" cy="78" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="70" cy="78" r="2.2" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Холст (тёмный) -->
  <rect x="29" y="22" width="38" height="53" fill="#3A2A20"/>

  <!-- Силуэт дамы (крем) -->
  <path d="M48 30 Q56 30 56 40 Q56 46 52 48 L52 52 Q60 54 62 64 L63 72 L33 72 L34 64 Q36 54 44 52 L44 48 Q40 46 40 40 Q40 30 48 30 Z"
        fill="#F5E9D0"/>
  <!-- Причёска-пучок -->
  <path d="M41 34 Q42 27 48 26 Q54 27 55 34 Q52 29.5 48 29.5 Q44 29.5 41 34 Z" fill="#F5E9D0"/>
  <circle cx="48" cy="25" r="3" fill="#F5E9D0"/>
  <!-- Ожерелье -->
  <path d="M44 54 Q48 57.5 52 54" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Диагональный блик на раме -->
  <path d="M23.5 20 L28 16.5 L31 16.2 L24.8 23.8 Z" fill="#F5E9D0"/>
  <path d="M23.5 28 L34 17.5 L37 17.3 L25.8 30.5 Z" fill="#E8B95F"/>
</svg>
