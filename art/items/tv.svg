<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    tv — плазменный телевизор: плоский экран на тумбе, стальная рама,
    на экране — статика/погода (детективный канал), пульт рядом.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="36" ry="5" fill="#3A2A20"/>

  <!-- Тумба -->
  <rect x="20" y="66" width="56" height="14" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M24 70 Q48 68 72 70" fill="none" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Ящик тумбы -->
  <rect x="26" y="69.5" width="22" height="7" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="47" cy="73" r="1.2" fill="#1A1A1A"/>

  <!-- Ножка-подставка экрана -->
  <rect x="44" y="58" width="8" height="9" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="48" cy="66" rx="12" ry="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Корпус ТВ (плоский, стальная рама) -->
  <rect x="14" y="14" width="68" height="46" rx="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Экран -->
  <rect x="19" y="19" width="58" height="36" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- На экране: «передача» — силуэт детектива (юмор: канал криминальных хроник) -->
  <circle cx="38" cy="32" r="6" fill="#3A2A20"/>
  <path d="M29 47 Q29 40 38 40 Q47 40 47 47 Z" fill="#3A2A20"/>
  <!-- Шляпа силуэта -->
  <rect x="30" y="26" width="16" height="3" rx="1.5" fill="#3A2A20"/>
  <path d="M33 26 L33 21 L43 21 L43 26 Z" fill="#3A2A20"/>
  <!-- Полоса «срочных новостей» -->
  <rect x="52" y="24" width="20" height="9" rx="1.5" fill="#C8102E"/>
  <path d="M55 28.5 H69" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Волны-помехи -->
  <path d="M22 24 Q28 22 34 24" fill="none" stroke="#7FA85B" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M58 44 Q64 42 70 44" fill="none" stroke="#7FA85B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Индикатор питания -->
  <circle cx="76" cy="57" r="1.4" fill="#7FA85B"/>
  <!-- Динамик-точки -->
  <g fill="#5C6670">
    <circle cx="22" cy="57" r="0.9"/>
    <circle cx="25.5" cy="57" r="0.9"/>
    <circle cx="29" cy="57" r="0.9"/>
  </g>

  <!-- Пульт на тумбе -->
  <rect x="56" y="70" width="14" height="7" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="59.5" cy="73.5" r="1.1" fill="#C8102E"/>
  <circle cx="63.5" cy="72.5" r="1" fill="#D5DCE1"/>
  <circle cx="63.5" cy="75" r="1" fill="#D5DCE1"/>
  <circle cx="66.5" cy="73.5" r="1" fill="#D5DCE1"/>
</svg>
