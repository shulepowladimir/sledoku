<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    ball — футбольный мяч: кремовая сфера, тёмные пятиугольники
    обрезаны по окружности мяча (clipPath), швы стыкуются
    от вершин центрального пятиугольника к краевым.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="28" ry="5.5" fill="#3A2A20"/>

  <!-- Клип по сфере мяча -->
  <clipPath id="ballClip">
    <circle cx="48" cy="48" r="30.5"/>
  </clipPath>

  <!-- Сфера мяча -->
  <circle cx="48" cy="48" r="32" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>

  <g clip-path="url(#ballClip)">
    <!-- Центральный пятиугольник -->
    <path d="M48 30 L60 39 L55.5 53 L40.5 53 L36 39 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Краевые пятиугольники (обрезаются клипом по сфере) -->
    <!-- Верхний -->
    <path d="M48 22 L57 16 L54 5 L42 5 L39 16 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Право-верхний -->
    <path d="M66 36.5 L78 30 L84 36 L80 44 L70 43 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Право-нижний -->
    <path d="M60 58 L72 58 L78 68 L70 78 L58 70 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Лево-нижний -->
    <path d="M36 58 L24 58 L18 68 L26 78 L38 70 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Лево-верхний -->
    <path d="M30 36.5 L18 30 L12 36 L16 44 L26 43 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Швы: от вершин центрального к краевым -->
    <g fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round">
      <path d="M48 30 L48 22"/>
      <path d="M60 39 L66 36.5"/>
      <path d="M55.5 53 L60 58"/>
      <path d="M40.5 53 L36 58"/>
      <path d="M36 39 L30 36.5"/>
    </g>
  </g>

  <!-- Блик (верх-слева) -->
  <path d="M30 30 Q35 22 44 20" fill="none" stroke="#E8B95F" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="35" cy="26" r="1.6" fill="#E8B95F"/>
</svg>
