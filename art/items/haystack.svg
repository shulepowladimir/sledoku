<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    haystack — стог сена: золотой купол с горизонтальными нитями-слоями,
    вилы воткнуты в макушку. Органический, чуть неровный силуэт.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="36" ry="5.5" fill="#3A2A20"/>

  <!-- Купол стога (пузатый) -->
  <path d="M14 82 Q10 64 20 50 Q28 38 48 36 Q68 38 76 50 Q86 64 82 82 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Слои сена (горизонтальные нити, два тона) -->
  <g fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round">
    <path d="M20 62 Q34 57 48 58 Q62 57 76 62"/>
    <path d="M17 70 Q33 65 48 66 Q63 65 79 70"/>
    <path d="M24 53 Q36 49 48 50 Q60 49 72 53"/>
  </g>
  <g fill="none" stroke="#B87F33" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 66 Q36 61 50 62 Q64 61 78 66"/>
    <path d="M19 74 Q34 70 48 71 Q62 70 77 74"/>
    <path d="M28 46 Q38 43 48 44 Q58 43 68 46"/>
  </g>
  <!-- Торчащие травинки по бокам -->
  <g fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round">
    <path d="M18 56 Q14 53 13 49"/>
    <path d="M78 56 Q82 53 83 49"/>
    <path d="M20 78 Q16 76 14 73"/>
    <path d="M76 78 Q80 76 82 73"/>
  </g>
  <!-- Блик слева-сверху -->
  <path d="M28 44 Q34 39 42 38" fill="none" stroke="#F5E9D0" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Вилы, воткнутые в макушку -->
  <path d="M56 38 L62 12" stroke="#B87F33" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M57.5 34 L61.5 15" stroke="#E0A94A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Зубья -->
  <g fill="none" stroke="#9BA5AD" stroke-width="2.6" stroke-linecap="round">
    <path d="M56 12 L54 4"/>
    <path d="M61 12 L61 3"/>
    <path d="M66 12 L68 4"/>
  </g>
  <!-- Перекладина зубьев -->
  <path d="M54 12 L68 12" stroke="#9BA5AD" stroke-width="2.6" stroke-linecap="round"/>
</svg>
