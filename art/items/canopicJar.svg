<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    canopicJar — канопа (гробница): терракотовая урна с иероглифами
    (абстрактные метки), крышка — голова шакала с ушами. Золочёные детали.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Пьедестал -->
  <rect x="32" y="76" width="32" height="9" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M35 79.5 H61" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Тело урны -->
  <path d="M31 46 Q26 62 31 74 Q40 77 48 77 Q56 77 65 74 Q70 62 65 46 Q48 40 31 46 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик слева -->
  <path d="M34 52 Q31 62 34 70" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Поясок у горла -->
  <path d="M32 48 Q48 43 64 48" fill="none" stroke="#B85F2E" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Иероглифы (абстрактные метки, не текст) -->
  <g fill="#3A2A20">
    <rect x="40" y="56" width="3" height="10" rx="1"/>
    <circle cx="48" cy="58" r="2.4" fill="none" stroke="#3A2A20" stroke-width="1.8"/>
    <path d="M54 55 L57 60 L54 65 L51 60 Z"/>
    <path d="M42 68 L46 66 M54 66 L50 68" stroke="#3A2A20" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Крышка: голова шакала (золото) -->
  <path d="M38 42 Q38 30 48 29 Q58 30 58 42 Q48 45 38 42 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Уши -->
  <path d="M39 32 L36 20 L45 27 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M57 32 L60 20 L51 27 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M39.5 29 L38.5 23.5 L43 26.5 Z" fill="#3A2A20"/>
  <path d="M56.5 29 L57.5 23.5 L53 26.5 Z" fill="#3A2A20"/>
  <!-- Морда -->
  <path d="M44 36 L48 36 L47 41 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Глаза -->
  <circle cx="43.5" cy="35" r="1.3" fill="#1A1A1A"/>
  <circle cx="52.5" cy="35" r="1.3" fill="#1A1A1A"/>
  <!-- Блик на голове -->
  <path d="M42 33 Q46 30.5 50 31" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
</svg>
