<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fridge — холодильник: кремовый корпус, морозилка сверху,
    стальные ручки, магнитики и записка (юмор-деталь).
  -->
  <!-- Тень-подложка -->
  <rect x="22.5" y="83.5" width="52" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="24" y="12" width="48" height="72" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="28" y="17" width="4.5" height="60" rx="2.2" fill="#E8B95F"/>

  <!-- Линия раздела морозилки -->
  <path d="M24 36 L72 36" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Ручки (сталь, вертикальные) -->
  <rect x="30" y="19" width="5" height="13" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="30" y="42" width="5" height="22" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M31.4 21 L31.4 30 M31.4 44 L31.4 62" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Магнитик-помидор (юмор) -->
  <circle cx="52" cy="23" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M51 21.5 Q52 20.5 53 21.5" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Магнитик-буква? Нет текста — магнит-звезда -->
  <path d="M62 25 L63 27.5 L65.5 27.5 L63.5 29 L64.5 31.5 L62 30 L59.5 31.5 L60.5 29 L58.5 27.5 L61 27.5 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Записка на дверце (кремовый листочек с ручкой-магнитом) -->
  <path d="M58 44 L68 42.5 L69 56 L59 57.5 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M61 47.5 L66 46.8 M61 50.5 L66 49.8 M61 53.5 L64.5 53" stroke="#3A2A20" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="63.5" cy="43.4" r="1.8" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Ножки -->
  <rect x="28" y="82" width="7" height="5" rx="2" fill="#5C6670"/>
  <rect x="61" y="82" width="7" height="5" rx="2" fill="#5C6670"/>
</svg>
