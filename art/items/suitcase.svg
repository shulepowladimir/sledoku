<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    suitcase — винтажный кожаный чемодан, чисто анфас: широкий
    прямоугольный корпус коричневой кожи, два ремня, ручка сверху,
    наклейки. Отличается от box пропорциями и фурнитурой.
  -->
  <!-- Тень-подложка -->
  <rect x="15.5" y="76.5" width="66" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Ручка сверху -->
  <path d="M41 34 Q41 26 48 26 Q55 26 55 34" fill="none" stroke="#1A1A1A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M42.8 33 Q43 28.5 48 28.5 Q53 28.5 53.2 33" fill="none" stroke="#C98B5E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Корпус (широкий, анфас) -->
  <rect x="15" y="34" width="66" height="42" rx="5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="19.5" y="38" width="4" height="32" rx="2" fill="#C98B5E"/>
  <!-- Затемнение низа -->
  <rect x="16.5" y="68" width="63" height="6.5" rx="3" fill="#B85F2E"/>
  <!-- Продольные швы кожи -->
  <path d="M20 40 L76 40 M20 70 L76 70" stroke="#B85F2E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22 43 L74 43" stroke="#C98B5E" stroke-width="1" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Ремни (вертикальные, тёмная кожа) -->
  <rect x="28" y="34" width="8" height="42" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="60" y="34" width="8" height="42" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Пряжки ремней (латунь) -->
  <rect x="26.5" y="50" width="11" height="9" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="58.5" y="50" width="11" height="9" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M30.5 50 L30.5 59 M62.5 50 L62.5 59" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Угловые накладки (латунные заклёпки по углам) -->
  <g fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4">
    <circle cx="21" cy="40" r="1.8"/>
    <circle cx="75" cy="40" r="1.8"/>
    <circle cx="21" cy="70" r="1.8"/>
    <circle cx="75" cy="70" r="1.8"/>
  </g>

  <!-- Дорожная наклейка-этикетка (крем) -->
  <g transform="rotate(-4 44 58)">
    <rect x="37" y="52" width="16" height="11" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
    <path d="M40 55.5 H50 M40 58.5 H47" stroke="#1F3A5F" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- Круглая наклейка-печать (голубая) -->
  <circle cx="52" cy="63" r="4.2" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="52" cy="63" r="2.4" fill="none" stroke="#9CC3E0" stroke-width="1"/>
</svg>
