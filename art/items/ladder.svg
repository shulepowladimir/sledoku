<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    ladder — стремянка сбоку: слева тетива со ступенями (в глубину,
    укороченными), справа глухая стойка. Металл серебристый:
    база #9BA5AD, тень #5C6670, блик #D5DCE1 (гайд §1).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="47" cy="86" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Задняя глухая стойка (правая, темнее) -->
  <polygon points="60,26 66,26 74,84 67,84" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Блик на стойке -->
  <path d="M62.5 30 L71 80" stroke="#9BA5AD" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Передняя тетива (левая, со ступенями) -->
  <polygon points="26,16 33,16 21,84 14,84" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Блик на тетиве -->
  <path d="M29.5 21 L21 79" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>

  <!-- Ступени (уходят вглубь к задней стойке, укорачиваются кверху) -->
  <g stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round">
    <polygon points="29,32 47,27 48,33 30,39" fill="#9BA5AD"/>
    <polygon points="27,44 48,39 49,45 28,51" fill="#D5DCE1"/>
    <polygon points="25,56 49,51 50,57 26,63" fill="#9BA5AD"/>
    <polygon points="24,68 50,63 51,69 25,75" fill="#D5DCE1"/>
  </g>
  <!-- Заклёпки на тетиве (на каждой ступени) -->
  <g fill="#5C6670">
    <circle cx="31" cy="35.5" r="1.3"/>
    <circle cx="29" cy="47.5" r="1.3"/>
    <circle cx="27" cy="59.5" r="1.3"/>
    <circle cx="26" cy="71.5" r="1.3"/>
  </g>

  <!-- Верхняя площадка на петле -->
  <rect x="26" y="10" width="42" height="9" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M31 13.5 H58" stroke="#D5DCE1" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Шарнир -->
  <circle cx="59" cy="27" r="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="32" cy="18.5" r="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Ремешок-фиксатор между стойками -->
  <path d="M30 22 Q45 28 58 24" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 2.5"/>
</svg>
