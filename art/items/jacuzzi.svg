<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    jacuzzi — джакузи: белая керамическая ванна (top-down 3/4),
    голубая пузырчатая вода, джеты-фонтанчики, полотенце на бортике.
  -->
  <!-- Тень-подложка -->
  <rect x="16.5" y="82.5" width="64" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Толщина ванны (ближняя грань, керамика в тени) -->
  <path d="M16 54 L80 54 L76 80 L20 80 Z" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Плиточные швы фронта -->
  <path d="M18 62 L78 62 M19 71 L77 71" stroke="#9BA5AD" stroke-width="1.4"/>
  <!-- Блик фронта -->
  <path d="M22 57 L21 77" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Керамический борт (белый) -->
  <rect x="14" y="40" width="68" height="15" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Фаска борта (света линия) -->
  <path d="M18 43.5 Q48 41.5 78 43.5" fill="none" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Хромированные уголки -->
  <circle cx="21" cy="47.5" r="2.6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="75" cy="47.5" r="2.6" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Вода (голубая) -->
  <rect x="19" y="42.5" width="58" height="10.5" rx="3" fill="#4A7BA6"/>
  <!-- Пузыри -->
  <circle cx="28" cy="47.5" r="1.5" fill="#9CC3E0"/>
  <circle cx="35" cy="45" r="1.1" fill="#9CC3E0"/>
  <circle cx="42" cy="49" r="1.7" fill="#9CC3E0"/>
  <circle cx="50" cy="46" r="1.3" fill="#9CC3E0"/>
  <circle cx="57" cy="48.5" r="1.6" fill="#9CC3E0"/>
  <circle cx="64" cy="45.5" r="1.2" fill="#9CC3E0"/>
  <circle cx="70" cy="48" r="1.4" fill="#9CC3E0"/>
  <circle cx="46" cy="44" r="0.9" fill="#9CC3E0"/>
  <circle cx="60" cy="51" r="1" fill="#9CC3E0"/>

  <!-- Джеты-фонтанчики (два активных) -->
  <g fill="none" stroke="#9CC3E0" stroke-width="2" stroke-linecap="round">
    <path d="M36 42.5 Q34 36 31 33"/>
    <path d="M38 42.5 Q38 34 38 30"/>
    <path d="M40 42.5 Q42 36 45 33"/>
  </g>
  <circle cx="30.5" cy="31.5" r="1.6" fill="#9CC3E0"/>
  <circle cx="38" cy="28" r="1.8" fill="#9CC3E0"/>
  <circle cx="45.5" cy="31.5" r="1.6" fill="#9CC3E0"/>

  <!-- Полотенце на бортике -->
  <path d="M56 40 L72 40 L71 52 Q64 55 57 52 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M58 44 L70 44" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M58 47.5 L70 47.5" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
