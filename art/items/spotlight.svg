<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    spotlight — прожектор (киноплощадка): глубокий чёрный корпус
    (тёмная сталь) на треноге, голубой объектив, световой конус
    (кремовый) в сторону, оранжевый кабель.
  -->
  <!-- Световой конус (кремовый, влево-вниз) -->
  <polygon points="30,42 4,64 8,48" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="30,48 10,72 26,66" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Тренога -->
  <g stroke="#5C6670" stroke-width="4" stroke-linecap="round">
    <path d="M48 64 L36 84"/>
    <path d="M48 64 L60 84"/>
    <path d="M48 66 L48 86"/>
  </g>
  <path d="M47 68 L39 80 M59 68 L51 80" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="48" cy="63" r="2.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Корпус (тёмный, цилиндр под углом) -->
  <g transform="rotate(30 50 46)">
    <rect x="28" y="36" width="38" height="20" rx="9" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.8"/>
    <!-- Рёбра вентиляции -->
    <path d="M34 40 V52 M40 40 V52 M46 40 V52" stroke="#3A2A20" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Задняя крышка -->
    <rect x="24" y="39" width="6" height="14" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
    <!-- Объектив (спереди) -->
    <ellipse cx="67" cy="46" rx="4" ry="10" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.4"/>
    <ellipse cx="67" cy="46" rx="1.8" ry="4.5" fill="#9CC3E0"/>
    <!-- Блик корпуса -->
    <path d="M32 39.5 Q40 37.5 48 39" fill="none" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Регулировочный маховик (красный) -->
  <circle cx="58" cy="58" r="2.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Кабель -->
  <path d="M60 66 Q68 74 66 84" fill="none" stroke="#B85F2E" stroke-width="2.4" stroke-linecap="round"/>
</svg>
