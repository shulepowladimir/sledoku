<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    zebra — зебра (зоопарк): та же анатомия, что horse (вид сбоку,
    голова у травы), но кремово-белый окрас с тёмными полосами,
    тёмная грива-гребень и хвост, серая морда. Без седла и звезды.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Дальние ноги (приглушённо-светлые) -->
  <g fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
    <path d="M32 62 L30 80 L35 80 L37 62 Z"/>
    <path d="M62 62 L66 80 L71 80 L66 62 Z"/>
  </g>
  <!-- Полосы дальних ног -->
  <path d="M31.3 66 H36 M30.9 71 H35.8 M30.6 76 H35.6" stroke="#3A2A20" stroke-width="1.6"/>
  <path d="M63.2 66 H67.4 M64.2 71 H68.2 M65.4 76 H69" stroke="#3A2A20" stroke-width="1.6"/>
  <!-- Копыта дальних -->
  <rect x="29.5" y="78" width="6" height="5" rx="1.5" fill="#3A2A20"/>
  <rect x="65.5" y="78" width="6" height="5" rx="1.5" fill="#3A2A20"/>

  <!-- Хвост -->
  <path d="M26 52 Q18 58 18 70 Q21 66 24 68 Q20 74 21 80 Q25 74 27 68 Q29 62 30 56 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Тело -->
  <path d="M26 58 Q24 48 32 44 L40 42 Q52 38 62 42 Q72 45 72 54 Q72 62 64 64 L34 64 Q27 64 26 58 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Полосы тела (явные, через спину) -->
  <g fill="none" stroke="#3A2A20" stroke-width="2.6" stroke-linecap="round">
    <path d="M34 45 Q32 54 34 62"/>
    <path d="M41 43.5 Q40 53 41 63"/>
    <path d="M48 43 Q48 53 48 63.5"/>
    <path d="M55 43.5 Q56 53 55 63"/>
    <path d="M62 45 Q64 54 62 62"/>
  </g>
  <!-- Полосы на крупе -->
  <path d="M68 48 Q70 54 67 60" fill="none" stroke="#3A2A20" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Ближние ноги -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round">
    <path d="M36 62 L34 82 L40 82 L41 62 Z"/>
    <path d="M56 62 L57 82 L63 82 L61 62 Z"/>
  </g>
  <!-- Полосы ближних ног -->
  <path d="M35 67 H40.6 M34.8 72 H40.8 M34.5 77 H41" stroke="#3A2A20" stroke-width="2"/>
  <path d="M56.6 67 H61.8 M57 72 H62.2 M57.4 77 H62.6" stroke="#3A2A20" stroke-width="2"/>
  <!-- Копыта ближних -->
  <rect x="33.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="56.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Шея -->
  <path d="M32 44 L36 42 L44 24 L54 26 L52 42 Q42 38 34 44 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Полосы шеи -->
  <g fill="none" stroke="#3A2A20" stroke-width="2.4" stroke-linecap="round">
    <path d="M43 27 L52 33"/>
    <path d="M39 34 L50 39"/>
    <path d="M36 41 L46 45"/>
  </g>

  <!-- Голова (опущена к траве, как у horse) -->
  <path d="M44 24 L54 26 L66 32 Q72 35 70 40 Q68 44 62 43 L52 38 Q46 34 44 28 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Полосы на лбу -->
  <path d="M48 26 L52 32 M53 25 L56 30" stroke="#3A2A20" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Морда (серая) -->
  <ellipse cx="67" cy="37" rx="5.5" ry="4.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Ноздря -->
  <circle cx="68" cy="37.5" r="1.1" fill="#3A2A20"/>
  <!-- Глаз -->
  <circle cx="53" cy="30" r="1.8" fill="#1A1A1A"/>
  <circle cx="52.5" cy="29.5" r="0.5" fill="#F5E9D0"/>
  <!-- Уши -->
  <path d="M45 23 L44 15 L49 21 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50 22 L51 14 L55 21 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Грива (тёмный гребень) -->
  <path d="M42 26 Q44 34 48 40 Q42 38 38 40 Q40 34 39 28 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
</svg>
