<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    wheel — штурвал корабля (occupiable): тёмое дерево обода со спицами,
    латунная ступица с книтом, рукоятки-шкентни. Человек «стоит у штурвала».
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Стойка-пиллерс -->
  <path d="M44 60 L42 84 L54 84 L52 60 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M45 62 L44 82" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Внешний обод (кольцо) -->
  <circle cx="48" cy="42" r="32" fill="none" stroke="#3A2A20" stroke-width="10"/>
  <circle cx="48" cy="42" r="32" fill="none" stroke="#B87F33" stroke-width="6.4"/>
  <!-- Блик на ободе сверху-слева -->
  <path d="M26 22 A32 32 0 0 1 42 10.5" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Затемнение обода снизу-справа -->
  <path d="M70 62 A32 32 0 0 1 54 73.5" fill="none" stroke="#8F5A3A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Спицы (8 штук, от ступицы за обод с рукоятками) -->
  <g stroke="#3A2A20" stroke-width="7" stroke-linecap="round">
    <path d="M48 42 L48 6"/>
    <path d="M48 42 L73 17"/>
    <path d="M48 42 L84 42"/>
    <path d="M48 42 L73 67"/>
    <path d="M48 42 L48 78"/>
    <path d="M48 42 L23 67"/>
    <path d="M48 42 L12 42"/>
    <path d="M48 42 L23 17"/>
  </g>
  <g stroke="#B87F33" stroke-width="3.6" stroke-linecap="round">
    <path d="M48 42 L48 8"/>
    <path d="M48 42 L71.5 18.5"/>
    <path d="M48 42 L82 42"/>
    <path d="M48 42 L71.5 65.5"/>
    <path d="M48 42 L48 76"/>
    <path d="M48 42 L24.5 65.5"/>
    <path d="M48 42 L14 42"/>
    <path d="M48 42 L24.5 18.5"/>
  </g>

  <!-- Рукоятки на концах спиц (короткие поперечины) -->
  <g stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round">
    <path d="M44 8 L52 8"/>
    <path d="M69 15 L75 21"/>
    <path d="M82 38 L82 46"/>
    <path d="M75 63 L69 69"/>
    <path d="M44 76 L52 76"/>
    <path d="M27 69 L21 63"/>
    <path d="M14 46 L14 38"/>
    <path d="M21 21 L27 15"/>
  </g>

  <!-- Латунная ступица -->
  <circle cx="48" cy="42" r="9" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <circle cx="48" cy="42" r="5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="46.5" cy="40.5" r="1.3" fill="#F5E9D0"/>
  <!-- Книт-сердечник (красный акцент) -->
  <circle cx="48" cy="42" r="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
