<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    stump — пень (лес): срез с годовыми кольцами, кора с трещинами,
    мох, грибочек сбоку, травинки у основания. Без тени.
  -->
  <!-- Корневые наплывы -->
  <path d="M26 74 Q18 76 16 82 Q22 82 26 79 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M70 74 Q78 76 80 82 Q74 82 70 79 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Боковина пня (кора) -->
  <path d="M24 52 Q22 74 32 78 L64 78 Q74 74 72 52 Q48 46 24 52 Z"
        fill="#8F5A3A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Трещины коры -->
  <path d="M30 58 Q29 66 32 72 M66 58 Q67 66 64 72" fill="none" stroke="#B85F2E" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Мох -->
  <path d="M28 58 Q34 55 40 58 Q34 61 28 60 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Срез (светлое дерево) -->
  <ellipse cx="48" cy="50" rx="25" ry="11" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Годовые кольца -->
  <ellipse cx="48" cy="50" rx="19" ry="8" fill="none" stroke="#B87F33" stroke-width="1.8"/>
  <ellipse cx="48" cy="50" rx="13" ry="5.5" fill="none" stroke="#B87F33" stroke-width="1.6"/>
  <ellipse cx="48" cy="50" rx="7" ry="3" fill="none" stroke="#B87F33" stroke-width="1.4"/>
  <!-- Сердцевина-точка -->
  <circle cx="48" cy="50" r="1.6" fill="#8F5A3A"/>
  <!-- Трещинка на срезе -->
  <path d="M48 47 Q49 50 47.5 52" fill="none" stroke="#B87F33" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Травинки у основания -->
  <g fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round">
    <path d="M18 80 Q16 76 17 72"/>
    <path d="M24 82 Q23 78 24.5 74"/>
    <path d="M72 82 Q73 78 72 74"/>
    <path d="M78 80 Q80 76 79 72"/>
    <path d="M46 82 Q45 79 46 76"/>
  </g>

  <!-- Грибочек -->
  <rect x="22" y="72" width="3.6" height="6" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M17 73 Q24 66 31 73 Q24 77 17 73 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="22" cy="71.5" r="1" fill="#F5E9D0"/>
  <circle cx="27" cy="72.5" r="0.8" fill="#F5E9D0"/>
</svg>
