<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    luggageRack — багажная полка (вагон): стальная рама-кронштейн
    с полкой-решёткой, на ней — шляпная коробка и маленький чемодан.
  -->
  <!-- Настенное крепление -->
  <rect x="24" y="16" width="48" height="6" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="30" cy="19" r="1.3" fill="#9BA5AD"/>
  <circle cx="66" cy="19" r="1.3" fill="#9BA5AD"/>

  <!-- Кронштейны (диагональные) -->
  <path d="M28 22 L34 60 M68 22 L62 60" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M29.5 26 L35 56 M66.5 26 L61 56" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Полка (стальная планка) -->
  <rect x="22" y="58" width="52" height="7" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M26 61.5 H70" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Шляпная коробка (круглая, крем с лентой) -->
  <ellipse cx="38" cy="58" rx="14" ry="4.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="24" y="40" width="28" height="18" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="38" cy="40" rx="14" ry="4.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Терракотовая лента на коробке -->
  <rect x="24" y="46" width="28" height="5" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Бантик -->
  <path d="M38 36 Q33 32 32 36 Q34 39 38 37 Z M38 36 Q43 32 44 36 Q42 39 38 37 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="38" cy="36.5" r="1.4" fill="#B85F2E"/>

  <!-- Чемоданчик (маленький, коричневый) -->
  <rect x="56" y="42" width="20" height="16" rx="2.5" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M58 46 H74" stroke="#B85F2E" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Ручка -->
  <path d="M62 42 Q62 38 66 38 Q70 38 70 42" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Замочки -->
  <rect x="57.5" y="49" width="4" height="5" rx="1" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
  <rect x="70.5" y="49" width="4" height="5" rx="1" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
