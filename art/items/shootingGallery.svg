<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    shootingGallery — тир (ярмарка): прилавок с Counterом, стойка
    с мишенями-утками (крем с красным кольцом), полосатый навес.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="36" ry="5" fill="#3A2A20"/>

  <!-- Прилавок -->
  <rect x="12" y="58" width="72" height="12" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M16 62 H80" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Фронт прилавка -->
  <rect x="14" y="70" width="68" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M18 74 H78" stroke="#8F5A3A" stroke-width="1.4"/>

  <!-- Задняя стенка (тёмная, глубина тира) -->
  <rect x="18" y="26" width="60" height="32" rx="3" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Мишени-утки (двигающиеся, на волне) -->
  <!-- Утка 1 (поражена — наклонена) -->
  <g transform="rotate(12 30 44)">
    <path d="M24 46 Q23 40 29 39 Q35 39 35 45 Q35 50 29 50 Q24 50 24 46 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="33" cy="37" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M36 37 L39 38 L36 39 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="34" cy="36" r="0.7" fill="#1A1A1A"/>
    <circle cx="29" cy="44" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="29" cy="44" r="2.2" fill="#F5E9D0"/>
    <circle cx="29" cy="44" r="1" fill="#C8102E"/>
  </g>
  <!-- Утка 2 (целая) -->
  <g>
    <path d="M44 44 Q43 38 49 37 Q55 37 55 43 Q55 48 49 48 Q44 48 44 44 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="53" cy="35" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M56 35 L59 36 L56 37 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="54" cy="34" r="0.7" fill="#1A1A1A"/>
    <circle cx="49" cy="42" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="49" cy="42" r="2.2" fill="#F5E9D0"/>
    <circle cx="49" cy="42" r="1" fill="#C8102E"/>
  </g>
  <!-- Утка 3 (целая) -->
  <g>
    <path d="M62 44 Q61 38 67 37 Q73 37 73 43 Q73 48 67 48 Q62 48 62 44 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
    <circle cx="71" cy="35" r="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
    <path d="M74 35 L77 36 L74 37 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="0.9"/>
    <circle cx="72" cy="34" r="0.7" fill="#1A1A1A"/>
    <circle cx="67" cy="42" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
    <circle cx="67" cy="42" r="2.2" fill="#F5E9D0"/>
    <circle cx="67" cy="42" r="1" fill="#C8102E"/>
  </g>
  <!-- Волна-переносчик -->
  <path d="M20 52 Q48 48 76 52" fill="none" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Полосатый навес -->
  <path d="M10 26 L86 26 L80 14 L16 14 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M10 26 L86 26 L86 32 L10 32 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="26,14 34,14 32,26 24,26" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="44,14 52,14 50,26 42,26" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="62,14 70,14 68,26 60,26" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Фестоны -->
  <path d="M10 32 Q13.5 36 17 32 Q20.5 36 24 32 Q27.5 36 31 32 Q34.5 36 38 32 Q41.5 36 45 32 Q48.5 36 52 32 Q55.5 36 59 32 Q62.5 36 66 32 Q69.5 36 73 32 Q76.5 36 80 32 Q83.5 36 86 32"
        fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Приз на прилавке (мишень-медальон) -->
  <circle cx="48" cy="56" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="48" cy="56" r="1.8" fill="#C8102E"/>
</svg>
