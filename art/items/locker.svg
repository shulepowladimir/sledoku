<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    locker — спортивный шкафчик (библиотечный, decorative): стальной корпус
    с двумя дверцами, прорези вентиляции, ручки-защёлки, навесной замок.
    Переиспользуется: спортзал университета и др.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="18" y="10" width="60" height="78" rx="5" fill="#68727A" stroke="#1A1A1A" stroke-width="3.2"/>

  <!-- Дверцы -->
  <rect x="23" y="15" width="24" height="68" rx="3" fill="#7D878E" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="49" y="15" width="24" height="68" rx="3" fill="#7D878E" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Блики на дверцах (свет сверху-слева) -->
  <path d="M26 20 V78" stroke="#C2C9CB" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M52 20 V78" stroke="#C2C9CB" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Прорези вентиляции (верх дверцы) -->
  <g stroke="#454E58" stroke-width="2.4" stroke-linecap="round">
    <path d="M28 24 H42"/>
    <path d="M28 30 H42"/>
    <path d="M28 36 H42"/>
    <path d="M54 24 H68"/>
    <path d="M54 30 H68"/>
    <path d="M54 36 H68"/>
  </g>

  <!-- Ручки-защёлки -->
  <g fill="#454E58" stroke="#1A1A1A" stroke-width="1.8">
    <rect x="42" y="56" width="5" height="14" rx="2.5"/>
    <rect x="49" y="56" width="5" height="14" rx="2.5"/>
  </g>

  <!-- Навесной замок на левой дверце -->
  <g>
    <path d="M35 64 v6" stroke="#1A1A1A" stroke-width="2.2"/>
    <rect x="30" y="69" width="12" height="10" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>
    <path d="M33 69 V65 Q35 61 39 65 V69" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>
    <circle cx="36" cy="74" r="1.4" fill="#1A1A1A"/>
  </g>

  <!-- Ножки -->
  <path d="M26 88 V84 M70 88 V84" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
</svg>
