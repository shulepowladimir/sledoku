<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    camera — камера наблюдения: тёмно-синий корпус на стальном кронштейне,
    объектив с голубым стеклом, красный огонёк REC.
  -->
  <!-- Крепление к стене/потолку -->
  <rect x="16" y="12" width="12" height="18" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M19 16 L19 26" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Шурупы -->
  <circle cx="18" cy="14.5" r="1.2" fill="#5C6670"/>
  <circle cx="26" cy="14.5" r="1.2" fill="#5C6670"/>

  <!-- Шарнир -->
  <circle cx="22" cy="34" r="4.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="22" cy="34" r="1.6" fill="#5C6670"/>

  <!-- Рычаг кронштейна -->
  <path d="M24 37 L38 46" stroke="#9BA5AD" stroke-width="5" stroke-linecap="round"/>
  <path d="M25.5 38.5 L36 45" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Корпус камеры (наклонён вниз-вправо) -->
  <g transform="rotate(22 50 50)">
    <rect x="30" y="42" width="38" height="17" rx="8.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.8"/>
    <!-- Блик корпуса -->
    <path d="M36 46.5 Q46 44.5 56 46" fill="none" stroke="#4A7BA6" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Объектив -->
    <circle cx="61" cy="50.5" r="6" fill="#5C6670" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="61" cy="50.5" r="3.6" fill="#4A7BA6"/>
    <circle cx="59.8" cy="49.3" r="1.1" fill="#9CC3E0"/>
    <!-- Антенна -->
    <path d="M33 42 L31 35" stroke="#5C6670" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="31" cy="34" r="1.6" fill="#9BA5AD"/>
  </g>

  <!-- REC-огонёк (красный акцент) -->
  <circle cx="34" cy="56" r="2.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
