<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    paintingStand — мольберт с картиной (музей): деревянный А-рамный
    мольберт, холст с пейзажем (холмы, солнце), полочка и зажимы.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Задняя нога -->
  <path d="M48 62 L48 86" stroke="#B87F33" stroke-width="4" stroke-linecap="round"/>

  <!-- Передние ноги (А) -->
  <path d="M30 86 L42 30" stroke="#E0A94A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M66 86 L54 30" stroke="#E0A94A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M31.5 82 L42 34 M64.5 82 L54 34" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Полочка-держатель -->
  <rect x="30" y="66" width="36" height="6" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M34 69 H62" stroke="#E0A94A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Холст с картиной -->
  <rect x="28" y="26" width="40" height="40" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Пейзаж: небо уже на холсте (крем), солнце -->
  <circle cx="60" cy="34" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Холмы (зелень) -->
  <path d="M28 50 Q40 38 52 48 Q58 44 68 48 L68 66 L28 66 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M28 58 Q42 50 56 58 Q62 55 68 58 L68 66 L28 66 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Домик (юмор-деталь) -->
  <rect x="36" y="48" width="8" height="7" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M35 48 L40 43 L45 48 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Мазки-облачка -->
  <path d="M34 33 Q37 31 40 33" fill="none" stroke="#9BA5AD" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Зажим сверху -->
  <rect x="44" y="22" width="8" height="7" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="48" cy="25.5" r="1.2" fill="#3A2A20"/>
</svg>
