<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fountain — фонтан в парке: каменная чаша (top-down 3/4), центральная
    тумба со струями воды (бирюза), блики-капли.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="36" ry="6" fill="#3A2A20"/>

  <!-- Ножка чаши -->
  <rect x="40" y="62" width="16" height="18" rx="3" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M43 64 L43 78" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
  <!-- База -->
  <ellipse cx="48" cy="80" rx="20" ry="5.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="48" cy="78.8" rx="20" ry="5.5" fill="#9BA5AD"/>
  <ellipse cx="48" cy="78.8" rx="20" ry="5.5" fill="none" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Толщина чаши (ближняя грань) -->
  <path d="M16 56 L80 56 L76 66 L20 66 Z" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M22 60 L74 60" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Борт чаши -->
  <ellipse cx="48" cy="56" rx="32" ry="10" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Вода в чаше -->
  <ellipse cx="48" cy="56" rx="26" ry="7.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Блики на воде -->
  <path d="M30 54 Q36 52.5 42 53.5 M54 58.5 Q60 57.5 66 58.5" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Капли вокруг струй -->
  <circle cx="36" cy="49" r="1.2" fill="#9CC3E0"/>
  <circle cx="61" cy="50" r="1.1" fill="#9CC3E0"/>
  <circle cx="48" cy="47" r="1.3" fill="#9CC3E0"/>

  <!-- Центральная тумба -->
  <rect x="43" y="38" width="10" height="16" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M45.5 40 L45.5 52" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Верхняя чаша-тарелочка -->
  <ellipse cx="48" cy="38" rx="12" ry="4" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="48" cy="38" rx="7" ry="2.2" fill="#4A7BA6"/>

  <!-- Струи воды (дуги вверх и вниз) -->
  <g fill="none" stroke="#4A7BA6" stroke-width="2.4" stroke-linecap="round">
    <path d="M48 34 Q40 26 32 30"/>
    <path d="M48 34 Q56 26 64 30"/>
    <path d="M48 34 Q46 22 40 18"/>
    <path d="M48 34 Q50 22 56 18"/>
    <path d="M48 34 Q48 20 48 14"/>
  </g>
  <!-- Верхние капли-брызги -->
  <g fill="#9CC3E0">
    <circle cx="31" cy="28" r="1.6"/>
    <circle cx="65" cy="28" r="1.6"/>
    <circle cx="39" cy="16" r="1.4"/>
    <circle cx="57" cy="16" r="1.4"/>
    <circle cx="48" cy="12" r="1.8"/>
  </g>
</svg>
