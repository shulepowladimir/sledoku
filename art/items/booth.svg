<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    booth — кабинка дайнера (2-клеточный occupiable): слева стол с хром-кантом
    и кетчуп-бутылкой (красный акцент, отсылка к «Кетчупу на рубашке»),
    справа высокая виниловая скамья с капитоне. Посадочная зона — сиденье.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="42" ry="4.5" fill="#3A2A20"/>

  <!-- Стол: столешница (плоская плита, канон table) -->
  <rect x="5" y="46" width="36" height="10" rx="4.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Хром-кант под столешницей -->
  <path d="M7 57.5 L39 57.5" stroke="#9BA5AD" stroke-width="3" stroke-linecap="round"/>
  <path d="M7 59.5 L39 59.5" stroke="#5C6670" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Волокна столешницы -->
  <path d="M10 50 L16 50 M20 52 L28 52 M31 49 L37 49" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ножка-балясина -->
  <path d="M20 58 L18 84 L30 84 L28 58 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22.5 62 L21.5 80" stroke="#D5DCE1" stroke-width="2" stroke-linecap="round"/>
  <path d="M26.5 62 L27.5 80" stroke="#5C6670" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Кетчуп-бутылка на столе (красный акцент) -->
  <rect x="11" y="34" width="9" height="12.5" rx="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <rect x="13.5" y="29.5" width="4" height="5.5" rx="1.2" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M13 38 L18 38" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Скамья: высокая спинка с закруглённой верхушкой -->
  <path d="M51 84 L51 22 Q51 8 66 8 Q81 8 81 22 L81 84 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Свет на левой стороне спинки -->
  <path d="M54 26 Q54 14 63 12" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Капитоне: пуговицы -->
  <circle cx="66" cy="26" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="0.8"/>
  <circle cx="59.5" cy="38" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="0.8"/>
  <circle cx="72.5" cy="38" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="0.8"/>
  <circle cx="66" cy="49" r="1.8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="0.8"/>

  <!-- Сиденье: виниловая подушка (посадочная зона) -->
  <rect x="46" y="60" width="40" height="14" rx="7" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Шов по кромке подушки -->
  <path d="M51 65 Q66 62.5 81 65" fill="none" stroke="#B85F2E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Блик на подушке -->
  <path d="M50 68 Q58 66 66 66.5" fill="none" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Основание скамьи -->
  <rect x="52" y="74" width="28" height="10" rx="2" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4"/>
</svg>
