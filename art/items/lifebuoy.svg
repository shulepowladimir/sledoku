<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lifebuoy — спасательный круг на воде: красно-кремовые сектора,
    плещущаяся вода вокруг, верёвочная обвязка по внешнему краю.
    Акцент — сам красный сектор (это и есть красный элемент файла).
  -->
  <!-- Вода-подложка -->
  <ellipse cx="48" cy="52" rx="40" ry="30" fill="#4A7BA6"/>
  <!-- Волны (слои) -->
  <path d="M10 46 Q30 40 48 45 Q66 50 86 44" fill="none" stroke="#9CC3E0" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M14 60 Q34 66 52 61 Q70 56 84 62" fill="none" stroke="#61889F" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M20 70 Q38 74 56 70 Q70 67 80 70" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Блики на воде -->
  <circle cx="24" cy="52" r="1.4" fill="#F5E9D0"/>
  <circle cx="70" cy="56" r="1.2" fill="#F5E9D0"/>

  <!-- Круг: кремовое кольцо -->
  <circle cx="48" cy="48" r="28" fill="none" stroke="#F5E9D0" stroke-width="14"/>
  <!-- Тень нижней половины кольца -->
  <path d="M24.6 60 A28 28 0 0 0 71.4 60" fill="none" stroke="#DFD6C6" stroke-width="13" stroke-linecap="round"/>
  <!-- Контур кольца -->
  <circle cx="48" cy="48" r="35" fill="none" stroke="#1A1A1A" stroke-width="2.8"/>
  <circle cx="48" cy="48" r="21" fill="none" stroke="#1A1A1A" stroke-width="2.8"/>

  <!-- Красные сектора (4 шт., по диагоналям) -->
  <g fill="#C8102E" stroke="#1A1A1A" stroke-width="2">
    <path d="M31.5 27 Q25 33 25.5 41 L36 41 Q35 33 38.5 30.5 Z"/>
    <path d="M64.5 27 Q71 33 70.5 41 L60 41 Q61 33 57.5 30.5 Z"/>
    <path d="M31.5 69 Q25 63 25.5 55 L36 55 Q35 63 38.5 65.5 Z"/>
    <path d="M64.5 69 Q71 63 70.5 55 L60 55 Q61 63 57.5 65.5 Z"/>
  </g>

  <!-- Верёвочная обвязка (внешняя, узлом) -->
  <circle cx="48" cy="48" r="37.5" fill="none" stroke="#E8B95F" stroke-width="2.4" stroke-dasharray="6 4"/>
  <!-- Узел обвязки -->
  <circle cx="48" cy="9.5" r="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Блик на верхней части кольца -->
  <path d="M34 27 A28 28 0 0 1 52 20.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
