<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    box — картонная коробка с лентой, вид 3/4: верх, фронт и левая боковина.
    Свет сверху-слева: верх светлее всех, боковина темнее фронта.
  -->
  <!-- Тень-подложка -->
  <rect x="23.5" y="80.5" width="56" height="8" rx="4" fill="#3A2A20"/>

  <!-- Верхняя грань -->
  <polygon points="20,22 76,22 82,32 26,32" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Линии клапанов на верхней грани -->
  <path d="M48,22 L52,32 M63,22 L67,32" stroke="#B85F2E" stroke-width="1.4"/>
  <!-- Лента на верхней грани -->
  <polygon points="44,22 52,22 56,32 48,32" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Левая боковина (тёмная грань) -->
  <polygon points="20,22 26,32 26,82 20,72" fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Волоконце на боковине -->
  <path d="M22.6 36 L22.6 60" stroke="#3A2A20" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Передняя грань -->
  <polygon points="26,32 82,32 82,82 26,82" fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Затемнение низа -->
  <rect x="27.5" y="74" width="53" height="6.5" fill="#B85F2E"/>
  <!-- Лента на фронте -->
  <rect x="48" y="33.5" width="8" height="47" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Блик слева на фронте -->
  <rect x="31" y="36" width="3.5" height="34" rx="1.7" fill="#F5E9D0"/>

  <!-- Живая деталь: наклейка-этикетка -->
  <rect x="33" y="44" width="13" height="10" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M35.5,47.5 H43.5 M35.5,50.5 H41.5" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
</svg>
