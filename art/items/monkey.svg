<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    monkey — обезьянка (зоопарк): сидит, длинный закрученный хвост,
    в лапах банан (золотой). Коричневая, кремовое личико и живот.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="28" ry="5" fill="#3A2A20"/>

  <!-- Хвост (закрученный) -->
  <path d="M66 64 Q84 60 82 46 Q80 36 70 40" fill="none" stroke="#B85F2E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="69" cy="40" r="2.6" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Задняя лапа -->
  <ellipse cx="60" cy="76" rx="11" ry="8" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.6"/>
  <ellipse cx="60" cy="76" rx="5.5" ry="4" fill="#E0824A"/>

  <!-- Тело (сидит) -->
  <path d="M34 78 Q30 58 42 50 L56 50 Q68 56 66 76 Q64 80 58 80 L40 80 Q34 80 34 78 Z"
        fill="#B85F2E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Живот (кремовый) -->
  <path d="M40 78 Q38 60 48 55 Q58 60 56 78 Q48 82 40 78 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Передние лапы -->
  <path d="M36 54 Q30 60 32 68" fill="none" stroke="#B85F2E" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M58 54 Q64 58 63 66" fill="none" stroke="#B85F2E" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Лапка держит банан -->
  <circle cx="63" cy="67" r="3" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Банан (золотой) -->
  <path d="M50 72 Q60 70 70 62 Q71 66 66 70 Q58 76 51 76 Q48 75 50 72 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M52 73 Q60 71 68 64" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Кончик банана -->
  <path d="M50 72 L47 71 L51 75 Z" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Голова -->
  <circle cx="44" cy="34" r="14" fill="#B85F2E" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Ушки (круглые с светлой серединой) -->
  <circle cx="30" cy="30" r="5" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="30" cy="30" r="2.2" fill="#E0824A"/>
  <circle cx="58" cy="30" r="5" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="58" cy="30" r="2.2" fill="#E0824A"/>
  <!-- Личико (кремовое) -->
  <ellipse cx="44" cy="38" rx="9" ry="7.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Глаза (мультяшный реализм) -->
  <ellipse cx="40" cy="34" rx="2.4" ry="2.8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="40" cy="34.5" r="1.4" fill="#1A1A1A"/>
  <circle cx="39.5" cy="33.8" r="0.5" fill="#F5E9D0"/>
  <ellipse cx="48" cy="34" rx="2.4" ry="2.8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="48" cy="34.5" r="1.4" fill="#1A1A1A"/>
  <circle cx="47.5" cy="33.8" r="0.5" fill="#F5E9D0"/>
  <!-- Носик -->
  <ellipse cx="44" cy="39" rx="1.6" ry="1.2" fill="#3A2A20"/>
  <!-- Улыбка -->
  <path d="M41 42 Q44 44.5 47 42" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Хохолок -->
  <path d="M43 21 Q44 17 47 18 Q46 21 44 22 Z" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
