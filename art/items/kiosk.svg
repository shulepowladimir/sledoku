<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    kiosk — киоск с мороженым: будка с окошком-прилавком (голубое стекло),
    красный маркиз с кремовыми полосами, зелёная крыша и вывеска-рожок.
  -->
  <!-- Тень-подложка -->
  <rect x="17.5" y="81.5" width="62" height="8" rx="4" fill="#3A2A20"/>

  <!-- Корпус будки -->
  <rect x="20" y="38" width="56" height="46" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="24" y="42" width="4" height="38" rx="2" fill="#E8B95F"/>

  <!-- Прилавок-окошко: витрина с голубым стеклом -->
  <rect x="28" y="48" width="40" height="22" rx="2" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Диагональные блики на стекле -->
  <path d="M33 66 L41 50 M42 67 L50 51" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Нижняя часть проёма (тёмная, за прилавком) -->
  <rect x="28" y="63" width="40" height="7" rx="1.5" fill="#3A2A20"/>

  <!-- Полка с мороженым (за стеклом) -->
  <path d="M31 62 H65" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Рожок на полке -->
  <path d="M36 59.5 L42 59.5 L39 66 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="39" cy="57.5" r="2.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <!-- Второй рожок с шоколадной шапкой -->
  <path d="M48 59.5 L54 59.5 L51 66 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="51" cy="57.5" r="2.6" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Стойка прилавка (бирюзовая) -->
  <rect x="25" y="70" width="46" height="7" rx="2.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M29 73.5 H67" stroke="#7FA85B" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Маркиз (красный, с кремовыми полосами) -->
  <path d="M14 38 L82 38 L76 28 L20 28 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Полосы маркиза (крем) -->
  <polygon points="26,28 34,28 30,38 22,38" fill="#F5E9D0"/>
  <polygon points="42,28 50,28 48,38 40,38" fill="#F5E9D0"/>
  <polygon points="58,28 66,28 64,38 56,38" fill="#F5E9D0"/>
  <!-- Фестоны-зубчики по краю маркиза -->
  <path d="M14 38 Q17 42 20 38 Q23 42 26 38 Q29 42 32 38 Q35 42 38 38 Q41 42 44 38 Q47 42 50 38 Q53 42 56 38 Q59 42 62 38 Q65 42 68 38 Q71 42 74 38 Q77 42 80 38 L82 38"
        fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Крыша будки (зелёная) -->
  <rect x="17" y="20" width="62" height="9" rx="2.5" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M20 23 Q48 21 76 23" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Вывеска-рожок на крыше (зелёный шар) -->
  <path d="M42 20 L46 20 L44 10 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="44" cy="7.5" r="3.4" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="43" cy="6.8" r="0.8" fill="#F5E9D0"/>
</svg>
