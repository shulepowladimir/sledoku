<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hut — бунгало на сваях (остров): деревянный домик на четырёх сваях,
    пальмовая крыша (зелень ярусами), лестница, окно с голубым стеклом.
  -->
  <!-- Тень-подложка (песок) -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Сваи -->
  <path d="M24 62 V82 M72 62 V82" stroke="#8F5A3A" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M36 62 V78 M60 62 V78" stroke="#B87F33" stroke-width="4" stroke-linecap="round"/>
  <!-- Перекладины свай -->
  <path d="M22 72 H40 M56 72 H74" stroke="#8F5A3A" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Платформа -->
  <rect x="18" y="56" width="60" height="8" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M22 59 H74" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Стены -->
  <rect x="24" y="28" width="48" height="28" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Горизонтальные плашки -->
  <path d="M26 36 H70 M26 44 H70 M26 52 H70" stroke="#B87F33" stroke-width="1.4"/>
  <!-- Блик слева -->
  <path d="M27 31 V54" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Дверь (тёмный проём) -->
  <rect x="42" y="36" width="14" height="20" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Подвесной коврик на двери -->
  <path d="M43 38 H55 L54 44 L52 41 L50 45 L48 41 L46 45 L44 41 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Окно с голубым стеклом -->
  <rect x="29" y="38" width="9" height="9" rx="1.5" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M31 45 L34 40" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Крыша (пальмовая, ярусами зелени) -->
  <path d="M16 30 Q48 14 80 30 L74 22 Q48 8 22 22 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M20 26 Q48 12 76 26 L70 19 Q48 7 26 19 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Верхний пучок -->
  <path d="M42 14 Q48 4 54 14 L50 12 L48 15 L46 12 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Кончики листьев -->
  <path d="M16 30 Q12 32 10 36 M80 30 Q84 32 86 36" fill="none" stroke="#44663A" stroke-width="2" stroke-linecap="round"/>

  <!-- Лестница -->
  <path d="M43 64 L40 84 M57 64 L60 84" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
  <path d="M41.5 68 H58.5 M42.5 74 H57.5 M43.5 80 H56.5" stroke="#E0A94A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
