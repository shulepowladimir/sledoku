<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    skiRack — стойка с лыжами: две пары деревянных лыж с красным
    носком (акцент) и стальными полозьями, лыжные палки с кольцами.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4" fill="#3A2A20"/>

  <!-- Опора-стойка (поперечная) -->
  <rect x="18" y="70" width="60" height="7" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Ножки стойки -->
  <path d="M24 77 L22 86 M72 77 L74 86" stroke="#3A2A20" stroke-width="5" stroke-linecap="round"/>

  <!-- Левая пара лыж (наклонно, носками вверх-влево) -->
  <g>
    <path d="M8 84 L52 14" stroke="#E0A94A" stroke-width="7" stroke-linecap="round"/>
    <path d="M13 84 L57 14" stroke="#E0A94A" stroke-width="7" stroke-linecap="round"/>
    <!-- Полозья -->
    <path d="M7.5 83 L50 15.5 M12.5 83 L55 15.5" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Носки (красный акцент) -->
    <path d="M9.5 20 Q8 16 12 12.5 Q16 10 18 14 Q18.5 17 16 19 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Крепления -->
    <path d="M33 44 L40 47 M37 50 L44 53" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Правая пара лыж (наклонно, носками вверх-вправо) -->
  <g>
    <path d="M88 84 L44 14" stroke="#E0A94A" stroke-width="7" stroke-linecap="round"/>
    <path d="M83 84 L39 14" stroke="#E0A94A" stroke-width="7" stroke-linecap="round"/>
    <!-- Полозья -->
    <path d="M88.5 83 L45 15.5 M83.5 83 L40 15.5" stroke="#D5DCE1" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Носки (красный акцент) -->
    <path d="M86.5 20 Q88 16 84 12.5 Q80 10 78 14 Q77.5 17 80 19 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Крепления -->
    <path d="M63 44 L56 47 M59 50 L52 53" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Лыжная палка (за лыжами, по центру) -->
  <path d="M48 74 L48 18" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="48" cy="21" r="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M48 18 L48 12" stroke="#5C6670" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="48" cy="10.5" r="2.4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
