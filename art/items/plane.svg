<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    plane — самолёт у гейта: кремовый фюзеляж, синий киль и мотогондола,
    ряд иллюминаторов, красная полоса по борту, кокпит.
  -->
  <!-- Хвостовой киль (синий) -->
  <path d="M18 48 L10 28 Q9 24 14 25 L30 42 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Горизонтальный стабилизатор -->
  <path d="M16 48 L6 54 L20 54 Z" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Фюзеляж -->
  <path d="M14 48 Q14 38 28 36 L74 36 Q88 38 88 46 Q88 54 74 56 L28 56 Q14 56 14 48 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Красная полоса по борту -->
  <path d="M16 52 Q48 56 86 52 L86 55 Q48 59 16 55 Z" fill="#C8102E"/>
  <!-- Блик верха -->
  <path d="M24 39 Q50 36.5 76 39" fill="none" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Кокпит (голубое стекло) -->
  <path d="M82 39 Q87 40 88 44 L82 44 Z" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M83 40.5 Q85.5 41 86 43 L83 43 Z" fill="#9CC3E0"/>

  <!-- Иллюминаторы -->
  <g fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.4">
    <circle cx="30" cy="45" r="2.2"/>
    <circle cx="39" cy="45" r="2.2"/>
    <circle cx="48" cy="45" r="2.2"/>
    <circle cx="57" cy="45" r="2.2"/>
    <circle cx="66" cy="45" r="2.2"/>
    <circle cx="75" cy="45" r="2.2"/>
  </g>
  <!-- Блики на паре иллюминаторов -->
  <circle cx="39.6" cy="44.4" r="0.6" fill="#9CC3E0"/>
  <circle cx="57.6" cy="44.4" r="0.6" fill="#9CC3E0"/>

  <!-- Крыло (ближнее, одно — низ разгружен) -->
  <path d="M56 50 L70 66 L46 56 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M57 52 L67 63" stroke="#E8B95F" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Мотогондола (синяя, под крылом) -->
  <ellipse cx="53" cy="62" rx="6.5" ry="4.6" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2"/>
  <ellipse cx="58.5" cy="62" rx="1.9" ry="3.2" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
