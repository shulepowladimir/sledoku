<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hammock — гамак: ткань (терракота в кремовую полосу) провисает
    между двумя деревянными столбами с верёвочными крестами,
    подушка внутри. Посадочная зона — центр гамака.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="38" ry="4.5" fill="#3A2A20"/>

  <!-- Левый столб -->
  <rect x="14" y="30" width="8" height="54" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M16.5 36 L16.5 80" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Правый столб -->
  <rect x="74" y="30" width="8" height="54" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M76.5 36 L76.5 80" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Верёвочные крепления (кресты) -->
  <g stroke="#B85F2E" stroke-width="2" stroke-linecap="round">
    <path d="M20 36 L28 44 M28 36 L20 44"/>
    <path d="M76 36 L68 44 M68 36 L76 44"/>
  </g>
  <circle cx="18" cy="32" r="2.2" fill="none" stroke="#B85F2E" stroke-width="2"/>
  <circle cx="78" cy="32" r="2.2" fill="none" stroke="#B85F2E" stroke-width="2"/>

  <!-- Ткань гамака (провисающая) -->
  <path d="M22 42 Q48 74 74 42 L74 54 Q48 84 22 54 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Кремовые полосы вдоль провиса -->
  <path d="M24 47 Q48 77 72 47" fill="none" stroke="#F5E9D0" stroke-width="3"/>
  <path d="M23 52 Q48 80 73 52" fill="none" stroke="#F5E9D0" stroke-width="3"/>
  <!-- Сборка ткани у краёв -->
  <path d="M24 42 Q26 48 24 54 M72 42 Q70 48 72 54" fill="none" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Подушка в гамаке -->
  <g transform="rotate(-16 48 58)">
    <rect x="40" y="53" width="17" height="10" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
    <path d="M44 57 Q48 55 52 57" fill="none" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Блик на верхней кромке -->
  <path d="M26 43 Q34 53 42 58" fill="none" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
</svg>
