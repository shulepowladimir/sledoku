<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    horse — лошадь: вид сбоку, гнедая (терракота), тёмные грива и хвост,
    белая звёздочка на лбу, седло. Посадочная зона — центр спины (седло).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Дальние ноги (темнее) -->
  <g fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
    <path d="M32 62 L30 80 L35 80 L37 62 Z"/>
    <path d="M62 62 L66 80 L71 80 L66 62 Z"/>
  </g>
  <!-- Копыта дальних -->
  <rect x="29.5" y="78" width="6" height="5" rx="1.5" fill="#3A2A20"/>
  <rect x="65.5" y="78" width="6" height="5" rx="1.5" fill="#3A2A20"/>

  <!-- Тело -->
  <path d="M26 58 Q24 48 32 44 L40 42 Q52 38 62 42 Q72 45 72 54 Q72 62 64 64 L34 64 Q27 64 26 58 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на крупе -->
  <path d="M36 46 Q44 43 52 44" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>
  <!-- Затемнение брюха -->
  <path d="M34 60 Q48 64 62 60 Q48 63 34 61.5 Z" fill="#B85F2E"/>

  <!-- Ближние ноги -->
  <g fill="#E0824A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round">
    <path d="M36 62 L34 82 L40 82 L41 62 Z"/>
    <path d="M56 62 L57 82 L63 82 L61 62 Z"/>
  </g>
  <!-- Копыта ближних -->
  <rect x="33.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="56.5" y="80" width="7" height="5" rx="1.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Хвост -->
  <path d="M26 52 Q18 58 18 70 Q21 66 24 68 Q20 74 21 80 Q25 74 27 68 Q29 62 30 56 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Шея -->
  <path d="M32 44 L36 42 L44 24 L54 26 L52 42 Q42 38 34 44 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Голова (опущена к траве) -->
  <path d="M44 24 L54 26 L66 32 Q72 35 70 40 Q68 44 62 43 L52 38 Q46 34 44 28 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Морда -->
  <ellipse cx="67" cy="37" rx="5.5" ry="4.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Ноздря -->
  <circle cx="68" cy="37.5" r="1.1" fill="#3A2A20"/>
  <!-- Глаз -->
  <circle cx="53" cy="30" r="1.8" fill="#1A1A1A"/>
  <circle cx="52.5" cy="29.5" r="0.5" fill="#F5E9D0"/>
  <!-- Уши -->
  <path d="M45 23 L44 15 L49 21 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M50 22 L51 14 L55 21 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Звёздочка на лбу -->
  <path d="M49 27 L50 29.5 L52.5 30 L50.5 31.5 L51 34 L49 32.5 L47 34 L47.5 31.5 L45.5 30 L48 29.5 Z" fill="#F5E9D0"/>

  <!-- Грива -->
  <path d="M42 26 Q44 34 48 40 Q42 38 38 40 Q40 34 39 28 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Седло (посадочная зона) -->
  <path d="M42 41 L58 43 L58 49 Q50 51 42 48 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Лука седла -->
  <path d="M42 41 Q39 40 39 43 Q40 45 43 45" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Подпруга -->
  <path d="M44 49 Q48 55 56 50" fill="none" stroke="#B85F2E" stroke-width="2.6" stroke-linecap="round"/>
</svg>
