<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    torch — факел (гробница): деревянная рукоять со стальным воротом,
    тряпичный наконечник, живое пламя в три слоя, искры.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- Рукоять -->
  <rect x="44.5" y="52" width="7" height="32" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Блик -->
  <rect x="46" y="55" width="1.6" height="26" fill="#E8B95F"/>
  <!-- Намотка-ремень -->
  <path d="M43 62 H53 M43 68 H53" stroke="#B85F2E" stroke-width="2" stroke-linecap="round"/>

  <!-- Стальной ворот (крепление) -->
  <rect x="41" y="44" width="14" height="9" rx="2.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M44 47 H52" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Заклёпки -->
  <circle cx="43.5" cy="51" r="1" fill="#5C6670"/>
  <circle cx="52.5" cy="51" r="1" fill="#5C6670"/>

  <!-- Тряпичный наконечник (тёмная ткань) -->
  <path d="M40 44 Q36 40 38 34 L58 34 Q60 40 56 44 Q48 47 40 44 Z"
        fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Перевязь -->
  <path d="M39 39 H57" stroke="#8F5A3A" stroke-width="2" stroke-linecap="round"/>

  <!-- Пламя: внешний слой (терракота) -->
  <path d="M48 6 Q55 15 58 22 Q61 30 55 34 Q61 34 63 31 Q64 40 55 44 Q48 47 41 44 Q32 40 33 31 Q35 34 41 34 Q35 30 38 22 Q41 15 48 6 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Средний слой (красный) -->
  <path d="M48 16 Q52 22 54 27 Q56 33 51 36 Q48 38 45 36 Q40 33 42 27 Q44 22 48 16 Z" fill="#C8102E"/>
  <!-- Ядро (крем) -->
  <path d="M48 25 Q49.5 28 49 31 Q48 33 48 33 Q48 33 47 31 Q46.5 28 48 25 Z" fill="#F5E9D0"/>

  <!-- Искры -->
  <g stroke="#E0824A" stroke-width="1.5" stroke-linecap="round">
    <path d="M36 16 L37.5 20"/>
    <path d="M60 15 L58.5 19"/>
    <path d="M66 26 L63 27.5"/>
    <path d="M30 25 L33 26.5"/>
  </g>
  <circle cx="48" cy="4" r="1.5" fill="#E0A94A"/>
</svg>
