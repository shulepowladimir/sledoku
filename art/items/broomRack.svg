<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    broomRack — стойка мётел (школа волшебников): деревянная подставка,
    три метлы соломой вниз, красная лента на одной ручке,
    волшебные искры (юмор-деталь).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="32" ry="5" fill="#3A2A20"/>

  <!-- Подставка-кадка -->
  <rect x="22" y="68" width="52" height="14" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M25 72 H71" stroke="#8F5A3A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M26 77 H70" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Солома мётел (видна над кадкой) -->
  <path d="M28 68 L26 62 L38 62 L36 68 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M42 68 L41 61 L53 61 L52 68 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M58 68 L60 62 L72 62 L70 68 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Перевязи соломы -->
  <path d="M27.5 64.5 H36.5 M41.5 63.5 H52.5 M60.5 64.5 H69.5" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Ручки мётел -->
  <path d="M32 62 L26 24" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M47 61 L47 18" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <path d="M65 62 L72 28" stroke="#E0A94A" stroke-width="4" stroke-linecap="round"/>
  <!-- Блики на ручках -->
  <path d="M31 58 L27 30 M46.2 56 L46.2 24 M65.5 58 L71 34" stroke="#E8B95F" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Набалдашник средней метлы (волшебная) -->
  <circle cx="47" cy="15.5" r="3.2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Красная лента на левой ручке -->
  <rect x="24.5" y="36" width="6" height="3.4" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
  <path d="M27 39.5 Q25 43 27.5 45" fill="none" stroke="#C8102E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Волшебные искры -->
  <g stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round">
    <path d="M56 20 L56 26 M53 23 L59 23"/>
    <path d="M38 16 L38 20 M36 18 L40 18"/>
    <path d="M70 16 L70 21 M67.5 18.5 L72.5 18.5"/>
  </g>
</svg>
