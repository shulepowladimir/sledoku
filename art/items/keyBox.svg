<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    keyBox — ящик с ключами (отель): настенный шкафчик с крючками,
    пять латунных ключей с бирками, один крючок пуст (юмор: ключ пропал).
  -->
  <!-- Корпус -->
  <rect x="16" y="20" width="64" height="60" rx="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Внутренняя ниша (тёмная) -->
  <rect x="21" y="25" width="54" height="50" rx="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Блик корпуса -->
  <rect x="18" y="23" width="3" height="52" rx="1.5" fill="#E0A94A"/>

  <!-- Полочка -->
  <rect x="24" y="60" width="48" height="4" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Верхний ряд: 3 крючка с ключами -->
  <!-- Ключ 1 -->
  <circle cx="31" cy="32" r="3" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
  <path d="M33 34 L40 42" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M38 38 L41 35 M36.5 39.5 L39 42" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <!-- Ключ 2 -->
  <circle cx="48" cy="32" r="3" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
  <path d="M50 34 L57 42" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M55 38 L58 35 M53.5 39.5 L56 42" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <!-- Ключ 3 (с биркой) -->
  <circle cx="65" cy="32" r="3" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
  <path d="M67 34 L72 41" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M70.5 38 L73 40" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>

  <!-- Нижний ряд: 2 ключа + пустой крючок -->
  <!-- Ключ 4 -->
  <circle cx="33" cy="48" r="3" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
  <path d="M35 50 L42 58" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M40 54 L43 51 M38.5 55.5 L41 58" stroke="#E0A94A" stroke-width="2" stroke-linecap="round"/>
  <!-- Ключ 5 (красная бирка — «номер люкс») -->
  <circle cx="49" cy="48" r="3" fill="none" stroke="#E0A94A" stroke-width="2.2"/>
  <path d="M51 50 L56 57" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="55" y="55" width="8" height="6" rx="1" transform="rotate(-40 59 58)" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Пустой крючок (юмор: ключ куда-то делся) -->
  <path d="M68 46 V54 Q68 57 71 56" fill="none" stroke="#9BA5AD" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="68" cy="44.5" r="1.2" fill="#9BA5AD"/>
</svg>
