<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    plant — комнатный фикус в терракотовом горшке: пышный куст листьев,
    земля, блик на горшке.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="49" cy="84" rx="26" ry="5" fill="#3A2A20"/>

  <!-- Листья (куст из центра горшка) -->
  <g stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round">
    <path d="M48 50 Q34 42 30 28 Q42 30 48 44 Z" fill="#5E8A46"/>
    <path d="M48 50 Q62 42 66 28 Q54 30 48 44 Z" fill="#7FA85B"/>
    <path d="M48 48 Q46 32 48 18 Q56 30 52 46 Z" fill="#5E8A46"/>
    <path d="M48 48 Q40 36 36 22 Q28 34 44 48 Z" fill="#7FA85B"/>
    <path d="M48 48 Q56 36 60 22 Q68 34 52 48 Z" fill="#5E8A46"/>
    <path d="M48 50 Q38 50 28 54 Q40 60 48 52 Z" fill="#44663A"/>
    <path d="M48 50 Q58 50 68 54 Q56 60 48 52 Z" fill="#5E8A46"/>
  </g>
  <!-- Прожилки -->
  <g fill="none" stroke="#44663A" stroke-width="1.3" stroke-linecap="round">
    <path d="M47 46 Q43 36 38 27"/>
    <path d="M49 44 Q52 33 48 21"/>
    <path d="M50 46 Q56 35 60 24"/>
  </g>

  <!-- Земля в горшке -->
  <rect x="34" y="51" width="28" height="4" rx="2" fill="#3A2A20"/>

  <!-- Горшок -->
  <path d="M31 55 L65 55 L61 82 Q60.6 84 58 84 L38 84 Q35.4 84 35 82 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Венчик горшка -->
  <rect x="28" y="49" width="40" height="9" rx="3" fill="#E0824A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Тень под венчиком -->
  <path d="M33 58 L63 58" stroke="#B85F2E" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Затемнение низа горшка -->
  <path d="M36.5 76 L59.5 76 L59 82 Q58.6 84 56.5 84 L39.5 84 Q37.4 84 37 82 Z" fill="#B85F2E"/>
  <!-- Блик на горшке -->
  <rect x="36" y="61" width="4.5" height="12" rx="2.2" fill="#E0824A" stroke="none"/>
  <rect x="37" y="62" width="3" height="10" rx="1.5" fill="#F5E9D0"/>
</svg>
