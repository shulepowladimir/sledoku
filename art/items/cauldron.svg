<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    cauldron — ведьмин котёл: чугунный котёл на ножках, зелёное зелье
    с пузырями, деревянная мешалка, магические искры.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Ножки -->
  <path d="M32 74 L28 84 M64 74 L68 84 M48 78 L48 84" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- Корпус котла -->
  <path d="M22 48 Q18 76 48 80 Q78 76 74 48 Q62 44 48 44 Q34 44 22 48 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на левом боку -->
  <path d="M28 56 Q27 66 34 72" fill="none" stroke="#5C6670" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Венчик котла -->
  <ellipse cx="48" cy="45" rx="27" ry="8" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Зелье (зелёное, магическое — не вода) -->
  <ellipse cx="48" cy="45" rx="21" ry="5.5" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Пузыри зелья -->
  <circle cx="38" cy="44" r="1.6" fill="#7FA85B"/>
  <circle cx="46" cy="46" r="2.2" fill="#7FA85B"/>
  <circle cx="54" cy="43.5" r="1.8" fill="#7FA85B"/>
  <circle cx="60" cy="45.5" r="1.3" fill="#7FA85B"/>
  <!-- Лопнувший пузырь -->
  <circle cx="43" cy="39" r="2" fill="none" stroke="#7FA85B" stroke-width="1.4"/>

  <!-- Деревянная мешалка -->
  <path d="M58 43 L66 22" stroke="#B87F33" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M59.5 40 L65.5 25" stroke="#E0A94A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Лопатка на конце -->
  <rect x="63" y="17" width="7" height="7" rx="1.5" transform="rotate(20 66.5 20.5)" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Магический пар (зелёные завитки) -->
  <path d="M36 36 Q33 31 36 27 Q39 23 36 18" fill="none" stroke="#7FA85B" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 34 Q55 30 52 26" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Искры -->
  <g stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round">
    <path d="M26 32 L26 37 M23.5 34.5 L28.5 34.5"/>
    <path d="M68 38 L68 42 M66 40 L70 40"/>
  </g>
</svg>
