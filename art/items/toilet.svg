<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    toilet — унитаз (камера): фаянсовый унитаз с бачком и крышкой,
    кремовая керамика, стальная кнопка, ёршик рядом (юмор-деталь).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="28" ry="4.5" fill="#3A2A20"/>

  <!-- Бачок -->
  <rect x="28" y="16" width="40" height="24" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Крышка бачка -->
  <rect x="26" y="12" width="44" height="7" rx="3" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M30 15 H66" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Кнопка спуска -->
  <circle cx="58" cy="15.5" r="2.4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Блик бачка -->
  <rect x="32" y="21" width="4" height="15" rx="2" fill="#E8B95F"/>

  <!-- Чаша (сиденье с крышкой) -->
  <ellipse cx="48" cy="46" rx="22" ry="9" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="44.5" rx="18" ry="7" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Внутренний овал -->
  <ellipse cx="48" cy="44.5" rx="12" ry="4.5" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Блик воды -->
  <path d="M40 43.5 Q44 42.5 48 43.5" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Основание чаши (пьедестал) -->
  <path d="M38 53 Q34 66 36 74 Q42 80 48 80 Q54 80 60 74 Q62 66 58 53 Q48 57 38 53 Z"
        fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Блик пьедестала -->
  <path d="M41 58 Q39 66 40 72" fill="none" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Основание -->
  <ellipse cx="48" cy="79" rx="14" ry="4" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Ёршик в стакане (юмор-деталь) -->
  <rect x="72" y="64" width="9" height="14" rx="2" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M76.5 64 V56" stroke="#9BA5AD" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="76.5" cy="53.5" r="4" fill="#4A7BA6" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Щетинки -->
  <path d="M73.5 55 L71 57 M79.5 55 L82 57 M75 57 L74 60 M78 57 L79 60" stroke="#4A7BA6" stroke-width="1.4" stroke-linecap="round"/>
</svg>
