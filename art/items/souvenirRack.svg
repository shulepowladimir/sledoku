<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    souvenirRack — стеллаж с сувенирами: деревянный стеллаж (top-down 3/4),
    три полки с магнитами, статуэтками, кружками и мягкой игрушкой.
  -->
  <!-- Тень-подложка -->
  <rect x="17.5" y="82.5" width="62" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Боковины -->
  <rect x="18" y="14" width="7" height="68" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="71" y="14" width="7" height="68" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M20.5 18 L20.5 78 M73.5 18 L73.5 78" stroke="#E0A94A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Полка 1 (задник) -->
  <rect x="25" y="16" width="46" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Полка 1 (плоскость) -->
  <rect x="23" y="22" width="50" height="7" rx="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Сувениры полки 1: статуэтка-сфинкс и пирамидка -->
  <path d="M30 22 Q30 12 36 10 Q42 12 42 22 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M33 18 Q36 15.5 39 18" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M50 22 L54 12 L58 22 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M54 18 L54 21" stroke="#E0824A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Магнитик-брелок -->
  <circle cx="65" cy="18" r="3.4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M65 16 L65.8 17.8 L67.8 18 L66.4 19.4 L66.8 21.4 L65 20.4 L63.2 21.4 L63.6 19.4 L62.2 18 L64.2 17.8 Z" fill="#E8B95F"/>

  <!-- Полка 2 -->
  <rect x="25" y="38" width="46" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="23" y="44" width="50" height="7" rx="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Сувениры полки 2: кружки -->
  <rect x="29" y="36" width="8" height="8" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M37 38.5 Q39.5 38.5 39.5 41 Q39.5 43.5 37 43.5" fill="none" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="43" y="37" width="7" height="7" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Мягкий крокодил (юмор) -->
  <path d="M55 44 Q53 34 58 32 Q63 31 63 36 Q66 35 66 38 Q69 38 68 41 Q70 44 66 44 Z" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="60" cy="35" r="0.9" fill="#1A1A1A"/>
  <path d="M63 33 Q64 32 65 33" fill="none" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>

  <!-- Полка 3 -->
  <rect x="25" y="60" width="46" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="23" y="66" width="50" height="7" rx="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Сувениры полки 3: тарелка на подставке и стопка магнитов -->
  <ellipse cx="36" cy="60" rx="9" ry="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="36" cy="60" rx="5" ry="3.2" fill="#2E6E65"/>
  <path d="M30 66 Q36 63.5 42 66" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="52" y="60" width="12" height="4" rx="1.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="53" y="56" width="10" height="4" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="54.5" y="52.5" width="7" height="3.5" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
