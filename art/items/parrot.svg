<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    parrot — попугай ара на жёрдочке: терракотово-бирюзовое оперение,
    изогнутый клюв с восковицей, хохолок, любопытный глаз. Красный —
    окантовка клюва/хвоста не даёт: акцент — серёжка-пятно на щеке.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="24" ry="4" fill="#3A2A20"/>

  <!-- Жёрдочка -->
  <path d="M30 78 L66 78" stroke="#B87F33" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 76 L62 76" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Верёвочка -->
  <path d="M64 78 Q70 84 68 90 M62 78 Q60 84 62 90" fill="none" stroke="#8F5A3A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Хвост (длинный, бирюзово-терракотовые перья вниз) -->
  <path d="M56 60 Q64 72 60 84 Q58 88 54 84 Q50 74 50 64 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M50 62 Q48 74 44 82 Q42 86 40 82 Q40 72 46 60 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Блик на хвосте -->
  <path d="M54 66 Q57 74 55 80" fill="none" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Тело -->
  <path d="M34 66 Q28 52 38 40 Q48 28 58 34 Q66 40 64 52 Q62 64 52 68 Q42 72 34 66 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Cel-тень по правому боку -->
  <path d="M58 36 Q64 42 63 52 Q62 62 52 67 Q60 60 60 50 Q60 42 58 36 Z" fill="#B85F2E"/>
  <!-- Крыло (сложенное, бирюза) -->
  <path d="M38 46 Q34 58 42 64 Q50 68 54 62 Q56 54 50 48 Q44 42 38 46 Z"
        fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M40 50 Q38 58 44 62" fill="none" stroke="#9CC3E0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Блик на груди -->
  <path d="M36 48 Q34 56 40 62" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Голова -->
  <circle cx="52" cy="32" r="13" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Хохолок (2 пера) -->
  <path d="M48 20 Q46 12 52 10 Q50 16 50 20 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M55 19 Q57 11 61 12 Q57 16 56 20 Z" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Глаз (белок + радужка + зрачок, блик) -->
  <circle cx="55" cy="29" r="4.2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
  <circle cx="55.5" cy="29.5" r="2.2" fill="#E8B95F"/>
  <circle cx="55.8" cy="29.8" r="1.1" fill="#1A1A1A"/>
  <circle cx="54.6" cy="28.4" r="0.7" fill="#F5E9D0"/>

  <!-- Клюв (изогнутый,Hooks вниз) -->
  <path d="M62 27 Q72 26 70 34 Q69 40 63 40 Q60 40 60 36 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M62 28 Q67 28 66 32" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Кончик клюва тёмный -->
  <path d="M69.5 33 Q69 38 64 39 Q67 36 69.5 33 Z" fill="#3A2A20"/>

  <!-- Лапки, обхватившие жёрдочку -->
  <path d="M44 70 Q43 76 40 77 M50 70 Q50 76 47 77" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M40 76.5 L37 78 M40 76.5 L43 78 M47 76.5 L44 78 M47 76.5 L50 78" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Серёжка-пятно на щеке (красный акцент) -->
  <path d="M48 36 Q46 40 49 42 Q52 42 52 38 Q51 35 48 36 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
</svg>
