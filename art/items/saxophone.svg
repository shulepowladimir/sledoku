  <path d="M41 84 Q52 86 65 83" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="53" cy="88" rx="12" ry="3.2" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <ellipse cx="53" cy="88" rx="6.5" ry="1.5" fill="#3A2A20"/>

  <!-- Ключевые тяги идут вдоль трубы; крупные перламутровые чашечки читаются в 22px. -->
