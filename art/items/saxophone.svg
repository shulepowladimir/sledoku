  <!-- Мундштук с тростью -->
  <path d="M56 8 L62 5 Q65 5 66 8 L67 12 L61 15 L56 13Z" fill="#3A3238" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M58 8 L63 6.5" fill="none" stroke="#9BA5AD" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M62 13 C69 16 70 21 65 25 L57 31" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>
