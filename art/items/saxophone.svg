  <ellipse cx="57" cy="49" rx="3.2" ry="4" transform="rotate(-12 57 49)" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <ellipse cx="57" cy="59" rx="3.3" ry="4.2" transform="rotate(-12 57 59)" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="49" cy="43" r="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4"/>
