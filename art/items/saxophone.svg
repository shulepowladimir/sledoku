  <path d="M65 16 Q67 19 64 22" fill="none" stroke="#E8B95F" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Конический корпус с характерным нижним изгибом -->
  <path d="M51 27 Q57 27 59 33 L59 65 Q59 72 64 78 L69 83 Q71 86 67 88 Q53 92 38 90 Q34 89 37 85 L45 76 Q48 72 48 65 L48 34 Q48 28 51 27Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
