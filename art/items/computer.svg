<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    computer — настольный ПК: монитор с «включённым» экраном и строками,
    подставка, клавиатура с клавишами, мышь.
  -->
  <!-- Тень-подложка -->
  <rect x="24.5" y="79.5" width="49" height="8" rx="4" fill="#3A2A20"/>

  <!-- Подставка монитора -->
  <rect x="41" y="48" width="14" height="10" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="34" y="57" width="28" height="6" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Корпус монитора -->
  <rect x="26" y="12" width="44" height="38" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Экран -->
  <rect x="31" y="17" width="34" height="26" rx="2" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Строки «текста» -->
  <g stroke="#2E6E65" stroke-width="2" stroke-linecap="round">
    <path d="M35 23 H58"/>
    <path d="M35 28 H52"/>
    <path d="M35 33 H55"/>
  </g>
  <!-- Курсор -->
  <rect x="58" y="31.5" width="4" height="4.5" fill="#C8102E"/>
  <!-- Блик на экране -->
  <path d="M33 19 L39 19 M33 20.5 L36 20.5" stroke="#F5E9D0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Кнопка питания -->
  <circle cx="48" cy="46.5" r="1.8" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Клавиатура -->
  <rect x="28" y="63" width="40" height="12" rx="3" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Клавиши -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1">
    <rect x="31.5" y="65.5" width="5" height="3" rx="0.8"/>
    <rect x="38" y="65.5" width="5" height="3" rx="0.8"/>
    <rect x="44.5" y="65.5" width="5" height="3" rx="0.8"/>
    <rect x="51" y="65.5" width="5" height="3" rx="0.8"/>
    <rect x="57.5" y="65.5" width="5" height="3" rx="0.8"/>
    <rect x="31.5" y="69.5" width="5" height="3" rx="0.8"/>
    <rect x="38" y="69.5" width="5" height="3" rx="0.8"/>
    <rect x="44.5" y="69.5" width="5" height="3" rx="0.8"/>
    <rect x="51" y="69.5" width="5" height="3" rx="0.8"/>
    <rect x="57.5" y="69.5" width="5" height="3" rx="0.8"/>
  </g>
  <!-- Пробел -->
  <rect x="38" y="73.5" width="19" height="1.5" rx="0.7" fill="#F5E9D0" stroke="none"/>

  <!-- Мышь -->
  <ellipse cx="76" cy="69" rx="6" ry="8.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M76 61.5 L76 66" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M72.5 65 Q76 63 79.5 65" fill="none" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
</svg>
