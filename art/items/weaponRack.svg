<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    weaponRack — стойка с оружием (замок): деревянная стойка, на ней
    меч в ножнах, копьё и щит; боевой топор прислонён.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="32" ry="4.5" fill="#3A2A20"/>

  <!-- Стойка (вертикальная + упоры) -->
  <rect x="20" y="18" width="7" height="66" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <rect x="69" y="18" width="7" height="66" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <rect x="17" y="40" width="62" height="6" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="17" y="64" width="62" height="6" rx="2.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M21 43 H75 M21 67 H75" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Меч в ножнах (висит на верхнем упоре) -->
  <path d="M34 18 L34 66" stroke="#3A2A20" stroke-width="7" stroke-linecap="round"/>
  <!-- Ножны -->
  <path d="M34 18 L34 62" stroke="#B85F2E" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Навершие и гарда -->
  <circle cx="34" cy="18" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M29 40 H39" stroke="#E0A94A" stroke-width="3" stroke-linecap="round"/>
  <!-- Подвес -->
  <path d="M34 24 Q28 28 27 36" fill="none" stroke="#8F5A3A" stroke-width="1.6"/>

  <!-- Копьё (за стойкой, верхний упор) -->
  <path d="M58 14 L58 76" stroke="#E0A94A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M59.2 18 L59.2 72" stroke="#E8B95F" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Наконечник -->
  <path d="M58 14 L54.5 6 L58 3 L61.5 6 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M54.5 12 H61.5" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>

  <!-- Щит на стойке (центр) -->
  <path d="M46 46 Q46 38 53 37 L60 37 Q67 38 67 46 Q67 56 60 60 Q53 64 46 60 Q39 56 39 46 Z"
        transform="translate(-2 -2)"
        fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Сегменты щита -->
  <path d="M45 42 H61 M45 46 H61 M45 50 H61" stroke="#5C6670" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="53" cy="46" r="2.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Боевой топор (прислонён справа) -->
  <path d="M80 44 L84 78" stroke="#8F5A3A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M78 48 Q70 44 72 36 Q80 34 82 42 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M79.5 46 Q74 43.5 74.5 38.5" fill="none" stroke="#D5DCE1" stroke-width="1.3" stroke-linecap="round"/>
</svg>
