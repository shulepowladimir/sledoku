<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    remote — пульт от телевизора-гиганта: тёмный корпус, кремовые
    числовые кнопки, красная кнопка питания, стальные стрелки каналов.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="16" ry="3.6" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="34" y="6" width="28" height="82" rx="8" fill="#3A2A20" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева на корпусе -->
  <path d="M38 14 Q37 48 38 80" fill="none" stroke="#5C6670" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Кнопка питания (акцент) -->
  <circle cx="48" cy="16" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M48 13.5 L48 18.5 M45.8 15 Q48 12.6 50.2 15" fill="none" stroke="#F5E9D0" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Стрелки каналов -->
  <path d="M48 26 L43.5 31 L52.5 31 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M48 38 L43.5 33 L52.5 33 Z" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Числовые кнопки 3×4 -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.4">
    <rect x="39" y="45" width="6" height="5.4" rx="1.6"/>
    <rect x="47" y="45" width="6" height="5.4" rx="1.6"/>
    <rect x="55" y="45" width="6" height="5.4" rx="1.6"/>
    <rect x="39" y="53" width="6" height="5.4" rx="1.6"/>
    <rect x="47" y="53" width="6" height="5.4" rx="1.6"/>
    <rect x="55" y="53" width="6" height="5.4" rx="1.6"/>
    <rect x="39" y="61" width="6" height="5.4" rx="1.6"/>
    <rect x="47" y="61" width="6" height="5.4" rx="1.6"/>
    <rect x="55" y="61" width="6" height="5.4" rx="1.6"/>
  </g>
  <!-- Нижний широкий ряд: громкость и каналы -->
  <rect x="39" y="69" width="10" height="5.4" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="51" y="69" width="10" height="5.4" rx="2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Точки-надписи на нижнем ряду -->
  <path d="M41.5 71.7 L46.5 71.7 M51.5 71.7 L56.5 71.7" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Одна кнопка нажата (вмятина) -->
  <rect x="47" y="53" width="6" height="5.4" rx="1.6" fill="#D5DCE1"/>
</svg>
