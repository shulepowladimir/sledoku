<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    table — обеденный стол, вид сверху с небольшим 3/4: сплошная плита
    столешницы (без дальних ножек) с бликом и волокнами; ближние
    балясины — под ближней гранью.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="82" rx="38" ry="6" fill="#3A2A20"/>

  <!-- Столешница (плита, продлена вверх — без дальних ножек) -->
  <rect x="11" y="13" width="74" height="44" rx="8" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик (свет сверху-слева: светлый кант дальней и левой кромки) -->
  <path d="M17 18 Q48 14.5 79 18" fill="none" stroke="#E8B95F" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M16 20 L15.5 47" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Волокна -->
  <path d="M26 28 Q48 25.5 70 28" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28 36 Q48 33.5 68 36" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M26 44 Q48 41.5 70 44" fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M30 50 Q48 48 66 50" fill="none" stroke="#B87F33" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Толщина столешницы (ближняя грань) -->
  <rect x="12.5" y="55" width="71" height="7" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M16 57.5 L80 57.5" stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ближние ножки-балясины (пеньки с талиями) -->
  <g fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round">
    <path d="M18 62 Q21 65 19.5 69 L18 84 L25 84 L24 69 Q23 65 25 62 Z"/>
    <path d="M71 62 Q74 65 72.5 69 L71 84 L78 84 L77 69 Q76 65 78 62 Z"/>
  </g>
  <!-- Талии -->
  <path d="M19.5 72 Q21.6 75 20.5 78 M72.5 72 Q74.6 75 73.5 78" fill="none" stroke="#B87F33" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Блики на ножках -->
  <path d="M19.8 66 L19 80 M72.8 66 L72 80" stroke="#E8B95F" stroke-width="1.5" stroke-linecap="round"/>
</svg>
