<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    swing — качели: А-образная деревянная рама, сиденье на верёвках
    (в движении, чуть наклонено). Посадочная зона — сиденье.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Задние стойки (темнее) -->
  <path d="M30 84 L48 22" stroke="#B87F33" stroke-width="5" stroke-linecap="round"/>
  <path d="M66 84 L48 22" stroke="#B87F33" stroke-width="5" stroke-linecap="round"/>

  <!-- Передние стойки (светлее) -->
  <path d="M24 84 L44 20" stroke="#E0A94A" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M72 84 L52 20" stroke="#E0A94A" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Блики передних стоек -->
  <path d="M25.5 79 L43 25 M70.5 79 L53 25" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Поперечина сверху -->
  <rect x="20" y="14" width="56" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M24 17.5 Q48 15.5 72 17.5" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Верёвки (наклон — качели в движении) -->
  <path d="M40 22 L36 56" stroke="#8F5A3A" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M56 22 L52 56" stroke="#8F5A3A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Узлы крепления -->
  <circle cx="40" cy="22" r="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="56" cy="22" r="2.6" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Сиденье (деревянная дощечка, чуть наклонена) -->
  <g transform="rotate(-6 44 58)">
    <rect x="30" y="56" width="30" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
    <path d="M33 60 L57 60" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- Люверсы сиденья -->
  <circle cx="37.5" cy="56.5" r="1.4" fill="#5C6670"/>
  <circle cx="53" cy="55" r="1.4" fill="#5C6670"/>

  <!-- Ласточкин след движения (дуги) -->
  <path d="M62 44 Q68 40 74 44" fill="none" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M64 50 Q69 47 73 50" fill="none" stroke="#9BA5AD" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Трава у основания -->
  <g fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 84 Q20 80 21 77"/>
    <path d="M74 84 Q76 80 75 77"/>
  </g>
</svg>
