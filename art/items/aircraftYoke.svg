        fill="#D5DCE1" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="48" cy="43" r="3" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.2"/>
