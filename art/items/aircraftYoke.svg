  <path d="M19 20 Q19 14 26 13 L33 14 Q38 15 40 20 L42 31 L54 31 L56 20 Q58 15 63 14 L70 13 Q77 14 77 20 L76 39 Q75 45 69 48 L57 53 Q48 56 39 53 L27 48 Q21 45 20 39 Z"
