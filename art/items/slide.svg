<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    slide — горка (площадок): лесенка с перилами, плавный спуск-жёлоб
    (терракота), земля с травой у выката.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="5" fill="#3A2A20"/>

  <!-- Платформа-верхушка -->
  <rect x="16" y="22" width="26" height="8" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M19 25.5 H39" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Столбы-опоры -->
  <path d="M20 30 V78 M38 30 V78" stroke="#B87F33" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M21.5 34 V76 M39.5 34 V76" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Косынки жёсткости -->
  <path d="M22 50 L36 42 M36 50 L22 42" stroke="#B87F33" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Лесенка (ступени к платформе, слева) -->
  <path d="M6 78 L14 60" stroke="#B87F33" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M11.5 64 H22 M14 69 H26 M16.5 74 H30" stroke="#E0A94A" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Перила лесенки -->
  <path d="M8 60 Q4 68 6 78" fill="none" stroke="#E0A94A" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Спуск-жёлоб (плавная дуга, терракота) -->
  <path d="M42 26 Q70 32 82 56 Q87 66 84 74 Q76 80 68 76 Q78 70 74 60 Q66 42 42 34 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Блик на жёлобе -->
  <path d="M46 29 Q66 36 76 52" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Бортик жёлоба -->
  <path d="M42 30 Q68 38 78 58" fill="none" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Выкат (кромка земли) -->
  <path d="M60 80 Q72 78 84 80" fill="none" stroke="#5E8A46" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Трава -->
  <path d="M56 80 Q55 77 56 74 M88 78 Q89 75 88 72" fill="none" stroke="#7FA85B" stroke-width="1.6" stroke-linecap="round"/>
</svg>
