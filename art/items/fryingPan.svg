<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    fryingPan — чугунная сковорода-гигант (occupiable, top-down 3/4):
    тёмная внутренняя поверхность = посадочная зона по центру,
    стальной кант, длинная деревянная ручка с заклёпкой.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="30" ry="5" fill="#3A2A20"/>

  <!-- Ручка (дерево, уходит вправо-вверх) -->
  <path d="M70 46 L88 28 L93 33 L75 51 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M73.5 45.5 L84 35" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Заклёпка на ручке -->
  <circle cx="78" cy="44" r="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Внешний кант сковороды (сталь) -->
  <circle cx="44" cy="54" r="33" fill="#5C6670" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик на канте -->
  <path d="M18 40 Q24 28 36 24" fill="none" stroke="#9BA5AD" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Внутренняя поверхность (чугун, посадочная зона) -->
  <circle cx="44" cy="54" r="26" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Блики на внутренней поверхности -->
  <path d="M28 42 Q33 33 42 30" fill="none" stroke="#5C6670" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 48 Q31 44 34 41" fill="none" stroke="#5C6670" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Затейливое дно: кольца от жарки -->
  <circle cx="44" cy="54" r="16" fill="none" stroke="#5C6670" stroke-width="1.6"/>
  <circle cx="44" cy="54" r="7" fill="none" stroke="#5C6670" stroke-width="1.4"/>

  <!-- Стык ручки с корпусом -->
  <path d="M72 48 Q76 52 74 56" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
</svg>
