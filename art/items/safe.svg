<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    safe — сейф: синяя сталь, дверца с клёпками, штурвал,
    замочная скважина, ножки.
  -->
  <!-- Тень-подложка -->
  <rect x="23.5" y="83.5" width="54" height="7" rx="3.5" fill="#3A2A20"/>

  <!-- Ножки -->
  <rect x="26" y="80" width="8" height="7" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="62" y="80" width="8" height="7" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Корпус -->
  <rect x="20" y="20" width="56" height="64" rx="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="24" y="24" width="4" height="52" rx="2" fill="#2E6E65"/>

  <!-- Дверца -->
  <rect x="27" y="26" width="44" height="52" rx="3" fill="none" stroke="#2E6E65" stroke-width="2.4"/>
  <!-- Клёпки по периметру дверцы -->
  <g fill="#F5E9D0">
    <circle cx="32" cy="31" r="1.4"/>
    <circle cx="44" cy="31" r="1.4"/>
    <circle cx="66" cy="31" r="1.4"/>
    <circle cx="32" cy="73" r="1.4"/>
    <circle cx="44" cy="73" r="1.4"/>
    <circle cx="66" cy="73" r="1.4"/>
  </g>
  <!-- Петли справа -->
  <rect x="70" y="34" width="6" height="10" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="70" y="58" width="6" height="10" rx="2" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Штурвал -->
  <circle cx="43" cy="46" r="10" fill="none" stroke="#E0A94A" stroke-width="3"/>
  <g stroke="#E0A94A" stroke-width="2.6" stroke-linecap="round">
    <path d="M43 36 L43 56"/>
    <path d="M33 46 L53 46"/>
    <path d="M36 39 L50 53"/>
    <path d="M50 39 L36 53"/>
  </g>
  <circle cx="43" cy="46" r="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Замочная скважина -->
  <circle cx="60" cy="52" r="2.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="58.9" y="52" width="2.2" height="6" rx="1.1" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
