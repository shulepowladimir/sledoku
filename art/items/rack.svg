<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    rack — стойка с одеждой: хромированная рама на колёсах, три вещи
    на плечиках (крем/терракота/красная кофта с биркой).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="27" ry="4.5" fill="#3A2A20"/>

  <!-- Колёсики -->
  <circle cx="30" cy="82" r="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.4"/>
  <circle cx="66" cy="82" r="4" fill="#2E6E65" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Стойки -->
  <rect x="28" y="34" width="5" height="46" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="63" y="34" width="5" height="46" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Перекладина-горб -->
  <path d="M30.5 38 Q48 24 65.5 38" fill="none" stroke="#1F3A5F" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M33 36.5 Q48 25.5 63 36.5" fill="none" stroke="#2E6E65" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Вещь 1: кремовый свитер (слева) -->
  <path d="M34 33 Q33 30 35 29" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="35,29 31,32 29,38 33,39" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M29 38 Q28 48 30 54 L42 56 Q45 48 43 38 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M32 41 Q33 48 32 53" fill="none" stroke="#E0A94A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Вещь 2: терракотовое платье (центр) -->
  <path d="M47 31 Q46 28 48 27" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="48,27 44,30 42,36 46,37" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M42.5 36 Q41 44 42 50 Q43 58 48 58 Q53 58 54 50 Q55 44 53.5 36 Z"
        fill="#E0824A" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M46 40 Q47 48 46.5 55" fill="none" stroke="#B85F2E" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Вещь 3: красная кофта (справа) с биркой -->
  <path d="M61 33 Q60 30 62 29" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="62,29 58,32 56,38 60,39" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M56 38 Q55 46 56.5 52 L67 54 Q70 46 69 38 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M59.5 41 Q60 47 59.5 51" fill="none" stroke="#E0824A" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Бирка -->
  <rect x="65" y="44" width="7" height="5" rx="1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <path d="M64.5 44 L63.5 43" stroke="#1A1A1A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
