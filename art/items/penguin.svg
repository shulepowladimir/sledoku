<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    penguin — пингвин (зоопарк): стоит, тёмный «фрак», кремовое брюшко,
    золотой клюв и лапы, крылья разведены. Умильная поза.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Лапки-ступни -->
  <ellipse cx="41" cy="84" rx="7" ry="3.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="55" cy="84" rx="7" ry="3.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Тело (тёмный фрак) -->
  <path d="M48 14 Q62 16 64 34 Q66 52 60 70 Q56 78 48 78 Q40 78 36 70 Q30 52 32 34 Q34 16 48 14 Z"
        fill="#3A2A20" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Брюшко (кремовое) -->
  <path d="M48 24 Q58 26 59 40 Q60 56 55 68 Q52 73 48 73 Q44 73 41 68 Q36 56 37 40 Q38 26 48 24 Z"
        fill="#F5E9D0"/>

  <!-- Крылья (разведены) -->
  <path d="M33 36 Q24 44 26 56 Q30 56 33 50 Q34 43 36 38 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M63 36 Q72 44 70 56 Q66 56 63 50 Q62 43 60 38 Z" fill="#3A2A20" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Голова: белые «щёки» (шапка тёмная сверху) -->
  <path d="M48 14 Q34 16 32 34 L36 30 Q42 22 48 22 Q54 22 60 30 L64 34 Q62 16 48 14 Z" fill="#3A2A20"/>

  <!-- Глаза (мультяшный реализм) -->
  <circle cx="43" cy="28" r="2.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="43.5" cy="28.5" r="1.5" fill="#1A1A1A"/>
  <circle cx="43" cy="27.8" r="0.6" fill="#F5E9D0"/>
  <circle cx="53" cy="28" r="2.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="53.5" cy="28.5" r="1.5" fill="#1A1A1A"/>
  <circle cx="53" cy="27.8" r="0.6" fill="#F5E9D0"/>

  <!-- Клюв (золотой, вниз — скромница) -->
  <path d="M48 30 L44.5 34.5 L51.5 34.5 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M45.8 33 L50.2 33" stroke="#B87F33" stroke-width="1" stroke-linecap="round"/>

  <!-- Румянец на щеках -->
  <circle cx="39" cy="33" r="1.4" fill="#E0824A"/>
  <circle cx="57" cy="33" r="1.4" fill="#E0824A"/>

  <!-- Блик на фраке -->
  <path d="M38 44 Q36 56 38 64" fill="none" stroke="#5C6670" stroke-width="1.8" stroke-linecap="round"/>
</svg>
