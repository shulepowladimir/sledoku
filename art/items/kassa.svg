<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    kassa — кассовый аппарат: бирюзовый корпус, экран с чеком,
    сетка клавиш, ящик с мелочью.
  -->
  <!-- Тень-подложка -->
  <rect x="23.5" y="82.5" width="52" height="8" rx="4" fill="#3A2A20"/>

  <!-- Корпус -->
  <path d="M24 42 Q24 36 30 36 L66 36 Q72 36 72 42 L74 78 Q74 82 70 82 L26 82 Q22 82 22 78 Z"
        fill="#2E6E65" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик слева -->
  <path d="M27 42 L26.5 76" stroke="#7FA85B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Экран с чеком -->
  <rect x="30" y="20" width="34" height="18" rx="3" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Строки чека -->
  <g stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round">
    <path d="M34 26 H56"/>
    <path d="M34 30 H50"/>
    <path d="M34 34 H53"/>
  </g>
  <!-- Стрелка-курсор -->
  <rect x="57" y="29" width="3" height="3" fill="#C8102E"/>
  <!-- Подставка экрана -->
  <rect x="40" y="36" width="14" height="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Клавиши (сетка 4×3) -->
  <g fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6">
    <rect x="30" y="44" width="8" height="6" rx="1.5"/>
    <rect x="41" y="44" width="8" height="6" rx="1.5"/>
    <rect x="52" y="44" width="8" height="6" rx="1.5"/>
    <rect x="63" y="44" width="8" height="6" rx="1.5"/>
    <rect x="30" y="53" width="8" height="6" rx="1.5"/>
    <rect x="41" y="53" width="8" height="6" rx="1.5"/>
    <rect x="52" y="53" width="8" height="6" rx="1.5"/>
    <rect x="63" y="53" width="8" height="6" rx="1.5"/>
    <rect x="30" y="62" width="8" height="6" rx="1.5"/>
    <rect x="41" y="62" width="8" height="6" rx="1.5"/>
    <rect x="52" y="62" width="8" height="6" rx="1.5"/>
  </g>
  <!-- Одна клавиша-акцент -->
  <rect x="63" y="62" width="8" height="6" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Ящик с мелочью -->
  <rect x="27" y="72" width="32" height="7" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M40 75.5 H52" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Рычаг сбоку -->
  <path d="M74 58 L80 54" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="81" cy="53" r="2.4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.6"/>
</svg>
