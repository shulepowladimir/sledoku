<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    armchair — пышное кресло: градиентная спинка с пуговицами, валики-подлокотники
    со строчкой, кремовая подушка. Эталон «мягкой мебели».
  -->
  <defs>
    <linearGradient id="armchairGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B95F"/>
      <stop offset="1" stop-color="#B87F33"/>
    </linearGradient>
  </defs>

  <!-- Тень-подложка -->
  <rect x="17" y="80" width="66" height="9" rx="4.5" fill="#3A2A20"/>

  <!-- Задние ножки -->
  <rect x="34" y="68" width="6" height="13" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="56" y="68" width="6" height="13" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Спинка -->
  <path d="M18 62 L18 32 Q18 10 40 10 L56 10 Q78 10 78 32 L78 62 Z"
        fill="url(#armchairGrad1)" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик на спинке (свет сверху-слева) -->
  <path d="M32 18 Q44 12 54 13" fill="none" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Основание (юбка) -->
  <rect x="24" y="66" width="48" height="9" rx="3.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Подушка сиденья (крем, со строчкой) -->
  <rect x="26" y="52" width="44" height="16" rx="6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M31 58 Q48 55 65 58" fill="none" stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Передние ножки -->
  <rect x="27" y="74" width="7" height="12" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>
  <rect x="62" y="74" width="7" height="12" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.5"/>

  <!-- Валики-подлокотники -->
  <rect x="11" y="40" width="17" height="33" rx="8.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <rect x="68" y="40" width="17" height="33" rx="8.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Строчка на подлокотниках -->
  <rect x="15.5" y="45" width="8" height="23" rx="4" fill="none" stroke="#F5E9D0" stroke-width="1.5"/>
  <rect x="72.5" y="45" width="8" height="23" rx="4" fill="none" stroke="#F5E9D0" stroke-width="1.5"/>

  <!-- Пуговицы капитоне на спинке -->
  <g fill="#B87F33" stroke="#3A2A20" stroke-width="0.8">
    <circle cx="38" cy="24" r="2.2"/>
    <circle cx="58" cy="24" r="2.2"/>
    <circle cx="48" cy="34" r="2.2"/>
  </g>
  <!-- Складки от пуговиц -->
  <g fill="none" stroke="#B87F33" stroke-width="1.4" stroke-linecap="round">
    <path d="M38 27 Q36 32 34 36"/>
    <path d="M58 27 Q60 32 62 36"/>
    <path d="M44 36 Q48 40 52 36"/>
  </g>
</svg>
