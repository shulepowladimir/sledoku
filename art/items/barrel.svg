<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    barrel — дубовая бочка: клёпки двух тонов, обручи с заклёпками,
    крышка с краем.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="85" rx="26" ry="5" fill="#3A2A20"/>

  <!-- Корпус (пузатый) -->
  <path d="M27 34 Q19 58 27 82 L69 82 Q77 58 69 34 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Клёпки (светлые полосы) -->
  <g fill="#E8B95F">
    <path d="M36 34 Q32 58 36 81 L42 81 Q39 58 41 34 Z"/>
    <path d="M52 34 Q51 58 52 81 L58 81 Q55 58 57 34 Z"/>
  </g>
  <!-- Блик слева -->
  <path d="M31 40 Q27 58 30.5 76" fill="none" stroke="#F5E9D0" stroke-width="2" stroke-linecap="round"/>

  <!-- Обручи -->
  <g fill="#B87F33" stroke="#1A1A1A" stroke-width="2">
    <path d="M24 46 Q20.5 46 21 52 L22 58 Q24 58.5 24.5 58 L71.5 58 Q72 58.5 74 58 L75 52 Q75.5 46 72 46 Z"/>
    <rect x="23" y="70" width="50" height="8" rx="2"/>
  </g>
  <!-- Заклёпки на обручах -->
  <g fill="#1A1A1A">
    <circle cx="32" cy="52" r="1.2"/>
    <circle cx="48" cy="52" r="1.2"/>
    <circle cx="64" cy="52" r="1.2"/>
    <circle cx="32" cy="74" r="1.2"/>
    <circle cx="48" cy="74" r="1.2"/>
    <circle cx="64" cy="74" r="1.2"/>
  </g>

  <!-- Крышка -->
  <ellipse cx="48" cy="34" rx="21" ry="7" fill="#E8B95F" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="48" cy="33" rx="14" ry="4" fill="#E0A94A"/>
  <!-- Доски на крышке -->
  <path d="M40 31.2 L40 35 M56 31.2 L56 35" stroke="#B87F33" stroke-width="1.4"/>
</svg>
