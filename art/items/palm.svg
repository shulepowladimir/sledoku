<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    palm — пальма: изогнутый ствол с сегментами, 5 листьев-звёздой,
    кокосы под листьями, трава у основания.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="28" ry="5" fill="#3A2A20"/>

  <!-- Трава у основания -->
  <g fill="none" stroke="#7FA85B" stroke-width="1.8" stroke-linecap="round">
    <path d="M30 82 Q27 78 27 74"/>
    <path d="M36 83 Q34 79 35 75"/>
    <path d="M62 83 Q64 79 63 75"/>
    <path d="M68 82 Q71 78 71 74"/>
  </g>

  <!-- Ствол (изогнутый) -->
  <path d="M46 82 Q42 64 44 50 Q46 38 54 32 L60 37 Q53 42 51 52 Q49 64 54 82 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Сегменты ствола -->
  <g fill="none" stroke="#B87F33" stroke-width="1.8" stroke-linecap="round">
    <path d="M45 74 Q49 73 52.5 74"/>
    <path d="M45 66 Q49 65 51.5 66"/>
    <path d="M45.5 58 Q49 57 51 58"/>
    <path d="M46.5 50 Q49.5 49 51.5 50"/>
    <path d="M48 42 Q51 41 53 42.5"/>
  </g>
  <!-- Блик ствола -->
  <path d="M47 76 Q45 62 47 50" fill="none" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Листья (5 штук, звёздой) -->
  <!-- Верхний -->
  <path d="M56 30 Q56 16 64 10 Q60 22 66 22 Q58 26 62 32 Q55 32 56 30 Z"
        fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Левый верхний -->
  <path d="M54 32 Q38 20 26 22 Q38 26 30 32 Q42 30 46 36 Q52 36 54 32 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Левый нижний -->
  <path d="M53 36 Q36 36 26 44 Q38 40 34 48 Q46 42 50 44 Q54 40 53 36 Z"
        fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Правый верхний -->
  <path d="M58 30 Q72 18 84 20 Q72 24 80 30 Q68 28 64 34 Q58 34 58 30 Z"
        fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Правый нижний -->
  <path d="M58 35 Q74 35 84 43 Q72 39 76 47 Q64 41 60 43 Q56 39 58 35 Z"
        fill="#7FA85B" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Прожилки на листьях -->
  <g fill="none" stroke="#44663A" stroke-width="1.2" stroke-linecap="round">
    <path d="M57 26 Q59 18 63 13"/>
    <path d="M50 30 Q38 25 29 24"/>
    <path d="M50 39 Q38 39 30 44"/>
    <path d="M62 28 Q72 23 80 22"/>
    <path d="M61 38 Q72 38 79 43"/>
  </g>

  <!-- Кокосы -->
  <circle cx="52" cy="38" r="4" fill="#B87F33" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="60" cy="40" r="4" fill="#8F5A3A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="51" cy="37" r="1" fill="#E0A94A"/>
  <circle cx="59" cy="39" r="1" fill="#E0A94A"/>
</svg>
