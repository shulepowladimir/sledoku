<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    billiardTable — бильярдный стол, top-down 3/4: зелёное сукно,
    деревянные борта с лузами, шары и кий на столе.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="84" rx="40" ry="5.5" fill="#3A2A20"/>

  <!-- Ближние ножки -->
  <rect x="22" y="72" width="7" height="11" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="67" y="72" width="7" height="11" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Толщина стола (ближняя грань) -->
  <rect x="10" y="66" width="76" height="8" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.8"/>
  <path d="M14 69 L82 69" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Борта (деревянная рама) -->
  <rect x="8" y="12" width="80" height="56" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блики бортов -->
  <path d="M12 16 Q48 13 84 16" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Сукно -->
  <rect x="15" y="19" width="66" height="42" rx="2" fill="#5E8A46" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Блик сукна -->
  <path d="M20 24 Q48 20.5 76 24" fill="none" stroke="#7FA85B" stroke-width="2" stroke-linecap="round"/>

  <!-- Лузы (6: 4 угла + 2 борта) -->
  <g fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.6">
    <circle cx="17" cy="21" r="3.4"/>
    <circle cx="79" cy="21" r="3.4"/>
    <circle cx="17" cy="59" r="3.4"/>
    <circle cx="79" cy="59" r="3.4"/>
    <circle cx="48" cy="19.5" r="3"/>
    <circle cx="48" cy="60.5" r="3"/>
  </g>
  <!-- Дуги луз -->
  <path d="M14 24 Q17 27 20 24 M76 24 Q79 27 82 24" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Шары -->
  <circle cx="38" cy="38" r="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="36.7" cy="36.7" r="1.1" fill="#fff" stroke="none"/>
  <circle cx="52" cy="34" r="4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="50.7" cy="32.7" r="1.1" fill="#F5E9D0"/>
  <circle cx="58" cy="45" r="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="56.7" cy="43.7" r="1.1" fill="#F5E9D0"/>
  <!-- Полосатый шар -->
  <circle cx="30" cy="48" r="4" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M26.6 47 Q30 45 33.4 47 L33.2 48.6 Q30 46.8 26.8 48.6 Z" fill="#F5E9D0"/>

  <!-- Кий (лежит по диагонали) -->
  <g transform="rotate(28 48 52)">
    <rect x="14" y="50.5" width="60" height="3.4" rx="1.7" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
    <rect x="14" y="50.5" width="10" height="3.4" rx="1.7" fill="#E8B95F"/>
    <rect x="71" y="50.2" width="6" height="4" rx="1" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.2"/>
  </g>
</svg>
