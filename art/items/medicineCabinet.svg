<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    medicineCabinet — шкаф с лекарствами: настенный шкафчик,
    красный крест на дверце, склянки и пузырьки внутри.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="34" ry="4.5" fill="#3A2A20"/>

  <!-- Корпус (стальной, с открывающейся нишей) -->
  <rect x="16" y="20" width="64" height="60" rx="4" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="20" y="24" width="4" height="50" rx="2" fill="#D5DCE1"/>

  <!-- Полки и склянки внутри (открытая часть справа) -->
  <rect x="42" y="26" width="33" height="48" rx="2.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Полка 1 -->
  <path d="M44 44 L73 44" stroke="#9BA5AD" stroke-width="3"/>
  <!-- Склянки на полке 1 -->
  <rect x="46" y="36" width="7" height="8" rx="1.5" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="56" y="34" width="6" height="10" rx="1.5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="65" y="37" width="6" height="7" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Полка 2 -->
  <path d="M44 60 L73 60" stroke="#9BA5AD" stroke-width="3"/>
  <!-- Склянки на полке 2 -->
  <rect x="47" y="52" width="6" height="8" rx="1.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.6"/>
  <rect x="57" y="53" width="7" height="7" rx="1.5" fill="#7FA85B" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Банка внизу -->
  <rect x="47" y="66" width="8" height="6" rx="1.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <circle cx="51" cy="69" r="1.6" fill="#C8102E"/>

  <!-- Дверца слева (закрытая) -->
  <rect x="20" y="26" width="19" height="48" rx="2.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.4"/>
  <path d="M23 30 L23 70" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Ручка дверцы -->
  <rect x="34" y="46" width="3.6" height="10" rx="1.8" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Красный крест на дверце -->
  <rect x="25" y="42" width="10" height="3.6" rx="1" fill="#C8102E"/>
  <rect x="28.2" y="38.8" width="3.6" height="10" rx="1" fill="#C8102E"/>
</svg>
