<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    slotMachine — игровой автомат: высокий шкаф тёмно-синей стали с кремовой
    маркизой (золотой ромб), тремя окошками барабанов (золотой слиток,
    бирюзовый ромб, терракотовый апельсин), золотой кнопочной панелью,
    лотком для монет и рычагом с красным шаром (единственный красный акцент).
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="30" ry="4.5" fill="#3A2A20"/>

  <!-- Рычаг (правый): кронштейн, дуга-штанга, красный шар -->
  <rect x="68" y="38" width="7" height="9" rx="2" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M73 42 Q82 40 82 28" fill="none" stroke="#9BA5AD" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="82" cy="23.5" r="4.6" fill="#C8102E" stroke="#1A1A1A" stroke-width="2.2"/>
  <circle cx="80.6" cy="22" r="1.2" fill="#F5E9D0"/>

  <!-- Основание-плинт -->
  <rect x="23" y="75" width="50" height="11" rx="3" fill="#5C6670" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M27 78 L69 78" stroke="#9BA5AD" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Корпус -->
  <rect x="26" y="13" width="44" height="64" rx="5" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Светлая грань слева -->
  <path d="M30.5 17 L30.5 73" stroke="#2E6E65" stroke-width="3.4" stroke-linecap="round"/>

  <!-- Маркиза (кремовая, золотой ромб) -->
  <rect x="30" y="17" width="36" height="12" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M48 19.5 L52.5 23 L48 26.5 L43.5 23 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Экран барабанов -->
  <rect x="30" y="33" width="36" height="22" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M42 33.8 L42 54.2 M54 33.8 L54 54.2" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <!-- Барабан 1: золотой слиток -->
  <rect x="33.6" y="41.5" width="7" height="6" rx="1.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M34.8 43 L39.4 43" stroke="#E8B95F" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Барабан 2: бирюзовый ромб -->
  <path d="M48 40 L52 45 L48 50 L44 45 Z" fill="#2E6E65" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M48 43 L49.8 45 L48 47 L46.2 45 Z" fill="#F5E9D0"/>
  <!-- Барабан 3: терракотовый апельсин с листиком -->
  <circle cx="61" cy="45" r="3.8" fill="#E0824A" stroke="#1A1A1A" stroke-width="1.4"/>
  <path d="M61 41.5 Q63 39.5 64.5 41 Q62.5 42.5 61 41.5 Z" fill="#5E8A46" stroke="#1A1A1A" stroke-width="1"/>
  <circle cx="59.8" cy="43.8" r="1" fill="#F5E9D0"/>

  <!-- Кнопочная панель -->
  <rect x="30" y="59" width="36" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="38" cy="63" r="2.1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="48" cy="63" r="2.1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="58" cy="63" r="2.1" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Лоток для монет -->
  <rect x="35" y="70" width="26" height="7" rx="2.5" fill="#3A2A20" stroke="#1A1A1A" stroke-width="1.8"/>
  <rect x="38.5" y="72" width="19" height="3" rx="1.5" fill="#9BA5AD"/>
  <!-- Монетка в лотке (живая деталь) -->
  <ellipse cx="43" cy="73.5" rx="2.4" ry="1.5" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1"/>
</svg>
