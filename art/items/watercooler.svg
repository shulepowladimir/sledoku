<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    watercooler — кулер с водой: синяя бутыль с пузырьками на белом
    корпусе, краники, стаканчик-деталь.
  -->
  <!-- Тень-подложка -->
  <rect x="31.5" y="82.5" width="38" height="8" rx="4" fill="#3A2A20"/>

  <!-- Корпус -->
  <rect x="30" y="34" width="38" height="50" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Блик слева -->
  <rect x="34" y="38" width="4" height="40" rx="2" fill="#E8B95F"/>
  <!-- Бак для стаканчиков (дверца) -->
  <rect x="42" y="62" width="18" height="16" rx="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M46 70 H56" stroke="#F5E9D0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Стаканчик в нише -->
  <path d="M46 74 L47.5 79 L52.5 79 L54 74 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Приёмник бутыли (горловина корпуса) -->
  <rect x="37" y="28" width="24" height="8" rx="3" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Краники (горячая/холодная) -->
  <rect x="38" y="40" width="9" height="10" rx="2" fill="#C8102E" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="51" y="40" width="9" height="10" rx="2" fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M41.5 50 L41.5 53 M54.5 50 L54.5 53" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Капля из синего краника -->
  <path d="M54.5 55 Q55.6 57 54.5 58.2 Q53.4 57 54.5 55 Z" fill="#1F3A5F"/>

  <!-- Бутыль (синяя, перевёрнутая) -->
  <path d="M38 26 L38 16 Q38 8 49 8 Q60 8 60 16 L60 26 Q49 30 38 26 Z"
        fill="#1F3A5F" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Пробка бутыли (снизу) -->
  <rect x="45" y="24" width="8" height="6" rx="1.5" fill="#D5DCE1" stroke="#1A1A1A" stroke-width="1.8"/>
  <!-- Уровень воды (голубой) -->
  <path d="M40 26 Q49 29.5 58 26 L58 16 Q58 10 49 10 Q40 10 40 16 Z" fill="#4A7BA6"/>
  <!-- Блики на бутыли -->
  <path d="M42 22 Q42 12 49 11" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Пузырьки -->
  <circle cx="46" cy="17" r="1.2" fill="#9CC3E0"/>
  <circle cx="52" cy="20" r="1.5" fill="#9CC3E0"/>
  <circle cx="49" cy="14" r="0.9" fill="#9CC3E0"/>
</svg>
