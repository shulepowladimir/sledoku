<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    hurdle — барьер (лёгкая атлетика): две кремовые стойки с тёмными
    метками, горизонтальные перекладины, стальные ножки-основания.
  -->
  <!-- Стальные основания (дуги) -->
  <path d="M26 78 Q26 86 34 86" fill="none" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>
  <path d="M70 78 Q70 86 62 86" fill="none" stroke="#9BA5AD" stroke-width="4" stroke-linecap="round"/>

  <!-- Левая стойка -->
  <rect x="24" y="26" width="7" height="54" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Правая стойка -->
  <rect x="65" y="26" width="7" height="54" rx="3" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Метки-полоски на стойках -->
  <path d="M24 38 H31 M24 50 H31 M24 62 H31" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round"/>
  <path d="M65 38 H72 M65 50 H72 M65 62 H72" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round"/>
  <!-- Блики стоек -->
  <path d="M25.6 30 V78 M66.6 30 V78" stroke="#D5DCE1" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Верхняя перекладина (деревянная) -->
  <rect x="20" y="20" width="56" height="8" rx="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M24 24 H72" stroke="#E8B95F" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Средние перекладины (стальные) -->
  <rect x="22" y="36" width="52" height="4.5" rx="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="22" y="46" width="52" height="4.5" rx="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <rect x="22" y="56" width="52" height="4.5" rx="2.2" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M26 38.2 H70 M26 48.2 H70 M26 58.2 H70" stroke="#D5DCE1" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Номер дорожки на перекладине (штрих-метки) -->
  <rect x="42" y="30.5" width="12" height="4" rx="1.5" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.4"/>
</svg>
