<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    sarcophagus — саркофаг (гробница): стоящая золотая мумийная капсула
    с маской-лицом, скрещенными руками, полосами иероглифов, головой
    кобры на нагруднике.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- Корпус (заострённый низ, мумийная форма) -->
  <path d="M30 22 Q30 76 40 84 L44 86 Q48 87 52 86 L56 84 Q66 76 66 22 Q48 14 30 22 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Нимб-полоса за головой -->
  <ellipse cx="48" cy="26" rx="17" ry="13" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Маска-лицо -->
  <ellipse cx="48" cy="27" rx="12" ry="10.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.2"/>
  <!-- Глаза (подведённые, египетский стиль) -->
  <path d="M40 25 Q43 22.5 46 25" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="43" cy="25" r="1.3" fill="#1A1A1A"/>
  <path d="M50 25 Q53 22.5 56 25" fill="none" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="53" cy="25" r="1.3" fill="#1A1A1A"/>
  <!-- Урей (кобра) на лбу -->
  <path d="M48 17 Q46.5 20 48 21.5 Q49.5 20 48 17 Z" fill="#C8102E" stroke="#1A1A1A" stroke-width="0.9"/>
  <!-- Губы (спокойная улыбка) -->
  <path d="M45 32.5 Q48 34 51 32.5" fill="none" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Нагрудник-воротник (полосы) -->
  <path d="M36 36 Q48 44 60 36" fill="none" stroke="#C8102E" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M38 40 Q48 46 58 40" fill="none" stroke="#B85F2E" stroke-width="2" stroke-linecap="round"/>

  <!-- Скрещенные руки -->
  <path d="M34 50 Q42 46 52 50 L52 58 Q42 54 34 58 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <path d="M62 50 Q54 46 46 50 L46 58 Q54 54 62 58 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Кисти с жезлами -->
  <rect x="44" y="52" width="3" height="12" rx="1.5" transform="rotate(-8 45.5 58)" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.4"/>

  <!-- Пояс -->
  <path d="M36 64 Q48 68 60 64" fill="none" stroke="#C8102E" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Иероглифы (абстрактные метки) -->
  <g fill="#B85F2E">
    <circle cx="41" cy="72" r="1.8"/>
    <rect x="46" y="70" width="3" height="4" rx="0.8"/>
    <path d="M53 70 L56 72.5 L53 75 L50 72.5 Z"/>
    <path d="M41 79 L45 77.5 M55 77.5 L51 79" stroke="#B85F2E" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Вертикальные золотые полосы -->
  <path d="M34 48 Q34 74 42 82 M62 48 Q62 74 54 82" fill="none" stroke="#E8B95F" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Блик слева -->
  <path d="M34 30 Q33 50 36 68" fill="none" stroke="#E8B95F" stroke-width="2" stroke-linecap="round"/>
</svg>
