<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    samovar — самовар (вагон-ресторан): латунная тулья с ручками,
    кран с вентилем, резная ножка, дымоход с паром, чашка рядом.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="46" cy="86" rx="28" ry="4.5" fill="#3A2A20"/>

  <!-- Дымоход (труба сверху) -->
  <rect x="42" y="12" width="8" height="12" rx="2.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <ellipse cx="46" cy="12" rx="4" ry="2" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.6"/>
  <!-- Пар из трубы -->
  <path d="M42 10 Q40 8 42 6" fill="none" stroke="#9CC3E0" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 11 Q52 9 50 7" fill="none" stroke="#9CC3E0" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Шапка (крышка) -->
  <path d="M34 24 Q46 16 58 24 L58 28 Q46 23 34 28 Z" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="46" cy="17" r="2.4" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.6"/>

  <!-- Тулья (пузатый корпус) -->
  <path d="M34 28 Q26 34 28 46 Q30 52 34 54 Q30 60 32 66 Q34 70 40 70 L52 70 Q58 70 60 66 Q62 60 58 54 Q62 52 64 46 Q66 34 58 28 Q46 33 34 28 Z"
        fill="#E0A94A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Блик слева -->
  <path d="M34 36 Q31 44 33 52" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Пояски -->
  <path d="M33 44 Q46 48 59 44" fill="none" stroke="#B87F33" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 62 Q46 65 58 62" fill="none" stroke="#B87F33" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ручки (фигурные) -->
  <path d="M28 34 Q22 36 23 42 Q27 42 29 39" fill="none" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 34 Q70 36 69 42 Q65 42 63 39" fill="none" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>

  <!-- Кран с вентилем -->
  <rect x="60" y="48" width="6" height="5" rx="1.5" fill="#B87F33" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M66 50.5 L71 50.5" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
  <circle cx="72" cy="50.5" r="2.6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="1.8"/>
  <path d="M72 48 L72 53" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Ножка (резная) -->
  <path d="M40 70 L38 78 M52 70 L54 78" stroke="#B87F33" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="46" cy="80" rx="14" ry="4" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Чашка с блюдцем -->
  <ellipse cx="80" cy="80" rx="8" ry="2.4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.6"/>
  <path d="M75 72 L85 72 L84 79 Q80 81 76 79 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Чай в чашке -->
  <ellipse cx="80" cy="73.5" rx="4.4" ry="1.4" fill="#B85F2E"/>
  <!-- Ручка чашки -->
  <path d="M85 74 Q88 75.5 86.5 78" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round"/>
</svg>
