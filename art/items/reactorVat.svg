<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    reactorVat — реакторный чан (2-клеточный вертикальный, decorative):
    стальной бак с куполом и горловиной-клапаном, боковые трубы с фланцами,
    манометр и красная лампа-индикатор (тёплый акцент уровня). Свет сверху-слева.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="88" rx="32" ry="5.5" fill="#3A2A20"/>

  <!-- Левая труба (от купола вниз, за баком) -->
  <rect x="10" y="34" width="10" height="46" rx="3" fill="#68727A" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="8" y="30" width="14" height="7" rx="2.5" fill="#7D878E" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="8" y="62" width="14" height="7" rx="2.5" fill="#7D878E" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Правая труба (выше, к куполу) -->
  <rect x="76" y="22" width="10" height="34" rx="3" fill="#68727A" stroke="#1A1A1A" stroke-width="2.6"/>
  <rect x="74" y="46" width="14" height="7" rx="2.5" fill="#7D878E" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Основной бак: цилиндр -->
  <path d="M28 32
           Q28 26 34 25
           L62 25
           Q68 26 68 32
           L68 80
           Q68 86 62 86
           L34 86
           Q28 86 28 80
           Z"
        fill="#939CA2" stroke="#1A1A1A" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- Тёмная грань справа (объём) -->
  <path d="M60 25.6 L62 25 Q68 26 68 32 L68 80 Q68 86 62 86 L58 86 L63 32 Z" fill="#68727A"/>

  <!-- Пояса-обручи бака -->
  <g stroke="#545D65" stroke-width="2.6" fill="none">
    <path d="M28 44 Q48 49 68 44"/>
    <path d="M28 66 Q48 71 68 66"/>
  </g>
  <!-- Блик слева -->
  <path d="M33 31 V82" stroke="#D5DCE1" stroke-width="3" stroke-linecap="round"/>

  <!-- Купол-горловина с клапаном -->
  <path d="M36 25 Q48 12 60 25 Z" fill="#7D878E" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <rect x="43" y="4" width="10" height="10" rx="2.5" fill="#939CA2" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M41 9 H55" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Красная лампа-индикатор на клапане (акцент) -->
  <circle cx="58" cy="7" r="3.4" fill="#C8102E" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="57" cy="6" r="1.1" fill="#F5E9D0"/>

  <!-- Манометр на баке -->
  <circle cx="48" cy="40" r="8" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M48 40 L53 35" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 34.5 V37 M53.5 40 H51 M42.5 40 H45 M48 45.5 V43" stroke="#545D65" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="1.6" fill="#C8102E"/>

  <!-- Заклёпки по канту -->
  <g fill="#D5DCE1">
    <circle cx="32" cy="36" r="1.3"/>
    <circle cx="64" cy="36" r="1.3"/>
    <circle cx="32" cy="76" r="1.3"/>
    <circle cx="64" cy="76" r="1.3"/>
  </g>
</svg>
