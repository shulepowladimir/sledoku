<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    makeupMirror — гримёрное зеркало: круглое зеркало в латунной раме
    с лампочками по кругу, голубоватое стекло, подставка-нога.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="87" rx="26" ry="4.5" fill="#3A2A20"/>

  <!-- Нога-подставка -->
  <rect x="45" y="62" width="6" height="16" rx="2" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.2"/>
  <ellipse cx="48" cy="82" rx="16" ry="4.5" fill="#E0A94A" stroke="#1A1A1A" stroke-width="2.6"/>
  <path d="M40 81 Q48 78.5 56 81" fill="none" stroke="#E8B95F" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Рама (латунь) -->
  <circle cx="48" cy="38" r="26" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>

  <!-- Лампочки по кругу (кремовые с золотым свечением) -->
  <g stroke="#1A1A1A" stroke-width="1.6">
    <circle cx="48" cy="14" r="3.4" fill="#F5E9D0"/>
    <circle cx="64.5" cy="18.5" r="3.4" fill="#F5E9D0"/>
    <circle cx="74" cy="32" r="3.4" fill="#F5E9D0"/>
    <circle cx="74" cy="45" r="3.4" fill="#F5E9D0"/>
    <circle cx="64.5" cy="58" r="3.4" fill="#F5E9D0"/>
    <circle cx="48" cy="62.5" r="3.4" fill="#F5E9D0"/>
    <circle cx="31.5" cy="58" r="3.4" fill="#F5E9D0"/>
    <circle cx="22" cy="45" r="3.4" fill="#F5E9D0"/>
    <circle cx="22" cy="32" r="3.4" fill="#F5E9D0"/>
    <circle cx="31.5" cy="18.5" r="3.4" fill="#F5E9D0"/>
  </g>
  <!-- Ореолы-блики на лампочках -->
  <g fill="#E8B95F">
    <circle cx="48" cy="12.8" r="1.1"/>
    <circle cx="66" cy="20.5" r="1.1"/>
    <circle cx="75.2" cy="34" r="1.1"/>
    <circle cx="75.2" cy="43" r="1.1"/>
    <circle cx="66" cy="56" r="1.1"/>
    <circle cx="48" cy="61.3" r="1.1"/>
    <circle cx="30" cy="56" r="1.1"/>
    <circle cx="20.8" cy="43" r="1.1"/>
    <circle cx="20.8" cy="34" r="1.1"/>
    <circle cx="30" cy="20.5" r="1.1"/>
  </g>

  <!-- Стекло зеркала -->
  <circle cx="48" cy="38" r="17" fill="#9CC3E0" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Отражение (светлые диагонали) -->
  <path d="M38 48 L50 26 M46 50 L58 28" stroke="#F5E9D0" stroke-width="3" stroke-linecap="round"/>
  <path d="M33 44 L41 30" stroke="#4A7BA6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Верхний узор рамы (звёздочка) -->
  <path d="M48 6.5 L49.2 9.3 L52 9.5 L49.8 11.3 L50.6 14 L48 12.5 L45.4 14 L46.2 11.3 L44 9.5 L46.8 9.3 Z" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1" stroke-linejoin="round"/>
</svg>
