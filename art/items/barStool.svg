<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    barStool — барный табурет: хромированная стойка с кольцом-подножкой,
    терракотовое круглое сиденье с бликом. Посадочная зона — центр.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="86" rx="24" ry="4.5" fill="#3A2A20"/>

  <!-- База (крестовина) -->
  <ellipse cx="48" cy="82" rx="20" ry="5.5" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="80.8" rx="20" ry="5.5" fill="#D5DCE1"/>
  <ellipse cx="48" cy="80.8" rx="20" ry="5.5" fill="none" stroke="#1A1A1A" stroke-width="2.2"/>

  <!-- Стойка (хром) -->
  <rect x="45" y="36" width="6" height="45" fill="#9BA5AD" stroke="#1A1A1A" stroke-width="2.2"/>
  <rect x="46.2" y="38" width="1.6" height="40" fill="#D5DCE1"/>

  <!-- Кольцо-подножка -->
  <ellipse cx="48" cy="62" rx="15" ry="4.5" fill="none" stroke="#9BA5AD" stroke-width="3.6"/>
  <ellipse cx="48" cy="62" rx="15" ry="4.5" fill="none" stroke="#D5DCE1" stroke-width="1.2"/>
  <!-- Крепление кольца -->
  <rect x="43" y="59.5" width="10" height="5" rx="1.5" fill="#5C6670" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Сиденье (терракотовый диск с толщиной) -->
  <ellipse cx="48" cy="33" rx="21" ry="7" fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8"/>
  <ellipse cx="48" cy="30" rx="21" ry="7" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.8"/>
  <!-- Блик на сиденье -->
  <path d="M32 27.5 Q38 24 46 23.5" fill="none" stroke="#F5E9D0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Строчка по кромке -->
  <path d="M29 31 Q48 36.5 67 31" fill="none" stroke="#B85F2E" stroke-width="1.3" stroke-linecap="round"/>
</svg>
