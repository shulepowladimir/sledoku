<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    bed — кровать, вид сверху с небольшим 3/4: видна вся плоскость
    матраса; подушка у дальнего края, одеяло с отворотом на ближней трети,
    тонкая ближняя грань каркаса и две ближние ножки. Чистые скруглённые
    формы без сходящейся перспективы.
  -->
  <!-- Тень-подложка -->
  <ellipse cx="48" cy="81" rx="37" ry="6.5" fill="#3A2A20"/>

  <!-- Ближние ножки (пеньки под каркасом) -->
  <rect x="19" y="66" width="9" height="13" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>
  <rect x="68" y="66" width="9" height="13" rx="3" fill="#B87F33" stroke="#1A1A1A" stroke-width="2.4"/>

  <!-- Каркас (плита) -->
  <rect x="15" y="20" width="66" height="48" rx="6" fill="#E0A94A" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Ближняя грань каркаса (толщина) -->
  <path d="M17 61 Q48 64 79 61" fill="none" stroke="#B87F33" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Блик на каркасе (светлый кант дальнего края) -->
  <path d="M19 24 Q48 21.5 77 24" fill="none" stroke="#E8B95F" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Матрас -->
  <rect x="20" y="25" width="56" height="34" rx="4" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Строчка по кромке матраса -->
  <path d="M23 28 Q48 26 73 28" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Подушка (дальний край) -->
  <rect x="24" y="28.5" width="21" height="12" rx="5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M28 33 Q34.5 31.5 41 33" fill="none" stroke="#E0A94A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Вторая подушка (справа, чуть дальше) -->
  <rect x="49" y="29" width="18" height="10.5" rx="4.5" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2.2"/>
  <path d="M52 33 Q58 31.8 64 33" fill="none" stroke="#E0A94A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Одеяло (ближняя часть: во всю ширину рамки, драпируется через ближний край) -->
  <rect x="15" y="44" width="66" height="26" rx="4.5" fill="#E0824A" stroke="#1A1A1A" stroke-width="2.4"/>
  <!-- Отворот одеяла (кремовая кромка загиба) -->
  <rect x="15" y="44" width="66" height="5.5" rx="2.75" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Строчка на одеяле -->
  <path d="M20 58 Q48 60.5 76 58" fill="none" stroke="#B85F2E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Блик на одеяле -->
  <path d="M21 52 Q36 50.8 51 52" fill="none" stroke="#F5E9D0" stroke-width="1.6" stroke-linecap="round"/>
</svg>
