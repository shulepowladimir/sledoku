<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!--
    lion — лев (зоопарк): лежащий/сидящий лев в профиль, пышная грива
    (терракота), тело золотистое, кисточка на хвосте, добродушная морда.
  -->
  <!-- Хвост с кисточкой -->
  <path d="M72 66 Q82 62 82 52" fill="none" stroke="#E8B95F" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M80 47 Q84 46 84 51 Q81 54 79 51 Q78 47 80 47 Z" fill="#B85F2E" stroke="#1A1A1A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Задняя лапа -->
  <ellipse cx="64" cy="74" rx="12" ry="7" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>

  <!-- Тело -->
  <path d="M30 76 Q26 58 40 52 L58 52 Q72 56 70 72 Q70 76 64 76 Z"
        fill="#E8B95F" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- Передняя лапа -->
  <path d="M32 76 Q30 68 34 64 L40 66 L38 76 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Пальцы -->
  <path d="M34 74 V70 M37.5 74 V70.5" stroke="#B85F2E" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Грива (пышная, зубчатая) -->
  <path d="M34 50 Q24 48 24 38 Q24 26 36 22 Q34 14 44 16 Q46 8 54 14 Q62 10 62 20 Q72 20 68 30 Q76 34 70 42 Q74 50 62 52 Q56 58 48 54 Q40 58 34 50 Z"
        fill="#B85F2E" stroke="#1A1A1A" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Фактура гривы (завитки) -->
  <g fill="none" stroke="#8F5A3A" stroke-width="1.6" stroke-linecap="round">
    <path d="M30 40 Q31 34 36 31"/>
    <path d="M58 26 Q62 29 62 34"/>
    <path d="M38 22 Q41 20 44 21"/>
  </g>

  <!-- Морда -->
  <ellipse cx="47" cy="36" rx="10" ry="9" fill="#E8B95F" stroke="#1A1A1A" stroke-width="2.6"/>
  <!-- Уши в гриве -->
  <path d="M38 28 Q36 23 41 23 Q44 24 42 28 Z" fill="#E8B95F" stroke="#1A1A1A" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Глаза (мультяшный реализм) -->
  <ellipse cx="43" cy="34" rx="2.2" ry="2.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="43" cy="34.5" r="1.3" fill="#1A1A1A"/>
  <circle cx="42.5" cy="33.8" r="0.5" fill="#F5E9D0"/>
  <ellipse cx="52" cy="34" rx="2.2" ry="2.6" fill="#F5E9D0" stroke="#1A1A1A" stroke-width="1.2"/>
  <circle cx="52" cy="34.5" r="1.3" fill="#1A1A1A"/>
  <circle cx="51.5" cy="33.8" r="0.5" fill="#F5E9D0"/>
  <!-- Нос -->
  <path d="M46 39 Q48 37.5 50 39 Q50 41 48 41.5 Q46 41 46 39 Z" fill="#3A2A20"/>
  <!-- Усы и рот -->
  <path d="M48 41.5 L48 43.5 M48 43.5 Q46 45.5 44 44 M48 43.5 Q50 45.5 52 44" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M40 40 L36 41 M55 40 L59 41" stroke="#1A1A1A" stroke-width="1" stroke-linecap="round"/>

  <!-- Блик на груди -->
  <path d="M42 56 Q50 54 58 57" fill="none" stroke="#F5E9D0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
