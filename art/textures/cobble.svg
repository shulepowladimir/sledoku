    <!-- Ряд A -->
    <rect x="1" y="1" width="30" height="28" rx="13"/>
    <rect x="33" y="1" width="30" height="28" rx="13"/>
    <rect x="65" y="1" width="30" height="28" rx="13"/>
    <rect x="97" y="1" width="30" height="28" rx="13"/>
    <rect x="129" y="1" width="30" height="28" rx="13"/>
    <rect x="161" y="1" width="30" height="28" rx="13"/>
    <rect x="193" y="1" width="30" height="28" rx="13"/>
    <rect x="225" y="1" width="30" height="28" rx="13"/>
    <!-- Ряд B (сдвиг 16 + заворот камня через край) -->
    <rect x="-15" y="33" width="30" height="28" rx="13"/>
    <rect x="17" y="33" width="30" height="28" rx="13"/>
    <rect x="49" y="33" width="30" height="28" rx="13"/>
    <rect x="81" y="33" width="30" height="28" rx="13"/>
