    <rect x="209" y="33" width="30" height="28" rx="13"/>
    <rect x="241" y="33" width="30" height="28" rx="13"/>
    <!-- Ряд A -->
    <rect x="1" y="65" width="30" height="28" rx="13"/>
    <rect x="33" y="65" width="30" height="28" rx="13"/>
    <rect x="65" y="65" width="30" height="28" rx="13"/>
    <rect x="97" y="65" width="30" height="28" rx="13"/>
