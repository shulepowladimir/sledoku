<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    cobble — булыжник (.45): раствор C5, камни C6 (капсулы 30×28, rx13)
    в полукирпичной раскладке 64×32; пара камней темнее C7 (биение).
    Бесшовно: камни ряда B, пересекающие край, продублированы с x-256.
  -->
