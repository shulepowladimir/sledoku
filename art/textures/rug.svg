<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    rug — ковёр-плитка (.34, глубокий тёплый): база D2, рамка-бордюр D1
    по периметру (при тайлинге образует решётку рамок), ворс-точки
    D1/D3 внутри. Спокойно: рамка тонкая, точки редкие.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#64473F"/>

  <!-- Бордюр (рамка на отступе 10px) -->
  <g fill="none" stroke="#7A5A50" stroke-width="3">
    <rect x="10" y="10" width="236" height="236"/>
  </g>
  <!-- Внутренний тонкий кант -->
  <g fill="none" stroke="#4F3733" stroke-width="1.5">
    <rect x="17" y="17" width="222" height="222"/>
  </g>

  <!-- Угловые метки бордюра -->
  <g fill="#7A5A50">
    <rect x="8" y="8" width="12" height="12"/>
    <rect x="236" y="8" width="12" height="12"/>
    <rect x="8" y="236" width="12" height="12"/>
    <rect x="236" y="236" width="12" height="12"/>
  </g>

  <!-- Ворс: светлые точки (внутри поля) -->
  <g fill="#7A5A50">
    <circle cx="56" cy="52" r="2.2"/>
    <circle cx="128" cy="44" r="2.2"/>
    <circle cx="200" cy="56" r="2.2"/>
    <circle cx="44" cy="128" r="2.2"/>
    <circle cx="212" cy="132" r="2.2"/>
    <circle cx="60" cy="204" r="2.2"/>
    <circle cx="132" cy="212" r="2.2"/>
    <circle cx="198" cy="202" r="2.2"/>
    <circle cx="96" cy="92" r="2.2"/>
    <circle cx="168" cy="168" r="2.2"/>
  </g>

  <!-- Ворс: тёмные точки (реже) -->
  <g fill="#4F3733">
    <circle cx="92" cy="140" r="2.2"/>
    <circle cx="164" cy="84" r="2.2"/>
    <circle cx="128" cy="128" r="2.2"/>
    <circle cx="88" cy="188" r="2.2"/>
    <circle cx="176" cy="120" r="2.2"/>
  </g>
</svg>
