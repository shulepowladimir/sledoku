<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    ice — лёд (.72): база W1, гладь; редкие трещины W2 (полилинии
    с ветвями, interior — бесшовно), блики N2 короткими диагоналями.
    Паттерн ортогонален wood (доски) — на близкой ступени различимы.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#9FBFCF"/>

  <!-- Трещины -->
  <g fill="none" stroke="#7FA3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 56 L62 70 L68 92 L86 102 M62 70 L56 88"/>
    <path d="M168 36 L184 54 L212 58"/>
    <path d="M118 156 L136 176 L132 204 M136 176 L158 186"/>
  </g>

  <!-- Блики (диагональные штрихи N2) -->
  <g fill="none" stroke="#DFD6C6" stroke-width="2.4" stroke-linecap="round">
    <path d="M96 116 L112 100"/>
    <path d="M150 96 L162 84"/>
    <path d="M52 168 L66 154"/>
    <path d="M188 216 L202 202"/>
  </g>
</svg>
