<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    stairs — широкие ступени (.36, тёплый): период 128px — вдвое шире
    досок wood, чтобы орнаменты не путались. Каждая ступень: светлый
    проступь N8 (8px) → база N9 → тень подступенка N10 (10px).
    Строго рампа: база N9 ± 1 шаг. Бесшовно по обоим осям (период 128).
  -->
  <rect x="0" y="0" width="256" height="256" fill="#675A56"/>

  <!-- Ступень 1 (y 0–128) -->
  <rect x="0" y="0" width="256" height="8" fill="#786862"/>
  <rect x="0" y="118" width="256" height="10" fill="#574D4A"/>

  <!-- Ступень 2 (y 128–256) -->
  <rect x="0" y="128" width="256" height="8" fill="#786862"/>
  <rect x="0" y="246" width="256" height="10" fill="#574D4A"/>
</svg>
