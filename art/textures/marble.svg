<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    marble — мрамор (.83): база N2, 3 квази-горизонтальные прожилки N4
    (вход/выход на одной высоте — бесшовно по X) + пара мягких бликов N1.
    Спокойно: прожилки редкие, тонкие, с разрывами.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#DFD6C6"/>

  <!-- Мягкие светлые облака -->
  <ellipse cx="70" cy="70" rx="46" ry="26" fill="#EDE7DB"/>
  <ellipse cx="190" cy="200" rx="40" ry="22" fill="#EDE7DB"/>

  <!-- Прожилка 1 (y≈48) -->
  <path d="M0 50 Q40 44 80 50 T160 48 T256 50"
        fill="none" stroke="#BFB09A" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M96 49 Q120 46 150 48" fill="none" stroke="#BFB09A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Прожилка 2 (y≈128) с развилкой -->
  <path d="M0 130 Q50 122 100 130 T200 126 T256 130"
        fill="none" stroke="#BFB09A" stroke-width="2" stroke-linecap="round"/>
  <path d="M118 128 Q140 136 168 132" fill="none" stroke="#BFB09A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Прожилка 3 (y≈208) -->
  <path d="M0 210 Q60 204 120 210 T256 208"
        fill="none" stroke="#BFB09A" stroke-width="2.2" stroke-linecap="round"/>
</svg>
