<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    metal — палубные пластины (.29): база C8, фаски-швы C7 крестом 128px,
    заклёпки C7 по углам пластин. Строго рампа: база + 1 шаг.
    Бесшовно: швы на 0/128 складываются при тайлинге.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#454E58"/>

  <!-- Фаски-швы (крест 128×128) -->
  <g fill="#545D65">
    <rect x="0" y="0" width="256" height="2"/>
    <rect x="0" y="127" width="256" height="2"/>
    <rect x="0" y="0" width="2" height="256"/>
    <rect x="127" y="0" width="2" height="256"/>
  </g>

  <!-- Блики верхних кромок пластин -->
  <rect x="4" y="4" width="120" height="1.5" fill="#545D65"/>
  <rect x="133" y="4" width="120" height="1.5" fill="#545D65"/>
  <rect x="4" y="131" width="120" height="1.5" fill="#545D65"/>
  <rect x="133" y="131" width="120" height="1.5" fill="#545D65"/>

  <!-- Заклёпки по углам пластин (отступ 10 от швов) -->
  <g fill="#545D65">
    <circle cx="10" cy="10" r="2.6"/>
    <circle cx="118" cy="10" r="2.6"/>
    <circle cx="10" cy="118" r="2.6"/>
    <circle cx="118" cy="118" r="2.6"/>
    <circle cx="138" cy="10" r="2.6"/>
    <circle cx="246" cy="10" r="2.6"/>
    <circle cx="138" cy="118" r="2.6"/>
    <circle cx="246" cy="118" r="2.6"/>
    <circle cx="10" cy="138" r="2.6"/>
    <circle cx="118" cy="138" r="2.6"/>
    <circle cx="10" cy="246" r="2.6"/>
    <circle cx="118" cy="246" r="2.6"/>
    <circle cx="138" cy="138" r="2.6"/>
    <circle cx="246" cy="138" r="2.6"/>
    <circle cx="138" cy="246" r="2.6"/>
    <circle cx="246" cy="246" r="2.6"/>
  </g>
</svg>
