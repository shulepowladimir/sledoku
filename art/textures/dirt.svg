<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    dirt — земля (.48): база N7, мягкие комки-эллипсы N6/N8 (8–14px),
    редкий мелкий крап. Спокойно: комки размыты по тону, без контуров.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#8A786A"/>

  <!-- Комки: светлее базы -->
  <g fill="#9C8A76">
    <ellipse cx="40" cy="38" rx="13" ry="8"/>
    <ellipse cx="150" cy="26" rx="10" ry="6"/>
    <ellipse cx="224" cy="52" rx="12" ry="7"/>
    <ellipse cx="76" cy="110" rx="11" ry="7"/>
    <ellipse cx="196" cy="126" rx="13" ry="8"/>
    <ellipse cx="30" cy="190" rx="10" ry="6"/>
    <ellipse cx="136" cy="210" rx="12" ry="7"/>
    <ellipse cx="226" cy="226" rx="10" ry="6"/>
  </g>

  <!-- Комки: темнее базы -->
  <g fill="#786862">
    <ellipse cx="96" cy="60" rx="11" ry="7"/>
    <ellipse cx="246" cy="30" rx="9" ry="5.5"/>
    <ellipse cx="56" cy="150" rx="12" ry="7"/>
    <ellipse cx="166" cy="168" rx="10" ry="6"/>
    <ellipse cx="100" cy="244" rx="11" ry="6"/>
    <ellipse cx="204" cy="188" rx="9" ry="5.5"/>
  </g>

  <!-- Мелкий крап (совсем редкий) -->
  <circle cx="182" cy="84" r="2" fill="#786862"/>
  <circle cx="14" cy="122" r="2" fill="#9C8A76"/>
  <circle cx="242" cy="158" r="2" fill="#9C8A76"/>
  <circle cx="64" cy="228" r="2" fill="#786862"/>
</svg>
