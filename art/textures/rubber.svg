<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    rubber — терракотовый мат: база — терракота #E0824A, вертикальные
    рифы — терракота тёмная #B85F2E (пара из основной палитры, как у
    wood E0A94A/B87F33). Ширина 10px, период 32px — бесшовно по X и Y.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#E0824A"/>

  <!-- Вертикальные рифы (период 32) -->
  <g fill="#B85F2E">
    <rect x="5" y="0" width="10" height="256"/>
    <rect x="37" y="0" width="10" height="256"/>
    <rect x="69" y="0" width="10" height="256"/>
    <rect x="101" y="0" width="10" height="256"/>
    <rect x="133" y="0" width="10" height="256"/>
    <rect x="165" y="0" width="10" height="256"/>
    <rect x="197" y="0" width="10" height="256"/>
    <rect x="229" y="0" width="10" height="256"/>
  </g>
</svg>
