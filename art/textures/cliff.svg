<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    cliff — скала (.42): база N8, грубые угловатые обломки N7/N9
    (5-8 граней, все в interior — бесшовно), тонкие трещины N9.
    Отличие от dirt: угловатые полигоны vs мягкие эллипсы.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#786862"/>

  <!-- Обломки: светлее (N7) -->
  <g fill="#8A786A">
    <polygon points="20,30 70,22 82,55 48,66 14,52"/>
    <polygon points="190,40 240,26 248,62 200,70"/>
    <polygon points="164,178 224,186 216,226 170,220"/>
    <polygon points="112,148 150,140 158,172 120,180"/>
  </g>

  <!-- Обломки: темнее (N9) -->
  <g fill="#675A56">
    <polygon points="110,18 160,28 150,60 108,56"/>
    <polygon points="40,110 88,100 96,140 52,150 28,132"/>
    <polygon points="70,190 120,182 128,222 84,232"/>
    <polygon points="206,104 244,112 236,144 208,138"/>
  </g>

  <!-- Трещины (тонкие, interior) -->
  <g fill="none" stroke="#675A56" stroke-width="1.8" stroke-linecap="round">
    <path d="M96 74 Q104 88 98 104"/>
    <path d="M160 214 Q168 226 162 240"/>
    <path d="M30 170 Q42 178 40 192"/>
  </g>
</svg>
