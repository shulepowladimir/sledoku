<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    asphalt — асфальт (.31): база N10, один усадочный шов N9 на y=128
    (прямая линия — бесшовна), редкий мелкий крап N9, пятно износа.
    Самый тёмный и самый тихий пол.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#574D4A"/>

  <!-- Усадочный шов -->
  <rect x="0" y="127" width="256" height="2" fill="#675A56"/>

  <!-- Пятно износа (мягкое) -->
  <ellipse cx="176" cy="70" rx="30" ry="16" fill="#5C514E"/>
  <ellipse cx="64" cy="196" rx="24" ry="13" fill="#5C514E"/>

  <!-- Мелкий крап (редкий) -->
  <g fill="#675A56">
    <circle cx="36" cy="42" r="2"/>
    <circle cx="120" cy="28" r="2.4"/>
    <circle cx="216" cy="44" r="2"/>
    <circle cx="76" cy="90" r="2"/>
    <circle cx="196" cy="140" r="2.4"/>
    <circle cx="48" cy="158" r="2"/>
    <circle cx="140" cy="200" r="2.4"/>
    <circle cx="228" cy="212" r="2"/>
    <circle cx="100" cy="238" r="2"/>
  </g>
</svg>
