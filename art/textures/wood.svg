<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    wood — широкая доска, бесшовный тайл (смягчённая версия по §7).
    Раскладка по вертикали: 1px шов + 4 × 62px доски + 3 × 2px разделителя + 1px шов.
    Тона чередуются E0A94A / E8B95F, фаски: светлый кант сверху, мягкий низ B87F33.
    Швы и сучки — без тёмных контуров (#B87F33 вместо #3A2A20), волокон меньше.
  -->

  <!-- Верхний шов -->
  <rect x="0" y="0" width="256" height="1" fill="#B87F33"/>

  <!-- Доска 1 (y=1–62, золото) -->
  <rect x="0" y="1" width="256" height="62" fill="#E0A94A"/>
  <rect x="0" y="1" width="256" height="1.5" fill="#E8B95F"/>
  <rect x="0" y="60.5" width="256" height="1.5" fill="#B87F33"/>
  <g fill="none" stroke="#B87F33" stroke-width="1" stroke-linecap="round">
    <path d="M18 16 Q64 12 110 16 T202 15"/>
    <path d="M40 44 Q100 40 160 44 T240 43"/>
  </g>
  <!-- Сучок (без тёмного центра) -->
  <ellipse cx="225" cy="30" rx="5.5" ry="2.8" fill="#B87F33"/>
  <ellipse cx="225" cy="30" rx="2.8" ry="1.3" fill="#E8B95F"/>

  <!-- Разделитель 1–2 -->
  <rect x="0" y="63" width="256" height="2" fill="#B87F33"/>

  <!-- Доска 2 (y=65–126, светлое дерево) -->
  <rect x="0" y="65" width="256" height="62" fill="#E8B95F"/>
  <rect x="0" y="65" width="256" height="1.5" fill="#F5E9D0"/>
  <rect x="0" y="124.5" width="256" height="1.5" fill="#B87F33"/>
  <g fill="none" stroke="#B87F33" stroke-width="1" stroke-linecap="round">
    <path d="M30 84 Q100 80 170 84 T250 83"/>
    <path d="M20 110 Q90 106 160 110"/>
  </g>

  <!-- Разделитель 2–3 -->
  <rect x="0" y="127" width="256" height="2" fill="#B87F33"/>

  <!-- Доска 3 (y=129–190, золото) -->
  <rect x="0" y="129" width="256" height="62" fill="#E0A94A"/>
  <rect x="0" y="129" width="256" height="1.5" fill="#E8B95F"/>
  <rect x="0" y="188.5" width="256" height="1.5" fill="#B87F33"/>
  <g fill="none" stroke="#B87F33" stroke-width="1" stroke-linecap="round">
    <path d="M10 146 Q80 142 150 146 T250 145"/>
    <path d="M60 174 Q130 170 200 174"/>
  </g>
  <!-- Сучок -->
  <ellipse cx="180" cy="160" rx="5.5" ry="2.8" fill="#B87F33"/>
  <ellipse cx="180" cy="160" rx="2.8" ry="1.3" fill="#E8B95F"/>

  <!-- Разделитель 3–4 -->
  <rect x="0" y="191" width="256" height="2" fill="#B87F33"/>

  <!-- Доска 4 (y=193–254, светлое дерево) -->
  <rect x="0" y="193" width="256" height="62" fill="#E8B95F"/>
  <rect x="0" y="193" width="256" height="1.5" fill="#F5E9D0"/>
  <rect x="0" y="252.5" width="256" height="1.5" fill="#B87F33"/>
  <g fill="none" stroke="#B87F33" stroke-width="1" stroke-linecap="round">
    <path d="M50 208 Q120 204 190 208"/>
    <path d="M0 236 Q70 232 140 236 T240 235"/>
  </g>

  <!-- Нижний шов -->
  <rect x="0" y="255" width="256" height="1" fill="#B87F33"/>
</svg>
