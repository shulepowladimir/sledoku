<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    concrete — бетон (.58): база C4, почти гладкий; усадочные швы C5
    крестом 128px, редкий крап C3/C5, одно пятно выцветания C3.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#939CA2"/>

  <!-- Пятно выцветания (мягкое, большое) -->
  <ellipse cx="64" cy="192" rx="52" ry="30" fill="#9DA6AC"/>

  <!-- Усадочные швы (крест 128×128, толщина 2) -->
  <g fill="#7D878E">
    <rect x="0" y="0" width="256" height="2"/>
    <rect x="0" y="127" width="256" height="2"/>
    <rect x="0" y="0" width="2" height="256"/>
    <rect x="127" y="0" width="2" height="256"/>
  </g>

  <!-- Крап (редкий, ≥4px) -->
  <g fill="#7D878E">
    <circle cx="40" cy="48" r="2.4"/>
    <circle cx="180" cy="36" r="2"/>
    <circle cx="96" cy="160" r="2.4"/>
    <circle cx="216" cy="176" r="2"/>
    <circle cx="60" cy="236" r="2.4"/>
    <circle cx="160" cy="216" r="2"/>
  </g>
  <g fill="#AAB2B6">
    <circle cx="128" cy="72" r="2.4"/>
    <circle cx="200" cy="120" r="2"/>
    <circle cx="36" cy="140" r="2"/>
    <circle cx="232" cy="236" r="2.4"/>
  </g>
</svg>
