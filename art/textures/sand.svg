<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    sand — песок (.66): база T1, ветровые рифли N2 (пологие волны,
    вход/выход на одной высоте) + мелкозернистый крап N4/N2.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#C9A183"/>

  <!-- Ветровые рифли (3 пологие волны) -->
  <g fill="none" stroke="#DFD6C6" stroke-width="2" stroke-linecap="round">
    <path d="M0 56 Q64 50 128 56 T256 56"/>
    <path d="M0 140 Q64 134 128 140 T256 140"/>
    <path d="M0 224 Q64 218 128 224 T256 224"/>
  </g>

  <!-- Крап: тёмные песчинки -->
  <g fill="#BFB09A">
    <circle cx="26" cy="24" r="2"/>
    <circle cx="88" cy="30" r="1.6"/>
    <circle cx="160" cy="22" r="2"/>
    <circle cx="216" cy="34" r="1.6"/>
    <circle cx="44" cy="94" r="2"/>
    <circle cx="124" cy="100" r="1.6"/>
    <circle cx="196" cy="88" r="2"/>
    <circle cx="240" cy="104" r="1.6"/>
    <circle cx="18" cy="176" r="2"/>
    <circle cx="100" cy="182" r="1.6"/>
    <circle cx="176" cy="170" r="2"/>
    <circle cx="230" cy="186" r="1.6"/>
    <circle cx="56" cy="246" r="2"/>
    <circle cx="140" cy="252" r="1.6"/>
    <circle cx="210" cy="242" r="2"/>
  </g>

  <!-- Крап: светлые песчинки (реже) -->
  <g fill="#DFD6C6">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="188" cy="52" r="2"/>
    <circle cx="80" cy="152" r="2"/>
    <circle cx="200" cy="212" r="2"/>
    <circle cx="30" cy="212" r="2"/>
    <circle cx="150" cy="126" r="2"/>
  </g>
</svg>
