<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    stone — каменные плиты (.50): база C5, кладка 128×64 со смещением
    (полукирпичная), швы C6 2px; пара плит светлее C4, мягкие блики.
    Бесшовно: сетка периодична по обоим осям, швы на краях складываются.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#7D878E"/>

  <!-- Ряды: горизонтальные швы y=0,64,128,192 -->
  <g fill="#68727A">
    <rect x="0" y="0" width="256" height="2"/>
    <rect x="0" y="63" width="256" height="2"/>
    <rect x="0" y="127" width="256" height="2"/>
    <rect x="0" y="191" width="256" height="2"/>
  </g>
  <!-- Вертикальные швы: чётные ряды x=0,128; нечётные x=64,192 -->
  <g fill="#68727A">
    <rect x="0" y="0" width="2" height="64"/>
    <rect x="127" y="0" width="2" height="64"/>
    <rect x="63" y="64" width="2" height="64"/>
    <rect x="191" y="64" width="2" height="64"/>
    <rect x="0" y="128" width="2" height="64"/>
    <rect x="127" y="128" width="2" height="64"/>
    <rect x="63" y="192" width="2" height="64"/>
    <rect x="191" y="192" width="2" height="64"/>
  </g>

  <!-- Плиты-акценты (светлее, биение тона) -->
  <rect x="4" y="4" width="119" height="57" fill="#87939B"/>
  <rect x="68" y="132" width="119" height="57" fill="#87939B"/>

  <!-- Мягкие блики на верхних кромках пары плит -->
  <rect x="134" y="4" width="119" height="1.5" fill="#AAB2B6"/>
  <rect x="4" y="68" width="119" height="1.5" fill="#AAB2B6"/>
  <rect x="196" y="132" width="58" height="1.5" fill="#AAB2B6"/>
</svg>
