<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    tile — квадратная плитка (.77): база N3, швы N5 2px, сетка 64px;
    пара плиток-акцентов N4, мягкие блики N2 на верхних кромках.
    Бесшовно: швы лежат на краях 0/256 и складываются при тайлинге.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#CFC3AF"/>

  <!-- Швы: вертикали (x=0,64,128,192) и горизонтали (y=0,64,128,192) -->
  <g fill="#AE9C86">
    <rect x="0" y="0" width="2" height="256"/>
    <rect x="63" y="0" width="2" height="256"/>
    <rect x="127" y="0" width="2" height="256"/>
    <rect x="191" y="0" width="2" height="256"/>
    <rect x="0" y="0" width="256" height="2"/>
    <rect x="0" y="63" width="256" height="2"/>
    <rect x="0" y="127" width="256" height="2"/>
    <rect x="0" y="191" width="256" height="2"/>
  </g>

  <!-- Плитки-акценты (чуть темнее, биение тона) -->
  <rect x="66" y="66" width="59" height="59" fill="#C4B7A2"/>
  <rect x="194" y="2" width="59" height="59" fill="#C4B7A2"/>

  <!-- Мягкие блики на верхних кромках нескольких плиток -->
  <rect x="4" y="4" width="56" height="1.5" fill="#DFD6C6"/>
  <rect x="132" y="68" width="56" height="1.5" fill="#DFD6C6"/>
  <rect x="68" y="132" width="56" height="1.5" fill="#DFD6C6"/>
  <rect x="196" y="196" width="56" height="1.5" fill="#DFD6C6"/>
</svg>
