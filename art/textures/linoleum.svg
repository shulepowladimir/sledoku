<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    linoleum — мягкая шахматка (.61): плитки 64px чередуются N4/N6,
    без жёстких швов (стык тональный); пара плиток с вкраплением N3.
    Бесшовно: шахматка 4×4 периодична по обоим осям.
  -->
  <rect x="0" y="0" width="256" height="256" fill="#9C8A76"/>

  <!-- Светлые клетки (N4) в шахматном порядке -->
  <g fill="#BFB09A">
    <rect x="0" y="0" width="64" height="64"/>
    <rect x="128" y="0" width="64" height="64"/>
    <rect x="64" y="64" width="64" height="64"/>
    <rect x="192" y="64" width="64" height="64"/>
    <rect x="0" y="128" width="64" height="64"/>
    <rect x="128" y="128" width="64" height="64"/>
    <rect x="64" y="192" width="64" height="64"/>
    <rect x="192" y="192" width="64" height="64"/>
  </g>

  <!-- Вкрапления-«чипы» (пара на тайл, крупно) -->
  <circle cx="96" cy="32" r="4" fill="#8A786A"/>
  <circle cx="160" cy="224" r="4.5" fill="#8A786A"/>
  <circle cx="224" cy="96" r="3.5" fill="#CFC3AF"/>
</svg>
